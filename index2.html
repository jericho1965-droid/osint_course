.\n2. Invia il comando <code>/id</code> al bot: risponde con l’ID di tutti\ni membri. 3. Oppure rispondi a un messaggio dell’utente target con\n<code>/id</code>: il bot risponde con l’ID di quell’utente.</p>\n<p><strong>Metodo 2 – Via Telethon:</strong></p>\n<pre class=\"python\"><code>entity = await client.get_entity(&quot;@username&quot;)\nprint(entity.id)  # ID numerico</code></pre>\n<p><strong>Metodo 3 – Analisi del forward:</strong> Se un utente ha\nabilitato il forward dei propri messaggi con link all’account originale,\nl’URL del messaggio originale contiene l’ID dell’utente nel formato\n<code>tg://user?id=NUMERO</code>.</p>\n<h3 id=\"utenti-parte-2-informazioni-indirette\">5.3 Utenti – parte 2:\ninformazioni indirette</h3>\n<p>Oltre ai dati diretti, un utente Telegram “lascia tracce” in modo\nindiretto:</p>\n<p><strong>Nei gruppi:</strong> - I messaggi scritti in gruppi pubblici\nsono accessibili a chiunque. - Il comportamento (orari, frequenza, tono,\nargomenti) costruisce un profilo. - Le reazioni ai messaggi (emoji)\nrivelano simpatie e posizioni.</p>\n<p><strong>Nei canali:</strong> - Se l’utente è admin di un canale, i\nsuoi messaggi nel canale vengono pubblicati “a nome del canale”. Ma se\nfa un errore e pubblica come utente personale, il suo nome compare. - I\ncommenti nei canali con funzione commenti sono firmati dall’utente.</p>\n<p><strong>Nelle bio e nei link:</strong> - La bio può contenere\nusername di altri social, siti web, email. - Il campo “link” nel profilo\npuò puntare a un sito personale o a un altro canale.</p>\n<h3 id=\"introduzione-alla-raccolta-di-informazioni-su-un-utente\">5.4\nIntroduzione alla raccolta di informazioni su un utente</h3>\n<p>Il flusso standard per raccogliere informazioni su un utente Telegram\nnoto (es. con username):</p>\n<pre><code>  USERNAME TARGET: @mario_osint\n          │\n          ├─ 1. INFO BASE ────────────────────────────────\n          │    @getidsbot → ID numerico\n          │    @creationfinder_bot → stima data creazione\n          │    Profilo diretto: t.me/mario_osint\n          │\n          ├─ 2. STORICO USERNAME ─────────────────────────\n          │    @SangMataInfo_bot (con cautela)\n          │    TGStat: cerca &quot;@mario_osint&quot; nei messaggi\n          │\n          ├─ 3. MESSAGGI PUBBLICI ─────────────────────────\n          │    TGStat: ricerca &quot;@mario_osint&quot; nei canali\n          │    Google Dork: &quot;mario_osint&quot; site:t.me\n          │    Telethon: cerca messaggi in canali comuni\n          │\n          ├─ 4. PIVOT ────────────────────────────────────\n          │    Username → Lezione 4 (WhatsMyName, Maigret)\n          │    Foto profilo → ricerca inversa (Lezione 8)\n          │    Link nella bio → analisi del sito/profilo\n          │\n          └─ 5. ANALISI COMPORTAMENTALE ──────────────────\n               Orari, stile, argomenti, errori OPSEC</code></pre>\n<hr />\n<h2 id=\"gruppi-e-informazioni-rilevanti-a-fini-osint\">6. Gruppi e\ninformazioni rilevanti a fini OSINT</h2>\n<h3 id=\"differenze-tra-gruppi-e-canali\">6.1 Differenze tra gruppi e\ncanali</h3>\n<p>Questa distinzione è fondamentale per sapere dove e come cercare\ninformazioni:</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Caratteristica</th>\n<th>Gruppo / Supergruppo</th>\n<th>Canale</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Chi scrive</td>\n<td>Tutti i membri</td>\n<td>Solo admin</td>\n</tr>\n<tr>\n<td>Scopo principale</td>\n<td>Discussione</td>\n<td>Broadcasting</td>\n</tr>\n<tr>\n<td>Max membri</td>\n<td>200.000</td>\n<td>Illimitati</td>\n</tr>\n<tr>\n<td>Visibilità dei membri</td>\n<td>Parziale (lista accessibile)</td>\n<td>No (solo admin vedono gli iscritti)</td>\n</tr>\n<tr>\n<td>Visibilità dell’admin</td>\n<td>Dipende dalle impostazioni</td>\n<td>Dipende dalle impostazioni</td>\n</tr>\n<tr>\n<td>Commenti</td>\n<td>Sì (thread)</td>\n<td>Solo se abilitati (via gruppo collegato)</td>\n</tr>\n<tr>\n<td>Storico messaggi per i nuovi</td>\n<td>Dipende dalla configurazione</td>\n<td>Sì (per i canali pubblici)</td>\n</tr>\n<tr>\n<td>Indicizzato da motori di ricerca</td>\n<td>Raramente</td>\n<td>Parzialmente (canali pubblici)</td>\n</tr>\n<tr>\n<td>Tracciato da TGStat</td>\n<td>Solo se pubblico</td>\n<td>Sì (se pubblico)</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Implicazione OSINT:</strong> - I <strong>canali</strong> sono\nla fonte principale per la raccolta sistematica: i messaggi sono\narchivistici, pubblici, scaricabili. - I <strong>gruppi</strong> sono\npiù dinamici e rivelano le relazioni tra utenti, ma sono più difficili\nda raccogliere (volatilità dei messaggi, accesso richiede\niscrizione).</p>\n<h3 id=\"informazioni-rilevanti-nei-gruppi\">6.2 Informazioni rilevanti\nnei gruppi</h3>\n<p>In un gruppo pubblico o in uno a cui hai legittimamente accesso, le\ninformazioni rilevanti includono:</p>\n<ul>\n<li><strong>Lista membri</strong>: in un supergruppo pubblico, è\npossibile scaricare la lista dei membri via Telethon.</li>\n<li><strong>Admin e moderatori</strong>: visibili nelle informazioni del\ngruppo; spesso con un badge.</li>\n<li><strong>Messaggi fissati</strong>: spesso contengono regole, link\nimportanti, riferimenti all’identità del gruppo.</li>\n<li><strong>Link condivisi</strong>: spesso vengono condivisi link a\ncanali, siti, profili.</li>\n<li><strong>Pattern di risposta</strong>: chi risponde a chi? Chi è\nl’authority del gruppo?</li>\n</ul>\n<hr />\n<h2 id=\"analisi-dei-canali-introduzione\">7. Analisi dei canali:\nintroduzione</h2>\n<h3 id=\"cosa-si-può-estrarre-da-un-canale-pubblico\">7.1 Cosa si può\nestrarre da un canale pubblico</h3>\n<p>Un canale Telegram pubblico è, ai fini OSINT, equivalente a un sito\nweb aperto: tutto il contenuto è pubblicamente accessibile senza\nautenticazione. Da un canale pubblico si può estrarre:</p>\n<ul>\n<li>Tutti i <strong>messaggi</strong> (testo, media, documenti,\nsondaggi).</li>\n<li><strong>Metadati dei messaggi</strong>: ID, data/ora UTC, views,\nforwards, reply chain.</li>\n<li><strong>Metadati del canale</strong>: nome, username, ID numerico,\ndescrizione, link, data di creazione stimata.</li>\n<li><strong>Admin visibili</strong> (se il canale mostra i\nfirmatari).</li>\n<li><strong>Canali citati o forwarded</strong>: pivot verso altri canali\ndella stessa rete.</li>\n<li><strong>Messaggi eliminati</strong>: talvolta archiviati da TGStat o\nWayback Machine.</li>\n</ul>\n<h3 id=\"come-accedere-a-un-canale-pubblico-senza-account\">7.2 Come\naccedere a un canale pubblico senza account</h3>\n<p>Qualunque canale pubblico con username è accessibile via browser\nsenza account Telegram:</p>\n<pre><code>https://t.me/s/NOME_CANALE</code></pre>\n<p>Il parametro <code>/s/</code> mostra la versione web del canale.\nPermette di: - Leggere gli ultimi messaggi. - Vedere le immagini. -\nAccedere agli URL dei singoli messaggi\n(<code>https://t.me/NOME_CANALE/NUMERO_MESSAGGIO</code>).</p>\n<blockquote>\n<p><strong>Attenzione:</strong> la versione web mostra solo i messaggi\npiù recenti. Per lo storico completo servono Telethon o TGStat.</p>\n</blockquote>\n<hr />\n<h2 id=\"cercare-i-link-dinvito-tramite-dork\">8. Cercare i link d’invito\ntramite dork</h2>\n<h3 id=\"riepilogo-dei-dork-rispiegazione-nel-contesto-telegram\">8.1\nRiepilogo dei dork (rispiegazione nel contesto Telegram)</h3>\n<p>Come abbiamo visto nella Lezione 3, i <strong>dork</strong> sono\nquery avanzate che sfruttano gli operatori dei motori di ricerca.\nApplicati a Telegram, servono per: - Trovare link d’invito a gruppi\nprivati condivisi pubblicamente. - Trovare menzioni di canali o utenti\nTelegram su siti web. - Trovare messaggi di canali indicizzati da\nGoogle.</p>\n<h3 id=\"applicare-i-dork-a-telegram\">8.2 Applicare i dork a\nTelegram</h3>\n<p><strong>Trovare link d’invito a gruppi privati:</strong></p>\n<pre><code>&quot;t.me/+&quot; &quot;keyword&quot;</code></pre>\n<pre><code>&quot;t.me/joinchat/&quot; &quot;keyword&quot;</code></pre>\n<blockquote>\n<p>I link <code>t.me/+HASH</code> e <code>t.me/joinchat/HASH</code> sono\nlink d’invito a gruppi o canali privati. Se compaiono in pagine\npubbliche (forum, Reddit, social), sono accessibili a chiunque.</p>\n</blockquote>\n<p><strong>Trovare canali che parlano di un argomento:</strong></p>\n<pre><code>site:t.me &quot;keyword&quot;</code></pre>\n<p><strong>Trovare link d’invito su Reddit:</strong></p>\n<pre><code>&quot;t.me/+&quot; &quot;keyword&quot; site:reddit.com</code></pre>\n<p><strong>Trovare link condivisi su forum italiani:</strong></p>\n<pre><code>&quot;t.me/+&quot; OR &quot;t.me/joinchat&quot; &quot;keyword&quot; site:*.it</code></pre>\n<p><strong>Trovare messaggi specifici indicizzati da\nGoogle:</strong></p>\n<pre><code>site:t.me/NOME_CANALE &quot;frase esatta&quot;</code></pre>\n<p><strong>Trovare canali che contengono un certo username:</strong></p>\n<pre><code>site:t.me &quot;@username_target&quot;</code></pre>\n<p><strong>Trovare link d’invito su Pastebin:</strong></p>\n<pre><code>&quot;t.me/+&quot; site:pastebin.com</code></pre>\n<p><strong>Trovare canali Telegram menzionati in documenti\nPDF:</strong></p>\n<pre><code>&quot;t.me/&quot; filetype:pdf &quot;keyword&quot;</code></pre>\n<h3 id=\"dork-su-motori-alternativi\">8.3 Dork su motori alternativi</h3>\n<p><strong>Su Yandex</strong> (migliore per contenuti russi):</p>\n<pre><code>&quot;t.me/+&quot; &quot;keyword&quot; lang:ru\nsite:t.me &quot;keyword&quot;</code></pre>\n<p><strong>Su DuckDuckGo con !bang:</strong></p>\n<pre><code>&quot;t.me/+&quot; keyword !g</code></pre>\n<hr />\n<h2\nid=\"cercare-link-dinvito-tramite-siti-che-listano-canali-e-gruppi\">9.\nCercare link d’invito tramite siti che listano canali e gruppi</h2>\n<h3 id=\"introduzione-alle-risorse-specifiche-per-telegram\">9.1\nIntroduzione alle risorse specifiche per Telegram</h3>\n<p>Oltre ai motori di ricerca generalisti, esistono siti dedicati che\naggregano e indicizzano canali e gruppi Telegram. Questi siti sono\ncostruiti in modo simile ai motori di ricerca, ma specializzati sulla\npiattaforma.</p>\n<p><strong>Perché usarli:</strong> - Trovano canali che Google non\nindicizza. - Permettono di filtrare per lingua, categoria, numero di\niscritti. - Alcuni aggregano anche link d’invito a gruppi privati\n(condivisi volontariamente dagli utenti). - Hanno motori di ricerca per\nkeyword nei messaggi dei canali.</p>\n<h3 id=\"guida-allutilizzo\">9.2 Guida all’utilizzo</h3>\n<p><strong>Approccio standard:</strong> 1. Identifica la keyword o il\ntema che stai cercando. 2. Cerca su più siti contemporaneamente. 3. Per\nogni canale trovato, apri la sua pagina su TGStat per vedere le\nstatistiche. 4. Analizza i canali correlati per mappare la rete. 5.\nDocumenta ogni canale con: username, ID, data di creazione stimata,\nscreenshot della pagina TGStat.</p>\n<h3 id=\"motore-di-ricerca-esterno-principali-risorse\">9.3 Motore di\nricerca esterno: principali risorse</h3>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Sito</th>\n<th>URL</th>\n<th>Specialità</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>TGStat</strong></td>\n<td>tgstat.com / tgstat.ru</td>\n<td>Analytics, ricerca messaggi, canali correlati</td>\n</tr>\n<tr>\n<td><strong>Telemetr</strong></td>\n<td>telemetr.me</td>\n<td>Ranking, crescita organica/artificiale</td>\n</tr>\n<tr>\n<td><strong>TGDR</strong></td>\n<td>tgdr.io</td>\n<td>Directory canali e gruppi</td>\n</tr>\n<tr>\n<td><strong>Telegram Directory</strong></td>\n<td>telegramdirectory.com</td>\n<td>Elenco canali per categoria</td>\n</tr>\n<tr>\n<td><strong>Telegram Analytics</strong></td>\n<td>t.me/s/ + username</td>\n<td>Accesso web senza app</td>\n</tr>\n<tr>\n<td><strong>Lyzem</strong></td>\n<td>lyzem.com</td>\n<td>Ricerca messaggi Telegram (simile a TGStat search)</td>\n</tr>\n<tr>\n<td><strong>ComBot</strong></td>\n<td>combot.org</td>\n<td>Statistiche gruppi</td>\n</tr>\n<tr>\n<td><strong>RecordedTelegram</strong></td>\n<td>api.recordedtelegram.com</td>\n<td>Archivio messaggi, ricerca storica (richiede registrazione)</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2 id=\"recordedtelegram\">10. RecordedTelegram</h2>\n<h3 id=\"introduzione-1\">10.1 Introduzione</h3>\n<p><strong>RecordedTelegram</strong> è un servizio specializzato che\narchivia e rende ricercabili i messaggi di canali e gruppi Telegram\npubblici. A differenza di TGStat (che si concentra sulle statistiche),\nRecordedTelegram è orientato alla <strong>ricerca del contenuto\ntestuale</strong> dei messaggi.</p>\n<blockquote>\n<p><strong>Nota aggiornamento:</strong> il portale web\n<code>recordedtelegram.com</code> non è più raggiungibile. L’accesso\navviene ora tramite registrazione diretta all’endpoint API:\n<strong>https://api.recordedtelegram.com/</strong>. Dopo la\nregistrazione si ottiene una chiave API per l’interrogazione\nprogrammatica del servizio.</p>\n</blockquote>\n<p><strong>Funzionalità principali:</strong> - Ricerca full-text nei\nmessaggi archiviati. - Filtro per canale, data, lingua. -\nVisualizzazione dei messaggi originali con metadati. - Export dei\nrisultati. - API per integrazioni (piano a pagamento).</p>\n<h3 id=\"tipologie-di-informazioni-accessibili\">10.2 Tipologie di\ninformazioni accessibili</h3>\n<p><strong>Ricerca per keyword:</strong> Trova tutti i messaggi che\ncontengono una parola chiave, tra tutti i canali indicizzati. Utile per\nmonitorare come si diffonde una notizia, un nome o un evento su\nTelegram.</p>\n<p><strong>Ricerca per canale:</strong> Visualizza lo storico completo\ndei messaggi di un canale specifico, inclusi quelli\n<strong>eliminati</strong> (se archiviati prima della cancellazione).\nQuesta è la funzione più potente per l’OSINT.</p>\n<p><strong>Ricerca per utente:</strong> Trova i messaggi scritti da un\nutente specifico nei gruppi indicizzati.</p>\n<p><strong>Ricerca per entità:</strong> Trova menzioni di username, URL,\nhashtag in tutti i messaggi archiviati.</p>\n<h3 id=\"come-utilizzare-recordedtelegram\">10.3 Come utilizzare\nRecordedTelegram</h3>\n<p>L’accesso a RecordedTelegram avviene tramite API dopo\nregistrazione:</p>\n<ol type=\"1\">\n<li>Registrati su\n<strong>https://api.recordedtelegram.com/</strong>.</li>\n<li>Ottieni la tua <strong>API key</strong> dalla dashboard dopo la\nverifica dell’account.</li>\n<li>Usa l’API per interrogare il database con richieste HTTP.</li>\n</ol>\n<p><strong>Endpoint principali dell’API:</strong></p>\n<pre><code>GET /v2/search?q=KEYWORD&amp;type=text\nGET /v2/channel/NOME_CANALE/messages\nGET /v2/user/@username/messages</code></pre>\n<p><strong>Script Python per RecordedTelegram API:</strong></p>\n<pre class=\"python\"><code>import os\nimport requests\n\nAPI_KEY = os.environ.get(&quot;RECORDED_TG_KEY&quot;, &quot;&quot;)\nBASE = &quot;https://api.recordedtelegram.com/v2&quot;\n\ndef cerca(query: str, tipo: str = &quot;text&quot;, limite: int = 20) -&gt; list[dict]:\n    r = requests.get(\n        f&quot;{BASE}/search&quot;,\n        headers={&quot;Authorization&quot;: f&quot;Bearer {API_KEY}&quot;},\n        params={&quot;q&quot;: query, &quot;type&quot;: tipo, &quot;limit&quot;: limite},\n        timeout=15,\n    )\n    r.raise_for_status()\n    return r.json().get(&quot;results&quot;, [])\n\nif __name__ == &quot;__main__&quot;:\n    if not API_KEY:\n        print(&quot;⚠ Imposta RECORDED_TG_KEY&quot;); exit(1)\n    query = input(&quot;Keyword da cercare: &quot;).strip()\n    risultati = cerca(query)\n    for r in risultati:\n        print(f&quot;  [{r.get(&#39;date&#39;,&#39;N/A&#39;)}] @{r.get(&#39;channel&#39;,&#39;?&#39;)} – {r.get(&#39;text&#39;,&#39;&#39;)[:120]}&quot;)</code></pre>\n<blockquote>\n<p><strong>Nota:</strong> RecordedTelegram è uno strumento professionale\nusato da giornalisti, ricercatori e aziende di intelligence. Il suo\ndatabase copre milioni di canali pubblici; i canali privati e quelli non\nancora indicizzati non sono presenti. Verifica la documentazione\naggiornata su <strong>https://api.recordedtelegram.com/</strong> per\neventuali variazioni agli endpoint.</p>\n</blockquote>\n<hr />\n<h2 id=\"tgstat-approfondimento\">11. TGStat: approfondimento</h2>\n<h3 id=\"tgstat-come-strumento-osint\">11.1 TGStat come strumento\nOSINT</h3>\n<p>Abbiamo introdotto TGStat nella precedente versione del capitolo.\nApprofondiamo le funzionalità specifiche per l’OSINT:</p>\n<p><strong>Ricerca canali per keyword:</strong></p>\n<pre><code>https://tgstat.com/search?q=KEYWORD</code></pre>\n<p><strong>Ricerca messaggi per keyword:</strong></p>\n<pre><code>https://tgstat.com/search/messages?q=KEYWORD</code></pre>\n<p><strong>Pagina di un singolo canale:</strong></p>\n<pre><code>https://tgstat.com/channel/@NOME_CANALE</code></pre>\n<p><strong>Messaggi eliminati:</strong> nella tab “Posts” di TGStat, i\nmessaggi eliminati sono spesso ancora presenti con il testo originale\n(evidenziati con un’icona rossa).</p>\n<p><strong>Canali correlati:</strong> nella sezione “Related channels”\ntrovi i canali che si citano a vicenda, condividono iscritti o\ncontenuti.</p>\n<p><strong>Ricerca per lingua e paese:</strong> usa i filtri nella\npagina di ricerca per restringere ai canali in italiano o registrati in\nItalia.</p>\n<h3 id=\"interpretare-le-statistiche-tgstat-per-losint\">11.2 Interpretare\nle statistiche TGStat per l’OSINT</h3>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Metrica</th>\n<th>Valore normale</th>\n<th>Segnale d’allarme</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>ERR (Engagement Rate Reach)</strong></td>\n<td>10-30%</td>\n<td>&lt; 2%: possibili bot; &gt; 80%: canale piccolo di nicchia</td>\n</tr>\n<tr>\n<td><strong>Crescita iscritti</strong></td>\n<td>Graduale</td>\n<td>Picco improvviso: acquisto followers</td>\n</tr>\n<tr>\n<td><strong>Views/post vs. iscritti</strong></td>\n<td>~15-25%</td>\n<td>&lt; 1%: contenuto irrilevante o molti bot</td>\n</tr>\n<tr>\n<td><strong>Frequency</strong></td>\n<td>1-10 post/giorno</td>\n<td>&gt; 50/giorno: canale automatizzato</td>\n</tr>\n<tr>\n<td><strong>Citation index</strong></td>\n<td>Crescente</td>\n<td>Diminuisce: canale che perde influenza</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2 id=\"applicazioni-per-osint-su-telegram\">12. Applicazioni per OSINT\nsu Telegram</h2>\n<h3 id=\"panoramica-degli-strumenti-software\">12.1 Panoramica degli\nstrumenti software</h3>\n<p>Oltre ai siti web, esistono applicazioni e framework software\ndedicati all’OSINT su Telegram. I principali:</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Strumento</th>\n<th>Tipo</th>\n<th>Funzione principale</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Telethon</strong></td>\n<td>Libreria Python</td>\n<td>API MTProto: raccolta dati, monitoring</td>\n</tr>\n<tr>\n<td><strong>Telepathy</strong></td>\n<td>Tool Python</td>\n<td>OSINT su canali: messaggi, media, membri</td>\n</tr>\n<tr>\n<td><strong>TeleRecon</strong></td>\n<td>Tool Python</td>\n<td>Ricognizione completa su canali e utenti</td>\n</tr>\n<tr>\n<td><strong>Telegram-Tracker</strong></td>\n<td>Tool Python</td>\n<td>Tracking storico username e info utenti</td>\n</tr>\n<tr>\n<td><strong>TGS (Telegram Grapher Scanner)</strong></td>\n<td>Tool Python</td>\n<td>Visualizzazione reti di canali</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2 id=\"introduzione-allo-scraping-su-telegram-e-normative\">13.\nIntroduzione allo scraping su Telegram e normative</h2>\n<h3 id=\"cosa-si-intende-per-scraping-su-telegram\">13.1 Cosa si intende\nper scraping su Telegram</h3>\n<p>Lo <strong>scraping</strong> su Telegram è la raccolta automatizzata\ndi messaggi, metadati e informazioni da canali e gruppi tramite: - L’API\nufficiale MTProto (via Telethon o altri client). - Il parsing\ndell’interfaccia web <code>t.me/s/</code>. - Bot dedicati.</p>\n<h3 id=\"cosa-è-consentito-e-cosa-no\">13.2 Cosa è consentito e cosa\nno</h3>\n<p><strong>Consentito (API ufficiale):</strong> - Raccogliere messaggi\nda canali pubblici a cui sei iscritto. - Ottenere metadati di canali e\nutenti pubblici. - Costruire bot che rispondono agli utenti.</p>\n<p><strong>Vietato dai ToS di Telegram:</strong> - Creare account falsi\nin modo automatizzato. - Spammare utenti o canali. - Raccogliere in modo\nmassiccio dati personali degli utenti senza consenso. - Usare l’API per\ncreare servizi concorrenti a Telegram.</p>\n<p><strong>Vietato dalla legge (GDPR / Codice Penale):</strong> -\nRaccogliere e pubblicare dati personali di utenti senza base giuridica.\n- Accedere a gruppi privati con false identità per raccogliere dati. -\nIntercettare comunicazioni private.</p>\n<h3 id=\"rate-limiting-di-telegram\">13.3 Rate limiting di Telegram</h3>\n<p>Telegram applica limiti alle richieste API per prevenire abusi:</p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Operazione</th>\n<th>Limite approssimativo</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Messaggi inviati in broadcast</td>\n<td>30/secondo</td>\n</tr>\n<tr>\n<td>Richieste GetHistory (messaggi canale)</td>\n<td>~100 messaggi/richiesta</td>\n</tr>\n<tr>\n<td>Richieste GetParticipants (membri)</td>\n<td>~200/richiesta, pause obbligatorie</td>\n</tr>\n<tr>\n<td>Cambio username</td>\n<td>1 ogni 24 ore</td>\n</tr>\n<tr>\n<td>Creazione gruppi/canali</td>\n<td>5 al giorno</td>\n</tr>\n</tbody>\n</table>\n<p>Violare i rate limit porta a errori <code>FloodWait</code> (attesa\nobbligatoria) o al ban temporaneo/permanente dell’account o dell’IP.</p>\n<hr />\n<h2 id=\"telepathy\">14. Telepathy</h2>\n<h3 id=\"panoramica-della-suite\">14.1 Panoramica della suite</h3>\n<p><strong>Telepathy</strong>\n(https://github.com/jordanwildon/Telepathy) è uno strumento OSINT open\nsource sviluppato in Python da <strong>Jordan Wildon</strong>\n(giornalista e ricercatore). Si concentra sull’analisi di canali e\ngruppi Telegram, offrendo un approccio strutturato alla raccolta\ndati.</p>\n<p><strong>Caratteristiche principali:</strong> - Download completo dei\nmessaggi di un canale in formato JSON/CSV. - Estrazione dei media\n(immagini, video, documenti). - Analisi delle entity (username, URL,\nhashtag) nei messaggi. - Estrazione dei membri di un gruppo. - Mapping\ndei canali correlati (forward analysis). - Generazione di report in\nHTML.</p>\n<p><strong>Requisiti:</strong> - Python 3.8+ - Account Telegram con API\nID e API Hash (<code>my.telegram.org</code>) -\n<code>pip3 install telepathy-osint</code></p>\n<h3 id=\"installazione-e-configurazione\">14.2 Installazione e\nconfigurazione</h3>\n<pre class=\"bash\"><code># Installazione da pip\npip3 install telepathy-osint\n\n# Oppure da sorgente\ngit clone https://github.com/jordanwildon/Telepathy.git\ncd Telepathy\npip3 install -r requirements.txt</code></pre>\n<p><strong>Configurazione (prima esecuzione):</strong></p>\n<pre class=\"bash\"><code>python3 -m telepathy --config\n# Chiede: API_ID, API_HASH, numero di telefono\n# Genera il file di sessione</code></pre>\n<h3 id=\"uso-di-telepathy\">14.3 Uso di Telepathy</h3>\n<pre class=\"bash\"><code># Analisi completa di un canale\npython3 -m telepathy -t nome_canale\n\n# Solo messaggi (no media)\npython3 -m telepathy -t nome_canale --text-only\n\n# Includi l&#39;analisi dei membri del gruppo\npython3 -m telepathy -t nome_gruppo --include-members\n\n# Analisi dei forward (canali correlati)\npython3 -m telepathy -t nome_canale --forwards\n\n# Genera report HTML\npython3 -m telepathy -t nome_canale --report\n\n# Specifica il limite di messaggi\npython3 -m telepathy -t nome_canale --limit 1000\n\n# Analisi a partire da una data\npython3 -m telepathy -t nome_canale --from-date 2024-01-01</code></pre>\n<p><strong>Output tipico di Telepathy:</strong></p>\n<pre><code>output/\n└── nome_canale_2024-10-21/\n    ├── messages.csv          # Tutti i messaggi con metadati\n    ├── media/                # Immagini e video scaricati\n    ├── entities.csv          # URL, username, hashtag estratti\n    ├── members.csv           # Lista membri (se gruppo)\n    ├── forwards.csv          # Canali da cui sono stati forwarded messaggi\n    └── report.html           # Report visuale interattivo</code></pre>\n<h3 id=\"analisi-dei-forward-con-telepathy\">14.4 Analisi dei forward con\nTelepathy</h3>\n<p>La funzione <code>--forwards</code> è particolarmente potente per\nl’OSINT: analizza i messaggi forwarded nel canale e costruisce una\n<strong>mappa dei canali di origine</strong>. Questo rivela:</p>\n<ul>\n<li>Da quali canali l’admin trae ispirazione o amplifica contenuti.</li>\n<li>Reti di canali coordinati che si promuovono a vicenda.</li>\n<li>La “catena di diffusione” di una notizia o contenuto su\nTelegram.</li>\n</ul>\n<pre class=\"python\"><code># Analisi manuale dei forward con Telethon\nimport asyncio\nfrom collections import Counter\nfrom telethon import TelegramClient\nimport os\n\nAPI_ID = int(os.environ.get(&quot;TG_API_ID&quot;, 0))\nAPI_HASH = os.environ.get(&quot;TG_API_HASH&quot;, &quot;&quot;)\n\nasync def analizza_forward(canale: str, limite: int = 500):\n    async with TelegramClient(&quot;osint_session&quot;, API_ID, API_HASH) as client:\n        entity = await client.get_entity(canale)\n        origini = Counter()\n\n        async for msg in client.iter_messages(entity, limit=limite):\n            if msg.forward and msg.forward.chat:\n                nome_origine = getattr(msg.forward.chat, &quot;title&quot;,\n                               getattr(msg.forward.chat, &quot;username&quot;, &quot;sconosciuto&quot;))\n                origini[nome_origine] += 1\n\n        print(f&quot;\\n📊 Canali di origine dei forward in @{canale}:\\n&quot;)\n        for nome, conteggio in origini.most_common(20):\n            print(f&quot;  {conteggio:&gt;4}x  {nome}&quot;)\n\nif __name__ == &quot;__main__&quot;:\n    canale = input(&quot;Canale da analizzare: &quot;).strip()\n    asyncio.run(analizza_forward(canale))</code></pre>\n<hr />\n<h2 id=\"telerecon\">15. TeleRecon</h2>\n<h3 id=\"cosè-telerecon\">15.1 Cos’è TeleRecon</h3>\n<p><strong>TeleRecon</strong> (https://github.com/revealing/TeleRecon) è\nuno strumento di ricognizione Telegram orientato all’analisi degli\nutenti e dei loro comportamenti. Si concentra maggiormente sul\n<strong>profiling degli utenti</strong> rispetto a Telepathy (che è più\norientata ai canali).</p>\n<p><strong>Funzionalità principali:</strong> - Raccolta di informazioni\nsu un utente (nome, username, ID, foto, bio). - Storico degli username\n(se disponibile). - Analisi dei gruppi comuni tra l’account di ricerca e\nil target. - Verifica della presenza dell’utente in gruppi specifici. -\nExport in JSON.</p>\n<h3 id=\"installazione-e-uso\">15.2 Installazione e uso</h3>\n<pre class=\"bash\"><code>git clone https://github.com/revealing/TeleRecon.git\ncd TeleRecon\npip3 install -r requirements.txt\npython3 telerecon.py</code></pre>\n<p><strong>Menu principale di TeleRecon:</strong></p>\n<pre><code>1. Raccolta info su utente (per username)\n2. Raccolta info su utente (per ID)\n3. Analisi di un canale\n4. Cerca utente nei gruppi comuni\n5. Export dati</code></pre>\n<h3 id=\"script-python-equivalente-a-telerecon\">15.3 Script Python\nequivalente a TeleRecon</h3>\n<pre class=\"python\"><code>#!/usr/bin/env python3\n&quot;&quot;&quot;\nuser_recon.py – Ricognizione completa su un utente Telegram.\nEquivalente semplificato di TeleRecon.\nRichiede: pip3 install telethon\n&quot;&quot;&quot;\nimport asyncio\nimport json\nimport os\nfrom datetime import datetime, timezone\nfrom telethon import TelegramClient\nfrom telethon.tl.types import User, UserFull\n\nAPI_ID = int(os.environ.get(&quot;TG_API_ID&quot;, 0))\nAPI_HASH = os.environ.get(&quot;TG_API_HASH&quot;, &quot;&quot;)\nSESSION = &quot;osint_session&quot;\n\n\nasync def recon_utente(identificatore: str) -&gt; dict:\n    &quot;&quot;&quot;Raccoglie tutte le informazioni disponibili su un utente.&quot;&quot;&quot;\n    async with TelegramClient(SESSION, API_ID, API_HASH) as client:\n        # Risolvi l&#39;entità\n        if identificatore.lstrip(&quot;+-&quot;).isdigit():\n            entity = await client.get_entity(int(identificatore))\n        else:\n            entity = await client.get_entity(identificatore.lstrip(&quot;@&quot;))\n\n        if not isinstance(entity, User):\n            print(&quot;⚠ Non è un utente (è un canale o gruppo).&quot;)\n            return {}\n\n        # Ottieni il profilo completo\n        full = await client(\n            __import__(&quot;telethon.tl.functions.users&quot;, fromlist=[&quot;GetFullUserRequest&quot;])\n            .GetFullUserRequest(entity)\n        )\n\n        profilo = {\n            &quot;timestamp_utc&quot;: datetime.now(timezone.utc).isoformat(timespec=&quot;seconds&quot;),\n            &quot;id&quot;: entity.id,\n            &quot;nome&quot;: entity.first_name or &quot;&quot;,\n            &quot;cognome&quot;: entity.last_name or &quot;&quot;,\n            &quot;username&quot;: entity.username or &quot;&quot;,\n            &quot;bot&quot;: entity.bot,\n            &quot;premium&quot;: getattr(entity, &quot;premium&quot;, False),\n            &quot;verified&quot;: getattr(entity, &quot;verified&quot;, False),\n            &quot;scam&quot;: getattr(entity, &quot;scam&quot;, False),\n            &quot;fake&quot;: getattr(entity, &quot;fake&quot;, False),\n            &quot;telefono&quot;: entity.phone or &quot;nascosto&quot;,\n            &quot;bio&quot;: getattr(full.full_user, &quot;about&quot;, &quot;&quot;) or &quot;&quot;,\n            &quot;link_comune&quot;: getattr(full.full_user, &quot;common_chats_count&quot;, 0),\n        }\n\n        # Stima anno creazione\n        profilo[&quot;stima_creazione&quot;] = stima_anno_creazione(entity.id)\n\n        return profilo\n\n\ndef stima_anno_creazione(user_id: int) -&gt; str:\n    &quot;&quot;&quot;Stima approssimativa del periodo di creazione dell&#39;account dall&#39;ID.&quot;&quot;&quot;\n    fasce = [\n        (10_000, &quot;2013 (beta tester)&quot;),\n        (1_000_000, &quot;2013-2014&quot;),\n        (10_000_000, &quot;2014-2015&quot;),\n        (100_000_000, &quot;2015-2017&quot;),\n        (1_000_000_000, &quot;2017-2020&quot;),\n        (5_000_000_000, &quot;2020-2022&quot;),\n    ]\n    for limite, periodo in fasce:\n        if user_id &lt; limite:\n            return periodo\n    return &quot;2022+&quot;\n\n\ndef stampa_profilo(profilo: dict) -&gt; None:\n    &quot;&quot;&quot;Stampa il profilo in modo leggibile.&quot;&quot;&quot;\n    print(f&quot;\\n{&#39;=&#39;*55}&quot;)\n    print(f&quot;  PROFILO TELEGRAM – {profilo.get(&#39;nome&#39;)} {profilo.get(&#39;cognome&#39;)}&quot;)\n    print(f&quot;{&#39;=&#39;*55}&quot;)\n    for k, v in profilo.items():\n        if v and k != &quot;timestamp_utc&quot;:\n            print(f&quot;  {k:&lt;25} {v}&quot;)\n    print()\n\n\nif __name__ == &quot;__main__&quot;:\n    identificatore = input(&quot;Username (@nome) o ID numerico: &quot;).strip()\n    profilo = asyncio.run(recon_utente(identificatore))\n    if profilo:\n        stampa_profilo(profilo)\n        nome_file = f&quot;recon_{profilo.get(&#39;id&#39;, &#39;unknown&#39;)}.json&quot;\n        with open(nome_file, &quot;w&quot;, encoding=&quot;utf-8&quot;) as f:\n            json.dump(profilo, f, ensure_ascii=False, indent=2)\n        print(f&quot;✔ Profilo salvato in {nome_file}&quot;)</code></pre>\n<hr />\n<h2 id=\"monitorare-lo-stato-online-e-offline-tramite-script\">16.\nMonitorare lo stato online e offline tramite script</h2>\n<h3 id=\"il-problema-del-monitoraggio-last-seen\">16.1 Il problema del\nmonitoraggio “last seen”</h3>\n<p>Telegram registra l’“<strong>ultimo accesso</strong>” (last seen) di\nogni utente. In base alle impostazioni privacy dell’utente, questo dato\nè: - <strong>Visibile a tutti</strong>: mostra l’ora esatta dell’ultimo\naccesso o “online” in tempo reale. - <strong>Visibile ai\ncontatti</strong>: visibile solo ai contatti dell’utente. -\n<strong>Nascosto</strong>: mostra solo “recentemente” o “molto tempo\nfa”. - <strong>Non visibile</strong>: nessuna informazione.</p>\n<p>Monitorare le sessioni online/offline di un utente nel tempo\ncostruisce un <strong>pattern di attività</strong> che rivela: - Il fuso\norario del soggetto (picchi di attività in certi orari UTC). - Le\nabitudini (mattiniero? nottambulo? attivo solo nei feriali?). - Periodi\ndi assenza (vacanze, detenzione, malattia?). - La correlazione con\neventi (il soggetto va offline subito dopo un certo evento).</p>\n<blockquote>\n<p><strong>Avvertenza etica:</strong> il monitoraggio sistematico dello\nstato online di un individuo è una forma di sorveglianza. In Italia, se\nfatto in modo non autorizzato su soggetti privati, può configurare lo\nstalking digitale (art. 612-bis c.p.) o trattamento illecito di dati\n(art. 167 Codice Privacy).</p>\n</blockquote>\n<h3 id=\"script-di-monitoring-del-last-seen\">16.2 Script di monitoring\ndel last seen</h3>\n<pre class=\"python\"><code>#!/usr/bin/env python3\n&quot;&quot;&quot;\nonline_monitor.py – Monitora lo stato online/offline di un utente Telegram.\nATTENZIONE: usare solo con base giuridica legittima.\nRichiede: pip3 install telethon\n&quot;&quot;&quot;\nimport asyncio\nimport csv\nimport os\nfrom datetime import datetime, timezone\nfrom telethon import TelegramClient\nfrom telethon.tl.types import (\n    UserStatusOnline, UserStatusOffline,\n    UserStatusRecently, UserStatusLastWeek,\n    UserStatusLastMonth, UserStatusEmpty,\n)\n\nAPI_ID = int(os.environ.get(&quot;TG_API_ID&quot;, 0))\nAPI_HASH = os.environ.get(&quot;TG_API_HASH&quot;, &quot;&quot;)\nSESSION = &quot;osint_session&quot;\n\nINTERVALLO_SECONDI = 60  # controlla ogni minuto\n\n\ndef interpreta_status(status) -&gt; str:\n    &quot;&quot;&quot;Converte lo status Telegram in testo leggibile.&quot;&quot;&quot;\n    if isinstance(status, UserStatusOnline):\n        return &quot;ONLINE&quot;\n    elif isinstance(status, UserStatusOffline):\n        ultimo = status.was_online.astimezone(timezone.utc).isoformat(timespec=&quot;seconds&quot;)\n        return f&quot;OFFLINE (ultimo accesso: {ultimo})&quot;\n    elif isinstance(status, UserStatusRecently):\n        return &quot;recentemente (&lt; 72h)&quot;\n    elif isinstance(status, UserStatusLastWeek):\n        return &quot;nell&#39;ultima settimana&quot;\n    elif isinstance(status, UserStatusLastMonth):\n        return &quot;nell&#39;ultimo mese&quot;\n    elif isinstance(status, UserStatusEmpty):\n        return &quot;non disponibile&quot;\n    return &quot;sconosciuto&quot;\n\n\nasync def monitora(username: str, durata_minuti: int = 60) -&gt; None:\n    &quot;&quot;&quot;\n    Monitora lo stato online di un utente per un periodo dato.\n    Salva ogni cambio di stato in un CSV.\n    &quot;&quot;&quot;\n    file_log = f&quot;monitor_{username}_{datetime.now(timezone.utc).strftime(&#39;%Y%m%d_%H%M&#39;)}.csv&quot;\n    campi = [&quot;timestamp_utc&quot;, &quot;status&quot;, &quot;dettaglio&quot;]\n\n    async with TelegramClient(SESSION, API_ID, API_HASH) as client:\n        entity = await client.get_entity(username)\n        print(f&quot;🔭 Monitoring: {entity.first_name} @{entity.username} (ID: {entity.id})&quot;)\n        print(f&quot;   Durata: {durata_minuti} minuti | Log: {file_log}\\n&quot;)\n\n        iterazioni = (durata_minuti * 60) // INTERVALLO_SECONDI\n        status_precedente = None\n\n        with open(file_log, &quot;w&quot;, newline=&quot;&quot;, encoding=&quot;utf-8&quot;) as f:\n            writer = csv.DictWriter(f, fieldnames=campi)\n            writer.writeheader()\n\n            for _ in range(iterazioni):\n                user = await client.get_entity(entity.id)\n                status_attuale = interpreta_status(user.status)\n                ts = datetime.now(timezone.utc).isoformat(timespec=&quot;seconds&quot;)\n\n                if status_attuale != status_precedente:\n                    print(f&quot;  [{ts}] {status_attuale}&quot;)\n                    writer.writerow({\n                        &quot;timestamp_utc&quot;: ts,\n                        &quot;status&quot;: &quot;ONLINE&quot; if &quot;ONLINE&quot; in status_attuale else &quot;OFFLINE&quot;,\n                        &quot;dettaglio&quot;: status_attuale,\n                    })\n                    f.flush()\n                    status_precedente = status_attuale\n\n                await asyncio.sleep(INTERVALLO_SECONDI)\n\n    print(f&quot;\\n✔ Monitoring completato. Log in {file_log}&quot;)\n\n\nif __name__ == &quot;__main__&quot;:\n    username = input(&quot;Username da monitorare (senza @): &quot;).strip()\n    durata = int(input(&quot;Durata in minuti (es. 60): &quot;).strip() or &quot;60&quot;)\n    asyncio.run(monitora(username, durata))</code></pre>\n<h3 id=\"analisi-dei-dati-di-monitoring\">16.3 Analisi dei dati di\nmonitoring</h3>\n<p>Dopo aver raccolto i dati di monitoring, l’analisi si concentra\nsu:</p>\n<pre class=\"python\"><code>#!/usr/bin/env python3\n&quot;&quot;&quot;\nanalisi_monitoring.py – Analizza i dati di monitoring dello stato online.\nProduce statistiche su orari di attività e fuso orario probabile.\n&quot;&quot;&quot;\nimport csv\nimport sys\nfrom collections import Counter\nfrom datetime import datetime, timezone\n\n\ndef carica_log(file_csv: str) -&gt; list[dict]:\n    with open(file_csv, encoding=&quot;utf-8&quot;) as f:\n        return list(csv.DictReader(f))\n\n\ndef analizza(log: list[dict]) -&gt; None:\n    &quot;&quot;&quot;Analizza il pattern di attività.&quot;&quot;&quot;\n    sessioni_online = [r for r in log if r[&quot;status&quot;] == &quot;ONLINE&quot;]\n    ore_utc = [datetime.fromisoformat(r[&quot;timestamp_utc&quot;]).hour for r in sessioni_online]\n    distribuzione = Counter(ore_utc)\n\n    print(f&quot;\\n📊 Analisi monitoraggio – {len(log)} eventi totali&quot;)\n    print(f&quot;   Sessioni ONLINE: {len(sessioni_online)}\\n&quot;)\n\n    print(&quot;🕐 Distribuzione oraria (UTC):&quot;)\n    for ora in range(24):\n        barre = &quot;█&quot; * distribuzione.get(ora, 0)\n        print(f&quot;  {ora:02d}:00  {barre} ({distribuzione.get(ora, 0)})&quot;)\n\n    # Ora di punta\n    if ore_utc:\n        ora_picco = distribuzione.most_common(1)[0][0]\n        print(f&quot;\\n  Ora di picco (UTC): {ora_picco:02d}:00&quot;)\n\n        # Stima fuso orario\n        print(&quot;\\n⏰ Fuso orario probabile (se attivo in orari diurni 8-20):&quot;)\n        for fuso in range(-12, 13):\n            ora_locale = (ora_picco + fuso) % 24\n            if 8 &lt;= ora_locale &lt;= 20:\n                nome_fuso = f&quot;UTC{&#39;+&#39; if fuso &gt;= 0 else &#39;&#39;}{fuso}&quot;\n                print(f&quot;  {nome_fuso}: ore {ora_locale:02d}:00 locali&quot;)\n\n\nif __name__ == &quot;__main__&quot;:\n    file = sys.argv[1] if len(sys.argv) &gt; 1 else input(&quot;File CSV di monitoring: &quot;)\n    log = carica_log(file)\n    analizza(log)</code></pre>\n<hr />\n<h2 id=\"analisi-degli-id\">17. Analisi degli ID</h2>\n<h3 id=\"perché-lid-è-fondamentale\">17.1 Perché l’ID è fondamentale</h3>\n<p>L’<strong>ID numerico</strong> di un account Telegram è: -\n<strong>Immutabile</strong>: non cambia mai, neanche se l’utente cambia\nnumero di telefono, username o nome. - <strong>Univoco</strong>: non può\nessere riassegnato. - <strong>Sequenziale</strong>: assegnato in ordine\ncrescente al momento della creazione dell’account. - <strong>Rivelatore\ndella data di creazione</strong>: tramite correlazione con range\nnoti.</p>\n<h3 id=\"come-ottenere-lid-di-un-account\">17.2 Come ottenere l’ID di un\naccount</h3>\n<p><strong>Via <span class=\"citation\"\ndata-cites=\"getidsbot\">@getidsbot</span>:</strong> 1. Avvia una chat con\n<code>@getidsbot</code>. 2. Inoltra un messaggio dell’utente target al\nbot. 3. Il bot risponde con l’ID del mittente originale.</p>\n<p><strong>Via Telethon:</strong></p>\n<pre class=\"python\"><code>entity = await client.get_entity(&quot;@username&quot;)\nprint(entity.id)</code></pre>\n<p><strong>Via URL del forward:</strong> Quando si inoltra un messaggio\ncon link all’account originale, l’URL contiene:</p>\n<pre><code>tg://user?id=NUMERO</code></pre>\n<h3 id=\"tabella-di-correlazione-id-data-di-creazione\">17.3 Tabella di\ncorrelazione ID → data di creazione</h3>\n<table>\n<thead>\n<tr>\n<th>Range ID</th>\n<th>Periodo stimato</th>\n<th>Note</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1 – 10.000</td>\n<td>Agosto 2013</td>\n<td>Fondatori e beta tester</td>\n</tr>\n<tr>\n<td>10.000 – 100.000</td>\n<td>2013</td>\n<td>Adozione iniziale</td>\n</tr>\n<tr>\n<td>100.000 – 1.000.000</td>\n<td>2013-2014</td>\n<td>Prima espansione</td>\n</tr>\n<tr>\n<td>1M – 10M</td>\n<td>2014-2015</td>\n<td>Crescita post-WhatsApp outage</td>\n</tr>\n<tr>\n<td>10M – 100M</td>\n<td>2015-2017</td>\n<td>Espansione globale</td>\n</tr>\n<tr>\n<td>100M – 500M</td>\n<td>2017-2019</td>\n<td>Adozione in ME e Asia</td>\n</tr>\n<tr>\n<td>500M – 1B</td>\n<td>2019-2020</td>\n<td>Boom post-WhatsApp privacy</td>\n</tr>\n<tr>\n<td>1B – 3B</td>\n<td>2020-2021</td>\n<td>Pandemia COVID</td>\n</tr>\n<tr>\n<td>3B – 5B</td>\n<td>2021-2022</td>\n<td>Ulteriore crescita</td>\n</tr>\n<tr>\n<td>&gt; 5B</td>\n<td>2022+</td>\n<td>Periodo attuale</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>Attenzione:</strong> questi range sono stime basate su report\ndella community, non dati ufficiali di Telegram. Usali come indicatori\napprossimativi, non come prove certe.</p>\n</blockquote>\n<h3 id=\"script-di-analisi-degli-id\">17.4 Script di analisi degli ID</h3>\n<pre class=\"python\"><code>#!/usr/bin/env python3\n&quot;&quot;&quot;\nid_analyzer.py – Analisi avanzata degli ID Telegram.\nStima la data di creazione e analizza pattern in liste di ID.\n&quot;&quot;&quot;\nfrom datetime import datetime\n\n\nFASCE_ID = [\n    (10_000, &quot;ago 2013&quot;, &quot;beta tester&quot;),\n    (100_000, &quot;set-dic 2013&quot;, &quot;adozione iniziale&quot;),\n    (1_000_000, &quot;2013-2014&quot;, &quot;prima espansione&quot;),\n    (10_000_000, &quot;2014-2015&quot;, &quot;crescita post-WhatsApp&quot;),\n    (100_000_000, &quot;2015-2017&quot;, &quot;espansione globale&quot;),\n    (500_000_000, &quot;2017-2019&quot;, &quot;ME e Asia&quot;),\n    (1_000_000_000, &quot;2019-2020&quot;, &quot;boom privacy&quot;),\n    (3_000_000_000, &quot;2020-2021&quot;, &quot;pandemia&quot;),\n    (5_000_000_000, &quot;2021-2022&quot;, &quot;crescita ulteriore&quot;),\n    (float(&quot;inf&quot;), &quot;2022+&quot;, &quot;periodo attuale&quot;),\n]\n\n\ndef analizza_id(user_id: int) -&gt; dict:\n    &quot;&quot;&quot;Analizza un singolo ID Telegram.&quot;&quot;&quot;\n    for limite, periodo, contesto in FASCE_ID:\n        if user_id &lt; limite:\n            return {\n                &quot;id&quot;: user_id,\n                &quot;periodo_creazione&quot;: periodo,\n                &quot;contesto&quot;: contesto,\n                &quot;tipo&quot;: &quot;bot&quot; if user_id &lt; 0 else &quot;utente&quot;,\n            }\n    return {&quot;id&quot;: user_id, &quot;periodo_creazione&quot;: &quot;sconosciuto&quot;}\n\n\ndef analizza_lista(ids: list[int]) -&gt; None:\n    &quot;&quot;&quot;Analizza una lista di ID e produce statistiche.&quot;&quot;&quot;\n    print(f&quot;\\n📊 Analisi di {len(ids)} ID Telegram\\n&quot;)\n\n    risultati = [analizza_id(i) for i in ids if i &gt; 0]\n    risultati.sort(key=lambda r: r[&quot;id&quot;])\n\n    # Distribuzione per periodo\n    from collections import Counter\n    periodi = Counter(r[&quot;periodo_creazione&quot;] for r in risultati)\n\n    print(&quot;Distribuzione per periodo di creazione:&quot;)\n    for periodo, conteggio in sorted(periodi.items()):\n        barre = &quot;█&quot; * min(conteggio, 50)\n        print(f&quot;  {periodo:&lt;20} {barre} ({conteggio})&quot;)\n\n    # ID più vecchio e più recente\n    if risultati:\n        print(f&quot;\\n  ID più vecchio:  {risultati[0][&#39;id&#39;]:,} ({risultati[0][&#39;periodo_creazione&#39;]})&quot;)\n        print(f&quot;  ID più recente:  {risultati[-1][&#39;id&#39;]:,} ({risultati[-1][&#39;periodo_creazione&#39;]})&quot;)\n        print(f&quot;  ID mediano:      {sorted(ids)[len(ids)//2]:,}&quot;)\n\n\nif __name__ == &quot;__main__&quot;:\n    print(&quot;=== Analisi ID Telegram ===&quot;)\n    print(&quot;1) Analizza singolo ID  2) Analizza lista da file&quot;)\n    scelta = input(&quot;Scelta: &quot;).strip()\n\n    if scelta == &quot;1&quot;:\n        user_id = int(input(&quot;ID numerico: &quot;).strip())\n        r = analizza_id(user_id)\n        print(f&quot;\\n  ID:              {r[&#39;id&#39;]:,}&quot;)\n        print(f&quot;  Tipo:            {r[&#39;tipo&#39;]}&quot;)\n        print(f&quot;  Periodo stimato: {r[&#39;periodo_creazione&#39;]}&quot;)\n        print(f&quot;  Contesto:        {r[&#39;contesto&#39;]}&quot;)\n\n    elif scelta == &quot;2&quot;:\n        file = input(&quot;File con IDs (uno per riga): &quot;).strip()\n        try:\n            with open(file) as f:\n                ids = [int(r.strip()) for r in f if r.strip().lstrip(&quot;-&quot;).isdigit()]\n            analizza_lista(ids)\n        except FileNotFoundError:\n            print(f&quot;⚠ File non trovato: {file}&quot;)</code></pre>\n<hr />\n<h2 id=\"box-legale-ed-etico\">⚖️ Box legale ed etico</h2>\n<h3 id=\"gdpr-e-raccolta-su-telegram\">GDPR e raccolta su Telegram</h3>\n<ul>\n<li>I <strong>canali pubblici</strong> sono equiparabili a siti web\npubblici: la raccolta è generalmente lecita con adeguata base\ngiuridica.</li>\n<li>I <strong>gruppi privati</strong> hanno una ragionevole aspettativa\ndi riservatezza: entrarvi con identità falsa per raccogliere dati è\neticamente e legalmente problematico.</li>\n<li>I <strong>dati degli utenti</strong> (ID, username, bio, foto) sono\ndati personali: il trattamento richiede base giuridica, minimizzazione e\nsicurezza.</li>\n</ul>\n<h3 id=\"monitoring-dello-stato-online-sorveglianza-o-osint\">Monitoring\ndello stato online: sorveglianza o OSINT?</h3>\n<p>Il monitoraggio dello stato online è una tecnica potente ma invasiva.\nÈ accettabile in contesti: - <strong>Sicurezza aziendale</strong>:\nmonitoraggio di account associati a minacce note. - <strong>Giornalismo\ninvestigativo</strong>: con interesse pubblico documentato. -\n<strong>Indagini legali</strong>: su incarico e con autorizzazione\ndell’autorità giudiziaria.</p>\n<p>Non è accettabile: - Monitorare un ex partner, un vicino, o chiunque\nper curiosità personale. - Usare i dati di monitoring per stalking,\nmolestie o intimidazioni.</p>\n<h3 id=\"responsabilità-per-contenuti-illegali-trovati\">Responsabilità\nper contenuti illegali trovati</h3>\n<p>Se durante le ricerche su Telegram trovi: - Contenuti\npedopornografici → segnala immediatamente alla Polizia Postale. -\nPropaganda terroristica → segnala a Telegram e alla DIGOS. - Truffe\nfinanziarie in corso → segnala alla Guardia di Finanza.</p>\n<p><strong>Non conservare</strong> materiale illegale, anche a scopo\nprobatorio, senza specifica autorizzazione giudiziaria.</p>\n<hr />\n<h2 id=\"caso-di-studio-la-rete-di-disinformazione\">Caso di studio: “La\nrete di disinformazione”</h2>\n<blockquote>\n<p><em>Dati fittizi.</em></p>\n</blockquote>\n<p><strong>Scenario.</strong> Un’organizzazione di fact-checking\nidentifica una rete di canali Telegram che diffondono false notizie\nsanitarie. Il canale principale si chiama <code>@salute_verita</code>\n(45.000 iscritti). L’obiettivo è mappare la rete e stimare quante\npersone raggiunge.</p>\n<p><strong>Pianificazione – EEI:</strong> 1. Quanti canali fanno parte\ndella rete? 2. Chi gestisce il canale principale? 3. Qual è la portata\ntotale della rete? 4. Come si diffondono i contenuti?</p>\n<p><strong>Step 1 – TGStat su <code>@salute_verita</code>.</strong> -\nCreato 6 mesi fa. Iscritti cresciuti da 0 a 45k in 3 settimane (acquisto\nprobabile). - Canali correlati: 12 canali con naming simile\n(<code>@salute_vera</code>, <code>@medicina_libera</code>, ecc.). -\nMessaggi eliminati presenti: 3 post eliminati, uno dei quali conteneva\nla firma “Admin Marco”.</p>\n<p><strong>Step 2 – Dork per link d’invito.</strong></p>\n<pre><code>&quot;t.me/+&quot; &quot;salute verita&quot; site:reddit.com OR site:forum.it</code></pre>\n<p>Trovato link d’invito a un gruppo correlato su un forum italiano.\nGruppo: <code>Medici Liberi IT</code> – 8.200 membri.</p>\n<p><strong>Step 3 – Telepathy sul canale principale.</strong></p>\n<pre class=\"bash\"><code>python3 -m telepathy -t salute_verita --forwards --limit 500</code></pre>\n<p><code>forwards.csv</code> mostra 47 canali di origine dei forward,\nmolti in russo e ucraino. Il canale più citato:\n<code>@zdorove_pravda</code> (traduzione: “salute verità” in russo),\n220.000 iscritti.</p>\n<p><strong>Step 4 – RecordedTelegram.</strong> Ricerca\n<code>\"salute_verita\"</code> su RecordedTelegram: trovati 23 messaggi in\naltri canali che menzionano il canale, risalenti a 7 mesi fa (prima\ndella sua creazione pubblica su TGStat). Questo suggerisce pre-lancio\ncoordinato.</p>\n<p><strong>Step 5 – Analisi ID.</strong> - ID canale:\n<code>-1001987654321</code> → prefisso <code>-100</code> +\n<code>1987654321</code>. - ID stimato canale: creato nel 2022-2023. - Il\ngruppo correlato <code>Medici Liberi IT</code> ha ID analogo: creato\nnello stesso periodo.</p>\n<p><strong>Analisi della rete.</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Canale</th>\n<th>Iscritti</th>\n<th>Lingua</th>\n<th>Collegamento</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>@salute_verita</code></td>\n<td>45.000</td>\n<td>IT</td>\n<td>Canale principale</td>\n</tr>\n<tr>\n<td><code>@salute_vera</code></td>\n<td>12.000</td>\n<td>IT</td>\n<td>Forward reciproci</td>\n</tr>\n<tr>\n<td><code>@medicina_libera</code></td>\n<td>8.500</td>\n<td>IT</td>\n<td>Forward reciproci</td>\n</tr>\n<tr>\n<td><code>@zdorove_pravda</code></td>\n<td>220.000</td>\n<td>RU</td>\n<td>Fonte primaria dei contenuti</td>\n</tr>\n<tr>\n<td>Gruppo <code>Medici Liberi IT</code></td>\n<td>8.200</td>\n<td>IT</td>\n<td>Canale di discussione associato</td>\n</tr>\n<tr>\n<td><strong>Totale rete IT</strong></td>\n<td><strong>~74.000</strong></td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Conclusioni nel report.</strong></p>\n<blockquote>\n<p>“La rete ruota attorno al canale russo <code>@zdorove_pravda</code>\n(220k iscritti) che funge da produttore primario di contenuti, tradotti\ne ridiffusi in italiano attraverso almeno 12 canali coordinati. La\nportata totale della rete italiana è di circa 74.000 persone. L’analisi\ndei forward e la crescita innaturale degli iscritti confermano una\n<strong>coordinazione inautentica</strong>. Non è stato possibile\nidentificare con certezza il gestore italiano: la firma ‘Admin Marco’ in\nun messaggio eliminato e l’analisi stilistica suggeriscono una persona\nitalofona, ma le prove non sono sufficienti per un’identificazione\ndefinitiva. Si raccomanda di segnalare i canali a Telegram per\nviolazione delle policy e di condividere questa analisi con le autorità\ncompetenti.”</p>\n</blockquote>\n<hr />\n<h2 id=\"esercizi-pratici\">Esercizi pratici</h2>\n<p><strong>Esercizio 1 – Struttura e storia (15 min)</strong> Senza\nusare strumenti: elenca le tre differenze principali tra un canale e un\nsupergruppo Telegram che hanno implicazioni OSINT. Perché l’ID numerico\nè più utile dell’username per l’identificazione?</p>\n<p><strong>Esercizio 2 – Dork Telegram (20 min)</strong> Lancia questi\ndork su Google e documenta i risultati:</p>\n<pre><code>&quot;t.me/+&quot; &quot;sicurezza informatica&quot; site:reddit.com\nsite:t.me &quot;OSINT&quot; lang:it</code></pre>\n<p><strong>Esercizio 3 – TGStat (30 min)</strong> Scegli un canale\nTelegram pubblico italiano (news, cultura, sport). Aprilo su TGStat.\nDocumenta: iscritti attuali, trend ultimi 30 giorni, ERR, canali\ncorrelati. Ci sono messaggi eliminati visibili?</p>\n<p><strong>Esercizio 4 – <span class=\"citation\"\ndata-cites=\"getidsbot\">@getidsbot</span> (10 min)</strong> Apri\nTelegram, avvia <code>@getidsbot</code>. Inoltra al bot un messaggio da\nun canale pubblico. Annota: ID del canale, ID del messaggio. Usa la\ntabella di correlazione per stimare quando è stato creato il canale.</p>\n<p><strong>Esercizio 5 – Telepathy (45 min)</strong> Installa Telepathy.\nScarica i messaggi di un canale pubblico di news italiano (limite: 200\nmessaggi). Analizza il CSV: qual è l’orario medio di pubblicazione?\nQuanti forward ci sono? Da dove vengono?</p>\n<p><strong>Esercizio 6 – Analisi degli ID (20 min)</strong> Lancia\n<code>id_analyzer.py</code> su tre ID Telegram diversi: il tuo account,\nun canale noto, un altro utente pubblico. Documenta le stime di\ncreazione e confrontale con la storia nota di quegli account.</p>\n<p><strong>Esercizio 7 – Dork + RecordedTelegram (30 min)</strong>\nScegli un evento di cronaca recente italiano. Cerca menzioni su\nRecordedTelegram. Quanti canali lo hanno discusso? Qual è stato il primo\ncanale a menzionarlo?</p>\n<hr />\n","quiz":[{"q":"Quale identificatore Telegram è immutabile e sopravvive a cambi di username e numero?","opts":{"a":"Il nome visualizzato","b":"L'username","c":"L'ID numerico","d":"La foto profilo"},"correct":"c","why":"L'ID numerico è permanente: non cambia con username, nome o numero di telefono"},{"q":"Cosa si ottiene dall'URL https://t.me/s/NOME_CANALE?","opts":{"a":"L'elenco dei membri del canale","b":"La versione web del canale, accessibile senza account","c":"Le impostazioni privacy dell'admin","d":"Il numero di telefono del gestore"},"correct":"b","why":"t.me/s/ mostra l'anteprima web del canale pubblico, consultabile senza account"},{"q":"Quale dork trova link d'invito a gruppi Telegram privati condivisi su siti web pubblici?","opts":{"a":"site:t.me filetype:html","b":"\"t.me/+\" \"keyword\"","c":"inurl:telegram.org","d":"host:t.me \"invito\""},"correct":"b","why":"I link d'invito privati hanno il formato t.me/+: il dork li cerca sulle pagine indicizzate"},{"q":"TGStat è utile per l'OSINT principalmente perché:","opts":{"a":"Permette di leggere messaggi privati degli utenti","b":"Conserva messaggi eliminati e mostra canali correlati","c":"Fornisce il numero di telefono degli admin","d":"È l'API ufficiale di Telegram"},"correct":"b","why":"TGStat conserva lo storico dei messaggi, anche quelli eliminati, e mostra i canali correlati"},{"q":"RecordedTelegram si differenzia da TGStat perché:","opts":{"a":"È gratuito senza limiti","b":"Si concentra sulla ricerca full-text dei messaggi e sull'archivio storico","c":"Funziona solo per canali privati","d":"Non richiede registrazione"},"correct":"b","why":"RecordedTelegram è specializzato nella ricerca full-text dei messaggi e nell'archivio storico (accesso con registrazione su api.recordedtelegram.com)"},{"q":"Telepathy, nella funzione --forwards, analizza:","opts":{"a":"I messaggi forwarded in entrata nel canale e la loro origine","b":"I messaggi in uscita dal canale verso altri","c":"I messaggi eliminati dall'admin","d":"I link d'invito ai gruppi collegati"},"correct":"a","why":"--forwards analizza i messaggi inoltrati nel canale e ne ricostruisce l'origine"},{"q":"Il monitoraggio dello stato online di un utente Telegram è eticamente accettabile:","opts":{"a":"Sempre, perché il dato è tecnicamente accessibile","b":"Mai, perché viola automaticamente la privacy","c":"Solo con base giuridica legittima (indagine autorizzata, giornalismo di interesse pubblico)","d":"Solo se l'utente ha lo status \"online\" visibile a tutti"},"correct":"c","why":"Il monitoraggio di una persona richiede una base giuridica legittima: non basta che il dato sia tecnicamente accessibile"},{"q":"Un ID Telegram di 2.000.000.000 (2 miliardi) corrisponde circa a:","opts":{"a":"2013-2014","b":"2015-2017","c":"2020-2021","d":"2022+"},"correct":"c","why":"Gli ID tra 1 e 3 miliardi corrispondono alla crescita del 2020–2021"},{"q":"Quale strumento permette di monitorare in tempo reale nuovi messaggi su un canale Telegram?","opts":{"a":"TGStat","b":"Telepathy con --report","c":"Telethon con events.NewMessage","d":"RecordedTelegram"},"correct":"c","why":"Telethon con l'evento NewMessage riceve in tempo reale i nuovi messaggi"},{"q":"Se trovi contenuti pedopornografici durante una ricerca su Telegram, cosa devi fare?","opts":{"a":"Documentarli e conservarli come prova","b":"Ignorarli per non esporti a rischi legali","c":"Segnalarli immediatamente alla Polizia Postale e a Telegram","d":"Condividerli con la community OSINT per la verifica"},"correct":"c","why":"Il materiale pedopornografico va segnalato subito alla Polizia Postale e alla piattaforma: detenerlo o diffonderlo è reato"}]},{"title":"Ricerca Inversa e Analisi di Immagini","html":"<h1 id=\"lezione-8-ricerca-inversa-e-analisi-di-immagini\">Lezione 8 –\nRicerca Inversa e Analisi di Immagini</h1>\n<blockquote>\n<p><em>“Un’immagine vale mille parole — e altrettanti metadati.”</em> —\nadagio della community OSINT</p>\n</blockquote>\n<hr />\n<h2 id=\"obiettivi-di-apprendimento\">Obiettivi di apprendimento</h2>\n<p>Al termine di questa lezione sarai in grado di:</p>\n<ol type=\"1\">\n<li>eseguire una ricerca inversa di immagini su più motori (Google,\nYandex, TinEye, Bing) per trovare l’origine e le occorrenze di una\nfoto;</li>\n<li>usare strumenti di <strong>riconoscimento facciale</strong>\n(PimEyes, FaceCheck.id) rispettando il quadro legale;</li>\n<li>estrarre, interpretare e rimuovere i <strong>metadati EXIF</strong>\ncon ExifTool e Python;</li>\n<li>applicare le tecniche di <strong>geolocalizzazione visiva</strong>\nper localizzare dove è stata scattata una foto anche senza dati\nGPS;</li>\n<li>comprendere cos’è la <strong>steganografia</strong>, come viene\nusata in ambito OSINT e come rilevarla;</li>\n<li>rilevare immagini generate da AI e deepfake;</li>\n<li>rispettare i limiti etici e legali del riconoscimento facciale e del\ntrattamento delle immagini.</li>\n</ol>\n<hr />\n<h2 id=\"ricerca-inversa-per-immagini\">1. Ricerca inversa per\nimmagini</h2>\n<h3 id=\"cosè-e-perché-è-fondamentale\">1.1 Cos’è e perché è\nfondamentale</h3>\n<p>La <strong>ricerca inversa</strong> (reverse image search) permette\ndi usare un’immagine come query invece di un testo. I motori analizzano\nl’immagine e restituiscono:</p>\n<ul>\n<li>Le pagine web dove la stessa foto (o versioni simili) è\napparsa.</li>\n<li>La <strong>fonte originale più antica</strong> rintracciabile.</li>\n<li>Immagini visivamente simili per contenuto o soggetto.</li>\n<li>Descrizioni testuali generate dall’AI.</li>\n</ul>\n<p>Per l’analista OSINT è indispensabile per: - Verificare se una foto è\nautenticai o riciclata da un evento diverso. - Trovare chi è il soggetto\ndi una foto sconosciuta. - Localizzare dove è stata scattata\nun’immagine. - Smontare fake news con foto fuori contesto.</p>\n<p><strong>Tecniche usate dai motori:</strong> - <strong>Hash\nesatto</strong>: confronto pixel per pixel. Trova solo copie identiche.\n- <strong>Perceptual hash (pHash)</strong>: tollerante a\nridimensionamento, crop e piccole modifiche. Trova varianti. -\n<strong>Embedding vettoriale AI</strong>: confronto semantico. Trova\nimmagini simili per contenuto (stessa scena, stesso soggetto).</p>\n<h3 id=\"google-lens\">1.2 Google Lens</h3>\n<p><strong>Google Lens</strong> (https://lens.google.com) è il motore di\nricerca inversa più potente per immagini generiche — paesaggi, oggetti,\nedifici, prodotti, testi.</p>\n<p><strong>Come usarlo:</strong> - <strong>Da browser</strong>: vai su\n<code>images.google.com</code> → icona fotocamera → carica file o\nincolla URL. - <strong>Da Chrome</strong>: click destro sull’immagine →\n“Cerca immagine con Google”. - <strong>Da smartphone</strong>: tieni\npremuta l’immagine → “Cerca con Google Lens”. - <strong>Da URL\ndiretto</strong>:\n<code>https://lens.google.com/uploadbyurl?url=URL_IMMAGINE</code></p>\n<p><strong>Google Lens eccelle in:</strong> - Identificazione di luoghi\n(edifici, monumenti, insegne). - OCR: lettura del testo visibile\nnell’immagine. - Identificazione di prodotti (scarpe, abbigliamento,\ndispositivi). - Riconoscimento di piante e animali.</p>\n<p><strong>Limitazioni:</strong> - Dal 2021 Google ha ridotto le\nfunzionalità di ricerca per volti per motivi di privacy. - Tende a\nrestituire immagini “simili” per contenuto semantico, non\nnecessariamente la stessa foto.</p>\n<h3 id=\"yandex-image-search\">1.3 Yandex Image Search</h3>\n<p><strong>Yandex</strong> (https://yandex.com/images/) è il riferimento\nassoluto per la ricerca inversa su <strong>persone</strong>. Il suo\nalgoritmo di riconoscimento facciale è superiore a Google per le foto di\nvolti e ha un indice molto ampio di siti russi e dell’Est Europa.</p>\n<p><strong>Come usarlo:</strong> 1. Vai su https://yandex.com/images/.\n2. Clicca sull’icona fotocamera. 3. Carica il file o incolla l’URL.</p>\n<p><strong>Yandex per OSINT su persone:</strong> - Trova spesso profili\nVK (VKontakte) e OK.ru con la stessa foto. - Mostra le foto precedenti\ndella stessa persona su siti diversi. - Trova varianti: foto ritagliate,\nspecchiate, con watermark rimosso.</p>\n<p><strong>Trucchi:</strong> - Ritaglia solo il viso dalla foto e carica\nsolo quello → aumenta la precisione. - Clicca su “Immagini simili” per\nallargare la ricerca. - Clicca “Mostra tutti i siti” per vedere tutte le\noccorrenze.</p>\n<h3 id=\"tineye\">1.4 TinEye</h3>\n<p><strong>TinEye</strong> (https://tineye.com) è lo strumento più\nspecializzato nella <strong>tracciabilità temporale</strong> delle\nimmagini. Indicizza oltre 60 miliardi di immagini e si concentra\nsull’individuare dove e quando una foto è apparsa per la prima\nvolta.</p>\n<p><strong>Funzione esclusiva: ordinamento per data.</strong> Ordina i\nrisultati per “Oldest” (più vecchio): il risultato in cima è la fonte\npiù antica trovata. Questo permette di: - Smascherare foto presentate\ncome recenti ma in realtà di anni fa. - Trovare l’origine autentica di\nun’immagine virale. - Verificare se il contesto con cui è diffusa è\nveritiero.</p>\n<p><strong>API di TinEye:</strong></p>\n<pre class=\"python\"><code># pip3 install tineye-api\nfrom tineye_api import TinEyeAPIRequest\n\napi = TinEyeAPIRequest(\n    api_url=&quot;https://api.tineye.com/rest/&quot;,\n    public_key=&quot;...&quot;,\n    private_key=&quot;...&quot;\n)\nresults = api.search_url(url=&quot;https://example.com/foto.jpg&quot;, sort=&quot;oldest&quot;, order=&quot;asc&quot;)\nfor r in results.matches:\n    print(r.domain, r.crawl_date)</code></pre>\n<h3 id=\"bing-visual-search\">1.5 Bing Visual Search</h3>\n<p><strong>Bing Visual Search</strong>\n(https://www.bing.com/visualsearch) è utile per trovare immagini su siti\nMicrosoft, LinkedIn e la galassia di siti indicizzati da Bing (spesso\ndiversa da Google).</p>\n<p><strong>Come usarlo:</strong> - Vai su\n<code>bing.com/visualsearch</code>. - Carica o trascina l’immagine. -\nUsa i filtri per restringere la ricerca.</p>\n<h3 id=\"altri-strumenti-specializzati\">1.6 Altri strumenti\nspecializzati</h3>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Strumento</th>\n<th>URL</th>\n<th>Specialità</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Baidu Image Search</strong></td>\n<td>image.baidu.com</td>\n<td>Ottimo per contenuti cinesi</td>\n</tr>\n<tr>\n<td><strong>SauceNAO</strong></td>\n<td>saucenao.com</td>\n<td>Arte, manga, anime</td>\n</tr>\n<tr>\n<td><strong>IQDB</strong></td>\n<td>iqdb.org</td>\n<td>Immagini di illustrazioni</td>\n</tr>\n<tr>\n<td><strong>Google Immagini</strong></td>\n<td>images.google.com</td>\n<td>Versione classica (senza Lens)</td>\n</tr>\n<tr>\n<td><strong>RevEye</strong></td>\n<td>estensione Chrome</td>\n<td>Ricerca simultanea su più motori</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"flusso-di-ricerca-inversa-su-più-motori\">1.7 Flusso di ricerca\ninversa su più motori</h3>\n<p>Non usare un solo motore: usali tutti in parallelo, perché i\nrisultati si sovrappongono solo parzialmente.</p>\n<pre class=\"python\"><code>#!/usr/bin/env python3\n&quot;&quot;&quot;\nreverse_search_links.py – Genera i link per la ricerca inversa su più motori.\nSupporta sia URL pubblici sia file locali (per i quali occorre caricare manualmente).\n&quot;&quot;&quot;\nimport hashlib\nimport sys\nfrom pathlib import Path\nfrom urllib.parse import quote\n\n\ndef genera_link(target: str) -&gt; dict:\n    &quot;&quot;&quot;Genera i link per la ricerca inversa su tutti i motori principali.&quot;&quot;&quot;\n    if target.startswith(&quot;http&quot;):\n        enc = quote(target, safe=&quot;&quot;)\n        return {\n            &quot;Google Lens&quot;:      f&quot;https://lens.google.com/uploadbyurl?url={enc}&quot;,\n            &quot;Yandex&quot;:           f&quot;https://yandex.com/images/search?rpt=imageview&amp;url={enc}&quot;,\n            &quot;Bing&quot;:             f&quot;https://www.bing.com/images/search?view=detailv2&amp;iss=sbi&amp;q=imgurl:{enc}&quot;,\n            &quot;TinEye&quot;:           f&quot;https://tineye.com/search?url={enc}&quot;,\n            &quot;Baidu&quot;:            f&quot;https://image.baidu.com/search/index?tn=baiduimage&amp;word={enc}&quot;,\n            &quot;PimEyes (volto)&quot;:  &quot;https://pimeyes.com/en (carica manualmente)&quot;,\n            &quot;FaceCheck.id&quot;:     &quot;https://facecheck.id (carica manualmente)&quot;,\n        }\n    else:\n        return {\n            &quot;Google Lens&quot;:  &quot;https://lens.google.com (carica manualmente)&quot;,\n            &quot;Yandex&quot;:       &quot;https://yandex.com/images (carica manualmente)&quot;,\n            &quot;Bing&quot;:         &quot;https://www.bing.com/visualsearch (carica manualmente)&quot;,\n            &quot;TinEye&quot;:       &quot;https://tineye.com (carica manualmente)&quot;,\n            &quot;PimEyes&quot;:      &quot;https://pimeyes.com/en (carica manualmente)&quot;,\n            &quot;FaceCheck.id&quot;: &quot;https://facecheck.id (carica manualmente)&quot;,\n        }\n\n\ndef hash_file(percorso: str) -&gt; dict:\n    &quot;&quot;&quot;Calcola hash SHA-256 e MD5 per documentazione forense.&quot;&quot;&quot;\n    p = Path(percorso)\n    if not p.exists():\n        return {}\n    dati = p.read_bytes()\n    return {\n        &quot;SHA-256&quot;:    hashlib.sha256(dati).hexdigest(),\n        &quot;MD5&quot;:        hashlib.md5(dati).hexdigest(),\n        &quot;Dimensione&quot;: f&quot;{p.stat().st_size:,} byte&quot;,\n    }\n\n\nif __name__ == &quot;__main__&quot;:\n    target = sys.argv[1] if len(sys.argv) &gt; 1 else input(&quot;URL o percorso immagine: &quot;).strip()\n    print(f&quot;\\n🔍 Ricerca inversa per: {target}\\n&quot;)\n    for motore, link in genera_link(target).items():\n        print(f&quot;  {motore:&lt;25} {link}&quot;)\n    if not target.startswith(&quot;http&quot;):\n        h = hash_file(target)\n        if h:\n            print(&quot;\\n📊 Hash del file (per documentazione forense):&quot;)\n            for k, v in h.items():\n                print(f&quot;  {k:&lt;12} {v}&quot;)</code></pre>\n<h3 id=\"geolocalizzazione-visiva\">1.8 Geolocalizzazione visiva</h3>\n<p>Quando i metadati GPS sono assenti o rimossi, si può localizzare\nun’immagine analizzando il <strong>contenuto visivo</strong>:</p>\n<p><strong>Elementi da analizzare:</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Categoria</th>\n<th>Cosa cercare</th>\n<th>Esempio</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Testo</strong></td>\n<td>Lingua, insegne, targhe, cartelli</td>\n<td>“APERTO” → italiano</td>\n</tr>\n<tr>\n<td><strong>Architettura</strong></td>\n<td>Stile edifici, materiali, balconi</td>\n<td>Barocco → Sud Italia, Spagna</td>\n</tr>\n<tr>\n<td><strong>Vegetazione</strong></td>\n<td>Specie di piante, stagione</td>\n<td>Palme + pini → Mediterraneo</td>\n</tr>\n<tr>\n<td><strong>Infrastrutture</strong></td>\n<td>Pali della luce, tipo strade, segnaletica</td>\n<td>Guida a sinistra → UK, India, Giappone</td>\n</tr>\n<tr>\n<td><strong>Veicoli</strong></td>\n<td>Targhe, modelli specifici</td>\n<td>Targa “RM” → Roma</td>\n</tr>\n<tr>\n<td><strong>Cielo e luce</strong></td>\n<td>Posizione del sole, tipo di nuvole</td>\n<td>Sole basso → alta/bassa latitudine</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Strumenti:</strong> - <strong>Google Street View</strong>:\nconfronta edifici e strade. - <strong>Google Earth Pro</strong>:\nimmagini storiche per verificare date. - <strong>Sentinel Hub</strong>\n(sentinel-hub.com): immagini satellitari aggiornate ogni 5 giorni. -\n<strong>SunCalc</strong> (suncalc.org): posizione del sole per verifica\nombre.</p>\n<h3 id=\"rilevamento-di-immagini-ai-e-deepfake\">1.9 Rilevamento di\nimmagini AI e deepfake</h3>\n<p>Con la diffusione di modelli generativi (Midjourney, DALL-E, Stable\nDiffusion), riconoscere immagini false è fondamentale.</p>\n<p><strong>Segnali visivi comuni:</strong> - Mani con dita in numero\nerrato o giunture strane. - Testo nell’immagine illeggibile o con\ncaratteri inventati. - Orecchie asimmetriche, gioielli duplicati,\ncapelli che scompaiono nello sfondo. - Pattern ripetuti nello\nsfondo.</p>\n<p><strong>Strumenti di rilevamento:</strong></p>\n<table>\n<thead>\n<tr>\n<th>Strumento</th>\n<th>URL</th>\n<th>Nota</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Hive Moderation</td>\n<td>hivemoderation.com</td>\n<td>Alta accuratezza</td>\n</tr>\n<tr>\n<td>AI or Not</td>\n<td>aiornot.com</td>\n<td>Facile da usare</td>\n</tr>\n<tr>\n<td>FotoForensics</td>\n<td>fotoforensics.com</td>\n<td>ELA per modifiche</td>\n</tr>\n<tr>\n<td>Illuminarty</td>\n<td>illuminarty.ai</td>\n<td>Analisi frequenze</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Error Level Analysis (ELA):</strong> evidenzia zone di un\nJPEG con diverso livello di compressione — le zone modificate appaiono\npiù chiare.</p>\n<pre class=\"python\"><code>#!/usr/bin/env python3\n&quot;&quot;&quot;\nela.py – Error Level Analysis per rilevare manipolazioni nelle immagini.\nRichiede: pip3 install Pillow\n&quot;&quot;&quot;\nfrom PIL import Image, ImageChops\nimport sys\nfrom pathlib import Path\n\n\ndef ela(percorso: str, qualita: int = 90, amplifica: int = 12) -&gt; str:\n    &quot;&quot;&quot;Genera l&#39;immagine ELA che evidenzia le zone modificate.&quot;&quot;&quot;\n    img = Image.open(percorso).convert(&quot;RGB&quot;)\n    tmp = &quot;/tmp/_ela_temp.jpg&quot;\n    output = str(Path(percorso).stem) + &quot;_ela.png&quot;\n    img.save(tmp, &quot;JPEG&quot;, quality=qualita)\n    diff = ImageChops.difference(img, Image.open(tmp))\n    diff = diff.point(lambda x: min(255, x * amplifica))\n    diff.save(output, &quot;PNG&quot;)\n    print(f&quot;✔ ELA salvata: {output}&quot;)\n    print(&quot;  Aree chiare = zone potenzialmente modificate&quot;)\n    return output\n\n\nif __name__ == &quot;__main__&quot;:\n    percorso = sys.argv[1] if len(sys.argv) &gt; 1 else input(&quot;Percorso JPEG: &quot;).strip()\n    ela(percorso)</code></pre>\n<hr />\n<h2 id=\"riconoscimento-facciale\">2. Riconoscimento facciale</h2>\n<h3 id=\"avvertenza-preliminare\">2.1 Avvertenza preliminare</h3>\n<p>Gli strumenti di riconoscimento facciale sono i più potenti e i più\neticamente delicati di questa lezione. Il GDPR classifica i dati\nbiometrici (tra cui i faceprint) come <strong>dati particolari</strong>\n(art. 9), il cui trattamento è vietato salvo eccezioni tassative. Leggi\nil box legale prima di procedere.</p>\n<h3\nid=\"come-funziona-il-riconoscimento-facciale-per-la-ricerca-inversa\">2.2\nCome funziona il riconoscimento facciale per la ricerca inversa</h3>\n<p>Il flusso è diverso dalla ricerca inversa tradizionale:</p>\n<ol type=\"1\">\n<li>Lo strumento <strong>estrae un embedding vettoriale</strong> del\nvolto dall’immagine caricata (un vettore numerico che rappresenta le\nproporzioni e le caratteristiche del viso).</li>\n<li>Confronta questo vettore con un database di milioni di immagini\nindicizzate dai siti web.</li>\n<li>Restituisce le immagini più simili con un punteggio di\nconfidenza.</li>\n</ol>\n<p>A differenza della ricerca per pixel (TinEye), il riconoscimento\nfacciale trova il <strong>soggetto</strong> anche se la foto è diversa:\nangolazione, illuminazione, età, trucco, capelli diversi.</p>\n<h3 id=\"pimeyes\">2.3 PimEyes</h3>\n<p><strong>PimEyes</strong> (https://pimeyes.com) è il motore di ricerca\nper volti più potente accessibile al pubblico. Indicizza miliardi di\nimmagini da siti web e restituisce quelle in cui appare la stessa\npersona.</p>\n<p><strong>Come funziona:</strong> 1. Carica una foto con il volto del\nsoggetto (meglio se con solo il viso, ritagliato). 2. PimEyes estrae il\nfaceprint. 3. Restituisce le corrispondenze ordinate per confidenza, con\nanteprima del sito.</p>\n<p><strong>Piano gratuito:</strong> mostra il sito di provenienza ma\noscura l’URL esatto. L’anteprima è sufficiente per capire se il\nrisultato è rilevante. <strong>Piano a pagamento:</strong> URL completi,\nricerca di più volti, alert in tempo reale, esportazione risultati.</p>\n<p><strong>Quando usarlo:</strong> - Verificare se una foto profilo è\nautentica o rubata da un’altra persona. - Trovare altri profili social\ndi un soggetto usando la sua foto. - Giornalismo investigativo su\npersonaggi pubblici. - Verificare se la propria foto è usata senza\nconsenso.</p>\n<p><strong>Interpretare i risultati:</strong> - <strong>Confidenza &gt;\n80%</strong>: corrispondenza probabile, verificare manualmente. -\n<strong>Confidenza 60-80%</strong>: possibile corrispondenza, richiede\nulteriore analisi. - <strong>Confidenza &lt; 60%</strong>: probabile\nfalso positivo. - <strong>Non usare mai</strong> una corrispondenza da\nriconoscimento facciale come prova definitiva: richiede sempre\ncorroborazione.</p>\n<h3 id=\"facecheck.id\">2.4 FaceCheck.id</h3>\n<p><strong>FaceCheck.id</strong> (https://facecheck.id) è un’alternativa\na PimEyes, con accesso gratuito limitato. Si concentra su social network\ne siti di notizie.</p>\n<p><strong>Caratteristiche:</strong> - Piano gratuito: risultati\nparziali, senza URL esatti. - Interfaccia semplice: carica la foto, vedi\ni risultati. - Utile come secondo controllo dopo PimEyes.</p>\n<h3 id=\"yandex-per-il-riconoscimento-facciale\">2.5 Yandex per il\nriconoscimento facciale</h3>\n<p>Yandex, pur non essendo specificamente un motore di riconoscimento\nfacciale, ha un algoritmo di similarità delle immagini molto efficace\nper i volti. In molti casi trova risultati che PimEyes non trova,\nspecialmente su siti russi e dell’Est Europa.</p>\n<p><strong>Trucco</strong>: ritaglia solo il volto dalla foto, elimina\nlo sfondo, e carica il ritaglio su Yandex. La precisione aumenta\nnotevolmente.</p>\n<h3 id=\"corroborazione-lobbligo-metodologico\">2.6 Corroborazione:\nl’obbligo metodologico</h3>\n<p>Qualsiasi identificazione basata su riconoscimento facciale deve\nessere <strong>obbligatoriamente corroborata</strong> da fonti\nindipendenti:</p>\n<pre><code>CORRISPONDENZA FACCIALE trovata su PimEyes\n          │\n          ├── Stesso username su più piattaforme? (Lezione 4)\n          ├── Stessa bio / stessa storia? \n          ├── Stessa email trovata associata?\n          ├── Stessa localizzazione nei post?\n          ├── Stessi contatti/amici in comune?\n          └── Solo se ≥ 2 fonti indipendenti convergono\n                    → IDENTIFICAZIONE CON CONFIDENZA ALTA</code></pre>\n<hr />\n<h2 id=\"dati-exif\">3. Dati EXIF</h2>\n<h3 id=\"cosa-sono-i-metadati-exif\">3.1 Cosa sono i metadati EXIF</h3>\n<p><strong>EXIF</strong> (Exchangeable Image File Format) è lo standard\nche definisce i metadati incorporati nelle immagini digitali. Ogni foto\nscattata da uno smartphone o fotocamera digitale contiene (salvo\nrimozione esplicita) un blocco di metadati che descrive le condizioni di\nscatto e il dispositivo usato.</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Campo EXIF</th>\n<th>Esempio</th>\n<th>Informazione OSINT</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>Make</code> / <code>Model</code></td>\n<td><code>Apple / iPhone 14 Pro</code></td>\n<td>Dispositivo usato</td>\n</tr>\n<tr>\n<td><code>DateTimeOriginal</code></td>\n<td><code>2024:10:15 14:32:11</code></td>\n<td>Data e ora precise dello scatto</td>\n</tr>\n<tr>\n<td><code>GPSLatitude</code> / <code>GPSLongitude</code></td>\n<td><code>45.4642, 9.1900</code></td>\n<td>Luogo esatto (GPS)</td>\n</tr>\n<tr>\n<td><code>GPSAltitude</code></td>\n<td><code>120 m</code></td>\n<td>Altitudine</td>\n</tr>\n<tr>\n<td><code>Software</code></td>\n<td><code>Adobe Lightroom 7.0</code></td>\n<td>Software di elaborazione → modifica post-scatto?</td>\n</tr>\n<tr>\n<td><code>Artist</code></td>\n<td><code>Mario Rossi</code></td>\n<td>Nome del fotografo</td>\n</tr>\n<tr>\n<td><code>Copyright</code></td>\n<td><code>© Mario Rossi 2024</code></td>\n<td>Copyright dichiarato</td>\n</tr>\n<tr>\n<td><code>LensModel</code></td>\n<td><code>6.86mm f/1.78</code></td>\n<td>Obiettivo specifico → modello dispositivo</td>\n</tr>\n<tr>\n<td><code>Flash</code></td>\n<td><code>No Flash</code></td>\n<td>Condizioni di luce</td>\n</tr>\n<tr>\n<td><code>Orientation</code></td>\n<td><code>Horizontal</code></td>\n<td>Se l’immagine è stata ruotata (possibile modifica)</td>\n</tr>\n<tr>\n<td><code>UserComment</code></td>\n<td><code>...</code></td>\n<td>Commento libero, spesso vuoto</td>\n</tr>\n<tr>\n<td><code>XMP:Creator</code></td>\n<td><code>Mario Rossi</code></td>\n<td>Autore da software di editing</td>\n</tr>\n<tr>\n<td><code>XMP:ModifyDate</code></td>\n<td><code>2024:10:16 09:15:00</code></td>\n<td>Data ultima modifica → compare con scatto?</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Metadati nei video:</strong> I video contengono metadati\nanaloghi: <code>GPSCoordinates</code>, <code>CreateDate</code>,\n<code>CameraModel</code>, ma anche <code>Duration</code>,\n<code>VideoFrameRate</code>, <code>AudioChannels</code>.</p>\n<p><strong>Metadati nei documenti:</strong> PDF, Word, Excel contengono:\nautore, data di creazione, software, nome del computer, versioni\nprecedenti del documento. ExifTool li legge tutti.</p>\n<h3 id=\"exiftool-lo-strumento-principale\">3.2 ExifTool: lo strumento\nprincipale</h3>\n<p><strong>ExifTool</strong> (https://exiftool.org) di Phil Harvey è lo\nstandard de facto per leggere e scrivere metadati su qualsiasi formato:\nJPEG, PNG, TIFF, HEIC, PDF, MP4, MOV, MP3, Word, Excel e molti\naltri.</p>\n<p><strong>Installazione:</strong></p>\n<pre class=\"bash\"><code># macOS\nbrew install exiftool\n\n# Linux (Debian/Ubuntu)\nsudo apt install libimage-exiftool-perl\n\n# Windows: scarica l&#39;eseguibile da exiftool.org</code></pre>\n<p><strong>Comandi fondamentali:</strong></p>\n<pre class=\"bash\"><code># Leggi tutti i metadati\nexiftool foto.jpg\n\n# Solo i dati GPS\nexiftool -GPS:all foto.jpg\n\n# Output JSON (per elaborazione automatica)\nexiftool -json foto.jpg\n\n# Output CSV (per più file)\nexiftool -csv *.jpg &gt; metadati.csv\n\n# Metadati di tutti i file in una cartella\nexiftool /path/cartella/\n\n# Campi specifici (formato compatto)\nexiftool -DateTimeOriginal -Model -GPSLatitude -GPSLongitude foto.jpg\n\n# Rimuovi TUTTI i metadati (salva una copia pulita)\nexift
