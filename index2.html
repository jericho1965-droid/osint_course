    esclusioni = input(&quot;Esclusioni (parole precedute da -): &quot;).strip()\n    if esclusioni:\n        parti.extend([f&quot;-{p.strip()}&quot; for p in esclusioni.split(&quot;,&quot;)])\n\n    query = &quot; &quot;.join(parti)\n\n    # URL di ricerca per ogni motore\n    urls = {\n        &quot;google&quot;: f&quot;https://www.google.com/search?q={quote_plus(query)}&quot;,\n        &quot;bing&quot;: f&quot;https://www.bing.com/search?q={quote_plus(query)}&quot;,\n        &quot;yandex&quot;: f&quot;https://yandex.com/search/?text={quote_plus(query)}&quot;,\n        &quot;duckduckgo&quot;: f&quot;https://duckduckgo.com/?q={quote_plus(query)}&quot;,\n    }\n    url = urls.get(motore, f&quot;https://www.google.com/search?q={quote_plus(query)}&quot;)\n\n    print(f&quot;\\n📋 Query: {query}&quot;)\n    print(f&quot;🔗 URL:   {url}&quot;)\n\n    return {\n        &quot;timestamp_utc&quot;: datetime.now(timezone.utc).isoformat(timespec=&quot;seconds&quot;),\n        &quot;motore&quot;: motore,\n        &quot;query_raw&quot;: query,\n        &quot;query_url&quot;: url,\n        &quot;obiettivo&quot;: input(&quot;\\nObiettivo (EEI a cui risponde): &quot;),\n        &quot;risultato_atteso&quot;: input(&quot;Risultato atteso: &quot;),\n        &quot;note&quot;: input(&quot;Note: &quot;),\n    }\n\n\ndef salva(voce: dict) -&gt; None:\n    &quot;&quot;&quot;Salva la query nel log CSV.&quot;&quot;&quot;\n    nuovo_file = not os.path.exists(FILE_QUERY)\n    with open(FILE_QUERY, &quot;a&quot;, newline=&quot;&quot;, encoding=&quot;utf-8&quot;) as f:\n        writer = csv.DictWriter(f, fieldnames=CAMPI)\n        if nuovo_file:\n            writer.writeheader()\n        writer.writerow(voce)\n\n\nif __name__ == &quot;__main__&quot;:\n    print(&quot;=== Dork Builder OSINT ===  (Ctrl+C per uscire)&quot;)\n    try:\n        while True:\n            voce = costruisci_dork()\n            salva(voce)\n            print(&quot;✔ Query salvata nel dork_log.csv\\n&quot;)\n    except KeyboardInterrupt:\n        print(&quot;\\nLog chiuso.&quot;)</code></pre>\n<blockquote>\n<p><strong>Perché non automatizzare le ricerche Google?</strong> Google\nvieta lo scraping nei propri ToS e lo blocca attivamente con CAPTCHA e\nban IP. Esistono API a pagamento (Google Custom Search API: 100 query\ngratis/giorno, poi a pagamento). Per uso didattico e professionale, la\nricerca manuale nel browser è la pratica corretta. Strumenti come\n<strong>SerpAPI</strong> offrono accesso legale alle SERP.</p>\n</blockquote>\n<hr />\n<h2 id=\"yandex-dork\">3. Yandex Dork</h2>\n<h3 id=\"perché-yandex-è-diverso\">3.1 Perché Yandex è diverso</h3>\n<p><strong>Yandex</strong> (motore di ricerca russo) è uno strumento\nOSINT prezioso per tre ragioni:</p>\n<ol type=\"1\">\n<li><strong>Indicizza contenuti diversi da Google</strong>: siti in\nlingua russa, dell’ex spazio sovietico, e spesso portali che Google non\nvisita con la stessa profondità.</li>\n<li><strong>Ricerca inversa di immagini superiore</strong>: Yandex Image\nSearch riconosce i volti con una precisione maggiore rispetto a Google\nLens, ed è uno degli strumenti preferiti per la verifica delle identità\n(lo approfondiremo nella lezione sulle immagini).</li>\n<li><strong>Meno aggressivo nei CAPTCHA</strong>: per le query testuali,\nYandex è spesso più permissivo di Google nell’accesso ripetuto.</li>\n</ol>\n<h3 id=\"operatori-principali-di-yandex\">3.2 Operatori principali di\nYandex</h3>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Operatore</th>\n<th>Funzione</th>\n<th>Esempio</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>site:</code></td>\n<td>Limita al dominio</td>\n<td><code>site:example.ru</code></td>\n</tr>\n<tr>\n<td><code>host:</code></td>\n<td>Limita all’host esatto (senza sottodomini)</td>\n<td><code>host:example.ru</code></td>\n</tr>\n<tr>\n<td><code>url:</code></td>\n<td>Cerca un URL esatto</td>\n<td><code>url:example.ru/admin</code></td>\n</tr>\n<tr>\n<td><code>title:</code></td>\n<td>Parola nel titolo</td>\n<td><code>title:\"login\"</code></td>\n</tr>\n<tr>\n<td><code>mime:</code></td>\n<td>Tipo di file (equivalente di <code>filetype:</code>)</td>\n<td><code>mime:pdf site:example.ru</code></td>\n</tr>\n<tr>\n<td><code>date:</code></td>\n<td>Filtra per data</td>\n<td><code>date:20240101..20241231 site:example.ru</code></td>\n</tr>\n<tr>\n<td><code>lang:</code></td>\n<td>Lingua della pagina</td>\n<td><code>lang:it \"mario rossi\"</code></td>\n</tr>\n<tr>\n<td><code>\"...\"</code></td>\n<td>Frase esatta</td>\n<td><code>\"mario rossi\" \"via della pace\"</code></td>\n</tr>\n<tr>\n<td><code>&amp;&amp;</code> / <code>\\|\\|</code></td>\n<td>AND / OR esplicito</td>\n<td><code>\"username\" &amp;&amp; \"password\"</code></td>\n</tr>\n<tr>\n<td><code>~</code></td>\n<td>Cerca sinonimi</td>\n<td><code>~hacker russo</code></td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"dork-yandex-utili-per-losint\">3.3 Dork Yandex utili per\nl’OSINT</h3>\n<p><strong>Trovare documenti in lingua russa su un dominio:</strong></p>\n<pre><code>site:example.ru mime:pdf</code></pre>\n<p><strong>Trovare pagine con credenziali esposte:</strong></p>\n<pre><code>site:example.ru &quot;username&quot; &amp;&amp; &quot;password&quot;</code></pre>\n<p><strong>Trovare pannelli di amministrazione:</strong></p>\n<pre><code>site:example.ru title:&quot;admin&quot; || title:&quot;panel&quot; || title:&quot;dashboard&quot;</code></pre>\n<p><strong>Ricerca su spazio ex-sovietico con operatore di\nlingua:</strong></p>\n<pre><code>lang:ru &quot;mario rossi&quot; &quot;società italiana&quot;</code></pre>\n<p><strong>Trovare sottodomini non pubblicizzati:</strong></p>\n<pre><code>site:*.example.com -host:www.example.com</code></pre>\n<h3 id=\"yandex-image-search-per-osint-su-persone\">3.4 Yandex Image\nSearch per OSINT su persone</h3>\n<p>Accedi a <strong>https://yandex.com/images/</strong> e carica\nun’immagine (o incolla un URL). Yandex è particolarmente bravo nel:</p>\n<ul>\n<li>Trovare la stessa persona in foto diverse.</li>\n<li>Individuare da dove proviene un’immagine di profilo.</li>\n<li>Scoprire profili social associati a una foto.</li>\n</ul>\n<p>Vedremo questa funzione nel dettaglio nella Lezione 8 (Ricerca\ninversa e analisi di immagini).</p>\n<hr />\n<h2 id=\"bing-dork\">4. Bing Dork</h2>\n<h3 id=\"perché-usare-bing\">4.1 Perché usare Bing</h3>\n<p>Bing indicizza contenuti diversi da Google e spesso restituisce\nrisultati utili che Google ha rimosso o declassato (es. pagine di\nnotizie meno recenti, contenuti regionali europei, siti aziendali). È\nanche il motore sottostante di <strong>DuckDuckGo</strong> per i\nrisultati web (ma con filtri diversi).</p>\n<p>Bing dispone delle <strong>Bing Webmaster Tools</strong>, che\nmostrano i siti indicizzati da Bing per chi possiede un dominio: utile\nper verificare l’esposizione della propria organizzazione.</p>\n<h3 id=\"operatori-di-bing\">4.2 Operatori di Bing</h3>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Operatore</th>\n<th>Funzione</th>\n<th>Esempio</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>site:</code></td>\n<td>Limita al dominio</td>\n<td><code>site:example.com</code></td>\n</tr>\n<tr>\n<td><code>filetype:</code></td>\n<td>Tipo di file</td>\n<td><code>filetype:pdf site:example.com</code></td>\n</tr>\n<tr>\n<td><code>intitle:</code></td>\n<td>Parola nel titolo</td>\n<td><code>intitle:\"login\" site:example.com</code></td>\n</tr>\n<tr>\n<td><code>inbody:</code></td>\n<td>Parola nel corpo (≈ <code>intext:</code> di Google)</td>\n<td><code>inbody:\"password\" site:example.com</code></td>\n</tr>\n<tr>\n<td><code>inanchor:</code></td>\n<td>Parola nel testo di un link</td>\n<td><code>inanchor:\"download\"</code></td>\n</tr>\n<tr>\n<td><code>contains:</code></td>\n<td>Pagine che contengono link a un tipo di file</td>\n<td><code>contains:pdf site:example.com</code></td>\n</tr>\n<tr>\n<td><code>ip:</code></td>\n<td>Cerca siti con un determinato IP</td>\n<td><code>ip:93.184.216.34</code></td>\n</tr>\n<tr>\n<td><code>language:</code></td>\n<td>Lingua della pagina</td>\n<td><code>language:it \"bilancio\"</code></td>\n</tr>\n<tr>\n<td><code>loc:</code> / <code>location:</code></td>\n<td>Paese di provenienza</td>\n<td><code>loc:IT filetype:pdf \"contratto\"</code></td>\n</tr>\n<tr>\n<td><code>\"...\"</code></td>\n<td>Frase esatta</td>\n<td><code>\"username\" \"password\"</code></td>\n</tr>\n<tr>\n<td><code>-</code></td>\n<td>Esclusione</td>\n<td><code>site:example.com -www</code></td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"dork-bing-utili-per-losint\">4.3 Dork Bing utili per l’OSINT</h3>\n<p><strong>Cercare documenti interni di un’azienda\nitaliana:</strong></p>\n<pre><code>site:example.it filetype:pdf OR filetype:docx loc:IT</code></pre>\n<p><strong>Trovare pagine con directory listing:</strong></p>\n<pre><code>intitle:&quot;index of&quot; site:example.com</code></pre>\n<p><strong>Cercare file di log esposti:</strong></p>\n<pre><code>site:example.com filetype:log</code></pre>\n<p><strong>Trovare siti ospitati sullo stesso IP:</strong></p>\n<pre><code>ip:93.184.216.34</code></pre>\n<blockquote>\n<p><strong>Nota Bing vs Google:</strong> <code>ip:</code> è esclusivo di\nBing ed è molto utile per trovare altri siti che condividono lo stesso\nserver (virtual hosting). Su Google non esiste.</p>\n</blockquote>\n<hr />\n<h2 id=\"duckduckgo-dork\">5. DuckDuckGo Dork</h2>\n<h3 id=\"caratteristiche-di-duckduckgo-per-losint\">5.1 Caratteristiche di\nDuckDuckGo per l’OSINT</h3>\n<p><strong>DuckDuckGo</strong> (DDG) è apprezzato per la privacy: non\nsalva le ricerche e non crea profili utente. Per l’analista OSINT questo\nsignifica che le query non “inquinano” il profilo di ricerca personale e\nnon avvertono Google delle proprie attività investigative.</p>\n<p>DDG utilizza risultati da Bing, Yandex e fonti proprie. I suoi\noperatori avanzati sono meno numerosi di Google, ma i più importanti\nfunzionano.</p>\n<p>DDG supporta anche i cosiddetti <strong>!bang</strong>: scorciatoie\nche reindirizzano la ricerca direttamente a un sito esterno.\nEstremamente utili per l’OSINT.</p>\n<h3 id=\"operatori-duckduckgo\">5.2 Operatori DuckDuckGo</h3>\n<table>\n<thead>\n<tr>\n<th>Operatore</th>\n<th>Funzione</th>\n<th>Esempio</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>site:</code></td>\n<td>Limita al dominio</td>\n<td><code>site:example.com</code></td>\n</tr>\n<tr>\n<td><code>filetype:</code></td>\n<td>Tipo di file</td>\n<td><code>filetype:pdf site:example.com</code></td>\n</tr>\n<tr>\n<td><code>intitle:</code></td>\n<td>Parola nel titolo</td>\n<td><code>intitle:\"admin\"</code></td>\n</tr>\n<tr>\n<td><code>inurl:</code></td>\n<td>Parola nell’URL</td>\n<td><code>inurl:login site:example.com</code></td>\n</tr>\n<tr>\n<td><code>\"...\"</code></td>\n<td>Frase esatta</td>\n<td><code>\"mario rossi\" genova</code></td>\n</tr>\n<tr>\n<td><code>-</code></td>\n<td>Esclusione</td>\n<td><code>-mario rossi</code></td>\n</tr>\n<tr>\n<td><code>OR</code></td>\n<td>Alternativa</td>\n<td><code>filetype:pdf OR filetype:doc</code></td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"i-bang-ricerca-istantanea-su-altri-siti\">5.3 I !bang: ricerca\nistantanea su altri siti</h3>\n<p>I <strong>!bang</strong> sono il vero punto di forza di DuckDuckGo.\nDigiti una query in DDG e un <code>!bang</code> e vieni reindirizzato al\nsito corrispondente con la query già inserita.</p>\n<table>\n<thead>\n<tr>\n<th>!bang</th>\n<th>Reindirizza a</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>!g</code></td>\n<td>Google</td>\n</tr>\n<tr>\n<td><code>!b</code></td>\n<td>Bing</td>\n</tr>\n<tr>\n<td><code>!y</code></td>\n<td>Yahoo</td>\n</tr>\n<tr>\n<td><code>!ya</code></td>\n<td>Yandex</td>\n</tr>\n<tr>\n<td><code>!a</code></td>\n<td>Amazon</td>\n</tr>\n<tr>\n<td><code>!li</code></td>\n<td>LinkedIn</td>\n</tr>\n<tr>\n<td><code>!gh</code></td>\n<td>GitHub</td>\n</tr>\n<tr>\n<td><code>!so</code></td>\n<td>Stack Overflow</td>\n</tr>\n<tr>\n<td><code>!w</code></td>\n<td>Wikipedia</td>\n</tr>\n<tr>\n<td><code>!translate</code></td>\n<td>Google Translate</td>\n</tr>\n<tr>\n<td><code>!archive</code></td>\n<td>Wayback Machine</td>\n</tr>\n<tr>\n<td><code>!whois</code></td>\n<td>Whois Lookup (whois.domaintools.com)</td>\n</tr>\n<tr>\n<td><code>!shodan</code></td>\n<td>Shodan</td>\n</tr>\n<tr>\n<td><code>!censys</code></td>\n<td>Censys</td>\n</tr>\n<tr>\n<td><code>!vt</code></td>\n<td>VirusTotal</td>\n</tr>\n<tr>\n<td><code>!leaklookup</code></td>\n<td>Leak-Lookup</td>\n</tr>\n<tr>\n<td><code>!maps</code></td>\n<td>Google Maps</td>\n</tr>\n<tr>\n<td><code>!osm</code></td>\n<td>OpenStreetMap</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Esempio:</strong> digita <code>mario rossi genova !li</code>\nin DDG e verrai portato direttamente alla ricerca su LinkedIn per “mario\nrossi genova”.</p>\n<p>Ci sono oltre 13.000 !bang disponibili. Lista completa:\nhttps://duckduckgo.com/bang</p>\n<hr />\n<h2 id=\"shodan-dork\">6. Shodan Dork</h2>\n<h3 id=\"cosè-shodan\">6.1 Cos’è Shodan</h3>\n<p><strong>Shodan</strong> (https://www.shodan.io) non è un motore di\nricerca tradizionale. Invece di indicizzare contenuti testuali,\n<strong>effettua scansioni continue di Internet</strong> e raccoglie i\n<strong>banner</strong> di risposta dei servizi TCP/IP: quello che un\nserver risponde quando viene contattato sulla porta 80 (HTTP), 443\n(HTTPS), 22 (SSH), 21 (FTP), 3389 (RDP), e centinaia di altre.</p>\n<p>Il risultato è un catalogo di tutti i dispositivi connessi a\nInternet: server web, router, webcam, dispositivi IoT, SCADA\nindustriali, stampanti, frigoriferi “smart”, e altro ancora.</p>\n<p>Per l’analista OSINT, Shodan è lo strumento principale per: - mappare\nl’infrastruttura tecnica di un obiettivo (server, sottodomini,\ntecnologie); - trovare servizi esposti che non dovrebbero esserlo; -\nidentificare vulnerabilità note già rilevate (Shodan integra il CVE\ndatabase); - monitorare la propria organizzazione.</p>\n<h3 id=\"filtri-principali-di-shodan\">6.2 Filtri principali di\nShodan</h3>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Filtro</th>\n<th>Sintassi</th>\n<th>Esempio</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>hostname:</code></td>\n<td>Host o sottodominio</td>\n<td><code>hostname:example.com</code></td>\n</tr>\n<tr>\n<td><code>ip:</code></td>\n<td>Indirizzo IP</td>\n<td><code>ip:93.184.216.34</code></td>\n</tr>\n<tr>\n<td><code>net:</code></td>\n<td>Range CIDR</td>\n<td><code>net:93.184.216.0/24</code></td>\n</tr>\n<tr>\n<td><code>org:</code></td>\n<td>Organizzazione (da WHOIS)</td>\n<td><code>org:\"Telecom Italia\"</code></td>\n</tr>\n<tr>\n<td><code>asn:</code></td>\n<td>Autonomous System Number</td>\n<td><code>asn:AS1234</code></td>\n</tr>\n<tr>\n<td><code>country:</code></td>\n<td>Paese (codice ISO)</td>\n<td><code>country:IT</code></td>\n</tr>\n<tr>\n<td><code>city:</code></td>\n<td>Città</td>\n<td><code>city:Milano</code></td>\n</tr>\n<tr>\n<td><code>port:</code></td>\n<td>Porta TCP/UDP</td>\n<td><code>port:22</code></td>\n</tr>\n<tr>\n<td><code>product:</code></td>\n<td>Software identificato</td>\n<td><code>product:Apache</code></td>\n</tr>\n<tr>\n<td><code>version:</code></td>\n<td>Versione del software</td>\n<td><code>version:2.4.49</code></td>\n</tr>\n<tr>\n<td><code>os:</code></td>\n<td>Sistema operativo</td>\n<td><code>os:\"Windows Server 2019\"</code></td>\n</tr>\n<tr>\n<td><code>ssl:</code></td>\n<td>Informazioni sul certificato TLS</td>\n<td><code>ssl:\"example.com\"</code></td>\n</tr>\n<tr>\n<td><code>ssl.cert.subject.cn:</code></td>\n<td>Common Name del certificato</td>\n<td><code>ssl.cert.subject.cn:\"example.com\"</code></td>\n</tr>\n<tr>\n<td><code>http.title:</code></td>\n<td>Titolo della pagina HTTP</td>\n<td><code>http.title:\"Admin Panel\"</code></td>\n</tr>\n<tr>\n<td><code>http.html:</code></td>\n<td>Contenuto HTML della pagina</td>\n<td><code>http.html:\"phpMyAdmin\"</code></td>\n</tr>\n<tr>\n<td><code>http.status:</code></td>\n<td>Codice di risposta HTTP</td>\n<td><code>http.status:200</code></td>\n</tr>\n<tr>\n<td><code>before:</code> / <code>after:</code></td>\n<td>Data della scansione</td>\n<td><code>before:2024-01-01</code></td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"shodan-dork-utili-per-losint\">6.3 Shodan Dork utili per\nl’OSINT</h3>\n<p><strong>Trovare tutti i server di un’organizzazione:</strong></p>\n<pre><code>org:&quot;example srl&quot; country:IT</code></pre>\n<p><strong>Trovare server Apache vulnerabili in Italia:</strong></p>\n<pre><code>product:Apache version:2.4.49 country:IT</code></pre>\n<p><strong>Trovare pannelli phpMyAdmin esposti:</strong></p>\n<pre><code>http.html:&quot;phpMyAdmin&quot; country:IT</code></pre>\n<p><strong>Trovare webcam con accesso libero:</strong></p>\n<pre><code>product:&quot;webcam&quot; has_screenshot:true country:IT</code></pre>\n<p><strong>Trovare dispositivi RDP esposti (porta 3389):</strong></p>\n<pre><code>port:3389 country:IT os:&quot;Windows&quot;</code></pre>\n<p><strong>Trovare router con interfaccia web standard:</strong></p>\n<pre><code>http.title:&quot;RouterOS&quot; country:IT</code></pre>\n<p><strong>Trovare server con certificato TLS per un\ndominio:</strong></p>\n<pre><code>ssl.cert.subject.cn:&quot;example.com&quot;</code></pre>\n<blockquote>\n<p>Questo dork è estremamente utile per trovare <strong>sottodomini\nnascosti</strong>: il certificato TLS registra spesso tutti i\nsottodomini coperti (SAN – Subject Alternative Names), anche quelli non\npubblicizzati.</p>\n</blockquote>\n<p><strong>Trovare sistemi SCADA/ICS esposti:</strong></p>\n<pre><code>product:&quot;Siemens S7&quot; country:IT</code></pre>\n<p><strong>Trovare porte SSH aperte con banner che rivelano la\nversione:</strong></p>\n<pre><code>port:22 product:&quot;OpenSSH&quot; version:&quot;7.4&quot; country:IT</code></pre>\n<h3 id=\"shodan-cli-e-api\">6.4 Shodan CLI e API</h3>\n<p>Shodan ha un’API e uno strumento da riga di comando (CLI):</p>\n<pre class=\"bash\"><code># Installazione\npip3 install shodan\n\n# Configurazione con la propria API key\nshodan init TUA_API_KEY\n\n# Ricerca base\nshodan search &quot;org:\\&quot;example srl\\&quot; country:IT&quot;\n\n# Info su un IP\nshodan host 93.184.216.34\n\n# Download dei risultati in JSON\nshodan download risultati &quot;org:\\&quot;example srl\\&quot;&quot;\nshodan parse --fields ip_str,port,product risultati.json.gz</code></pre>\n<p>Il piano gratuito di Shodan permette ricerche limitate. Il piano\n<strong>Freelancer</strong> (49$/anno nel 2024) è sufficiente per la\nmaggior parte dei casi OSINT.</p>\n<h3 id=\"script-python-query-shodan-via-api\">6.5 Script Python: query\nShodan via API</h3>\n<pre class=\"python\"><code>#!/usr/bin/env python3\n&quot;&quot;&quot;\nshodan_osint.py – Raccolta dati Shodan via API ufficiale.\nRichiede: pip3 install shodan\n          API key gratuita su https://account.shodan.io\n&quot;&quot;&quot;\nimport json\nimport os\nimport shodan  # type: ignore\nfrom datetime import datetime, timezone\n\nAPI_KEY = os.environ.get(&quot;SHODAN_API_KEY&quot;, &quot;&quot;)  # mai hardcoded!\n\n\ndef cerca(query: str, limite: int = 10) -&gt; list[dict]:\n    &quot;&quot;&quot;Esegue una ricerca Shodan e restituisce i risultati.&quot;&quot;&quot;\n    if not API_KEY:\n        raise ValueError(&quot;Imposta la variabile d&#39;ambiente SHODAN_API_KEY&quot;)\n    api = shodan.Shodan(API_KEY)\n    risultati = api.search(query, limit=limite)\n    return risultati.get(&quot;matches&quot;, [])\n\n\ndef stampa_risultato(r: dict) -&gt; None:\n    &quot;&quot;&quot;Stampa le informazioni salienti di un match Shodan.&quot;&quot;&quot;\n    ip = r.get(&quot;ip_str&quot;, &quot;N/A&quot;)\n    porta = r.get(&quot;port&quot;, &quot;N/A&quot;)\n    org = r.get(&quot;org&quot;, &quot;N/A&quot;)\n    paese = r.get(&quot;location&quot;, {}).get(&quot;country_name&quot;, &quot;N/A&quot;)\n    prodotto = r.get(&quot;product&quot;, r.get(&quot;_shodan&quot;, {}).get(&quot;module&quot;, &quot;N/A&quot;))\n    versione = r.get(&quot;version&quot;, &quot;N/A&quot;)\n    banner = r.get(&quot;data&quot;, &quot;&quot;)[:80]  # primi 80 caratteri del banner\n\n    print(f&quot;  IP:       {ip}:{porta}&quot;)\n    print(f&quot;  Org:      {org} ({paese})&quot;)\n    print(f&quot;  Prodotto: {prodotto} {versione}&quot;)\n    print(f&quot;  Banner:   {banner!r}&quot;)\n    print()\n\n\ndef salva_json(risultati: list[dict], nome_file: str) -&gt; None:\n    &quot;&quot;&quot;Salva i risultati completi in un file JSON.&quot;&quot;&quot;\n    with open(nome_file, &quot;w&quot;, encoding=&quot;utf-8&quot;) as f:\n        json.dump(risultati, f, ensure_ascii=False, indent=2, default=str)\n    print(f&quot;✔ Salvati {len(risultati)} risultati in {nome_file}&quot;)\n\n\nif __name__ == &quot;__main__&quot;:\n    import sys\n    query = &quot; &quot;.join(sys.argv[1:]) or input(&quot;Query Shodan: &quot;)\n    print(f&quot;\\n🔍 Ricerca: {query}&quot;)\n    ts = datetime.now(timezone.utc).strftime(&quot;%Y%m%d_%H%M%S&quot;)\n    matches = cerca(query)\n    for m in matches:\n        stampa_risultato(m)\n    salva_json(matches, f&quot;shodan_{ts}.json&quot;)</code></pre>\n<blockquote>\n<p><strong>Sicurezza:</strong> non inserire mai l’API key nel codice\nsorgente. Usa variabili d’ambiente\n(<code>export SHODAN_API_KEY=xxx</code>) o un file <code>.env</code> non\nversionato.</p>\n</blockquote>\n<hr />\n<h2 id=\"urlscan\">7. URLScan</h2>\n<h3 id=\"cosè-urlscan\">7.1 Cos’è URLScan</h3>\n<p><strong>URLScan.io</strong> (https://urlscan.io) è un servizio\ngratuito (con piani a pagamento) che analizza URL e pagine web in modo\ndinamico: apre il browser, carica la pagina, ne cattura lo screenshot,\nne analizza il comportamento (richieste HTTP, JavaScript eseguito,\ncookie, redirect) e ne archivia i risultati pubblicamente.</p>\n<p>Per l’OSINT è uno strumento potente per: - vedere come appare una\npagina <strong>senza visitarla</strong> (sicurezza); - scoprire le\n<strong>risorse caricate</strong> da una pagina (script, CDN, font,\nanalytics); - trovare <strong>altri domini</strong> che puntano allo\nstesso server o usano gli stessi script; - vedere la <strong>storia\ndelle scansioni</strong> di un dominio (timeline dell’infrastruttura); -\n<strong>ricercare domini</strong> con caratteristiche specifiche.</p>\n<h3 id=\"linterfaccia-di-ricerca\">7.2 L’interfaccia di ricerca</h3>\n<p>URLScan offre un motore di ricerca interno su tutti i risultati\npubblici delle scansioni effettuate da chiunque (incluso te).</p>\n<p><strong>URL di ricerca:</strong> https://urlscan.io/search/</p>\n<p>Sintassi della ricerca (basata su Elasticsearch):</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Campo</th>\n<th>Esempio</th>\n<th>Significato</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>domain:</code></td>\n<td><code>domain:example.com</code></td>\n<td>Scansioni del dominio</td>\n</tr>\n<tr>\n<td><code>page.domain:</code></td>\n<td><code>page.domain:example.com</code></td>\n<td>URL della pagina scansionata</td>\n</tr>\n<tr>\n<td><code>page.ip:</code></td>\n<td><code>page.ip:93.184.216.34</code></td>\n<td>IP della pagina</td>\n</tr>\n<tr>\n<td><code>page.asn:</code></td>\n<td><code>page.asn:AS15169</code></td>\n<td>ASN della pagina</td>\n</tr>\n<tr>\n<td><code>page.title:</code></td>\n<td><code>page.title:\"Login\"</code></td>\n<td>Titolo della pagina</td>\n</tr>\n<tr>\n<td><code>page.url:</code></td>\n<td><code>page.url:\"*/admin*\"</code></td>\n<td>URL con pattern</td>\n</tr>\n<tr>\n<td><code>task.tags:</code></td>\n<td><code>task.tags:phishing</code></td>\n<td>Tag assegnati alla scansione</td>\n</tr>\n<tr>\n<td><code>hash:</code></td>\n<td><code>hash:sha256...</code></td>\n<td>Hash di uno script specifico</td>\n</tr>\n<tr>\n<td><code>filename:</code></td>\n<td><code>filename:\"jquery.min.js\"</code></td>\n<td>File caricato dalla pagina</td>\n</tr>\n<tr>\n<td><code>ip:</code></td>\n<td><code>ip:93.184.216.34</code></td>\n<td>Qualsiasi risorsa caricata da questo IP</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Esempi pratici:</strong></p>\n<p>Trovare tutte le scansioni recenti di un dominio:</p>\n<pre><code>domain:example.com</code></pre>\n<p>Trovare pagine di phishing che imitano una banca:</p>\n<pre><code>page.title:&quot;Banca Intesa&quot; -domain:intesasanpaolo.com</code></pre>\n<p>Trovare pagine che caricano uno script malevolo specifico:</p>\n<pre><code>hash:abc123def456...</code></pre>\n<p>Trovare tutti i sottodomini di un dominio target indicizzati da\nURLScan:</p>\n<pre><code>page.domain:*.example.com</code></pre>\n<h3 id=\"urlscan-via-api\">7.3 URLScan via API</h3>\n<pre class=\"python\"><code>#!/usr/bin/env python3\n&quot;&quot;&quot;\nurlscan_osint.py – Cerca e invia URL a URLScan.io via API.\nRichiede: pip3 install requests\n          API key gratuita su https://urlscan.io/user/profile/\n&quot;&quot;&quot;\nimport os\nimport time\nimport requests\n\nAPI_KEY = os.environ.get(&quot;URLSCAN_API_KEY&quot;, &quot;&quot;)\nBASE = &quot;https://urlscan.io&quot;\n\n\ndef cerca(query: str, dimensione: int = 10) -&gt; list[dict]:\n    &quot;&quot;&quot;Cerca scansioni esistenti.&quot;&quot;&quot;\n    r = requests.get(\n        f&quot;{BASE}/api/v1/search/&quot;,\n        params={&quot;q&quot;: query, &quot;size&quot;: dimensione},\n        headers={&quot;API-Key&quot;: API_KEY},\n        timeout=15,\n    )\n    r.raise_for_status()\n    return r.json().get(&quot;results&quot;, [])\n\n\ndef invia_scansione(url: str, visibilita: str = &quot;private&quot;) -&gt; str:\n    &quot;&quot;&quot;\n    Invia un URL per la scansione.\n    Visibilità: &#39;public&#39; (risultato pubblico) o &#39;private&#39; (solo per l&#39;account).\n    ATTENZIONE: le scansioni pubbliche sono visibili a chiunque.\n    &quot;&quot;&quot;\n    if not API_KEY:\n        raise ValueError(&quot;Imposta URLSCAN_API_KEY&quot;)\n    r = requests.post(\n        f&quot;{BASE}/api/v1/scan/&quot;,\n        json={&quot;url&quot;: url, &quot;visibility&quot;: visibilita},\n        headers={&quot;API-Key&quot;: API_KEY, &quot;Content-Type&quot;: &quot;application/json&quot;},\n        timeout=15,\n    )\n    r.raise_for_status()\n    uuid = r.json()[&quot;uuid&quot;]\n    print(f&quot;✔ Scansione avviata. UUID: {uuid}&quot;)\n    print(f&quot;   Risultato: {BASE}/result/{uuid}/&quot;)\n    return uuid\n\n\ndef ottieni_risultato(uuid: str, attesa: int = 15) -&gt; dict:\n    &quot;&quot;&quot;Recupera il risultato di una scansione (dopo attesa secondi).&quot;&quot;&quot;\n    time.sleep(attesa)\n    r = requests.get(f&quot;{BASE}/api/v1/result/{uuid}/&quot;, timeout=15)\n    r.raise_for_status()\n    return r.json()\n\n\nif __name__ == &quot;__main__&quot;:\n    query = input(&quot;Query URLScan (es. domain:example.com): &quot;)\n    risultati = cerca(query)\n    for s in risultati[:5]:\n        page = s.get(&quot;page&quot;, {})\n        print(f&quot;  URL:   {page.get(&#39;url&#39;, &#39;N/A&#39;)}&quot;)\n        print(f&quot;  IP:    {page.get(&#39;ip&#39;, &#39;N/A&#39;)}&quot;)\n        print(f&quot;  Data:  {s.get(&#39;task&#39;, {}).get(&#39;time&#39;, &#39;N/A&#39;)[:10]}&quot;)\n        print(f&quot;  Link:  {BASE}/result/{s[&#39;_id&#39;]}/&quot;)\n        print()</code></pre>\n<blockquote>\n<p><strong>OPSEC:</strong> le scansioni pubbliche su URLScan sono\nvisibili a chiunque. Se stai analizzando un sito di un soggetto che non\ndeve sapere di essere osservato, usa sempre la visibilità\n<code>private</code> (richiede account) oppure cerca tra le scansioni\ngià esistenti invece di avviarne di nuove.</p>\n</blockquote>\n<hr />\n<h2 id=\"virustotal\">8. VirusTotal</h2>\n<h3 id=\"cosè-virustotal-e-perché-è-utile-per-losint\">8.1 Cos’è\nVirusTotal e perché è utile per l’OSINT</h3>\n<p><strong>VirusTotal</strong> (https://www.virustotal.com) è nato come\nstrumento per la scansione di file sospetti con oltre 70 antivirus. Nel\ntempo è diventato molto di più: una <strong>piattaforma di threat\nintelligence</strong> che raccoglie dati su file, URL, domini, indirizzi\nIP, e le loro relazioni.</p>\n<p>Per l’analista OSINT (anche non specializzato in cybersecurity),\nVirusTotal è utile per:</p>\n<ul>\n<li><strong>Verificare la reputazione</strong> di un URL o dominio prima\ndi visitarlo.</li>\n<li><strong>Trovare relazioni</strong> tra domini, IP, file e\norganizzazioni.</li>\n<li><strong>Scoprire sottodomini e URL</strong> associati a un\ndominio.</li>\n<li><strong>Vedere la storia</strong> di un IP (quali domini ha ospitato\nnel tempo).</li>\n<li><strong>Analizzare file</strong> (PDF, DOCX, EXE) per verificare se\ncontengono macro o codice malevolo.</li>\n<li><strong>Ricercare certificati TLS</strong> e le loro relazioni con\naltri host.</li>\n</ul>\n<h3 id=\"ricerca-su-virustotal-i-tipi-di-oggetto\">8.2 Ricerca su\nVirusTotal: i tipi di oggetto</h3>\n<p>VirusTotal permette di ricercare quattro tipi principali di\noggetti:</p>\n<p><strong>1. File (hash MD5, SHA1, SHA256)</strong></p>\n<p>Carica un file o incolla il suo hash. Ottieni: - Risultati di 70+\nmotori antivirus. - Metadati del file (dimensioni, tipo, data di\ncompilazione se EXE). - Relazioni con domini e URL che hanno distribuito\nquel file. - Comportamento dinamico (sandbox, solo per piani a\npagamento).</p>\n<p><strong>2. URL</strong></p>\n<p>Incolla un URL. Ottieni: - Scansione della pagina con motori\nantivirus e reputazione URL. - Screenshot della pagina. - Relazioni con\nil dominio, l’IP e i file scaricati. - Link a URLScan e altri\nservizi.</p>\n<p><strong>3. Dominio</strong></p>\n<p>Cerca un dominio (es. <code>example.com</code>). Ottieni: - Record\nDNS (A, MX, NS, TXT). - Sottodomini rilevati. - IP a cui punta il\ndominio (storici e attuali). - URL scansionati su quel dominio. - File\nassociati (es. file scaricati da quel dominio). - Reputazione\ncomplessiva (benigno/sospetto/malevolo). - Certificati TLS. - WHOIS.</p>\n<p><strong>4. Indirizzo IP</strong></p>\n<p>Cerca un IP. Ottieni: - Domini ospitati (attuali e storici):\nutilissimo per trovare altri siti sullo stesso server. - URL scansionati\nda quell’IP. - File distribuiti. - Geolocalizzazione e ASN. -\nReputazione.</p>\n<h3 id=\"virustotal-graph-la-visualizzazione-delle-relazioni\">8.3\nVirusTotal Graph: la visualizzazione delle relazioni</h3>\n<p><strong>VirusTotal Graph</strong> (https://www.virustotal.com/graph/)\nè uno strumento visuale che permette di esplorare le relazioni tra\nentità come un grafo. Partendo da un dominio, puoi espandere verso i\nsuoi IP, poi verso altri domini sullo stesso IP, verso i file\ndistribuiti, verso le URL malevole.</p>\n<p>Per l’OSINT è uno strumento molto potente per: - tracciare\nl’infrastruttura di un’organizzazione; - collegare domini apparentemente\nnon correlati che condividono IP, certificati o file; - documentare reti\ndi siti usati per disinformazione o frode.</p>\n<h3 id=\"virustotal-via-api\">8.4 VirusTotal via API</h3>\n<p>VirusTotal offre un’API pubblica (piano gratuito: 4 richieste/minuto,\n500/giorno):</p>\n<pre class=\"python\"><code>#!/usr/bin/env python3\n&quot;&quot;&quot;\nvirustotal_osint.py – Interroga VirusTotal per domini, IP e URL.\nRichiede: pip3 install requests\n          API key gratuita su https://www.virustotal.com/gui/join-us\n&quot;&quot;&quot;\nimport os\nimport time\nimport requests\n\nAPI_KEY = os.environ.get(&quot;VT_API_KEY&quot;, &quot;&quot;)\nBASE = &quot;https://www.virustotal.com/api/v3&quot;\nHEADERS = {&quot;x-apikey&quot;: API_KEY}\nPAUSA = 16  # secondi tra le richieste (piano gratuito: 4/minuto)\n\n\ndef analizza_dominio(dominio: str) -&gt; dict:\n    &quot;&quot;&quot;Ottieni informazioni su un dominio.&quot;&quot;&quot;\n    url = f&quot;{BASE}/domains/{dominio}&quot;\n    r = requests.get(url, headers=HEADERS, timeout=15)\n    r.raise_for_status()\n    return r.json()\n\n\ndef analizza_ip(ip: str) -&gt; dict:\n    &quot;&quot;&quot;Ottieni informazioni su un indirizzo IP.&quot;&quot;&quot;\n    url = f&quot;{BASE}/ip_addresses/{ip}&quot;\n    r = requests.get(url, headers=HEADERS, timeout=15)\n    r.raise_for_status()\n    return r.json()\n\n\ndef sottodomini(dominio: str) -&gt; list[str]:\n    &quot;&quot;&quot;Restituisce i sottodomini noti di un dominio.&quot;&quot;&quot;\n    url = f&quot;{BASE}/domains/{dominio}/subdomains&quot;\n    r = requests.get(url, headers=HEADERS, timeout=15)\n    r.raise_for_status()\n    dati = r.json().get(&quot;data&quot;, [])\n    return [d[&quot;id&quot;] for d in dati]\n\n\ndef risoluzione_ip(dominio: str) -&gt; list[str]:\n    &quot;&quot;&quot;Restituisce gli IP a cui punta (e ha puntato) un dominio.&quot;&quot;&quot;\n    url = f&quot;{BASE}/domains/{dominio}/resolutions&quot;\n    r = requests.get(url, headers=HEADERS, timeout=15)\n    r.raise_for_status()\n    dati = r.json().get(&quot;data&quot;, [])\n    return [\n        f&quot;{d[&#39;attributes&#39;][&#39;ip_address&#39;]} ({d[&#39;attributes&#39;].get(&#39;date&#39;, &#39;N/A&#39;)[:10]})&quot;\n        for d in dati\n    ]\n\n\ndef stampa_reputazione(dati: dict, tipo: str) -&gt; None:\n    &quot;&quot;&quot;Stampa un sommario della reputazione.&quot;&quot;&quot;\n    attr = dati.get(&quot;data&quot;, {}).get(&quot;attributes&quot;, {})\n    stats = attr.get(&quot;last_analysis_stats&quot;, {})\n    print(f&quot;\\n=== VirusTotal: {tipo} ===&quot;)\n    print(f&quot;  Malevolo:   {stats.get(&#39;malicious&#39;, 0)}&quot;)\n    print(f&quot;  Sospetto:   {stats.get(&#39;suspicious&#39;, 0)}&quot;)\n    print(f&quot;  Pulito:     {stats.get(&#39;undetected&#39;, 0) + stats.get(&#39;harmless&#39;, 0)}&quot;)\n    reputazione = attr.get(&quot;reputation&quot;, &quot;N/A&quot;)\n    print(f&quot;  Reputazione VirusTotal: {reputazione}&quot;)\n    categorie = attr.get(&quot;categories&quot;, {})\n    if categorie:\n        cat_uniche = list(set(categorie.values()))[:5]\n        print(f&quot;  Categorie: {&#39;, &#39;.join(cat_uniche)}&quot;)\n\n\nif __name__ == &quot;__main__&quot;:\n    if not API_KEY:\n        print(&quot;⚠ Imposta la variabile d&#39;ambiente VT_API_KEY&quot;); exit(1)\n\n    target = input(&quot;Dominio o IP da analizzare: &quot;).strip()\n\n    if &quot;.&quot; in target and not target.replace(&quot;.&quot;, &quot;&quot;).isdigit():\n        # È un dominio\n        dati = analizza_dominio(target)\n        stampa_reputazione(dati, f&quot;Dominio {target}&quot;)\n\n        time.sleep(PAUSA)\n        sd = sottodomini(target)\n        print(f&quot;\\n  Sottodomini noti ({len(sd)}): {&#39;, &#39;.join(sd[:10])}&quot;)\n\n        time.sleep(PAUSA)\n        ips = risoluzione_ip(target)\n        print(f&quot;\\n  IP storici: {&#39;; &#39;.join(ips[:10])}&quot;)\n    else:\n        # È un IP\n        dati = analizza_ip(target)\n        stampa_reputazione(dati, f&quot;IP {target}&quot;)</code></pre>\n<blockquote>\n<p><strong>Rispetta i rate limit:</strong> il piano gratuito di\nVirusTotal è 4 richieste/minuto. Lo script include una pausa\n(<code>PAUSA = 16</code> secondi). Ignorare i rate limit porta al ban\ndell’API key.</p>\n</blockquote>\n<h3 id=\"integrazione-virustotal-urlscan-shodan\">8.5 Integrazione\nVirusTotal + URLScan + Shodan</h3>\n<p>Un flusso di lavoro integrato tipico per l’analisi di un dominio\nsospetto:</p>\n<pre><code>Dominio target: example-suspicious.com\n         │\n         ├──► VirusTotal: reputazione, sottodomini, IP storici\n         │         └──► IP trovato: 185.220.101.50\n         │\n         ├──► Shodan (ip:185.220.101.50): altri domini sullo stesso IP,\n         │         porte aperte, tecnologie, banner\n         │\n         ├──► URLScan (domain:example-suspicious.com): screenshot,\n         │         risorse caricate, comportamento della pagina\n         │\n         └──► Censys (ip:185.220.101.50): certificati TLS, SAN,\n                   altri domini, storico delle porte</code></pre>\n<hr />\n<h2 id=\"censys\">9. Censys</h2>\n<h3 id=\"cosè-censys\">9.1 Cos’è Censys</h3>\n<p><strong>Censys</strong> (https://search.censys.io) è simile a Shodan\nma con alcune differenze importanti:</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Caratteristica</th>\n<th>Shodan</th>\n<th>Censys</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Aggiornamento</td>\n<td>Continuo (crawler attivo)</td>\n<td>Periodico (scansioni programmate)</td>\n</tr>\n<tr>\n<td>Forza principale</td>\n<td>Dispositivi IoT, SCADA, porte non standard</td>\n<td>Server web, certificati TLS, IPv6</td>\n</tr>\n<tr>\n<td>Ricerca certificati</td>\n<td>Buona</td>\n<td><strong>Eccellente</strong>: la più completa</td>\n</tr>\n<tr>\n<td>Interfaccia di ricerca</td>\n<td>SQL-like (filtri)</td>\n<td>Query SQL esplicita</td>\n</tr>\n<tr>\n<td>Dati IPv6</td>\n<td>Limitati</td>\n<td><strong>Estesi</strong></td>\n</tr>\n<tr>\n<td>Piano gratuito</td>\n<td>100 risultati/query</td>\n<td>250 risultati/query</td>\n</tr>\n</tbody>\n</table>\n<p>Censys è particolarmente apprezzato dagli analisti per la\n<strong>qualità e completezza dei dati sui certificati TLS</strong>, che\npermettono di trovare sottodomini e infrastrutture nascoste.</p>\n<h3 id=\"sintassi-delle-query-censys\">9.2 Sintassi delle query\nCensys</h3>\n<p>Censys usa una sintassi di tipo SQL. Le query si applicano a tre\nindici:</p>\n<ul>\n<li><strong><code>hosts</code></strong>: host IPv4 e IPv6 rilevati.</li>\n<li><strong><code>certificates</code></strong>: certificati TLS\nrilevati.</li>\n<li><strong><code>domains</code></strong> (legacy): domini.</li>\n</ul>\n<p><strong>Sintassi base:</strong></p>\n<pre class=\"sql\"><code>services.port = 443 and location.country = &quot;IT&quot;</code></pre>\n<pre class=\"sql\"><code>services.tls.certificates.leaf_data.subject.common_name = &quot;example.com&quot;</code></pre>\n<pre class=\"sql\"><code>services.http.response.html_title = &quot;phpMyAdmin&quot;</code></pre>\n<p><strong>Operatori logici:</strong> <code>and</code>, <code>or</code>,\n<code>not</code> <strong>Operatori di confronto:</strong>\n<code>=</code>, <code>!=</code>, <code>&lt;</code>, <code>&gt;</code>,\n<code>~</code> (regex)</p>\n<h3 id=\"query-censys-utili-per-losint\">9.3 Query Censys utili per\nl’OSINT</h3>\n<p><strong>Trovare tutti gli host di un’organizzazione in\nItalia:</strong></p>\n<pre class=\"sql\"><code>autonomous_system.organization = &quot;Vodafone Italia&quot; and location.country = &quot;IT&quot;</code></pre>\n<p><strong>Trovare server con certificato per un dominio (inclusi i\nsottodomini via SAN):</strong></p>\n<pre class=\"sql\"><code>services.tls.certificates.leaf_data.names = &quot;example.com&quot;</code></pre>\n<p>Questo è il dork più potente di Censys per l’OSINT: restituisce\n<strong>tutti gli IP</strong> che presentano un certificato TLS che\ncopre <code>example.com</code> o suoi sottodomini, anche se non\npubblicizzati nel DNS pubblico.</p>\n<p><strong>Trovare host con phpMyAdmin:</strong></p>\n<pre class=\"sql\"><code>services.http.response.html_title = &quot;phpMyAdmin&quot; and location.country = &quot;IT&quot;</code></pre>\n<p><strong>Trovare server con porta 3389 (RDP) aperta in\nItalia:</strong></p>\n<pre class=\"sql\"><code>services.port = 3389 and location.country = &quot;IT&quot;</code></pre>\n<p><strong>Trovare server con un banner SSH specifico:</strong></p>\n<pre class=\"sql\"><code>services.banner ~ &quot;OpenSSH_7.4&quot;</code></pre>\n<p><strong>Trovare host con certificato Let’s Encrypt su un sottodominio\nnon standard:</strong></p>\n<pre class=\"sql\"><code>services.tls.certificates.leaf_data.issuer.organization = &quot;Let&#39;s Encrypt&quot;\nand services.tls.certificates.leaf_data.subject.common_name ~ &quot;dev\\\\.&quot;</code></pre>\n<h3 id=\"censys-per-la-ricognizione-dei-sottodomini\">9.4 Censys per la\nricognizione dei sottodomini</h3>\n<p>La tecnica più usata in OSINT con Censys è la <strong>ricognizione\ndei sottodomini tramite SAN dei certificati</strong>.</p>\n<p>I certificati TLS moderni contengono un campo <strong>Subject\nAlternative Names</strong> (SAN) che elenca tutti i domini e sottodomini\ncoperti. Censys indicizza questi campi, rendendo possibile trovare\nsottodomini che non appaiono nel DNS pubblico né nei motori di\nricerca.</p>\n<pre class=\"sql\"><code>services.tls.certificates.leaf_data.names = &quot;*.example.com&quot;</code></pre>\n<p>Questo dork restituisce tutti gli host che hanno un certificato\nvalido per qualsiasi sottodominio di <code>example.com</code>.</p>\n<h3 id=\"censys-via-api-python\">9.5 Censys via API Python</h3>\n<pre class=\"python\"><code>#!/usr/bin/env python3\n&quot;&quot;&quot;\ncensys_osint.py – Ricerca host e certificati su Censys.\nRichiede: pip3 install censys\n          API ID e Secret su https://search.censys.io/account/api\n&quot;&quot;&quot;\nimport os\nfrom censys.search import CensysHosts  # type: ignore\n\nAPI_ID = os.environ.get(&quot;CENSYS_API_ID&quot;, &quot;&quot;)\nAPI_SECRET = os.environ.get(&quot;CENSYS_API_SECRET&quot;, &quot;&quot;)\n\n\ndef cerca_host(query: str, pagine: int = 1) -&gt; list[dict]:\n    &quot;&quot;&quot;Esegue una ricerca sull&#39;indice hosts di Censys.&quot;&quot;&quot;\n    client = CensysHosts(api_id=API_ID, api_secret=API_SECRET)\n    risultati = []\n    for pagina in client.search(query, pages=pagine):\n        risultati.extend(pagina)\n    return risultati\n\n\ndef stampa_host(h: dict) -&gt; None:\n    &quot;&quot;&quot;Stampa le informazioni principali di un host Censys.&quot;&quot;&quot;\n    ip = h.get(&quot;ip&quot;, &quot;N/A&quot;)\n    servizi = h.get(&quot;services&quot;, [])\n    porte = [str(s.get(&quot;port&quot;)) for s in servizi]\n    nomi = h.get(&quot;dns&quot;, {}).get(&quot;reverse_dns&quot;, {}).get(&quot;names&quot;, [])\n    asn = h.get(&quot;autonomous_system&quot;, {}).get(&quot;asn&quot;, &quot;N/A&quot;)\n    org = h.get(&quot;autonomous_system&quot;, {}).get(&quot;name&quot;, &quot;N/A&quot;)\n    paese = h.get(&quot;location&quot;, {}).get(&quot;country&quot;, &quot;N/A&quot;)\n\n    print(f&quot;  IP:    {ip}  ({paese})&quot;)\n    print(f&quot;  Org:   {org} (AS{asn})&quot;)\n    print(f&quot;  Porte: {&#39;, &#39;.join(porte)}&quot;)\n    if nomi:\n        print(f&quot;  DNS:   {&#39;, &#39;.join(nomi[:5])}&quot;)\n    print()\n\n\nif __name__ == &quot;__main__&quot;:\n    if not API_ID:\n        print(&quot;⚠ Imposta CENSYS_API_ID e CENSYS_API_SECRET&quot;); exit(1)\n    query = input(&quot;Query Censys (es. services.tls.certificates.leaf_data.names = \\&quot;example.com\\&quot;): &quot;)\n    hosts = cerca_host(query)\n    print(f&quot;\\n🔍 Trovati {len(hosts)} host:\\n&quot;)\n    for h in hosts[:10]:\n        stampa_host(h)</code></pre>\n<hr />\n<h2 id=\"tabella-comparativa-dei-motori\">Tabella comparativa dei\nmotori</h2>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Motore</th>\n<th>Cosa cerca</th>\n<th>Punti di forza OSINT</th>\n<th>Gratuito?</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Google</strong></td>\n<td>Contenuti testuali web</td>\n<td>Maggiore indice, dork potenti</td>\n<td>Sì (con limiti)</td>\n</tr>\n<tr>\n<td><strong>Bing</strong></td>\n<td>Contenuti testuali web</td>\n<td><code>ip:</code>, contenuti europei, risultati diversi da\nGoogle</td>\n<td>Sì</td>\n</tr>\n<tr>\n<td><strong>Yandex</strong></td>\n<td>Contenuti testuali + immagini</td>\n<td>Ricerca inversa immagini eccellente, contenuti russi</td>\n<td>Sì</td>\n</tr>\n<tr>\n<td><strong>DuckDuckGo</strong></td>\n<td>Contenuti testuali web</td>\n<td>Privacy, !bang per 13.000+ siti</td>\n<td>Sì</td>\n</tr>\n<tr>\n<td><strong>Shodan</strong></td>\n<td>Dispositivi e servizi TCP/IP</td>\n<td>IoT, SCADA, porte non standard, screenshot</td>\n<td>Parziale</td>\n</tr>\n<tr>\n<td><strong>Censys</strong></td>\n<td>Host e certificati TLS</td>\n<td>SAN dei certificati, dati IPv6, query SQL</td>\n<td>Parziale</td>\n</tr>\n<tr>\n<td><strong>URLScan</strong></td>\n<td>Comportamento delle pagine web</td>\n<td>Screenshot, risorse caricate, storico scansioni</td>\n<td>Parziale</td>\n</tr>\n<tr>\n<td><strong>VirusTotal</strong></td>\n<td>File, URL, domini, IP</td>\n<td>Reputazione, relazioni tra entità, sottodomini storici</td>\n<td>Parziale</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2 id=\"box-legale-ed-etico\">⚖️ Box legale ed etico</h2>\n<h3 id=\"usare-i-dork-cosa-è-lecito-e-cosa-no\">Usare i dork: cosa è\nlecito e cosa no</h3>\n<p><strong>Lecito:</strong> - Costruire query con operatori avanzati su\nmotori pubblici. - Trovare file esposti su server pubblicamente\naccessibili. - Documentare e analizzare ciò che si trova nelle pagine\nindicizzate. - Usare Shodan, Censys, VirusTotal e URLScan per\nricognizione passiva. - Segnalare responsabilmente (responsible\ndisclosure) file sensibili trovati per errore.</p>\n<p><strong>Zona grigia:</strong> - Scaricare un file trovato tramite\ndork che non è pubblicato intenzionalmente. Il file può essere\npubblicamente accessibile, ma potrebbe contenere dati personali altrui\n(GDPR) o essere protetto da copyright. - Usare API in modo automatizzato\nsu volumi elevati: rispetta sempre i rate limit e i ToS.</p>\n<p><strong>Non lecito:</strong> - Usare le informazioni trovate per\naccedere a sistemi (art. 615-ter c.p.). - Usare credenziali trovate in\nfile esposti per autenticarsi da qualche parte. - Effettuare scansioni\nattive su rete altrui (diverse da quelle passive dei motori). -\nPubblicare dati personali trovati senza una legittima base\ngiuridica.</p>\n<h3 id=\"shodan-e-censys-responsabilità\">Shodan e Censys:\nresponsabilità</h3>\n<p>Il fatto che Shodan o Censys mostrino che una porta è aperta su un IP\n<strong>non autorizza a connettersi</strong> a quel servizio per “vedere\ncosa c’è”. La raccolta di dati da parte di Shodan e Censys è opera loro.\nTu puoi analizzare i risultati; non puoi sfruttarli per accedere ai\nsistemi.</p>\n<h3 id=\"virustotal-attenzione-ai-file-caricati\">VirusTotal: attenzione\nai file caricati</h3>\n<p>I file caricati su VirusTotal (piano gratuito) diventano\n<strong>visibili ad altri utenti premium</strong>. Non caricare mai\ndocumenti riservati, file aziendali interni o qualsiasi documento che\ncontenga dati personali di terzi. Per analizzare file sensibili usa un\nhash (MD5/SHA256) invece del file completo, oppure un ambiente\noffline.</p>\n<hr />\n<h2 id=\"caso-di-studio-la-startup-con-il-server-dimenticato\">Caso di\nstudio: “La startup con il server dimenticato”</h2>\n<blockquote>\n<p><em>Nomi e dettagli fittizi.</em></p>\n</blockquote>\n<p><strong>Requisito.</strong> Un venture capital italiano vuole\ninvestire in una startup (chiamiamola <em>FastPay Srl</em>). Prima del\nterm sheet, chiede una verifica dell’esposizione tecnica online.</p>\n<p><strong>Pianificazione.</strong> EEI principale: <em>“FastPay Srl ha\nservizi o dati esposti online che potrebbero rappresentare un rischio di\nsicurezza o di reputazione?”</em></p>\n<p><strong>Raccolta.</strong></p>\n<p><strong>Step 1 – Google Dork:</strong></p>\n<pre><code>site:fastpay.it filetype:pdf OR filetype:env OR filetype:sql</code></pre>\n<p>Nessun risultato rilevante.</p>\n<pre><code>site:*.fastpay.it -www</code></pre>\n<p>Trovati tre sottodomini: <code>www</code>, <code>api</code>,\n<strong><code>dev</code></strong>.</p>\n<p><strong>Step 2 – URLScan:</strong></p>\n<pre><code>domain:dev.fastpay.it</code></pre>\n<p>Una scansione di tre settimane prima mostra che\n<code>dev.fastpay.it</code> risponde con un titolo\n<code>\"phpMyAdmin 5.1.0\"</code>.</p>\n<p><strong>Step 3 – Shodan:</strong></p>\n<pre><code>hostname:dev.fastpay.it</code></pre>\n<p>Conferma: porta 80 aperta, server Apache/2.4.41, phpMyAdmin in\n<code>/phpmyadmin/</code>. Il banner HTTP include la versione di PHP:\n<code>PHP/7.4.3</code>.</p>\n<p><strong>Step 4 – VirusTotal:</strong></p>\n<pre><code>domain: dev.fastpay.it</code></pre>\n<p>Il dominio non è classificato come malevolo, ma risulta attivo da 14\nmesi e ha avuto cinque indirizzi IP diversi. L’IP attuale ospita altri\ntre domini.</p>\n<p><strong>Step 5 – Censys:</strong></p>\n<pre><code>services.tls.certificates.leaf_data.names = &quot;fastpay.it&quot;</code></pre>\n<p>Il certificato copre: <code>fastpay.it</code>,\n<code>www.fastpay.it</code>, <code>api.fastpay.it</code>,\n<code>dev.fastpay.it</code>,\n<strong><code>staging.fastpay.it</code></strong>. Quest’ultimo non era\nemerso nei dork Google.</p>\n<pre><code>hostname:staging.fastpay.it</code></pre>\n<p>Su Shodan: porta 8080 aperta con pannello <strong>Swagger UI</strong>\npubblico, che mostra le API interne complete con possibilità di eseguire\nchiamate di test.</p>\n<p><strong>Analisi.</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Trovato</th>\n<th>Rischio</th>\n<th>Classificazione</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>dev.fastpay.it</code> con phpMyAdmin</td>\n<td>Alto: accesso non autorizzato al DB se credenziali deboli</td>\n<td>B2</td>\n</tr>\n<tr>\n<td><code>staging.fastpay.it</code> con Swagger UI pubblico</td>\n<td>Alto: tutte le API interne documentate e testabili</td>\n<td>B1</td>\n</tr>\n<tr>\n<td>Cinque IP storici</td>\n<td>Medio: traccia di cambi infrastruttura, possibili vecchie\nconfigurazioni</td>\n<td>A2</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Conclusioni nel report.</strong></p>\n<blockquote>\n<p>“È <strong>quasi certo</strong> (confidenza <strong>alta</strong>)\nche FastPay Srl abbia almeno due servizi esposti pubblicamente che non\ndovrebbero esserlo: un pannello phpMyAdmin su\n<code>dev.fastpay.it</code> e un’interfaccia Swagger UI completa su\n<code>staging.fastpay.it</code>. Entrambi aumentano significativamente\nla superficie d’attacco. Si raccomanda di segnalare immediatamente\nquesto alla startup prima di procedere con l’investimento, e di\nrichiedere un remediation plan. Nessun accesso ai sistemi è stato\ntentato nel corso di questa indagine.”</p>\n</blockquote>\n<p><strong>Lezioni apprese:</strong> - I dork Google hanno rivelato il\nsottodominio <code>dev</code>; Censys ha trovato <code>staging</code>\ntramite i SAN del certificato. - La combinazione di tre strumenti\n(URLScan + Shodan + Censys) ha fornito un quadro completo\ndell’esposizione. - Il report ha esplicitamente dichiarato che nessun\naccesso è stato tentato: fondamentale per la tutela legale\ndell’analista.</p>\n<hr />\n<h2 id=\"esercizi-pratici\">Esercizi pratici</h2>\n<blockquote>\n<p>Tutti gli esercizi vanno svolti su target che possiedi o su cui hai\nesplicita autorizzazione, oppure su target didattici designati (es. il\ntuo sito personale, domini di test pubblici).</p>\n</blockquote>\n<p><strong>Esercizio 1 – Google Dork sul proprio dominio (30\nmin)</strong> Se possiedi un dominio o un sito web, esegui le seguenti\nquery su Google e Bing e documenta i risultati:</p>\n<pre><code>site:tuodominio.it filetype:pdf OR filetype:docx OR filetype:xlsx\nsite:*.tuodominio.it -www\nintitle:&quot;index of&quot; site:tuodominio.it\nsite:tuodominio.it inurl:admin OR inurl:login</code></pre>\n<p>Scrivi un mini-report di una pagina sui risultati: cosa hai trovato?\nCosa rimuoveresti?</p>\n<p><strong>Esercizio 2 – !bang su DuckDuckGo (20 min)</strong> Usa i\n!bang di DuckDuckGo per cercare un soggetto pubblico (es. un’azienda\nquotata) su almeno cinque fonti diverse in un’unica sessione di ricerca.\nDocumenta i risultati diversi che ottieni su ciascuna fonte.</p>\n<p><strong>Esercizio 3 – Shodan su un IP pubblico noto (30 min)</strong>\nCerca su Shodan l’IP <code>93.184.216.34</code> (il server di\n<code>example.com</code>, gestito da ICANN, usato ufficialmente per\nscopi didattici). Documenta: porte aperte, software identificato,\ncertificato TLS, dati di localizzazione.</p>\n<p><strong>Esercizio 4 – VirusTotal su un dominio pubblico (20\nmin)</strong> Cerca su VirusTotal il dominio\n<code>malware-traffic-analysis.net</code> (sito di ricerca sulla\nsicurezza che analizza traffico malevolo). Documenta: reputazione,\nsottodomini, IP storici, categorie.</p>\n<p><strong>Esercizio 5 – URLScan su un sito noto (20 min)</strong> Cerca\nsu urlscan.io <code>domain:wikipedia.org</code>. Analizza una delle\nscansioni recenti: quante risorse esterne carica Wikipedia? Da quali\ndomini? Ci sono tracker?</p>\n<p><strong>Esercizio 6 – Censys: SAN del certificato (30 min)</strong>\nCerca su Censys:\n<code>services.tls.certificates.leaf_data.names = \"wikipedia.org\"</code>.\nQuanti IP diversi espongono un certificato per Wikipedia? Cosa ci dice\nquesto dell’infrastruttura CDN di Wikimedia?</p>\n<p><strong>Esercizio 7 – Flusso integrato (60 min)</strong> Scegli\nun’organizzazione pubblica italiana (es. un comune, un’università).\nCostruisci un flusso di lavoro completo: 1. Google Dork per documenti\nesposti. 2. Yandex per varianti nei risultati. 3. Shodan per\nl’infrastruttura. 4. Censys per i sottodomini tramite SAN. 5. VirusTotal\nper la reputazione del dominio principale. 6. URLScan per una scansione\nrecente della homepage.</p>\n<p>Scrivi un report di due pagine con i risultati.</p>\n<hr />\n","quiz":[{"q":"Quale operatore Google limita la ricerca a un singolo dominio?","opts":{"a":"inurl:","b":"domain:","c":"site:","d":"host:"},"correct":"c","why":"site: limita i risultati a un dominio o sottodominio specifico"},{"q":"Quale motore di ricerca è particolarmente utile per la ricerca inversa di immagini in OSINT?","opts":{"a":"Bing","b":"DuckDuckGo","c":"Google Scholar","d":"Yandex"},"correct":"d","why":"Yandex ha un riconoscimento di volti e luoghi spesso superiore a Google nella ricerca inversa"},{"q":"In DuckDuckGo, !li mario rossi genova porta a:","opts":{"a":"Google, cercando \"mario rossi genova\"","b":"LinkedIn, cercando \"mario rossi genova\"","c":"La Legge Italiana con la ricerca \"mario rossi genova\"","d":"LexisNexis"},"correct":"b","why":"Il bang !li reindirizza la ricerca direttamente su LinkedIn"},{"q":"Cosa indicizza principalmente Shodan?","opts":{"a":"Contenuti testuali di siti web","b":"Banner e metadati di servizi TCP/IP su dispositivi connessi a Internet","c":"Immagini e video","d":"Documenti PDF e Office"},"correct":"b","why":"Shodan scansiona Internet e indicizza i banner e i metadati dei servizi esposti dai dispositivi connessi"},{"q":"Quale dork Shodan trova server il cui certificato TLS copre un certo dominio?","opts":{"a":"hostname:example.com","b":"http.title:example.com","c":"ssl.cert.subject.cn:example.com","d":"org:example.com"},"correct":"c","why":"ssl.cert.subject.cn: filtra i server in base al Common Name del certificato TLS"},{"q":"Qual è il vantaggio principale di Censys rispetto a Shodan per l'OSINT?","opts":{"a":"È completamente gratuito","b":"Copre solo siti italiani","c":"Ha dati sui certificati TLS e SAN molto completi, utili per trovare sottodomini nascosti","d":"Funziona solo da linea di comando"},"correct":"c","why":"Censys ha dati molto completi sui certificati TLS e sui SAN, preziosi per scoprire sottodomini e infrastrutture"},{"q":"Su VirusTotal, caricare un file nel piano gratuito significa che:","opts":{"a":"Il file viene eliminato dopo 24 ore","b":"Il file diventa visibile ad altri utenti premium","c":"Il file viene analizzato solo da 5 antivirus","d":"Non è possibile caricare file nel piano gratuito"},"correct":"b","why":"I file caricati gratuitamente su VirusTotal diventano scaricabili dagli abbonati premium: mai caricare documenti riservati"},{"q":"Cosa sono i \"SAN\" di un certificato TLS?","opts":{"a":"Server Address Names: gli IP del server","b":"Subject Alternative Names: i domini e sottodomini coperti dal certificato","c":"Security Authority Numbers: i codici dell'autorità di certificazione","d":"Shodan Attribute Nodes: i nodi dell'indice Shodan"},"correct":"b","why":"I Subject Alternative Names elencano tutti i domini e sottodomini coperti da un certificato"},{"q":"URLScan.io è utile per l'OSINT principalmente perché:","opts":{"a":"Sostituisce Google per la ricerca di testi","b":"Permette di vedere come si comporta una pagina web e quali risorse carica senza visitarla","c":"È un database di vulnerabilità","d":"Permette di scansionare porte TCP"},"correct":"b","why":"URLScan.io visita la pagina al posto tuo e mostra risorse, richieste e screenshot senza esporre il tuo dispositivo"},{"q":"Quale dei seguenti comportamenti è non lecito nell'uso dei motori specializzati OSINT?","opts":{"a":"Usare i dork Google per trovare file PDF esposti","b":"Cercare un dominio su VirusTotal","c":"Connettersi al pannello phpMyAdmin trovato tramite Shodan per verificare se le credenziali di default funzionano","d":"Salvare uno screenshot di un risultato Censys"},"correct":"c","why":"Usare credenziali o pannelli trovati con Shodan è accesso abusivo a sistema informatico, anche solo \"per verificare\""}]},{"title":"La Ricerca degli Username","html":"<h1 id=\"lezione-4-la-ricerca-degli-username\">Lezione 4 – La Ricerca\ndegli Username</h1>\n<blockquote>\n<p><em>“Un nickname è una firma digitale. Le firme si riconoscono.”</em>\n— adagio della community OSINT</p>\n</blockquote>\n<hr />\n<h2 id=\"obiettivi-di-apprendimento\">Obiettivi di apprendimento</h2>\n<p>Al termine di questa lezione sarai in grado di:</p>\n<ol type=\"1\">\n<li>spiegare cos’è un username e perché è uno dei selettori OSINT più\npotenti;</li>\n<li>analizzare la struttura di un nickname per ricavarne ipotesi sul\nsoggetto;</li>\n<li>costruire dork specifici per la ricerca di username su motori\ngeneralisti e specializzati;</li>\n<li>usare <strong>WhatsMyName</strong> per la ricerca sistematica su\ncentinaia di piattaforme;</li>\n<li>usare <strong>Maigret</strong> e <strong>BlackBird</strong> per la\nricognizione automatizzata con profili arricchiti;</li>\n<li>riconoscere e non usare metodi illegali in Italia;</li>\n<li>sfruttare <strong>PIPL</strong> e servizi analoghi per la ricerca di\npersone in contesti leciti;</li>\n<li>generare ipotesi di indirizzi e-mail a partire dall’username e\nverificarle.</li>\n</ol>\n<hr />\n<h2 id=\"introduzione-agli-username\">1. Introduzione agli username</h2>\n<h3 id=\"definizione-e-anatomia\">1.1 Definizione e anatomia</h3>\n<p>Un <strong>username</strong> (o <em>nickname</em>, <em>handle</em>,\n<em>screen name</em>) è un identificatore testuale che una persona\nsceglie per rappresentarsi su una piattaforma digitale. A differenza del\nnome legale, è:</p>\n<ul>\n<li><strong>scelto liberamente</strong> dall’utente (con i vincoli del\nsito);</li>\n<li><strong>potenzialmente unico</strong> sulla piattaforma;</li>\n<li><strong>spesso riutilizzato</strong> su più servizi dallo stesso\nutente;</li>\n<li><strong>persistente nel tempo</strong> (le persone raramente\ncambiano nickname).</li>\n</ul>\n<p>La struttura di un username rivela spesso informazioni:</p>\n<pre><code>  mario.rossi87\n  │────┬────┘└┤\n  │   nome   │\n  │          └── anno (1987?)\n  └── cognome (o parte di esso)\n\n  mr_torino_1987\n  ││  └──┬──┘└┤\n  ││   città  └── anno\n  │└── separatore\n  └── iniziali (Mario Rossi)\n\n  _darkwolf_42\n   └───┬────┘└┤\n    pseudonimo └── numero (età? anno? numero preferito?)</code></pre>\n<h3 id=\"categorizzare-lusername\">1.2 Categorizzare l’username</h3>\n<p>Prima di iniziare la ricerca, classifica l’username che hai in\nmano:</p>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Tipo</th>\n<th>Esempio</th>\n<th>Cosa rivela</th>\n<th>Difficoltà di ricerca</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Nome + cognome</strong></td>\n<td><code>mario.rossi</code>, <code>m.rossi</code></td>\n<td>Identità reale quasi certa</td>\n<td>Bassa (ma omonimi!)</td>\n</tr>\n<tr>\n<td><strong>Nome + anno</strong></td>\n<td><code>mario87</code>, <code>rossi1987</code></td>\n<td>Nome parziale + possibile anno di nascita</td>\n<td>Bassa</td>\n</tr>\n<tr>\n<td><strong>Iniziali + città</strong></td>\n<td><code>mr_mi</code> (Milano), <code>mr_roma</code></td>\n<td>Iniziali + città</td>\n<td>Media</td>\n</tr>\n<tr>\n<td><strong>Soprannome</strong></td>\n<td><code>darkwolf</code>, <code>speedmaster</code></td>\n<td>Nulla di diretto, ma pattern riconoscibile</td>\n<td>Alta</td>\n</tr>\n<tr>\n<td><strong>Soprannome + numero</strong></td>\n<td><code>darkwolf42</code></td>\n<td>Soprannome + numero (età? anno?)</td>\n<td>Alta</td>\n</tr>\n<tr>\n<td><strong>E-mail come username</strong></td>\n<td><code>mario.rossi@gmail.com</code></td>\n<td>Nome, cognome, provider</td>\n<td>Bassa</td>\n</tr>\n<tr>\n<td><strong>Hash o stringa casuale</strong></td>\n<td><code>a3f9c2b1</code></td>\n<td>Bot o utente molto attento alla privacy</td>\n<td>Molto alta</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2 id=\"limportanza-dellusername\">2. L’importanza dell’username</h2>\n<h3 id=\"il-riutilizzo-la-vulnerabilità-principale\">2.1 Il riutilizzo: la\nvulnerabilità principale</h3>\n<p>Studi sul comportamento degli utenti online mostrano che la\n<strong>maggioranza delle persone riusa lo stesso username</strong> (o\nvarianti minime) su più piattaforme. Le ragioni sono psicologiche e\npratiche: il nickname diventa parte dell’identità digitale, è difficile\nricordare nomi diversi per ogni servizio, e molte persone non\npercepiscono il rischio.</p>\n<p>Questo riutilizzo è la base della ricerca OSINT per username: trovare\nun account su una piattaforma spesso porta a trovare gli stessi o simili\nsu decine di altre.</p>\n<p><strong>Varianti comuni dello stesso nickname:</strong></p>\n<pre><code>  Username base: darkwolf\n\n  darkwolf           (esatto)\n  dark_wolf          (underscore)\n  dark.wolf          (punto)\n  dark-wolf          (trattino)\n  darkwolf42         (+ numero)\n  darkwolf_42        (+ _ + numero)\n  thedarkwolf        (+ prefisso)\n  darkwolfofficial   (+ &quot;official&quot;)\n  darkwolf_it        (+ paese)\n  darkwolf1987       (+ anno di nascita)\n  xdarkwolfx         (lettere ornamentali)</code></pre>\n<p>Nella ricerca sistematica, vanno esplorate tutte queste varianti.</p>\n<h3 id=\"lusername-come-pivot-centrale\">2.2 L’username come pivot\ncentrale</h3>\n<p>Il pivot (introdotto nella Lezione 1) dell’username funziona\ncosì:</p>\n<pre><code>  [USERNAME]\n      │\n      ├──► Profili social → foto profilo → ricerca inversa → altre piattaforme\n      │\n      ├──► Forum e community → post → email di registrazione visibile → HIBP\n      │\n      ├──► GitHub → commit → email nei metadati git → nome reale\n      │\n      ├──► Steam / Discord / Gaming → amicizie → username correlati\n      │\n      ├──► Vecchi profili (Wayback Machine) → dati ora rimossi\n      │\n      └──► Paste sites (Pastebin, Ghostbin) → data breach → password hash</code></pre>\n<p>Ogni branch è un pivot verso nuovi selettori.</p>\n<h3 id=\"pattern-di-username-e-inferenze\">2.3 Pattern di username e\ninferenze</h3>\n<p>Alcuni pattern permettono inferenze utili:</p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Pattern trovato</th>\n<th>Inferenza possibile</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Username = nome.cognome</td>\n<td>Identità reale con alta probabilità</td>\n</tr>\n<tr>\n<td>Numero finale = anno a 4 cifre (1970–2010)</td>\n<td>Anno di nascita probabile</td>\n</tr>\n<tr>\n<td>Numero finale = anno a 2 cifre (<code>87</code>)</td>\n<td>Anno di nascita probabile (1987 o 2087)</td>\n</tr>\n<tr>\n<td>Suffisso geografico (<code>_roma</code>, <code>_mi</code>,\n<code>_it</code>)</td>\n<td>Città o paese</td>\n</tr>\n<tr>\n<td>Prefisso <code>x</code> o <code>_</code></td>\n<td>Username originale occupato; questo è la “seconda scelta”</td>\n</tr>\n<tr>\n<td>Stessa struttura su più piattaforme</td>\n<td>Alta probabilità di stesso utente</td>\n</tr>\n<tr>\n<td>Errore ortografico ricorrente nei post</td>\n<td>“Firma” stilistica unica</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>Importante:</strong> le inferenze vanno trattate come\nipotesi, non come fatti. Documenta sempre il ragionamento e il grado di\nconfidenza.</p>\n</blockquote>\n<hr />\n<h2 id=\"dork-per-la-ricerca-tramite-username\">3. Dork per la ricerca\ntramite username</h2>\n<p>Prima di usare strumenti automatici, una ricerca manuale con dork sui\nmotori generalisti dà risultati spesso migliori: i motori indicizzano\ncontenuti che gli strumenti automatici non raggiungono.</p>\n<h3 id=\"google-dork-per-username\">3.1 Google Dork per username</h3>\n<p><strong>Ricerca base del nickname su tutte le\npiattaforme:</strong></p>\n<pre><code>&quot;darkwolf42&quot;</code></pre>\n<p><strong>Restringere alle piattaforme social principali:</strong></p>\n<pre><code>&quot;darkwolf42&quot; site:twitter.com OR site:instagram.com OR site:reddit.com OR site:facebook.com</code></pre>\n<p><strong>Trovare il profilo GitHub:</strong></p>\n<pre><code>&quot;darkwolf42&quot; site:github.com</code></pre>\n<p><strong>Trovare profili su forum e community:</strong></p>\n<pre><code>&quot;darkwolf42&quot; inurl:profile OR inurl:user OR inurl:member</code></pre>\n<p><strong>Trovare menzioni in paste site (possibili data\nbreach):</strong></p>\n<pre><code>&quot;darkwolf42&quot; site:pastebin.com OR site:paste.ee OR site:ghostbin.co</code></pre>\n<p><strong>Trovare il nickname in documenti ufficiali (es. firme nei\ncommit):</strong></p>\n<pre><code>&quot;darkwolf42&quot; site:github.com OR site:gitlab.com inurl:commit</code></pre>\n<p><strong>Cercare varianti del nickname:</strong></p>\n<pre><code>&quot;darkwolf&quot; OR &quot;dark_wolf&quot; OR &quot;dark.wolf&quot; site:twitter.com</code></pre>\n<p><strong>Trovare profili Steam:</strong></p>\n<pre><code>&quot;darkwolf42&quot; site:steamcommunity.com</code></pre>\n<p><strong>Trovare menzioni in vecchie pagine (ricerca\ntemporale):</strong></p>\n<pre><code>&quot;darkwolf42&quot; before:2015-01-01</code></pre>\n<h3 id=\"yandex-e-bing\">3.2 Yandex e Bing</h3>\n<p>Ricorda che Yandex e Bing indicizzano contenuti diversi. Ripeti\nsempre le query principali su entrambi:</p>\n<pre><code>&quot;darkwolf42&quot; site:vk.com         # Yandex: ottimo per profili russi\n&quot;darkwolf42&quot; lang:it              # Yandex: limita all&#39;italiano\n&quot;darkwolf42&quot; site:*.ru            # Profili su piattaforme russe</code></pre>\n<p>Bing con l’operatore <code>ip:</code> non è utile per la ricerca di\nusername, ma può essere usato per trovare pagine di profilo sullo stesso\nserver di una piattaforma.</p>\n<h3 id=\"duckduckgo-bang-per-username\">3.3 DuckDuckGo !bang per\nusername</h3>\n<pre><code>darkwolf42 !twitter       # Ricerca su Twitter/X\ndarkwolf42 !reddit        # Ricerca su Reddit\ndarkwolf42 !gh            # Ricerca su GitHub\ndarkwolf42 !li            # Ricerca su LinkedIn\ndarkwolf42 !steam         # Ricerca su Steam</code></pre>\n<h3 id=\"ricerca-su-siti-specifici-url-diretti\">3.4 Ricerca su siti\nspecifici: URL diretti</h3>\n<p>Molti siti hanno URL prevedibili per i profili. Prova\ndirettamente:</p>\n<table>\n<thead>\n<tr>\n<th>Piattaforma</th>\n<th>URL del profilo</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Twitter/X</td>\n<td><code>https://x.com/USERNAME</code></td>\n</tr>\n<tr>\n<td>Instagram</td>\n<td><code>https://www.instagram.com/USERNAME/</code></td>\n</tr>\n<tr>\n<td>TikTok</td>\n<td><code>https://www.tiktok.com/@USERNAME</code></td>\n</tr>\n<tr>\n<td>Reddit</td>\n<td><code>https://www.reddit.com/user/USERNAME</code></td>\n</tr>\n<tr>\n<td>GitHub</td>\n<td><code>https://github.com/USERNAME</code></td>\n</tr>\n<tr>\n<td>GitLab</td>\n<td><code>https://gitlab.com/USERNAME</code></td>\n</tr>\n<tr>\n<td>LinkedIn</td>\n<td><code>https://www.linkedin.com/in/USERNAME</code></td>\n</tr>\n<tr>\n<td>Pinterest</td>\n<td><code>https://www.pinterest.it/USERNAME/</code></td>\n</tr>\n<tr>\n<td>YouTube</td>\n<td><code>https://www.youtube.com/@USERNAME</code></td>\n</tr>\n<tr>\n<td>Twitch</td>\n<td><code>https://www.twitch.tv/USERNAME</code></td>\n</tr>\n<tr>\n<td>Steam</td>\n<td><code>https://steamcommunity.com/id/USERNAME</code></td>\n</tr>\n<tr>\n<td>Keybase</td>\n<td><code>https://keybase.io/USERNAME</code></td>\n</tr>\n<tr>\n<td>Telegram</td>\n<td><code>https://t.me/USERNAME</code></td>\n</tr>\n<tr>\n<td>Mastodon</td>\n<td><code>https://mastodon.social/@USERNAME</code></td>\n</tr>\n</tbody>\n</table>\n<p>Puoi automatizzare questo controllo con lo script Python della\nsezione WhatsMyName.</p>\n<hr />\n<h2 id=\"whatsmyname\">4. WhatsMyName</h2>\n<h3 id=\"cosè-whatsmyname\">4.1 Cos’è WhatsMyName</h3>\n<p><strong>WhatsMyName</strong> (WMN) è un progetto open source creato\nda <strong>Micah Hoffman</strong> (WebBreacher) e mantenuto dalla\ncommunity. Il suo cuore è un file JSON (<code>wmn-data.json</code>) che\ncontiene l’elenco di oltre <strong>600 siti web</strong> con le relative\nURL di profilo e i criteri per determinare se un profilo esiste.</p>\n<p><strong>Sito web:</strong> https://whatsmyname.app (interfaccia web\ngratuita) <strong>Repository:</strong>\nhttps://github.com/WebBreacher/WhatsMyName</p>\n<h3 id=\"come-funziona\">4.2 Come funziona</h3>\n<p>Per ogni sito nel database, WMN: 1. Costruisce l’URL del profilo con\nl’username fornito. 2. Effettua una richiesta HTTP a quell’URL. 3.\nControlla la risposta: cerca una stringa di testo che indica la presenza\ndel profilo (<em>“found string”</em>) o ne verifica il codice HTTP. 4.\nSe il profilo esiste, lo segnala come trovato.</p>\n<p><strong>Schema del JSON per ogni sito:</strong></p>\n<pre class=\"json\"><code>{\n  &quot;name&quot;: &quot;GitHub&quot;,\n  &quot;uri_check&quot;: &quot;https://github.com/{account}&quot;,\n  &quot;e_code&quot;: 200,\n  &quot;e_string&quot;: &quot;\\&quot;login\\&quot;:\\&quot;{account}\\&quot;&quot;,\n  &quot;m_string&quot;: &quot;Not Found&quot;,\n  &quot;m_code&quot;: 404,\n  &quot;category&quot;: &quot;coding&quot;,\n  &quot;valid&quot;: true\n}</code></pre>\n<ul>\n<li><code>e_code</code> / <code>e_string</code>: codice HTTP o stringa\npresenti se il profilo <strong>esiste</strong>.</li>\n<li><code>m_code</code> / <code>m_string</code>: codice HTTP o stringa\npresenti se il profilo <strong>non esiste</strong>.</li>\n</ul>\n<h3 id=\"uso-dellinterfaccia-web\">4.3 Uso dell’interfaccia web</h3>\n<p>Vai su https://whatsmyname.app, inserisci l’username e clicca su\n“Check”. I risultati vengono mostrati in tempo reale con i siti in cui\nil profilo è stato trovato, organizzati per categoria (social, gaming,\ncoding, forum, ecc.).</p>\n<p><strong>Limiti dell’interfaccia web:</strong> - Non permette di\nfiltrare per categoria o paese. - Non esporta i risultati\nautomaticamente. - Richiede di verificare manualmente ogni link trovato\n(i falsi positivi esistono).</p>\n<h3 id=\"installazione-ed-uso-da-riga-di-comando\">4.4 Installazione ed\nuso da riga di comando</h3>\n<pre class=\"bash\"><code># Clona il repository\ngit clone https://github.com/WebBreacher/WhatsMyName.git\ncd WhatsMyName\n\n# Installa le dipendenze\npip3 install -r requirements.txt\n\n# Ricerca base\npython3 web_accounts_list_checker.py -u darkwolf42\n\n# Solo una categoria\npython3 web_accounts_list_checker.py -u darkwolf42 --category social\n\n# Salva i risultati in CSV\npython3 web_accounts_list_checker.py -u darkwolf42 --output csv --file risultati.csv\n\n# Ricerca di più username\npython3 web_accounts_list_checker.py -u darkwolf42 darkwolf_42 dark.wolf</code></pre>\n<h3 id=\"integrazione-python-script-personalizzato\">4.5 Integrazione\nPython: script personalizzato</h3>\n<pre class=\"python\"><code>#!/usr/bin/env python3\n&quot;&quot;&quot;\nwmn_check.py – Verifica username su siti selezionati usando i dati WhatsMyName.\nRichiede: pip3 install requests\n          Il file wmn-data.json scaricato da:\n          https://raw.githubusercontent.com/WebBreacher/WhatsMyName/main/wmn-data.json\n&quot;&quot;&quot;\nimport json\nimport time\nimport requests\nfrom pathlib import Path\n\nWMN_JSON = &quot;wmn-data.json&quot;\nTIMEOUT = 8         # secondi per richiesta\nPAUSA = 0.5         # secondi tra le richieste (sii educato!)\nCATEGORIE_OK = {    # filtra le categorie che ti interessano (vuoto = tutte)\n    &quot;social_media&quot;, &quot;coding&quot;, &quot;gaming&quot;, &quot;forum&quot;, &quot;professional&quot;\n}\n\n\ndef carica_siti(percorso: str) -&gt; list[dict]:\n    &quot;&quot;&quot;Carica il JSON di WhatsMyName.&quot;&quot;&quot;\n    with open(percorso, encoding=&quot;utf-8&quot;) as f:\n        dati = json.load(f)\n    siti = dati.get(&quot;sites&quot;, [])\n    if CATEGORIE_OK:\n        siti = [s for s in siti if s.get(&quot;category&quot;, &quot;&quot;) in CATEGORIE_OK]\n    return [s for s in siti if s.get(&quot;valid&quot;, True)]\n\n\ndef controlla(username: str, sito: dict) -&gt; bool | None:\n    &quot;&quot;&quot;\n    Verifica se l&#39;username esiste su un sito.\n    Restituisce True (trovato), False (non trovato), None (errore).\n    &quot;&quot;&quot;\n    url = sito[&quot;uri_check&quot;].replace(&quot;{account}&quot;, username)\n    e_code = sito.get(&quot;e_code&quot;, 200)\n    e_string = sito.get(&quot;e_string&quot;, &quot;&quot;).replace(&quot;{account}&quot;, username)\n    m_code = sito.get(&quot;m_code&quot;, 404)\n    m_string = sito.get(&quot;m_string&quot;, &quot;&quot;)\n\n    try:\n        r = requests.get(\n            url,\n            headers={&quot;User-Agent&quot;: &quot;Mozilla/5.0 (compatible; OSINT-research)&quot;},\n            timeout=TIMEOUT,\n            allow_redirects=True,\n        )\n        codice = r.status_code\n        testo = r.text\n\n        # Priorità alla stringa di corrispondenza negativa\n        if m_string and m_string in testo:\n            return False\n        if codice == m_code and not e_string:\n            return False\n        # Verifica presenza\n        if e_string and e_string in testo:\n            return True\n        if codice == e_code and not m_string:\n            return True\n        return None  # risultato ambiguo\n    except requests.RequestException:\n        return None\n\n\ndef cerca_username(username: str, siti: list[dict]) -&gt; list[dict]:\n    &quot;&quot;&quot;Cerca l&#39;username su tutti i siti e restituisce quelli trovati.&quot;&quot;&quot;\n    trovati = []\n    print(f&quot;\\n🔍 Ricerca: {username} su {len(siti)} siti\\n&quot;)\n    for sito in siti:\n        esito = controlla(username, sito)\n        nome = sito[&quot;name&quot;]\n        url = sito[&quot;uri_check&quot;].replace(&quot;{account}&quot;, username)\n        if esito is True:\n            print(f&quot;  ✔ {nome:&lt;30} {url}&quot;)\n            trovati.append({&quot;sito&quot;: nome, &quot;url&quot;: url, &quot;categoria&quot;: sito.get(&quot;category&quot;)})\n        time.sleep(PAUSA)\n    return trovati\n\n\ndef salva_csv(trovati: list[dict], username: str) -&gt; None:\n    &quot;&quot;&quot;Salva i risultati in un CSV.&quot;&quot;&quot;\n    import csv, os\n    from datetime import datetime, timezone\n    nome_file = f&quot;wmn_{username}_{datetime.now(timezone.utc).strftime(&#39;%Y%m%d_%H%M%S&#39;)}.csv&quot;\n    with open(nome_file, &quot;w&quot;, newline=&quot;&quot;, encoding=&quot;utf-8&quot;) as f:\n        writer = csv.DictWriter(f, fieldnames=[&quot;sito&quot;, &quot;url&quot;, &quot;categoria&quot;])\n        writer.writeheader()\n        writer.writerows(trovati)\n    print(f&quot;\\n✔ Risultati salvati in {nome_file}&quot;)\n\n\nif __name__ == &quot;__main__&quot;:\n    if not Path(WMN_JSON).exists():\n        print(f&quot;⚠ File {WMN_JSON} non trovato. Scaricalo da:&quot;)\n        print(&quot;  https://raw.githubusercontent.com/WebBreacher/WhatsMyName/main/wmn-data.json&quot;)\n        exit(1)\n    username = input(&quot;Username da cercare: &quot;).strip()\n    siti = carica_siti(WMN_JSON)\n    trovati = cerca_username(username, siti)\n    print(f&quot;\\n📊 Trovato su {len(trovati)} siti.&quot;)\n    if trovati:\n        salva_csv(trovati, username)</code></pre>\n<blockquote>\n<p><strong>Falsi positivi:</strong> alcuni siti restituiscono sempre\nHTTP 200 indipendentemente dall’esistenza del profilo. Verifica sempre\nmanualmente i link segnalati come “trovati” prima di includerli nel\nreport.</p>\n</blockquote>\n<hr />\n<h2 id=\"maigret\">5. Maigret</h2>\n<h3 id=\"cosè-maigret\">5.1 Cos’è Maigret</h3>\n<p><strong>Maigret</strong> è uno strumento open source in Python,\nispirato a <strong>Sherlock</strong> (il tool originale per la ricerca\ndi username) ma con capacità aggiuntive: oltre a verificare la presenza\ndel profilo, <strong>estrae informazioni</strong> dal profilo stesso\n(nome, bio, avatar, link, follower) e costruisce un <strong>report\nHTML</strong> strutturato.</p>\n<p>Il nome è un omaggio al commissario Maigret di Georges Simenon.</p>\n<p><strong>Repository:</strong> https://github.com/soxoj/maigret</p>\n<p><strong>Sviluppato da:</strong> soxoj, con contributi della community\nOSINT.</p>\n<p><strong>Differenze rispetto a Sherlock/WMN:</strong></p>\n<table>\n<thead>\n<tr>\n<th>Caratteristica</th>\n<th>Sherlock</th>\n<th>WhatsMyName</th>\n<th>Maigret</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Siti supportati</td>\n<td>~400</td>\n<td>600+</td>\n<td>2.500+</td>\n</tr>\n<tr>\n<td>Estrazione dati dal profilo</td>\n<td>No</td>\n<td>No</td>\n<td><strong>Sì</strong></td>\n</tr>\n<tr>\n<td>Report HTML</td>\n<td>No</td>\n<td>No</td>\n<td><strong>Sì</strong></td>\n</tr>\n<tr>\n<td>Ricerca ricorsiva (pivot)</td>\n<td>No</td>\n<td>No</td>\n<td><strong>Sì</strong></td>\n</tr>\n<tr>\n<td>Identificatori alternativi</td>\n<td>No</td>\n<td>No</td>\n<td><strong>Sì</strong> (e-mail, telefono)</td>\n</tr>\n<tr>\n<td>Attivamente mantenuto</td>\n<td>Sì</td>\n<td>Sì</td>\n<td><strong>Sì</strong></td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"installazione\">5.2 Installazione</h3>\n<pre class=\"bash\"><code># Con pip\npip3 install maigret\n\n# Da sorgente (versione più aggiornata)\ngit clone https://github.com/soxoj/maigret\ncd maigret\npip3 install .</code></pre>\n<h3 id=\"utilizzo-base\">5.3 Utilizzo base</h3>\n<pre class=\"bash\"><code># Ricerca base: username su tutti i siti\nmaigret darkwolf42\n\n# Genera report HTML\nmaigret darkwolf42 --html\n\n# Genera report PDF\nmaigret darkwolf42 --pdf\n\n# Limita a un certo numero di siti (più veloce)\nmaigret darkwolf42 --top-sites 500\n\n# Ricerca su siti di una specifica categoria\nmaigret darkwolf42 --tags social\n\n# Ricerca con timeout personalizzato (più lungo = meno errori)\nmaigret darkwolf42 --timeout 15\n\n# Ricerca di più username contemporaneamente\nmaigret darkwolf42 dark_wolf42 darkwolf_official\n\n# Ricerca a partire da un URL di profilo (pivot automatico)\nmaigret --url https://github.com/darkwolf42</code></pre>\n<h3 id=\"interpretare-i-risultati-di-maigret\">5.4 Interpretare i\nrisultati di Maigret</h3>\n<p>Maigret classifica i risultati in: - <strong>Found</strong>: profilo\ntrovato con dati estratti. - <strong>Not found</strong>: profilo\nassente. - <strong>Claimed</strong>: il sito ha risposto in modo ambiguo\n(possibile falso positivo). - <strong>Error</strong>: timeout o errore\ndi connessione.</p>\n<p>Il <strong>report HTML</strong> mostra per ogni profilo trovato: -\nURL del profilo. - Foto dell’avatar. - Nome visualizzato. - Bio o\ndescrizione. - Link ad altri profili (pivot automatici). - Tag e\ncategorie.</p>\n<h3 id=\"la-ricerca-ricorsiva-pivot-automatico\">5.5 La ricerca ricorsiva\n(pivot automatico)</h3>\n<p>Una delle funzioni più potenti di Maigret è la <strong>ricerca\nricorsiva</strong>: se un profilo trovato conti
