ene link ad altri profili\no username diversi, Maigret può seguire automaticamente quei link e\ncercare anche i nuovi username.</p>\n<pre class=\"bash\"><code>maigret darkwolf42 --with-related</code></pre>\n<p>Questo funziona perché molti profili social includono link incrociati\n(ad esempio, un profilo Twitter che linka al canale YouTube o\nall’account GitHub).</p>\n<h3 id=\"script-python-integrazione-maigret\">5.6 Script Python:\nintegrazione Maigret</h3>\n<pre class=\"python\"><code>#!/usr/bin/env python3\n&quot;&quot;&quot;\nmaigret_launcher.py – Avvia Maigret con parametri predefiniti\ne salva i risultati in una cartella con timestamp.\nRichiede: pip3 install maigret\n&quot;&quot;&quot;\nimport subprocess\nimport sys\nimport os\nfrom datetime import datetime, timezone\nfrom pathlib import Path\n\n\ndef lancia_maigret(username: str, cartella_output: str) -&gt; None:\n    &quot;&quot;&quot;Lancia Maigret per un username e salva il report.&quot;&quot;&quot;\n    Path(cartella_output).mkdir(parents=True, exist_ok=True)\n\n    cmd = [\n        sys.executable, &quot;-m&quot;, &quot;maigret&quot;,\n        username,\n        &quot;--html&quot;,                         # Report HTML\n        &quot;--json&quot;, &quot;ndjson&quot;,               # Report JSON lines\n        f&quot;--folderoutput&quot;, cartella_output,\n        &quot;--timeout&quot;, &quot;10&quot;,\n        &quot;--top-sites&quot;, &quot;500&quot;,             # Limita ai 500 siti più rilevanti\n        &quot;--with-related&quot;,                 # Segui i pivot automatici\n        &quot;--no-color&quot;,                     # Output pulito senza codici ANSI\n    ]\n\n    print(f&quot;🚀 Lancio Maigret per: {username}&quot;)\n    print(f&quot;   Output in: {cartella_output}/\\n&quot;)\n\n    try:\n        subprocess.run(cmd, check=True)\n        print(f&quot;\\n✔ Report salvato in {cartella_output}/&quot;)\n        # Lista i file prodotti\n        for f in Path(cartella_output).iterdir():\n            print(f&quot;   {f.name}&quot;)\n    except subprocess.CalledProcessError as e:\n        print(f&quot;⚠ Maigret ha restituito codice di errore: {e.returncode}&quot;)\n    except FileNotFoundError:\n        print(&quot;⚠ Maigret non trovato. Installalo con: pip3 install maigret&quot;)\n\n\nif __name__ == &quot;__main__&quot;:\n    username = input(&quot;Username: &quot;).strip()\n    ts = datetime.now(timezone.utc).strftime(&quot;%Y%m%d_%H%M%S&quot;)\n    output_dir = f&quot;maigret_{username}_{ts}&quot;\n    lancia_maigret(username, output_dir)</code></pre>\n<hr />\n<h2 id=\"blackbird\">6. BlackBird</h2>\n<h3 id=\"cosè-blackbird\">6.1 Cos’è BlackBird</h3>\n<p><strong>BlackBird</strong> è uno strumento OSINT open source per la\nricerca di username e indirizzi e-mail su centinaia di siti. È stato\ncreato con un focus particolare sulla <strong>velocità</strong>,\nsull’<strong>interfaccia grafica web</strong> integrata e sulla\n<strong>ricerca per e-mail</strong> (non solo per username).</p>\n<p><strong>Repository:</strong>\nhttps://github.com/p1ngul1n0/blackbird</p>\n<p><strong>Caratteristiche distintive:</strong> - Ricerca sia per\n<strong>username</strong> che per <strong>indirizzo e-mail</strong>. -\nInterfaccia web integrata (avvia un server locale). - Report HTML\ninterattivo con dettagli estratti dai profili. - Supporto per oltre 600\nsiti. - Aggiornato attivamente con nuove piattaforme.</p>\n<h3 id=\"installazione-1\">6.2 Installazione</h3>\n<pre class=\"bash\"><code>git clone https://github.com/p1ngul1n0/blackbird\ncd blackbird\npip3 install -r requirements.txt</code></pre>\n<h3 id=\"utilizzo-da-riga-di-comando\">6.3 Utilizzo da riga di\ncomando</h3>\n<pre class=\"bash\"><code># Ricerca per username\npython3 blackbird.py -u darkwolf42\n\n# Ricerca per e-mail\npython3 blackbird.py -e mario.rossi@example.com\n\n# Con interfaccia web (avvia un server su localhost)\npython3 blackbird.py -u darkwolf42 --web\n\n# Salva i risultati in JSON\npython3 blackbird.py -u darkwolf42 --json risultati.json\n\n# Imposta timeout personalizzato\npython3 blackbird.py -u darkwolf42 --timeout 15</code></pre>\n<h3 id=\"confronto-tra-i-tre-strumenti\">6.4 Confronto tra i tre\nstrumenti</h3>\n<p>Per la ricerca di username è buona pratica usare tutti e tre gli\nstrumenti, perché i loro database si sovrappongono parzialmente ma non\ncompletamente:</p>\n<table>\n<thead>\n<tr>\n<th>Strumento</th>\n<th>Siti</th>\n<th>E-mail?</th>\n<th>Report HTML</th>\n<th>Pivot auto</th>\n<th>Velocità</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>WhatsMyName</td>\n<td>600+</td>\n<td>No</td>\n<td>No</td>\n<td>No</td>\n<td>Media</td>\n</tr>\n<tr>\n<td>Maigret</td>\n<td>2.500+</td>\n<td>Parziale</td>\n<td>Sì</td>\n<td><strong>Sì</strong></td>\n<td>Media</td>\n</tr>\n<tr>\n<td>BlackBird</td>\n<td>600+</td>\n<td><strong>Sì</strong></td>\n<td>Sì</td>\n<td>No</td>\n<td>Alta</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Flusso di lavoro consigliato:</strong> 1.\n<strong>WhatsMyName</strong> per una prima panoramica rapida. 2.\n<strong>Maigret</strong> per un’analisi approfondita con pivot\nautomatici. 3. <strong>BlackBird</strong> se hai anche un’e-mail\nassociata.</p>\n<hr />\n<h2 id=\"metodi-illegali-in-italia\">7. Metodi illegali in Italia</h2>\n<h3 id=\"cosa-non-fare-il-confine-chiaro\">7.1 Cosa NON fare: il confine\nchiaro</h3>\n<p>Questa sezione è fondamentale. Esistono metodi e strumenti che\nsembrano legittimi ma che in Italia (e nell’UE) configurano reati. Li\npresentiamo per farli riconoscere e <strong>non usarli</strong>.</p>\n<blockquote>\n<p><strong>Avvertenza:</strong> la conoscenza di questi metodi serve a\nriconoscerli quando qualcuno li propone, a difendere i propri clienti, e\na evitare di commetterli involontariamente. Non costituiscono tecniche\nOSINT eticamente accettabili.</p>\n</blockquote>\n<h3 id=\"accesso-abusivo-a-sistemi-informatici-art.-615-ter-c.p.\">7.2\nAccesso abusivo a sistemi informatici (art. 615-ter c.p.)</h3>\n<p><strong>Cosa è</strong>: accedere a un account o sistema protetto da\ncredenziali senza autorizzazione del titolare. È irrilevante che le\ncredenziali siano state trovate in un data breach o indovinate.</p>\n<p><strong>Esempi concreti:</strong> - Usare credenziali trovate su\nPastebin per accedere a un account Gmail. - Usare una password di\ndefault non cambiata per accedere a un pannello admin. - “Recuperare”\nl’account di qualcun altro sfruttando domande di sicurezza.</p>\n<p><strong>Pena:</strong> reclusione fino a tre anni, aggravata (fino a\ncinque anni) se il sistema è di pubblica utilità o se l’accesso causa\ndanni.</p>\n<h3 id=\"sostituzione-di-persona-art.-494-c.p.\">7.3 Sostituzione di\npersona (art. 494 c.p.)</h3>\n<p><strong>Cosa è</strong>: creare un account che impersona una persona\nreale per trarne vantaggio o recarle danno.</p>\n<p><strong>Esempi concreti:</strong> - Creare un profilo Instagram con\nle foto e il nome di qualcuno per spiarne le conversazioni o\ndanneggiarne la reputazione. - Usare un “sock puppet” che si presenta\ncon un’identità reale altrui.</p>\n<p><strong>Nota:</strong> creare un account di ricerca con identità\n<strong>fittizia</strong> (cioè non corrispondente a una persona reale)\nè eticamente discutibile ma non integra necessariamente l’art. 494. Il\nlimite è non impersonare una persona reale.</p>\n<h3 id=\"intercettazione-illecita-art.-617-quater-c.p.\">7.4\nIntercettazione illecita (art. 617-quater c.p.)</h3>\n<p><strong>Cosa è</strong>: intercettare comunicazioni informatiche o\ntelematiche tra terze parti senza autorizzazione.</p>\n<p><strong>Esempi concreti:</strong> - Usare un attacco\nman-in-the-middle su una rete Wi-Fi pubblica per leggere i messaggi di\nun soggetto. - Installare un keylogger o spyware su un dispositivo\naltrui.</p>\n<h3\nid=\"trattamento-illecito-di-dati-personali-art.-167-codice-privacy\">7.5\nTrattamento illecito di dati personali (art. 167 Codice Privacy)</h3>\n<p><strong>Cosa è</strong>: raccogliere, conservare, cedere o diffondere\ndati personali altrui senza base giuridica, causando danno.</p>\n<p><strong>Esempi concreti:</strong> - Creare un database di dati\npersonali raccolti da fonti aperte e venderlo o diffonderlo. -\nPubblicare l’indirizzo di casa, il numero di telefono o altri dati\npersonali di qualcuno senza una legittima ragione (cosiddetto\n<strong>doxxing</strong>).</p>\n<p><strong>Pena:</strong> reclusione da uno a tre anni, aggravata se i\ndati sono “particolari” (salute, orientamento sessuale, religione,\necc.).</p>\n<h3 id=\"stalking-digitale-art.-612-bis-c.p.\">7.6 Stalking digitale (art.\n612-bis c.p.)</h3>\n<p><strong>Cosa è</strong>: condotte reiterate di monitoraggio, contatto\no pedinamento che causano ansia, paura o alterazione delle abitudini di\nvita.</p>\n<p><strong>Esempi concreti:</strong> - Monitorare ossessivamente i\nprofili social di una persona e inviarle messaggi ripetuti. -\nGeolocalizzarla tramite i suoi post e seguirla fisicamente.</p>\n<h3 id=\"accesso-a-database-di-dati-personali-non-autorizzati\">7.7\nAccesso a database di dati personali non autorizzati</h3>\n<p>In Italia circolano, spesso sotto forma di app o servizi online,\ndatabase che aggregano dati da fonti non lecite (rubrica condivisa senza\nconsenso, data breach illegali, dati di archivi giudiziari non\npubblici). Usarli è illecito ai sensi del GDPR e del Codice Privacy,\nindipendentemente dal fatto che il dato sia tecnicamente\n“accessibile”.</p>\n<hr />\n<h2 id=\"pipl\">8. PIPL</h2>\n<h3 id=\"cosè-pipl\">8.1 Cos’è PIPL</h3>\n<p><strong>PIPL</strong> (https://pipl.com) è un motore di ricerca\ncommerciale specializzato nella ricerca di persone. Aggrega dati da\nfonti pubbliche e semi-pubbliche (registri pubblici USA, social network,\ndati commerciali) per costruire profili dettagliati su persone\nfisiche.</p>\n<p><strong>Caratteristiche:</strong> - Orientato al mercato\n<strong>nordamericano e anglofono</strong> (risultati molto limitati per\nprofili italiani). - Accesso tramite <strong>API a pagamento</strong>\n(non esiste un piano gratuito commerciale; la versione consumer è stata\ndismessa). - Usato principalmente da aziende per KYC, verifica\ndell’identità, indagini HR. - Aggrega: nome, indirizzo, email, telefono,\nprofili social, parenti, storico degli indirizzi.</p>\n<p><strong>In Italia</strong>, PIPL ha una copertura molto limitata\nperché i dati di registro pubblico (residenza, stato civile) non sono\nliberamente accessibili come negli USA. È più utile per indagini su\nsoggetti nordamericani.</p>\n<h3 id=\"pipl-e-il-gdpr\">8.2 PIPL e il GDPR</h3>\n<p>PIPL è un esempio di servizio che solleva questioni serie di\nconformità al GDPR per gli utenti europei. Prima di usarlo:</p>\n<ol type=\"1\">\n<li>Verifica se la tua organizzazione ha una base giuridica (es. KYC/AML\nper banche e finanziarie, investigazione autorizzata).</li>\n<li>Non usarlo per curiosità personale o senza requisito informativo\ndocumentato.</li>\n<li>Elimina i dati raccolti quando non sono più necessari.</li>\n</ol>\n<h3 id=\"alternative-a-pipl-per-il-mercato-italiano\">8.3 Alternative a\nPIPL per il mercato italiano</h3>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Strumento / Servizio</th>\n<th>Tipo</th>\n<th>Cosa cerca</th>\n<th>Lecito?</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>InfoCamere / CCIAA</strong></td>\n<td>Registro ufficiale</td>\n<td>Aziende, soci, amministratori, bilanci</td>\n<td>Sì</td>\n</tr>\n<tr>\n<td><strong>ANAC</strong></td>\n<td>Registro ufficiale</td>\n<td>Bandi, appalti, sanzioni</td>\n<td>Sì</td>\n</tr>\n<tr>\n<td><strong>Tribunale.it</strong></td>\n<td>Registro ufficiale</td>\n<td>Sentenze, procedure concorsuali</td>\n<td>Sì</td>\n</tr>\n<tr>\n<td><strong>PEC pubblica (INI-PEC)</strong></td>\n<td>Registro ufficiale</td>\n<td>PEC di aziende e professionisti</td>\n<td>Sì</td>\n</tr>\n<tr>\n<td><strong>Albi professionali</strong> (OdA, OdM, ecc.)</td>\n<td>Registro ufficiale</td>\n<td>Iscrizioni ad albi</td>\n<td>Sì</td>\n</tr>\n<tr>\n<td><strong>LinkedIn</strong></td>\n<td>Social</td>\n<td>Profili professionali</td>\n<td>Sì</td>\n</tr>\n<tr>\n<td><strong>OSINT Industries</strong></td>\n<td>Aggregatore</td>\n<td>E-mail, telefono, username</td>\n<td>Sì (con limiti)</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2 id=\"generare-possibili-e-mail-a-partire-dallusername\">9. Generare\npossibili e-mail a partire dall’username</h2>\n<h3 id=\"il-collegamento-username-e-mail\">9.1 Il collegamento username →\ne-mail</h3>\n<p>Molti utenti creano il proprio indirizzo e-mail usando lo stesso\npattern del loro username. Trovare o ipotizzare l’e-mail associata a un\nusername è uno dei pivot più produttivi nell’OSINT.</p>\n<p><strong>Pattern comuni:</strong></p>\n<pre><code>  Username:    mario.rossi87\n  E-mail:      mario.rossi87@gmail.com\n               mario.rossi87@yahoo.it\n               mario.rossi87@libero.it\n               mario.rossi87@hotmail.com\n               mario.rossi87@outlook.com\n               m.rossi@azienda.it         (formato aziendale)\n               mario.rossi@azienda.it     (senza anno)\n               mario@rossi.it             (dominio personale)</code></pre>\n<h3 id=\"formati-aziendali\">9.2 Formati aziendali</h3>\n<p>Se conosci il nome e il cognome del soggetto e l’azienda per cui\nlavora, i formati aziendali più comuni sono:</p>\n<table>\n<thead>\n<tr>\n<th>Formato</th>\n<th>Esempio</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>nome.cognome@</code></td>\n<td><code>mario.rossi@example.it</code></td>\n</tr>\n<tr>\n<td><code>n.cognome@</code></td>\n<td><code>m.rossi@example.it</code></td>\n</tr>\n<tr>\n<td><code>nome.c@</code></td>\n<td><code>mario.r@example.it</code></td>\n</tr>\n<tr>\n<td><code>nomecognome@</code></td>\n<td><code>mariorossi@example.it</code></td>\n</tr>\n<tr>\n<td><code>cognome.nome@</code></td>\n<td><code>rossi.mario@example.it</code></td>\n</tr>\n<tr>\n<td><code>c.nome@</code></td>\n<td><code>r.mario@example.it</code></td>\n</tr>\n<tr>\n<td><code>nome@</code></td>\n<td><code>mario@example.it</code></td>\n</tr>\n<tr>\n<td><code>cognome@</code></td>\n<td><code>rossi@example.it</code></td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"strumenti-per-trovare-il-formato-aziendale\">9.3 Strumenti per\ntrovare il formato aziendale</h3>\n<p><strong>Hunter.io</strong> (https://hunter.io): permette di inserire\nun dominio e restituisce il formato di email usato dall’azienda e gli\nindirizzi trovati pubblicamente. Piano gratuito: 25 ricerche/mese.</p>\n<p><strong>Phonebook.cz</strong> (https://phonebook.cz): aggrega email\nda data breach pubblici e fonti aperte. Inserisci il dominio e ottieni\nle email trovate.</p>\n<p><strong>Skrapp.io</strong>, <strong>Snov.io</strong>: simili a\nHunter, orientati alla lead generation ma usabili per OSINT\naziendale.</p>\n<h3 id=\"verificare-se-une-mail-esiste\">9.4 Verificare se un’e-mail\nesiste</h3>\n<p>Una volta generate le ipotesi, puoi verificarle <strong>senza inviare\nmessaggi</strong> (verifica passiva):</p>\n<p><strong>1. Have I Been Pwned (HIBP):</strong>\nhttps://haveibeenpwned.com Controlla se l’indirizzo compare in data\nbreach noti. Se sì, l’email esiste quasi certamente.</p>\n<p><strong>2. Verifica SMTP (solo con strumenti appositi):</strong>\nalcuni server di posta rispondo alla domanda “esiste questo indirizzo?”\nsenza che tu invii una mail. Tecnicamente funziona tramite\n<code>RCPT TO</code> nella sessione SMTP. Non sempre è affidabile (molti\nserver bloccano questa tecnica per anti-spam).</p>\n<p><strong>3. Holehe:</strong> strumento open source che verifica se\nun’email è usata per la registrazione su decine di servizi. Lo vedremo\nnella Lezione 5.</p>\n<p><strong>4. Gravatar:</strong> https://en.gravatar.com/ Se l’indirizzo\nè associato a un account Gravatar,\n<code>https://www.gravatar.com/avatar/&lt;MD5_DELL_EMAIL&gt;</code>\nrestituisce un avatar (anche se di default). Questo conferma l’esistenza\ndell’account Gravatar, non necessariamente dell’email stessa.</p>\n<pre class=\"python\"><code># Calcola l&#39;hash MD5 per Gravatar\nimport hashlib\nemail = &quot;mario.rossi87@gmail.com&quot;\nmd5 = hashlib.md5(email.strip().lower().encode()).hexdigest()\nprint(f&quot;https://www.gravatar.com/avatar/{md5}?d=404&quot;)\n# d=404: restituisce 404 se non esiste, invece di un&#39;immagine di default</code></pre>\n<h3 id=\"script-python-generatore-di-ipotesi-di-e-mail\">9.5 Script\nPython: generatore di ipotesi di e-mail</h3>\n<pre class=\"python\"><code>#!/usr/bin/env python3\n&quot;&quot;&quot;\nemail_generator.py – Genera ipotesi di email da nome, cognome e dominio.\nUtile per OSINT aziendale: trova il formato giusto combinando con Hunter.io.\n&quot;&quot;&quot;\nimport hashlib\nimport itertools\nfrom urllib.parse import quote\n\n\ndef genera_varianti(nome: str, cognome: str, dominio: str) -&gt; list[str]:\n    &quot;&quot;&quot;Genera tutte le combinazioni comuni di email aziendale.&quot;&quot;&quot;\n    n = nome.lower().strip()\n    c = cognome.lower().strip()\n    n1 = n[0]       # Iniziale del nome\n    c1 = c[0]       # Iniziale del cognome\n\n    pattern = [\n        f&quot;{n}.{c}&quot;,\n        f&quot;{n1}.{c}&quot;,\n        f&quot;{n}.{c1}&quot;,\n        f&quot;{n}{c}&quot;,\n        f&quot;{n1}{c}&quot;,\n        f&quot;{c}.{n}&quot;,\n        f&quot;{c}{n}&quot;,\n        f&quot;{c1}.{n}&quot;,\n        f&quot;{n}&quot;,\n        f&quot;{c}&quot;,\n        f&quot;{n}_{c}&quot;,\n        f&quot;{n1}_{c}&quot;,\n    ]\n    return [f&quot;{p}@{dominio}&quot; for p in pattern]\n\n\ndef gravatar_url(email: str) -&gt; str:\n    &quot;&quot;&quot;Costruisce l&#39;URL Gravatar per un&#39;email (con d=404 per verificare).&quot;&quot;&quot;\n    md5 = hashlib.md5(email.strip().lower().encode()).hexdigest()\n    return f&quot;https://www.gravatar.com/avatar/{md5}?d=404&quot;\n\n\ndef url_hibp(email: str) -&gt; str:\n    &quot;&quot;&quot;URL diretto di Have I Been Pwned per l&#39;email.&quot;&quot;&quot;\n    return f&quot;https://haveibeenpwned.com/account/{quote(email)}&quot;\n\n\nif __name__ == &quot;__main__&quot;:\n    nome = input(&quot;Nome: &quot;).strip()\n    cognome = input(&quot;Cognome: &quot;).strip()\n    dominio = input(&quot;Dominio aziendale (es. example.it): &quot;).strip()\n\n    varianti = genera_varianti(nome, cognome, dominio)\n\n    print(f&quot;\\n📧 Varianti generate ({len(varianti)}):\\n&quot;)\n    for email in varianti:\n        print(f&quot;  {email}&quot;)\n        print(f&quot;    Gravatar: {gravatar_url(email)}&quot;)\n        print(f&quot;    HIBP:     {url_hibp(email)}&quot;)\n        print()\n\n    # Salva in un file\n    with open(f&quot;email_ipotesi_{nome}_{cognome}.txt&quot;, &quot;w&quot;) as f:\n        f.writelines(e + &quot;\\n&quot; for e in varianti)\n    print(f&quot;✔ Lista salvata in email_ipotesi_{nome}_{cognome}.txt&quot;)</code></pre>\n<h3 id=\"verificare-in-blocco-con-hunter.io-email-verifier\">9.6\nVerificare in blocco con Hunter.io Email Verifier</h3>\n<p>Hunter.io offre anche un servizio di verifica dell’esistenza di un\nindirizzo email. Nel piano gratuito sono disponibili 50\nverifiche/mese:</p>\n<pre class=\"python\"><code>#!/usr/bin/env python3\n&quot;&quot;&quot;\nhunter_verify.py – Verifica email con Hunter.io Email Verifier.\nRichiede: pip3 install requests\n          API key gratuita su https://hunter.io/users/sign_up\n&quot;&quot;&quot;\nimport os\nimport time\nimport requests\n\nAPI_KEY = os.environ.get(&quot;HUNTER_API_KEY&quot;, &quot;&quot;)\nBASE = &quot;https://api.hunter.io/v2&quot;\nPAUSA = 2  # secondi tra le richieste\n\n\ndef verifica(email: str) -&gt; dict:\n    &quot;&quot;&quot;Verifica l&#39;esistenza di un indirizzo email.&quot;&quot;&quot;\n    r = requests.get(\n        f&quot;{BASE}/email-verifier&quot;,\n        params={&quot;email&quot;: email, &quot;api_key&quot;: API_KEY},\n        timeout=15,\n    )\n    r.raise_for_status()\n    return r.json().get(&quot;data&quot;, {})\n\n\ndef formato_dominio(dominio: str) -&gt; dict | None:\n    &quot;&quot;&quot;Recupera il formato email usato da un&#39;azienda.&quot;&quot;&quot;\n    r = requests.get(\n        f&quot;{BASE}/domain-search&quot;,\n        params={&quot;domain&quot;: dominio, &quot;api_key&quot;: API_KEY, &quot;limit&quot;: 5},\n        timeout=15,\n    )\n    r.raise_for_status()\n    dati = r.json().get(&quot;data&quot;, {})\n    return dati\n\n\nif __name__ == &quot;__main__&quot;:\n    if not API_KEY:\n        print(&quot;⚠ Imposta HUNTER_API_KEY&quot;); exit(1)\n\n    print(&quot;1) Verifica email  2) Trova formato dominio&quot;)\n    scelta = input(&quot;Scelta: &quot;)\n\n    if scelta == &quot;1&quot;:\n        email = input(&quot;Email da verificare: &quot;).strip()\n        dati = verifica(email)\n        stato = dati.get(&quot;result&quot;, &quot;N/A&quot;)\n        punteggio = dati.get(&quot;score&quot;, &quot;N/A&quot;)\n        print(f&quot;\\n  Email:     {email}&quot;)\n        print(f&quot;  Stato:     {stato}&quot;)      # deliverable / undeliverable / risky\n        print(f&quot;  Punteggio: {punteggio}/100&quot;)\n    elif scelta == &quot;2&quot;:\n        dominio = input(&quot;Dominio (es. example.it): &quot;).strip()\n        dati = formato_dominio(dominio)\n        pattern = dati.get(&quot;pattern&quot;, &quot;non trovato&quot;)\n        email_trovate = [e[&quot;value&quot;] for e in dati.get(&quot;emails&quot;, [])]\n        print(f&quot;\\n  Dominio:  {dominio}&quot;)\n        print(f&quot;  Formato:  {pattern}&quot;)\n        print(f&quot;  Email:    {&#39;, &#39;.join(email_trovate[:5])}&quot;)</code></pre>\n<hr />\n<h2 id=\"tabella-degli-strumenti-della-lezione\">Tabella degli strumenti\ndella lezione</h2>\n<table>\n<colgroup>\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Strumento</th>\n<th>Tipo</th>\n<th>Uso</th>\n<th>Gratuito?</th>\n<th>Link</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>WhatsMyName</strong></td>\n<td>Web / CLI</td>\n<td>Ricerca username su 600+ siti</td>\n<td>Sì</td>\n<td>https://whatsmyname.app</td>\n</tr>\n<tr>\n<td><strong>Maigret</strong></td>\n<td>CLI / Python</td>\n<td>Ricerca username con pivot, 2.500+ siti</td>\n<td>Sì</td>\n<td>https://github.com/soxoj/maigret</td>\n</tr>\n<tr>\n<td><strong>BlackBird</strong></td>\n<td>CLI + Web</td>\n<td>Ricerca username ed e-mail</td>\n<td>Sì</td>\n<td>https://github.com/p1ngul1n0/blackbird</td>\n</tr>\n<tr>\n<td><strong>Sherlock</strong></td>\n<td>CLI</td>\n<td>Ricerca username su ~400 siti</td>\n<td>Sì</td>\n<td>https://github.com/sherlock-project/sherlock</td>\n</tr>\n<tr>\n<td><strong>PIPL</strong></td>\n<td>API commerciale</td>\n<td>Ricerca persone (mercato USA)</td>\n<td>No</td>\n<td>https://pipl.com</td>\n</tr>\n<tr>\n<td><strong>Hunter.io</strong></td>\n<td>Web / API</td>\n<td>Formato email aziendale, verifica</td>\n<td>Parziale</td>\n<td>https://hunter.io</td>\n</tr>\n<tr>\n<td><strong>Phonebook.cz</strong></td>\n<td>Web</td>\n<td>Email da dominio</td>\n<td>Sì</td>\n<td>https://phonebook.cz</td>\n</tr>\n<tr>\n<td><strong>HIBP</strong></td>\n<td>Web / API</td>\n<td>Verifica email in data breach</td>\n<td>Sì</td>\n<td>https://haveibeenpwned.com</td>\n</tr>\n<tr>\n<td><strong>OSINT Industries</strong></td>\n<td>Web</td>\n<td>Pivot su email, telefono, username</td>\n<td>Parziale</td>\n<td>https://osint.industries</td>\n</tr>\n<tr>\n<td><strong>Gravatar</strong></td>\n<td>Web</td>\n<td>Verifica se email ha un avatar</td>\n<td>Sì</td>\n<td>https://gravatar.com</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2 id=\"box-legale-ed-etico\">⚖️ Box legale ed etico</h2>\n<h3 id=\"username-e-gdpr-attenzione-alla-pseudonimizzazione\">Username e\nGDPR: attenzione alla “pseudonimizzazione”</h3>\n<p>Un username è un <strong>dato pseudonimo</strong>: non rivela\ndirettamente l’identità, ma può essere ricondotto a una persona fisica\nattraverso il processo di ricognizione OSINT. Se sei in grado di\ncollegare un username a una persona reale, stai trattando un\n<strong>dato personale</strong> e si applica il GDPR.</p>\n<p>Questo significa che: - La raccolta e il collegamento sono leciti\nsolo con una base giuridica valida. - I dati devono essere usati solo\nper lo scopo per cui sono stati raccolti. - Vanno cancellati quando non\nsono più necessari.</p>\n<h3 id=\"strumenti-di-ricerca-username-e-tos-delle-piattaforme\">Strumenti\ndi ricerca username e ToS delle piattaforme</h3>\n<p>Molte piattaforme (Instagram, Twitter/X, TikTok) vietano\nesplicitamente nei loro ToS la raccolta automatizzata di dati, inclusa\nla semplice verifica dell’esistenza di un profilo tramite richieste HTTP\nautomatiche. WhatsMyName, Maigret e BlackBird effettuano queste\nrichieste.</p>\n<p>La violazione dei ToS è generalmente una questione\n<strong>contrattuale</strong> (si rischia il ban), non penale. Tuttavia,\nla raccolta automatizzata massiva di dati potrebbe anche avere rilievo\nai sensi dell’art. 167-ter del Codice Privacy (acquisizione fraudolenta\ndi dati su larga scala). Usa questi strumenti con moderazione e solo\nquando necessario per l’indagine.</p>\n<h3 id=\"il-doxxing-il-confine-che-non-va-mai-superato\">Il doxxing: il\nconfine che non va mai superato</h3>\n<p><strong>Doxxing</strong> è la pratica di pubblicare dati personali di\nuna persona (indirizzo, telefono, email, luogo di lavoro, foto, ecc.)\ncon l’intento di esporla a molestie, minacce o danni. È eticamente\ninaccettabile e in Italia può configurare:</p>\n<ul>\n<li>Trattamento illecito di dati personali (art. 167 Codice\nPrivacy).</li>\n<li>Stalking (art. 612-bis c.p.) se le pubblicazioni sono reiterate e\ncausano danno.</li>\n<li>Diffamazione (art. 595 c.p.) se i dati sono accompagnati da\naffermazioni false.</li>\n</ul>\n<p>Un analista OSINT <strong>non fa mai doxxing</strong>, neanche quando\nil soggetto dell’indagine ha commesso azioni deplorevoli. Il principio\netico è: l’analista consegna il report al committente, non pubblica dati\npersonali online.</p>\n<hr />\n<h2 id=\"caso-di-studio-il-troll-con-un-nickname\">Caso di studio: “Il\ntroll con un nickname”</h2>\n<blockquote>\n<p><em>Nomi e dettagli fittizi.</em></p>\n</blockquote>\n<p><strong>Scenario.</strong> Un’associazione culturale riceve per tre\nsettimane messaggi anonimi di minaccia attraverso il modulo di contatto\ndel sito. Il mittente usa ogni volta un indirizzo email diverso, ma\nfirma sempre con lo stesso nickname: <strong>“il_corvo_73”</strong>.</p>\n<p><strong>Requisito.</strong> Chi si cela dietro “il_corvo_73”?</p>\n<p><strong>Pianificazione – EEI:</strong> 1. Il nickname “il_corvo_73”\nesiste su altre piattaforme? 2. È collegato a una persona reale\nidentificabile? 3. Esistono varianti del nickname? 4. Si possono\nricavare ipotesi di email?</p>\n<p><strong>Raccolta – Step 1: Dork Google</strong></p>\n<pre><code>&quot;il_corvo_73&quot; OR &quot;ilcorvo73&quot; OR &quot;il.corvo.73&quot;</code></pre>\n<p>Trovato: un account su un forum di fotografia (3 anni fa) e un\nvecchio post su Facebook (ora cancellato, ma visibile su Wayback\nMachine).</p>\n<p><strong>Raccolta – Step 2: WhatsMyName</strong></p>\n<p>Username <code>il_corvo_73</code>: trovato su\n<strong>Reddit</strong>, <strong>Discord</strong> (nome server non\ntracciabile), <strong>Flickr</strong>.</p>\n<p><strong>Raccolta – Step 3: Maigret</strong></p>\n<pre class=\"bash\"><code>maigret il_corvo_73 --html --with-related</code></pre>\n<p>Trovati: Reddit, Flickr, forum di fotografia (conferma), e un profilo\nsu <strong>500px</strong> con nome <code>Il Corvo</code> e bio:\n<em>“Appassionato di fotografia, Torino”</em>.</p>\n<p>Sul profilo 500px ci sono 47 foto. Guardandole: alcune mostrano\nedifici riconoscibili di Torino, una mostra una targa di un’auto in\nsecondo piano (parzialmente leggibile), un’altra include una riflessione\nin una vetrina che mostra la silhouette del fotografo con una giacca\nrossa caratteristica.</p>\n<p><strong>Raccolta – Step 4: Varianti e email</strong></p>\n<p>Il numero 73 è probabile anno di nascita (persona di ~50 anni,\ncoerente con lo stile di scrittura). Variante cercata:\n<code>il_corvo_1973</code>, <code>corvo73</code> → nessun risultato\nrilevante.</p>\n<p>Email ipotizzate:</p>\n<pre><code>ilcorvo73@gmail.com\nil.corvo.73@gmail.com\nilcorvo73@libero.it\nilcorvo73@hotmail.it</code></pre>\n<p>Verifica su HIBP: - <code>ilcorvo73@libero.it</code> → compare nel\ndata breach di un forum fotografico del 2019.</p>\n<p><strong>Analisi.</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Indizio</th>\n<th>Classificazione</th>\n<th>Inferenza</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Nickname uguale su forum foto e 500px</td>\n<td>B2</td>\n<td>Alta probabilità che sia la stessa persona</td>\n</tr>\n<tr>\n<td>Bio “Torino” su 500px</td>\n<td>C2</td>\n<td>Soggetto probabilmente residente a Torino</td>\n</tr>\n<tr>\n<td>Foto di Torino geolocalizzabili</td>\n<td>B2</td>\n<td>Conferma la presenza a Torino</td>\n</tr>\n<tr>\n<td>Email su HIBP (forum foto, stessa passione)</td>\n<td>C3</td>\n<td>Username e email probabilmente collegati</td>\n</tr>\n<tr>\n<td>Anno “73” nella bio</td>\n<td>F3</td>\n<td>Possibile anno di nascita 1973</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Conclusioni nel report.</strong></p>\n<blockquote>\n<p>“È <strong>probabile</strong> (confidenza <strong>media</strong>) che\nil nickname ‘il_corvo_73’ appartenga a una persona residente a Torino,\nappassionata di fotografia, nata probabilmente nel 1973. La ricognizione\nha identificato profili attivi su Reddit, 500px e un forum fotografico,\ncon contenuti coerenti tra loro. Non è stato possibile identificare il\nnome reale con la documentazione disponibile. Si <strong>raccomanda di\npresentare i dati raccolti alle autorità competenti</strong> (Polizia\nPostale) che, con le opportune autorizzazioni giudiziarie, potranno\nrichiedere alle piattaforme i dati identificativi degli utenti. Nessuna\ninformazione è stata pubblicata o condivisa al di fuori di questo\nreport.”</p>\n</blockquote>\n<p><strong>Lezioni apprese:</strong> - Il nickname era lo stesso su più\npiattaforme: il pivot ha funzionato. - Maigret con\n<code>--with-related</code> ha trovato il profilo 500px che gli altri\nstrumenti non avevano trovato. - Il report non contiene accuse né dati\npersonali definitivi: rimanda alle autorità. - La verifica su HIBP ha\nconfermato l’email ipotizzata senza bisogno di contattare il\nsoggetto.</p>\n<hr />\n<h2 id=\"esercizi-pratici\">Esercizi pratici</h2>\n<blockquote>\n<p>Esegui gli esercizi solo su te stesso, su personaggi pubblici, o in\ncontesti didattici con dati fittizi.</p>\n</blockquote>\n<p><strong>Esercizio 1 – Analizza il tuo username (30 min)</strong>\nPrendi il tuo username principale. Classifica il tipo (nome+cognome?\npseudonimo? + numero?). Quali informazioni rivela a chi non ti conosce?\nEsegui una ricerca con WhatsMyName e conta su quante piattaforme\nappare.</p>\n<p><strong>Esercizio 2 – Dork per username (20 min)</strong> Scegli un\npersonaggio pubblico italiano che ha un nickname riconoscibile (es. uno\nstreamer, un giornalista con username pubblico). Costruisci e documenta\nalmeno 5 dork diversi su Google e Bing per quel nickname.</p>\n<p><strong>Esercizio 3 – WhatsMyName vs Maigret (45 min)</strong> Scegli\nun username pubblico noto. Esegui la ricerca con WhatsMyName\n(interfaccia web) e con Maigret (riga di comando). Confronta i\nrisultati: quanti siti trova ciascuno? Ci sono profili trovati solo da\nuno dei due strumenti?</p>\n<p><strong>Esercizio 4 – Genera varianti (20 min)</strong> Dato\nl’username <code>tech_guru_milano</code>, genera tutte le varianti\nprobabili (con underscore, punto, senza separatore, con/senza numero).\nPoi cerca ciascuna variante su WhatsMyName. Documenta il processo.</p>\n<p><strong>Esercizio 5 – Generatore di email (30 min)</strong> Usa lo\nscript <code>email_generator.py</code> con il nome “Mario Rossi” e il\ndominio “comune.milano.it”. Cerca ognuna delle email generate su HIBP\n(manualmente, senza automatizzare). Documenta i risultati.</p>\n<p><strong>Esercizio 6 – Gravatar check (15 min)</strong> Calcola l’hash\nMD5 di tre indirizzi email (reali tuoi o di test). Controlla se esistono\navatar Gravatar associati. Cosa ti dice la presenza o assenza di un\nGravatar?</p>\n<hr />\n","quiz":[{"q":"Perché gli username sono selettori OSINT così potenti?","opts":{"a":"Perché sono sempre il nome reale della persona","b":"Perché la maggior parte delle persone riusa lo stesso nickname su più piattaforme","c":"Perché non possono essere modificati","d":"Perché contengono sempre l'anno di nascita"},"correct":"b","why":"La maggior parte delle persone riusa lo stesso nickname su più piattaforme, creando un filo che collega i profili"},{"q":"Quale strumento tra i seguenti ha il database di siti più ampio per la ricerca di username?","opts":{"a":"WhatsMyName","b":"BlackBird","c":"Maigret","d":"Sherlock"},"correct":"c","why":"Maigret controlla oltre 2.500 siti, contro i circa 600 di WhatsMyName e i circa 400 di Sherlock"},{"q":"Cosa significa un risultato \"Claimed\" in Maigret?","opts":{"a":"Il profilo esiste con certezza","b":"Il profilo non esiste","c":"La risposta del sito è ambigua (possibile falso positivo)","d":"Il sito ha bloccato la richiesta"},"correct":"c","why":"\"Claimed\" indica una risposta ambigua del sito: è un possibile falso positivo da verificare a mano"},{"q":"BlackBird si distingue dagli altri strumenti principalmente perché:","opts":{"a":"Supporta 2.500 siti","b":"Permette la ricerca anche per indirizzo e-mail","c":"Ha un'interfaccia a linea di comando più semplice","d":"Non richiede connessione a Internet"},"correct":"b","why":"BlackBird permette di cercare anche per indirizzo e-mail, non solo per username"},{"q":"Quale degli atti seguenti è illegale in Italia?","opts":{"a":"Cercare un username su WhatsMyName","b":"Verificare se un'email compare in HIBP","c":"Usare credenziali trovate in un data breach per accedere a un account altrui","d":"Generare ipotesi di email con un generatore Python"},"correct":"c","why":"Usare credenziali di un data breach per entrare in un account altrui è accesso abusivo (art. 615-ter c.p.)"},{"q":"Il \"doxxing\" è:","opts":{"a":"Una tecnica avanzata di ricerca su Google","b":"La pubblicazione di dati personali altrui con intento di esposizione","c":"Un tipo di dork per trovare username","d":"Un metodo per verificare l'esistenza di un'email"},"correct":"b","why":"Il doxxing è la pubblicazione di dati personali altrui con l'intento di esporre o colpire la persona"},{"q":"PIPL è uno strumento utile principalmente per ricerche su:","opts":{"a":"Profili italiani nel Registro delle Imprese","b":"Soggetti nordamericani e anglofoni","c":"Dispositivi IoT connessi a Internet","d":"Indirizzi IP italiani"},"correct":"b","why":"PIPL ha la copertura migliore su soggetti nordamericani e anglofoni"},{"q":"Per verificare se un'email esiste senza inviare messaggi, quale metodo è corretto?","opts":{"a":"Inviarle un messaggio con ricevuta di ritorno","b":"Contattare il gestore del dominio","c":"Controllare su HIBP, Holehe o tramite il suo hash MD5 su Gravatar","d":"Eseguire una scansione Shodan del server mail"},"correct":"c","why":"HIBP, Holehe e l'hash MD5 su Gravatar permettono una verifica passiva, senza contattare il soggetto"},{"q":"Quale operatore Google è utile per trovare la menzione di un username su paste site?","opts":{"a":"filetype:txt","b":"site:pastebin.com \"username\"","c":"inurl:user username","d":"intitle:username"},"correct":"b","why":"site:pastebin.com \"username\" cerca le menzioni dell'username su Pastebin"},{"q":"Il numero alla fine di un username (es. mario87) è:","opts":{"a":"Sempre l'anno di nascita","b":"Sempre irrilevante","c":"Un'inferenza probabilistica che va trattata come ipotesi da verificare","d":"Il codice paese"},"correct":"c","why":"Il numero può essere l'anno di nascita, ma è solo un'inferenza: va trattato come ipotesi da verificare"}]},{"title":"E-mail e Profili Associati","html":"<h1\nid=\"lezione-5-tecniche-di-ricerca-e-mail-e-profili-associati\">Lezione 5\n– Tecniche di Ricerca E-mail e Profili Associati</h1>\n<blockquote>\n<p><em>“L’indirizzo e-mail è la chiave universale dell’identità\ndigitale. Quasi tutto il resto si registra con un’email.”</em> —\ncomunità OSINT</p>\n</blockquote>\n<hr />\n<h2 id=\"obiettivi-di-apprendimento\">Obiettivi di apprendimento</h2>\n<p>Al termine di questa lezione sarai in grado di:</p>\n<ol type=\"1\">\n<li>comprendere la struttura tecnica di un indirizzo e-mail e le\ninformazioni che contiene;</li>\n<li>leggere e interpretare gli <strong>header</strong> di un messaggio\ne-mail per ricavare informazioni sul mittente;</li>\n<li>usare <strong>Holehe</strong> e strumenti analoghi per identificare\ni profili social associati a un indirizzo;</li>\n<li>usare <strong>OSINT Industries</strong> per un pivot completo su\nemail, username e telefono;</li>\n<li>usare <strong>Postal / eMailTrackerPro</strong> (Jake Creeps) per\nl’analisi dei messaggi ricevuti;</li>\n<li>interrogare <strong>IntelX</strong> per trovare occorrenze di\nun’email in archivi di intelligence, paste e leak;</li>\n<li>usare <strong>LeakCheck</strong> per verificare la presenza di\nun’email in data breach con dettagli aggiuntivi;</li>\n<li>applicare un flusso di lavoro integrato per trasformare un’email in\nun profilo completo.</li>\n</ol>\n<hr />\n<h2 id=\"introduzione\">1. Introduzione</h2>\n<p>L’indirizzo e-mail è il <strong>selettore di identità digitale più\nuniversale</strong> esistente. Praticamente ogni account online — social\nnetwork, forum, e-commerce, servizi bancari, app mobile — richiede un\nindirizzo e-mail per la registrazione. Questo significa che:</p>\n<ul>\n<li>Un’email è l’unico dato che collega account su piattaforme diverse,\nanche se l’utente usa username differenti.</li>\n<li>Chi possiede un’email spesso la usa per anni o decenni, anche quando\ntutti i profili associati sono stati modificati.</li>\n<li>Un’email esposta in un data breach rivela quali servizi l’utente\nusa, spesso con la password (in chiaro o hashata), il nome reale, la\ndata di registrazione e talvolta il numero di telefono.</li>\n</ul>\n<p>In questa lezione vedremo come trasformare un indirizzo e-mail in un\nprofilo ricco di informazioni, seguendo un flusso metodico e rispettando\nil quadro legale.</p>\n<hr />\n<h2 id=\"cosè-un-indirizzo-e-mail-struttura-e-informazioni-nascoste\">2.\nCos’è un indirizzo e-mail: struttura e informazioni nascoste</h2>\n<h3 id=\"anatomia-dellindirizzo\">2.1 Anatomia dell’indirizzo</h3>\n<pre><code>  mario.rossi.1987+newsletter@gmail.com\n  │────────────────────────────────────┤\n  │              PARTE LOCALE          │ DOMINIO\n  │                                    │\n  mario.rossi.1987   +newsletter   @   gmail.com\n  └──────┬──────┘    └────┬────┘       └──┬──┘\n      username        sub-address      provider\n   (spesso nome       (filtro          (rivela il\n    e cognome)         Gmail)           servizio)</code></pre>\n<p><strong>Parte locale (prima della @):</strong> - Può contenere punti,\ntrattini, underscore, numeri. - In Gmail, i punti nella parte locale\nsono ignorati (<code>mario.rossi = mariorossi</code>). - Il\n<strong>sub-address</strong> (dopo il <code>+</code>) è ignorato dai\nserver ma visibile al mittente: <code>mario+spam@gmail.com</code> arriva\na <code>mario@gmail.com</code>. Se un’email contiene\n<code>+nomesito</code>, rivela dove è stata usata.</p>\n<p><strong>Dominio (dopo la @):</strong> - <strong>Provider\nconsumer</strong>: Gmail, Yahoo, Outlook, Libero, Virgilio, Tiscali,\nTin.it → uso personale. - <strong>Provider business</strong>: G\nSuite/Workspace, Microsoft 365 → uso aziendale ma con dominio generico.\n- <strong>Dominio personalizzato</strong>: <code>@nomeazienda.it</code>\n→ rivela l’organizzazione di appartenenza. - <strong>Provider di\nalias</strong>: SimpleLogin, AnonAddy, DuckDuckGo Email → l’utente\nprotegge l’email reale. - <strong>Provider temp/disposable</strong>:\nMailinator, Guerrilla Mail, 10MinuteMail → account usa-e-getta, spesso\nusati per spam o registrazioni false.</p>\n<h3 id=\"informazioni-deducibili-dallindirizzo\">2.2 Informazioni\ndeducibili dall’indirizzo</h3>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Elemento</th>\n<th>Esempio</th>\n<th>Informazione ricavabile</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Nome + cognome</td>\n<td><code>mario.rossi@</code></td>\n<td>Identità reale probabile</td>\n</tr>\n<tr>\n<td>Anno nella parte locale</td>\n<td><code>mario87@</code></td>\n<td>Anno di nascita probabile (1987)</td>\n</tr>\n<tr>\n<td>Sub-address</td>\n<td><code>mario+amazon@</code></td>\n<td>Servizio usato (Amazon)</td>\n</tr>\n<tr>\n<td>Dominio aziendale</td>\n<td><code>@comune.torino.it</code></td>\n<td>Organizzazione, settore, città</td>\n</tr>\n<tr>\n<td>Provider storico</td>\n<td><code>@tin.it</code>, <code>@iol.it</code></td>\n<td>Persona di una certa età (registrazioni anni ’90-2000)</td>\n</tr>\n<tr>\n<td>Provider russo</td>\n<td><code>@mail.ru</code>, <code>@yandex.ru</code></td>\n<td>Possibile connessione con il mercato russo</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"il-dominio-mx-verificare-che-il-server-esista\">2.3 Il dominio\nMX: verificare che il server esista</h3>\n<p>Prima di fare qualunque altra ricerca, verifica che il dominio\ndell’email abbia un <strong>record MX</strong> (Mail Exchanger) valido.\nUn’email su un dominio senza MX non può ricevere posta e probabilmente è\nfalsa o abbandonata.</p>\n<pre class=\"bash\"><code># Da terminale\ndig MX gmail.com\n# oppure\nnslookup -type=MX gmail.com</code></pre>\n<pre class=\"python\"><code># Con Python\nimport dns.resolver  # pip3 install dnspython\n\ndef ha_mx(dominio: str) -&gt; bool:\n    try:\n        dns.resolver.resolve(dominio, &quot;MX&quot;)\n        return True\n    except dns.resolver.NXDOMAIN:\n        return False\n    except dns.resolver.NoAnswer:\n        return False\n\nprint(ha_mx(&quot;gmail.com&quot;))    # True\nprint(ha_mx(&quot;dominio-falso-inesistente.xyz&quot;))  # False</code></pre>\n<h3 id=\"leggere-gli-header-e-mail\">2.4 Leggere gli header e-mail</h3>\n<p>Ogni messaggio e-mail contiene un blocco di <strong>header</strong>\n(intestazioni) che registrano il percorso del messaggio dai server di\nposta. Sono normalmente nascosti, ma accessibili da qualunque client\nmail.</p>\n<p><strong>Come visualizzare gli header:</strong> -\n<strong>Gmail</strong>: apri il messaggio → ⋮ (tre punti) → “Mostra\noriginale”. - <strong>Outlook web</strong>: apri il messaggio → File →\nProprietà → “Intestazioni Internet”. - <strong>Thunderbird</strong>:\nVisualizza → Sorgente messaggio (Ctrl+U).</p>\n<p><strong>Header principali e cosa rivelano:</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Header</th>\n<th>Esempio</th>\n<th>Informazione</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>From:</code></td>\n<td><code>From: Mario Rossi &lt;mario@example.it&gt;</code></td>\n<td>Mittente dichiarato (falsificabile)</td>\n</tr>\n<tr>\n<td><code>Reply-To:</code></td>\n<td><code>Reply-To: altro@example.it</code></td>\n<td>Indirizzo a cui rispondere (spesso diverso dal mittente)</td>\n</tr>\n<tr>\n<td><code>Return-Path:</code></td>\n<td><code>Return-Path: &lt;bounce@example.it&gt;</code></td>\n<td>Indirizzo per i rimbalzi (più difficile da falsificare)</td>\n</tr>\n<tr>\n<td><code>Received:</code></td>\n<td><code>Received: from mail.example.it (93.1.2.3)</code></td>\n<td>Server di inoltro (dal basso: più recente; dall’alto: più\nvecchio)</td>\n</tr>\n<tr>\n<td><code>X-Originating-IP:</code></td>\n<td><code>X-Originating-IP: 88.36.12.4</code></td>\n<td>IP del client originale (non sempre presente)</td>\n</tr>\n<tr>\n<td><code>X-Mailer:</code></td>\n<td><code>X-Mailer: Thunderbird 91.0</code></td>\n<td>Client mail usato</td>\n</tr>\n<tr>\n<td><code>Message-ID:</code></td>\n<td><code>&lt;abc123@mail.gmail.com&gt;</code></td>\n<td>ID unico del messaggio; il dominio rivela il server reale</td>\n</tr>\n<tr>\n<td><code>DKIM-Signature:</code></td>\n<td><code>d=example.it; s=google</code></td>\n<td>Firma digitale: se valida, il dominio è autentico</td>\n</tr>\n<tr>\n<td><code>SPF:</code> / <code>Received-SPF:</code></td>\n<td><code>pass</code> o <code>fail</code></td>\n<td>Verifica SPF: <code>fail</code> suggerisce spoofing</td>\n</tr>\n<tr>\n<td><code>X-Spam-Status:</code></td>\n<td><code>X-Spam-Status: Yes, score=8.2</code></td>\n<td>Punteggio spam del filtro del destinatario</td>\n</tr>\n</tbody>\n</table>\n<p><strong>L’IP originante:</strong> nei messaggi inviati da client\ndesktop (Thunderbird, Outlook), spesso l’IP del mittente è visibile nel\nprimo <code>Received:</code>. Nei servizi webmail moderni (Gmail,\nOutlook.com) l’IP dell’utente viene anonimizzato.</p>\n<pre><code>Received: from [88.36.12.4] (broadband-88-36-12-4.ip.italiaonline.it)\n        by mx.google.com with ESMTPSA</code></pre>\n<p>L’IP <code>88.36.12.4</code> appartiene a un utente su rete\nItaliaonline: geolocalizzandolo si ricava una città (con margine di\nerrore notevole: vedi Lezione 3).</p>\n<p><strong>Analisi automatica degli header:</strong> strumenti come\n<strong>MXToolbox Header Analyzer</strong>\n(https://mxtoolbox.com/EmailHeaders.aspx) e <strong>Google Admin Toolbox\n– Messageheader</strong>\n(https://toolbox.googleapps.com/apps/messageheader/) leggono e\nvisualizzano gli header in modo strutturato.</p>\n<hr />\n<h2 id=\"individuare-i-profili-associati-a-une-mail\">3. Individuare i\nprofili associati a un’e-mail</h2>\n<h3 id=\"il-meccanismo-signup-check\">3.1 Il meccanismo: “signup\ncheck”</h3>\n<p>La tecnica principale per trovare i profili associati a un’email si\nchiama <strong>signup check</strong> (o <em>registration check</em>): si\nverifica se l’indirizzo è già registrato su una piattaforma tentando una\nregistrazione o un recupero password.</p>\n<p><strong>Come funziona nella pratica:</strong> - Se inserisci un’email\nnella pagina “password dimenticata” di Twitter e il sistema risponde “Ti\nabbiamo inviato un’email di recupero”, l’email è registrata. - Se\nrisponde “Nessun account trovato”, l’email non è registrata (ma il sito\npotrebbe mentire per privacy). - Alcune piattaforme, nella fase di\nregistrazione, avvisano “Questa email è già in uso”: anche questo è un\nsegnale.</p>\n<p><strong>Limiti:</strong> - Molte piattaforme hanno aggiornato le loro\npolicy per non rivelare se un’email è registrata (anti-enumeration). -\nL’approccio manuale su centinaia di siti è impraticabile. - Gli\nstrumenti automatici fanno questo lavoro in modo sistematico.</p>\n<h3 id=\"holehe\">3.2 Holehe</h3>\n<p><strong>Holehe</strong> è lo strumento open source più diffuso per il\nsignup check. Verifica se un’email è registrata su oltre <strong>120\nsiti</strong> sfruttando le funzionalità di recupero password o le\nAPI.</p>\n<p><strong>Repository:</strong> https://github.com/megadose/holehe</p>\n<p><strong>Installazione:</strong></p>\n<pre class=\"bash\"><code>pip3 install holehe</code></pre>\n<p><strong>Utilizzo base:</strong></p>\n<pre class=\"bash\"><code># Ricerca su tutti i siti supportati\nholehe mario.rossi@gmail.com\n\n# Solo i siti dove l&#39;email è trovata\nholehe mario.rossi@gmail.com | grep &quot;used&quot;\n\n# Salva i risultati in CSV\nholehe mario.rossi@gmail.com --csv</code></pre>\n<p><strong>Output tipico:</strong></p>\n<pre><code>[+] twitter.com        [used]\n[+] instagram.com      [used]\n[-] facebook.com       [not used]\n[+] adobe.com          [used]\n[?] github.com         [rate_limited]\n[-] spotify.com        [not used]</code></pre>\n<p><strong>Script Python per Holehe:</strong></p>\n<pre class=\"python\"><code>#!/usr/bin/env python3\n&quot;&quot;&quot;\nholehe_launcher.py – Avvia Holehe e salva i risultati strutturati.\nRichiede: pip3 install holehe\n&quot;&quot;&quot;\nimport subprocess\nimport sys\nimport json\nimport re\nfrom datetime import datetime, timezone\nfrom pathlib import Path\n\n\ndef lancia_holehe(email: str, cartella: str = &quot;.&quot;) -&gt; list[dict]:\n    &quot;&quot;&quot;Esegue Holehe e restituisce i risultati come lista di dizionari.&quot;&quot;&quot;\n    Path(cartella).mkdir(parents=True, exist_ok=True)\n    ts = datetime.now(timezone.utc).strftime(&quot;%Y%m%d_%H%M%S&quot;)\n    file_out = f&quot;{cartella}/holehe_{ts}.txt&quot;\n\n    cmd = [sys.executable, &quot;-m&quot;, &quot;holehe&quot;, email, &quot;--no-color&quot;]\n    print(f&quot;🔍 Ricerca Holehe per: {email}\\n&quot;)\n\n    try:\n        risultato = subprocess.run(\n            cmd, capture_output=True, text=True, timeout=180\n        )\n        output = risultato.stdout\n    except subprocess.TimeoutExpired:\n        print(&quot;⚠ Timeout scaduto.&quot;); return []\n\n    # Salva l&#39;output grezzo\n    with open(file_out, &quot;w&quot;, encoding=&quot;utf-8&quot;) as f:\n        f.write(output)\n\n    # Parsa i risultati\n    trovati = []\n    for riga in output.splitlines():\n        if &quot;[used]&quot; in riga:\n            sito = re.search(r&quot;\\] (.+?) \\[&quot;, riga)\n            if sito:\n                trovati.append({&quot;sito&quot;: sito.group(1).strip(), &quot;stato&quot;: &quot;found&quot;})\n        elif &quot;[not used]&quot; in riga:\n            pass  # non interessa per il report\n        elif &quot;[rate_limited]&quot; in riga or &quot;[error]&quot; in riga:\n            sito = re.search(r&quot;\\] (.+?) \\[&quot;, riga)\n            if sito:\n                trovati.append({&quot;sito&quot;: sito.group(1).strip(), &quot;stato&quot;: &quot;uncertain&quot;})\n\n    print(f&quot;✔ Trovata su {len([t for t in trovati if t[&#39;stato&#39;]==&#39;found&#39;])} siti.&quot;)\n    print(f&quot;   Output grezzo: {file_out}&quot;)\n    return trovati\n\n\nif __name__ == &quot;__main__&quot;:\n    email = input(&quot;Email da analizzare: &quot;).strip()\n    risultati = lancia_holehe(email)\n\n    print(&quot;\\n📊 Profili trovati:&quot;)\n    for r in risultati:\n        icona = &quot;✔&quot; if r[&quot;stato&quot;] == &quot;found&quot; else &quot;?&quot;\n        print(f&quot;  {icona} {r[&#39;sito&#39;]}&quot;)</code></pre>\n<h3 id=\"altre-tecniche-di-signup-check\">3.3 Altre tecniche di signup\ncheck</h3>\n<p><strong>Gravatar (già visto nella Lezione 4):</strong></p>\n<pre><code>https://www.gravatar.com/avatar/&lt;MD5_HASH&gt;?d=404</code></pre>\n<p>Se risponde con un’immagine (non 404), l’email ha un account\nGravatar.</p>\n<p><strong>Google Account check:</strong> Nella pagina di login di\nGoogle (https://accounts.google.com), il campo “Email o numero di\ntelefono” risponde diversamente per email esistenti e non esistenti su\nGmail. Attenzione: Google introduce spesso CAPTCHA su questo\nendpoint.</p>\n<p><strong>Recupero password manuale su piattaforme chiave:</strong> Per\npiattaforme ad alto valore investigativo (LinkedIn, Facebook, Twitter),\nesegui il check manuale dal browser, documentando la risposta con uno\nscreenshot.</p>\n<hr />\n<h2 id=\"osint-industries\">4. OSINT Industries</h2>\n<h3 id=\"cosè-osint-industries\">4.1 Cos’è OSINT Industries</h3>\n<p><strong>OSINT Industries</strong> (https://osint.industries) è una\npiattaforma web commerciale di pivot OSINT. Permette di cercare: -\n<strong>Indirizzi e-mail</strong> - <strong>Username</strong> -\n<strong>Numeri di telefono</strong></p>\n<p>e restituisce in modo aggregato e visuale i profili trovati su decine\ndi piattaforme, con informazioni estratte direttamente (nome, avatar,\nbio, data di registrazione, attività).</p>\n<p>È considerata uno degli strumenti più completi e aggiornati per\nquesto tipo di ricerca, ed è usata da investigatori professionali, team\ndi sicurezza e giornalisti.</p>\n<h3 id=\"funzionalità-principali\">4.2 Funzionalità principali</h3>\n<p><strong>Ricerca per email:</strong> - Signup check su oltre 200\npiattaforme. - Estrazione del profilo (nome, foto, bio, link). - Mappa\ndelle relazioni tra account. - Timeline dell’attività. - Export in JSON\ne PDF.</p>\n<p><strong>Ricerca per telefono:</strong> - Identificazione del gestore\n(carrier lookup). - Profili WhatsApp, Telegram, Viber associati. -\nReverse lookup.</p>\n<p><strong>Ricerca per username:</strong> - Simile a Maigret/BlackBird\nma con un’interfaccia più curata. - Pivot automatici verso email e\ntelefono.</p>\n<h3 id=\"piano-gratuito-vs.-piano-a-pagamento\">4.3 Piano gratuito\nvs. piano a pagamento</h3>\n<p>OSINT Industries offre un piano gratuito limitato (poche ricerche al\ngiorno) e piani a pagamento mensili. Per uso professionale è necessario\nil piano a pagamento.</p>\n<blockquote>\n<p>Per uso didattico, usa il piano gratuito limitando le ricerche a\nemail di test o a profili pubblici di persone che hai il consenso di\nanalizzare.</p>\n</blockquote>\n<h3 id=\"come-usare-osint-industries-nel-flusso-di-lavoro\">4.4 Come usare\nOSINT Industries nel flusso di lavoro</h3>\n<ol type=\"1\">\n<li>Vai su https://osint.industries.</li>\n<li>Inserisci l’email target nel campo di ricerca.</li>\n<li>Attendi il completamento (può richiedere 1-2 minuti per le ricerche\npiù approfondite).</li>\n<li>Analizza i risultati per categoria: social, shopping, servizi,\nprofessionale.</li>\n<li>Esporta il report in JSON per ulteriore elaborazione.</li>\n<li>Per ogni profilo trovato, verifica <strong>manualmente</strong> il\nlink: OSINT Industries può avere falsi positivi.</li>\n</ol>\n<h3\nid=\"integrazione-python-con-il-risultato-json-di-osint-industries\">4.5\nIntegrazione Python con il risultato JSON di OSINT Industries</h3>\n<pre class=\"python\"><code>#!/usr/bin/env python3\n&quot;&quot;&quot;\nosint_industries_parser.py – Analizza l&#39;export JSON di OSINT Industries.\nRichiede il file JSON esportato dalla piattaforma.\n&quot;&quot;&quot;\nimport json\nimport sys\nfrom pathlib import Path\n\n\ndef carica(percorso: str) -&gt; dict:\n    with open(percorso, encoding=&quot;utf-8&quot;) as f:\n        return json.load(f)\n\n\ndef stampa_riepilogo(dati: dict) -&gt; None:\n    &quot;&quot;&quot;Stampa un riepilogo strutturato dei profili trovati.&quot;&quot;&quot;\n    target = dati.get(&quot;query&quot;, &quot;N/A&quot;)\n    risultati = dati.get(&quot;results&quot;, [])\n\n    print(f&quot;\\n=== OSINT Industries – Riepilogo ===&quot;)\n    print(f&quot;Target: {target}&quot;)\n    print(f&quot;Profili trovati: {len(risultati)}\\n&quot;)\n\n    # Raggruppa per categoria\n    per_categoria: dict[str, list] = {}\n    for r in risultati:\n        cat = r.get(&quot;category&quot;, &quot;altro&quot;)\n        per_categoria.setdefault(cat, []).append(r)\n\n    for cat, profili in sorted(per_categoria.items()):\n        print(f&quot;📂 {cat.upper()} ({len(profili)})&quot;)\n        for p in profili:\n            nome_sito = p.get(&quot;site&quot;, &quot;N/A&quot;)\n            url = p.get(&quot;url&quot;, &quot;&quot;)\n            nome = p.get(&quot;name&quot;, &quot;&quot;)\n            bio = p.get(&quot;bio&quot;, &quot;&quot;)[:60] if p.get(&quot;bio&quot;) else &quot;&quot;\n            print(f&quot;  ✔ {nome_sito:&lt;25} {nome:&lt;20} {bio}&quot;)\n            if url:\n                print(f&quot;      {url}&quot;)\n        print()\n\n\ndef esporta_csv(dati: dict, output: str) -&gt; None:\n    &quot;&quot;&quot;Esporta i risultati in CSV.&quot;&quot;&quot;\n    import csv\n    risultati = dati.get(&quot;results&quot;, [])\n    campi = [&quot;site&quot;, &quot;category&quot;, &quot;url&quot;, &quot;name&quot;, &quot;bio&quot;, &quot;followers&quot;]\n    with open(output, &quot;w&quot;, newline=&quot;&quot;, encoding=&quot;utf-8&quot;) as f:\n        writer = csv.DictWriter(f, fieldnames=campi, extrasaction=&quot;ignore&quot;)\n        writer.writeheader()\n        writer.writerows(risultati)\n    print(f&quot;✔ CSV salvato: {output}&quot;)\n\n\nif __name__ == &quot;__main__&quot;:\n    if len(sys.argv) &lt; 2:\n        print(&quot;Uso: python3 osint_industries_parser.py risultati.json&quot;)\n        exit(1)\n    dati = carica(sys.argv[1])\n    stampa_riepilogo(dati)\n    esporta_csv(dati, sys.argv[1].replace(&quot;.json&quot;, &quot;.csv&quot;))</code></pre>\n<hr />\n<h2 id=\"postal-jake-creeps\">5. Postal (Jake Creeps)</h2>\n<h3 id=\"cosè-postal\">5.1 Cos’è Postal</h3>\n<p><strong>Postal</strong> è uno strumento web creato da <strong>Jake\nCreps</strong> (investigatore OSINT americano) per l’analisi dei\nmessaggi e-mail ricevuti. Si trova su:</p>\n<p><strong>https://app.jakepowers.io/postal/</strong> (o varianti; l’URL\npuò cambiare: cerca “Jake Creeps OSINT tools”).</p>\n<p>L’idea è semplice: incolla l’intero contenuto grezzo di un messaggio\ne-mail (inclusi gli header) e Postal lo analizza automaticamente,\nestraendo:</p>\n<ul>\n<li>IP del mittente originale (dal campo <code>Received:</code>).</li>\n<li>Geolocalizzazione dell’IP.</li>\n<li>Verifica SPF, DKIM, DMARC.</li>\n<li>Analisi del dominio mittente (WHOIS, MX record).</li>\n<li>Link presenti nel corpo del messaggio (con analisi della\ndestinazione).</li>\n<li>Allegati e loro hash.</li>\n</ul>\n<h3 id=\"uso-pratico\">5.2 Uso pratico</h3>\n<ol type=\"1\">\n<li>Apri il messaggio sospetto nel tuo client.</li>\n<li>Visualizza il sorgente completo (come descritto in §2.4).</li>\n<li>Copia tutto il testo (header + corpo).</li>\n<li>Incollalo nella casella di Postal.</li>\n<li>Clicca su Analyze.</li>\n</ol>\n<p><strong>Cosa cercare nei risultati:</strong></p>\n<ul>\n<li><strong>IP originante:</strong> se un’email che dice di venire da\nuna banca italiana ha come IP originante un server in Russia, è quasi\ncertamente phishing.</li>\n<li><strong>SPF fail / DKIM invalid:</strong> segnali di spoofing del\nmittente.</li>\n<li><strong>Link nascosti:</strong> Postal mostra il dominio reale di un\nlink anche se il testo mostra qualcosa di diverso.</li>\n<li><strong>Message-ID:</strong> il dominio nel Message-ID rivela il\nvero server di invio.</li>\n</ul>\n<h3 id=\"strumenti-analoghi\">5.3 Strumenti analoghi</h3>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Strumento</th>\n<th>URL</th>\n<th>Funzione</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>MXToolbox Header Analyzer</td>\n<td>https://mxtoolbox.com/EmailHeaders.aspx</td>\n<td>Analisi degli header e-mail</td>\n</tr>\n<tr>\n<td>Google Messageheader</td>\n<td>https://toolbox.googleapps.com/apps/messageheader/</td>\n<td>Parsing e visualizzazione degli header</td>\n</tr>\n<tr>\n<td>Mail-Tester</td>\n<td>https://www.mail-tester.com</td>\n<td>Test di spam score e autenticazione</td>\n</tr>\n<tr>\n<td>EmailRep</td>\n<td>https://emailrep.io</td>\n<td>Reputazione di un indirizzo email</td>\n</tr>\n<tr>\n<td>Epieos</td>\n<td>https://epieos.com</td>\n<td>Signup check + Google account info</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"epieos-un-caso-speciale\">5.4 Epieos: un caso speciale</h3>\n<p><strong>Epieos</strong> (https://epieos.com) merita una menzione\nseparata. Oltre al signup check, è in grado di recuperare informazioni\ndall’account Google associato a un indirizzo Gmail, sfruttando endpoint\nnon documentati di Google:</p>\n<ul>\n<li><strong>Nome e cognome</strong> visualizzato nell’account\nGoogle.</li>\n<li><strong>Foto del profilo</strong> Google.</li>\n<li><strong>Calendario Google</strong> (se pubblico).</li>\n<li><strong>Google Maps</strong> (recensioni e contributi\npubblici).</li>\n</ul>\n<blockquote>\n<p><strong>Attenzione:</strong> alcune funzioni di Epieos sfruttano\nendpoint non ufficiali di Google che possono essere chiusi in qualsiasi\nmomento. I risultati vanno verificati. L’uso massivo può portare al\nblocco dell’IP.</p>\n</blockquote>\n<hr />\n<h2 id=\"servizi-di-ricerca-e-violazione-dei-dati\">6. Servizi di ricerca\ne violazione dei dati</h2>\n<h3 id=\"cosa-sono-i-data-breach-e-perché-sono-rilevanti\">6.1 Cosa sono i\n“data breach” e perché sono rilevanti</h3>\n<p>Un <strong>data breach</strong> (violazione dei dati) si verifica\nquando dati di utenti vengono rubati da un’organizzazione e poi diffusi\nonline, spesso nei forum del dark web o su paste site. Questi database\npossono contenere:</p>\n<ul>\n<li>Indirizzi e-mail.</li>\n<li>Password (in chiaro o in formato hashato: MD5, SHA-1, bcrypt…).</li>\n<li>Nomi e cognomi.</li>\n<li>Date di nascita.</li>\n<li>Indirizzi fisici.</li>\n<li>Numeri di telefono.</li>\n<li>Dati di pagamento (più raramente).</li>\n</ul>\n<p>Per l’analista OSINT, i data breach sono una fonte di informazioni\nsu: - <strong>Quali servizi</strong> usa una persona (se l’email compare\nnel breach di un sito di dating, sappiamo che è iscritta lì). -\n<strong>Password usate in passato</strong> → possono rivelare pattern\n(nome del figlio + anno di nascita) utili per capire il soggetto. -\n<strong>Username usati su altri siti</strong> al momento della\nregistrazione. - <strong>Dati aggiuntivi</strong> registrati al momento\ndell’iscrizione.</p>\n<blockquote>\n<p><strong>Principio fondamentale:</strong> i dati dei breach possono\nessere <strong>consultati</strong> nei servizi che li trattano in modo\naggregato e anonimizzato (HIBP, IntelX, LeakCheck). <strong>Non vanno\nscaricati, conservati o usati</strong> al di fuori dello scopo\ndell’indagine. Usare le credenziali trovate per accedere ad account\naltrui è reato (art. 615-ter c.p.).</p>\n</blockquote>\n<h3 id=\"have-i-been-pwned-hibp-revisione\">6.2 Have I Been Pwned (HIBP) –\nrevisione</h3>\n<p>Abbiamo già citato HIBP nelle lezioni precedenti. Riepilogo\nrapido:</p>\n<ul>\n<li><strong>Fondato da:</strong> Troy Hunt nel 2013.</li>\n<li><strong>URL:</strong> https://haveibeenpwned.com</li>\n<li><strong>Cosa fa:</strong> verifica se un’email o un numero di\ntelefono compare in uno dei 12+ miliardi di account violati nel\ndatabase.</li>\n<li><strong>Cosa non mostra:</strong> le password. HIBP è progettato per\nnotificare l’utente della violazione, non per esporre i dati.</li>\n<li><strong>API:</strong> disponibile con chiave gratuita per ricerche\nsu singole email; a pagamento per ricerche massiva e per il servizio\n“Pwned Passwords” (verifica di password hashate).</li>\n</ul>\n<pre class=\"python\"><code>import requests\nimport hashlib\n\ndef controlla_hibp(email: str, api_key: str) -&gt; list[str]:\n    &quot;&quot;&quot;Verifica se un&#39;email compare in HIBP. Richiede API key gratuita.&quot;&quot;&quot;\n    url = f&quot;https://haveibeenpwned.com/api/v3/breachedaccount/{email}&quot;\n    headers = {\n        &quot;hibp-api-key&quot;: api_key,\n        &quot;User-Agent&quot;: &quot;OSINT-ricerca-personale&quot;,\n    }\n    r = requests.get(url, headers=headers, timeout=10)\n    if r.status_code == 404:\n        return []  # non trovata\n    r.raise_for_status()\n    return [b[&quot;Name&quot;] for b in r.json()]  # lista dei breach\n\n# Verifica password hashata (senza inviare la password)\ndef controlla_password(password: str) -&gt; int:\n    &quot;&quot;&quot;Controlla se una password compare in breach noti (k-anonymity).&quot;&quot;&quot;\n    sha1 = hashlib.sha1(password.encode()).hexdigest().upper()\n    prefisso, suffisso = sha1[:5], sha1[5:]\n    r = requests.get(\n        f&quot;https://api.pwnedpasswords.com/range/{prefisso}&quot;,\n        timeout=10,\n    )\n    for riga in r.text.splitlines():\n        hash_s, conteggio = riga.split(&quot;:&quot;)\n        if hash_s == suffisso:\n            return int(conteggio)\n    return 0</code></pre>\n<hr />\n<h2 id=\"intelx-intelligence-x\">7. IntelX (Intelligence X)</h2>\n<h3 id=\"cosè-intelx\">7.1 Cos’è IntelX</h3>\n<p><strong>Intelligence X</strong> (https://intelx.io), noto anche come\n<strong>IntelX</strong>, è un motore di ricerca specializzato in\nintelligence che indicizza:</p>\n<ul>\n<li><strong>Paste site</strong> (Pastebin, GitHub Gist, ecc.): testi\nincollati pubblicamente, spesso contenenti leak.</li>\n<li><strong>Dark web</strong>: archivi di forum e marketplace del dark\nweb indicizzati da IntelX.</li>\n<li><strong>Data breach</strong>: database di violazioni acquistati o\nraccolti legalmente.</li>\n<li><strong>WHOIS storici</strong>: informazioni di registrazione dei\ndomini nel tempo.</li>\n<li><strong>Archivi pubblici</strong>: Wayback Machine, documenti\npubblici.</li>\n<li><strong>Telegram</strong>: messaggi pubblici di canali e gruppi\nTelegram.</li>\n<li><strong>Darknet</strong>: i2p, Tor (onion).</li>\n</ul>\n<p>È usato da ricercatori di sicurezza, giornalisti e forze\ndell’ordine.</p>\n<p><strong>Fondata da:</strong> Peter Kleissner (CEO) nel 2018.\n<strong>URL:</strong> https://intelx.io</p>\n<h3 id=\"piano-gratuito-e-a-pagamento\">7.2 Piano gratuito e a\npagamento</h3>\n<table>\n<thead>\n<tr>\n<th>Funzione</th>\n<th>Gratuito</th>\n<th>A pagamento</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Ricerche al giorno</td>\n<td>5</td>\n<td>Illimitate</td>\n</tr>\n<tr>\n<td>Risultati per ricerca</td>\n<td>1</td>\n<td>Completi</td>\n</tr>\n<tr>\n<td>Accesso ai contenuti completi</td>\n<td>No</td>\n<td>Sì</td>\n</tr>\n<tr>\n<td>API</td>\n<td>Limitata</td>\n<td>Completa</td>\n</tr>\n<tr>\n<td>Dark web</td>\n<td>No</td>\n<td>Sì</td>\n</tr>\n<tr>\n<td>Download dei risultati</td>\n<td>No</td>\n<td>Sì</td>\n</tr>\n</tbody>\n</table>\n<p>Per OSINT professionale è quasi indispensabile il piano a pagamento.\nPer uso didattico, il piano gratuito permette di verificare se un’email\nè presente e vedere un’anteprima dei risultati.</p>\n<h3 id=\"come-cercare-su-intelx\">7.3 Come cercare su IntelX</h3>\n<p><strong>Ricerca base:</strong> 1. Vai su https://intelx.io. 2.\nInserisci il selettore: email, dominio, IP, username, numero di\ntelefono, hash, URL. 3. Imposta i filtri: tipo di fonte (paste, darknet,\nbreach, WHOIS…), data. 4. Clicca su Search.</p>\n<p><strong>Filtri disponibili:</strong> - <strong>Media type</strong>:\ntext, image, document, video, audio, database. -\n<strong>Storage</strong>: publicwww, tor, i2p, usenet, paste,\nretroshare. - <strong>Date range</strong>: per trovare leak recenti o\nstorici. - <strong>Bucket</strong>: categoria specifica (es. “Data\nBreaches”).</p>\n<p><strong>Ricerca avanzata con operatori:</strong></p>\n<p>IntelX supporta operatori nella query:</p>\n<pre><code>&quot;mario.rossi@gmail.com&quot;                    # Ricerca esatta\n&quot;@gmail.com&quot; AND &quot;password&quot;                # AND\n&quot;mario.rossi&quot; OR &quot;mariorossi&quot;              # OR\ndomain:example.com                         # Tutti i selettori del dominio</code></pre>\n<h3 id=\"intelx-api\">7.4 IntelX API</h3>\n<pre class=\"python\"><code>#!/usr/bin/env python3\n&quot;&quot;&quot;\nintelx_osint.py – Ricerca su IntelX tramite API.\nRichiede: pip3 install requests\n          API key gratuita su https://intelx.io/?register\n&quot;&quot;&quot;\nimport os\nimport time\nimport requests\n\nAPI_KEY = os.environ.get(&quot;INTELX_API_KEY&quot;, &quot;&quot;)\nBASE = &quot;https://2.intelx.io&quot;  # endpoint API v2\n\n\ndef avvia_ricerca(selettore: str) -&gt; str:\n    &quot;&quot;&quot;Avvia una ricerca e restituisce l&#39;ID della ricerca.&quot;&quot;&quot;\n    r = requests.post(\n        f&quot;{BASE}/intelligent/search&quot;,\n        headers={&quot;x-key&quot;: API_KEY},\n        json={\n            &quot;term&quot;: selettore,\n            &quot;buckets&quot;: [],\n            &quot;lookuplevel&quot;: 0,\n            &quot;maxresults&quot;: 10,\n            &quot;timeout&quot;: 0,\n            &quot;datefrom&quot;: &quot;&quot;,\n            &quot;dateto&quot;: &quot;&quot;,\n            &quot;sort&quot;: 4,          # Sort by date descending\n            &quot;media&quot;: 0,\n            &quot;terminate&quot;: [],\n        },\n        timeout=15,\n    )\n    r.raise_for_status()\n    return r.json()[&quot;id&quot;]\n\n\ndef ottieni_risultati(search_id: str, attesa: int = 5) -&gt; list[dict]:\n    &quot;&quot;&quot;Recupera i risultati di una ricerca.&quot;&quot;&quot;\n    time.sleep(attesa)\n    r = requests.get(\n        f&quot;{BASE}/intelligent/search/result&quot;,\n        headers={&quot;x-key&quot;: API_KEY},\n        params={&quot;id&quot;: search_id, &quot;limit&quot;: 10},\n        timeout=15,\n    )\n    r.raise_for_status()\n    return r.json().get(&quot;records&quot;, [])\n\n\ndef stampa_risultati(risultati: list[dict]) -&gt; None:\n    &quot;&quot;&quot;Stampa i risultati in modo leggibile.&quot;&quot;&quot;\n    if not risultati:\n        print(&quot;  Nessun risultato trovato.&quot;)\n        return\n    for r in risultati:\n        nome = r.get(&quot;name&quot;, &quot;N/A&quot;)\n        tipo = r.get(&quot;type&quot;, &quot;N/A&quot;)\n        data = r.get(&quot;date&quot;, &quot;N/A&quot;)[:10] if r.get(&quot;date&quot;) else &quot;N/A&quot;\n        size = r.get(&quot;size&quot;, 0)\n        uid = r.get(&quot;systemid&quot;, &quot;&quot;)\n        print(f&quot;  📄 {nome}&quot;)\n        print(f&quot;     Tipo: {tipo} | Data: {data} | Dim: {size} byte&quot;)\n        if uid:\n            print(f&quot;     Link: https://intelx.io/?did={uid}&quot;)\n        print()\n\n\nif __name__ == &quot;__main__&quot;:\n    if not API_KEY:\n        print(&quot;⚠ Imposta la variabile d&#39;ambiente INTELX_API_KEY&quot;); exit(1)\n    selettore = input(&quot;Selettore da cercare (email, dominio, username, IP): &quot;).strip()\n    print(f&quot;\\n🔍 Ricerca IntelX per: {selettore}&quot;)\n    search_id = avvia_ricerca(selettore)\n    risultati = ottieni_risultati(search_id)\n    print(f&quot;\\n📊 Risultati ({len(risultati)}):\\n&quot;)\n    stampa_risultati(risultati)</code></pre>\n<h3 id=\"intelx-per-la-ricerca-di-header-email\">7.5 IntelX per la ricerca\ndi header email</h3>\n<p>Un uso avanzato di IntelX è la ricerca di <strong>indirizzi\nIP</strong> estratti da header di messaggi spam o phishing. Inserendo\nl’IP nel campo di ricerca, si possono trovare altri messaggi con lo\nstesso IP originante, campagne precedenti, e forum in cui quell’IP è\nstato discusso.</p>\n<hr />\n<h2 id=\"leakcheck\">8. LeakCheck</h2>\n<h3 id=\"cosè-leakcheck\">8.1 Cos’è LeakCheck</h3>\n<p><strong>LeakCheck</strong> (https://leakcheck.io) è un servizio\nspecializzato nella ricerca di email e username in database di data\nbreach. A differenza di HIBP (che non mostra le password), LeakCheck\npermette agli utenti autorizzati (es. professionisti della sicurezza,\ninvestigatori) di vedere i <strong>dettagli del breach</strong>:\npassword hashata, nome reale, IP di registrazione, username.</p>\n<p><strong>Caratteristiche:</strong> - Oltre <strong>7 miliardi</strong>\ndi record da centinaia di breach. - Piano gratuito: 5 ricerche/giorno,\nsolo tipo di breach e data (nessun dettaglio). - Piano a pagamento:\ndettagli completi, API, ricerche massive. - API disponibile per\nautomazione.</p>\n<blockquote>\n<p><strong>Avvertenza etica e legale:</strong> LeakCheck è uno strumento\nprofessionale. Accedere ai dettagli di un breach (password, dati\npersonali altrui) senza una legittima ragione professionale è illecito\nai sensi del GDPR e del Codice Privacy. I piani a pagamento richiedono\nla verifica dell’identità professionale dell’utente.</p>\n</blockquote>\n<h3 id=\"come-usare-leakcheck\">8.2 Come usare LeakCheck</h3>\n<p><strong>Interfaccia web:</strong> 1. Vai su https://leakcheck.io. 2.\nInserisci l’email o lo username. 3. Nel piano gratuito, vedrai: in\nquanti breach compare, il nome dei breach e le date. Non vedrai password\no altri dettagli. 4. Nel piano a pagamento: vedrai il tipo di hash della\npassword, la password in chiaro (se il breach la contiene), il nome, il\nnumero di telefono, l’IP di registrazione.</p>\n<p><strong>Piano gratuito – interpretare il risultato:</strong></p>\n<table>\n<thead>\n<tr>\n<th>Informazione visibile</th>\n<th>Cosa significa</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>3 breaches found</td>\n<td>L’email è stata violata 3 volte in eventi diversi</td>\n</tr>\n<tr>\n<td>“LinkedIn (2016)”</td>\n<td>Compare nel celebre breach LinkedIn del 2016</td>\n</tr>\n<tr>\n<td>“Collection #1 (2019)”</td>\n<td>Un aggregato di breach multipli del 2019</td>\n</tr>\n</tbody>\n</table>\n<p>Anche senza i dettagli, sapere <strong>in quali breach</strong>\nun’email compare è già informativo: rivela quali servizi la persona usa\no usava.</p>\n<h3 id=\"leakcheck-api\">8.3 LeakCheck API</h3>\n<pre class=\"python\"><code>#!/usr/bin/env python3\n&quot;&quot;&quot;\nleakcheck_osint.py – Ricerca su LeakCheck tramite API.\nRichiede: pip3 install requests\n          API key su https://leakcheck.io/api\n&quot;&quot;&quot;\nimport os\nimport requests\n\nAPI_KEY = os.environ.get(&quot;LEAKCHECK_API_KEY&quot;, &quot;&quot;)\nBASE = &quot;https://leakcheck.io/api/v2&quot;\n\n\ndef cerca(selettore: str, tipo: str = &quot;auto&quot;) -&gt; dict:\n    &quot;&quot;&quot;\n    Cerca un selettore su LeakCheck.\n    tipo: &#39;auto&#39;, &#39;email&#39;, &#39;username&#39;, &#39;phone&#39;, &#39;domain&#39;, &#39;keyword&#39;\n    &quot;&quot;&quot;\n    r = requests.get(\n        f&quot;{BASE}/query/{selettore}&quot;,\n        headers={&quot;X-API-Key&quot;: API_KEY},\n        params={&quot;type&quot;: tipo},\n        timeout=15,\n    )\n    r.raise_for_status()\n    return r.json()\n\n\ndef stampa_risultati(dati: dict) -&gt; None:\n    &quot;&quot;&quot;Stampa i risultati di LeakCheck.&quot;&quot;&quot;\n    if not dati.get(&quot;success&quot;):\n        print(f&quot;⚠ Errore: {dati.get(&#39;error&#39;, &#39;sconosciuto&#39;)}&quot;)\n        return\n\n    trovato = dati.get(&quot;found&quot;, 0)\n    risultati = dati.get(&quot;result&quot;, [])\n\n    print(f&quot;\\n📊 Trovato in {trovato} breach:\\n&quot;)\n    for r in risultati:\n        sorgente = r.get(&quot;source&quot;, {})\n        nome = sorgente.get(&quot;name&quot;, &quot;N/A&quot;)\n        data = sorgente.get(&quot;breach_date&quot;, &quot;N/A&quot;)\n        cat = sorgente.get(&quot;category&quot;, &quot;N/A&quot;)\n        # I campi seguenti sono disponibili solo nei piani a pagamento\n        password = r.get(&quot;password&quot;, &quot;&quot;)\n        email = r.get(&quot;email&quot;, &quot;&quot;)\n        username = r.get(&quot;username&quot;, &quot;&quot;)\n\n        print(f&quot;  🔓 {nome} ({data}) – Categoria: {cat}&quot;)\n        if email:\n            print(f&quot;     Email: {email}&quot;)\n        if username:\n            print(f&quot;     Username: {username}&quot;)\n        if password:\n            print(f&quot;     Password (hash/testo): {password[:20]}...&quot;)  # troncata\n        print()\n\n\nif __name__ == &quot;__main__&quot;:\n    if not API_KEY:\n        print(&quot;⚠ Imposta LEAKCHECK_API_KEY&quot;); exit(1)\n    selettore = input(&quot;Email, username o dominio: &quot;).strip()\n    dati = cerca(selettore)\n    stampa_risultati(dati)</code></pre>\n<h3 id=\"altri-servizi-di-breach-intelligence\">8.4 Altri servizi di\nbreach intelligence</h3>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Servizio</th>\n<th>URL</th>\n<th>Specialità</th>\n<th>Gratuito?</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>HIBP</strong></td>\n<td>haveibeenpwned.com</td>\n<td>Notifiche breach, API, verifica password</td>\n<td>Sì (base)</td>\n</tr>\n<tr>\n<td><strong>LeakCheck</strong></td>\n<td>leakcheck.io</td>\n<td>Dettagli breach, API, 7+ miliardi di record</td>\n<td>Parziale</td>\n</tr>\n<tr>\n<td><strong>IntelX</strong></td>\n<td>intelx.io</td>\n<td>Dark web, paste, WHOIS storici</td>\n<td>Parziale</td>\n</tr>\n<tr>\n<td><strong>Dehashed</strong></td>\n<td>dehashed.com</td>\n<td>Email, username, IP, nome, indirizzo da breach</td>\n<td>No</td>\n</tr>\n<tr>\n<td><strong>Snusbase</strong></td>\n<td>snusbase.com</td>\n<td>Database di breach, cerca per vari selettori</td>\n<td>No</td>\n</tr>\n<tr>\n<td><strong>Leak-Lookup</strong></td>\n<td>leak-lookup.com</td>\n<td>Email, username, password da breach</td>\n<td>No</td>\n</tr>\n<tr>\n<td><strong>BreachDirectory</strong></td>\n<td>breachdirectory.org</td>\n<td>Ricerca email e password (piano base gratuito)</td>\n<td>Parziale</td>\n</tr>\n<tr>\n<td><strong>Nuclio / WeLeakInfo</strong></td>\n<td>(chiusi o mutati)</td>\n<td>–</td>\n<td>–</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2 id=\"flusso-di-lavoro-integrato-da-unemail-a-un-profilo-completo\">9.\nFlusso di lavoro integrato: da un’email a un profilo completo</h2>\n<p>Mettendo insieme tutti gli strumenti della lezione, ecco il flusso di\nlavoro standard per trasformare un indirizzo email in un profilo\ninvestigativo:</p>\n<pre><code>  EMAIL TARGET: mario.rossi87@gmail.com\n         │\n         ├─ 1. STRUTTURA ─────────────────────────────────\n         │    Analizza: nome (mario.rossi), anno (87),\n         │    provider (gmail = consumer italiano)\n         │\n         ├─ 2. VERIFICA ESISTENZA ─────────────────────────\n         │    HIBP: in quali breach compare?\n         │    Gravatar: ha un avatar? (→ foto profilo)\n         │    Google Account: esiste un account Google?\n         │\n         ├─ 3. PROFILI ASSOCIATI ─────────────────────────\n         │    Holehe: su quali piattaforme è registrata?\n         │    OSINT Industries: pivot completo\n         │    BlackBird: conferma + ulteriori piattaforme\n         │\n         ├─ 4. BREACH INTELLIGENCE ──────────────────────\n         │    LeakCheck: in quali breach, con quali dati\n         │    IntelX: paste, dark web, Telegram\n         │\n         ├─ 5. HEADER ANALYSIS (se hai ricevuto una mail) ─\n         │    Postal / MXToolbox: IP originante, SPF, DKIM\n         │    Geolocalizzazione dell&#39;IP\n         │\n         ├─ 6. PIVOT VERSO ALTRI SELETTORI ──────────────\n         │    → Username trovati → Lezione 4 (Maigret)\n         │    → Telefono trovato → Lezione 6\n         │    → Indirizzo trovato → Google Maps, Street View\n         │    → Foto trovata → Lezione 8 (ricerca inversa)\n         │\n         └─ 7. DOCUMENTAZIONE ────────────────────────────\n              Diario d&#39;indagine, screenshot archiviati,\n              classificazione A–F / 1–6, report finale</code></pre>\n<h3 id=\"script-python-orchestratore-del-flusso\">Script Python:\norchestratore del flusso</h3>\n<pre class=\"python\"><code>#!/usr/bin/env python3\n&quot;&quot;&quot;\nemail_pivot.py – Orchestratore del flusso OSINT su un&#39;indirizzo email.\nGenera un riepilogo dei passaggi da eseguire e lancia automaticamente\ni controlli che non richiedono API key.\nRichiede: pip3 install requests dnspython\n&quot;&quot;&quot;\nimport hashlib\nimport re\nimport socket\nimport requests\nfrom urllib.parse import quote\n\ntry:\n    import dns.resolver\n    DNS_OK = True\nexcept ImportError:\n    DNS_OK = False\n\n\ndef analizza_struttura(email: str) -&gt; dict:\n    &quot;&quot;&quot;Analizza la struttura dell&#39;indirizzo email.&quot;&quot;&quot;\n    m = re.match(r&quot;^([^@+]+)(\\+[^@]+)?@(.+)$&quot;, email.lower())\n    if not m:\n        return {&quot;valida&quot;: False}\n    parte_locale = m.group(1)\n    sub_addr = m.group(2) or &quot;&quot;\n    dominio = m.group(3)\n\n    # Prova a estrarre nome, cognome, anno\n    numeri = re.findall(r&quot;\\d{2,4}&quot;, parte_locale)\n    anno = None\n    for n in numeri:\n        if len(n) == 4 and 1950 &lt;= int(n) &lt;= 2010:\n            anno = int(n)\n        elif len(n) == 2 and 50 &lt;= int(n) &lt;= 99:\n            anno = 1900 + int(n)\n        elif len(n) == 2 and
