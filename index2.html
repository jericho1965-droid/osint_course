0 &lt;= int(n) &lt;= 24:\n            anno = 2000 + int(n)\n\n    return {\n        &quot;valida&quot;: True,\n        &quot;email&quot;: email,\n        &quot;parte_locale&quot;: parte_locale,\n        &quot;sub_address&quot;: sub_addr,\n        &quot;dominio&quot;: dominio,\n        &quot;anno_probabile&quot;: anno,\n        &quot;provider_noto&quot;: dominio in {\n            &quot;gmail.com&quot;, &quot;yahoo.com&quot;, &quot;yahoo.it&quot;, &quot;outlook.com&quot;,\n            &quot;hotmail.com&quot;, &quot;hotmail.it&quot;, &quot;libero.it&quot;, &quot;virgilio.it&quot;,\n            &quot;tiscali.it&quot;, &quot;tin.it&quot;, &quot;alice.it&quot;, &quot;icloud.com&quot;,\n        },\n    }\n\n\ndef verifica_mx(dominio: str) -&gt; bool:\n    &quot;&quot;&quot;Verifica se il dominio ha record MX.&quot;&quot;&quot;\n    if not DNS_OK:\n        return None\n    try:\n        dns.resolver.resolve(dominio, &quot;MX&quot;)\n        return True\n    except Exception:\n        return False\n\n\ndef gravatar_url(email: str) -&gt; str:\n    &quot;&quot;&quot;URL Gravatar con d=404 per verificare l&#39;esistenza.&quot;&quot;&quot;\n    md5 = hashlib.md5(email.strip().lower().encode()).hexdigest()\n    return f&quot;https://www.gravatar.com/avatar/{md5}?d=404&amp;s=200&quot;\n\n\ndef controlla_gravatar(email: str) -&gt; bool:\n    &quot;&quot;&quot;Verifica se l&#39;email ha un account Gravatar.&quot;&quot;&quot;\n    url = gravatar_url(email).replace(&quot;?d=404&quot;, &quot;?d=404&amp;s=80&quot;)\n    try:\n        r = requests.get(url, timeout=5)\n        return r.status_code == 200\n    except requests.RequestException:\n        return False\n\n\ndef report_iniziale(email: str) -&gt; None:\n    &quot;&quot;&quot;Genera un report iniziale sull&#39;email.&quot;&quot;&quot;\n    print(f&quot;\\n{&#39;=&#39;*60}&quot;)\n    print(f&quot;  OSINT EMAIL PIVOT – {email}&quot;)\n    print(f&quot;{&#39;=&#39;*60}\\n&quot;)\n\n    # Struttura\n    info = analizza_struttura(email)\n    if not info[&quot;valida&quot;]:\n        print(&quot;⚠ Indirizzo email non valido.&quot;); return\n\n    print(&quot;📋 STRUTTURA&quot;)\n    print(f&quot;  Parte locale:  {info[&#39;parte_locale&#39;]}&quot;)\n    if info[&quot;sub_address&quot;]:\n        print(f&quot;  Sub-address:   {info[&#39;sub_address&#39;]}  ← suggerisce uso su un servizio&quot;)\n    print(f&quot;  Dominio:       {info[&#39;dominio&#39;]}&quot;)\n    if info[&quot;anno_probabile&quot;]:\n        print(f&quot;  Anno probabile: {info[&#39;anno_probabile&#39;]} (da verificare)&quot;)\n    print(f&quot;  Provider noto: {&#39;Sì&#39; if info[&#39;provider_noto&#39;] else &#39;No (dominio aziendale o alias?)&#39;}&quot;)\n\n    # MX\n    if DNS_OK:\n        mx = verifica_mx(info[&quot;dominio&quot;])\n        print(f&quot;\\n🔍 RECORD MX: {&#39;✔ Presente&#39; if mx else &#39;✗ Assente (email probabilmente falsa)&#39;}&quot;)\n\n    # Gravatar\n    print(&quot;\\n🖼 GRAVATAR&quot;)\n    ha_gravatar = controlla_gravatar(email)\n    print(f&quot;  {&#39;✔ Account Gravatar trovato&#39; if ha_gravatar else &#39;✗ Nessun account Gravatar&#39;}&quot;)\n    print(f&quot;  URL: {gravatar_url(email)}&quot;)\n\n    # Link ai prossimi passi\n    print(&quot;\\n🔗 PASSI SUCCESSIVI (eseguire manualmente o con API key)&quot;)\n    print(f&quot;  HIBP:            https://haveibeenpwned.com/account/{quote(email)}&quot;)\n    print(f&quot;  Holehe:          python3 -m holehe {email}&quot;)\n    print(f&quot;  OSINT Industries: https://osint.industries/?s={quote(email)}&amp;t=email&quot;)\n    print(f&quot;  Epieos:          https://epieos.com/?q={quote(email)}&quot;)\n    print(f&quot;  IntelX:          https://intelx.io/?s={quote(email)}&quot;)\n    print(f&quot;  LeakCheck:       https://leakcheck.io/email/{quote(email)}&quot;)\n    print(f&quot;  EmailRep:        https://emailrep.io/{quote(email)}&quot;)\n    print()\n\n\nif __name__ == &quot;__main__&quot;:\n    email = input(&quot;Email da analizzare: &quot;).strip()\n    report_iniziale(email)</code></pre>\n<hr />\n<h2 id=\"box-legale-ed-etico\">⚖️ Box legale ed etico</h2>\n<h3 id=\"data-breach-e-responsabilità-dellanalista\">Data breach e\nresponsabilità dell’analista</h3>\n<p><strong>L’utilizzo di dati provenienti da breach è soggetto a norme\nprecise:</strong></p>\n<ol type=\"1\">\n<li><p><strong>Base giuridica GDPR (art. 6):</strong> anche i dati già\npubblici in un breach restano dati personali. Per trattarli\n(raccoglierli, analizzarli, conservarli) serve una base giuridica:\nlegittimo interesse con bilanciamento documentato, obbligo legale (es.\nindagini autorizzate) o consenso.</p></li>\n<li><p><strong>Minimizzazione:</strong> raccogli solo ciò che è\nnecessario per l’indagine. Se l’unica informazione utile è la lista dei\nbreach in cui compare un’email, non è necessario raccogliere anche le\npassword.</p></li>\n<li><p><strong>Non conservare le password:</strong> anche se trovi\npassword in chiaro in un breach, non conservarle nel tuo diario\nd’indagine. Non sono necessarie per identificare il soggetto e la loro\nconservazione è rischiosa sia legalmente sia eticamente.</p></li>\n<li><p><strong>Non usare le password trovate:</strong> ovviamente, usare\nuna password trovata in un breach per accedere a qualsiasi account è\nreato (art. 615-ter c.p.).</p></li>\n<li><p><strong>Servizi “legali” vs. servizi grigi:</strong> HIBP è\nesplicitamente progettato per la protezione degli utenti. IntelX e\nLeakCheck si rivolgono a professionisti e richiedono un profilo\nverificato. Servizi come Dehashed, Snusbase e altri simili si trovano in\nuna zona grigia: tecnicamente leciti in alcune giurisdizioni, ma la loro\nlegittimità è contestata in Europa.</p></li>\n</ol>\n<h3 id=\"analisi-degli-header-privacy-del-mittente\">Analisi degli header:\nprivacy del mittente</h3>\n<p>Analizzare gli header di un messaggio che hai\n<strong>ricevuto</strong> è sempre lecito: il messaggio è tuo.\nAnalizzare gli header di un messaggio che non ti è stato indirizzato\n(es. intercettato) è un reato (art. 617-quater c.p.).</p>\n<h3 id=\"holehe-e-i-siti-verificati\">Holehe e i siti verificati</h3>\n<p>Holehe effettua richieste HTTP ai siti per verificare la\nregistrazione. Questo è tecnicamente <strong>automatizzazione</strong>\ndi operazioni normalmente manuali. Molti siti vietano l’automazione nei\nloro ToS. Come per Maigret e BlackBird, il rischio legale è\nprincipalmente contrattuale (ban), non penale, purché le richieste siano\nmoderate e non causino danni al servizio.</p>\n<hr />\n<h2 id=\"caso-di-studio-il-mittente-misterioso\">Caso di studio: “Il\nmittente misterioso”</h2>\n<blockquote>\n<p><em>Dati fittizi.</em></p>\n</blockquote>\n<p><strong>Scenario.</strong> La responsabile HR di una piccola azienda\nriceve messaggi intimidatori da un’email sconosciuta:\n<code>hr_avvisato2024@proton.me</code>. I messaggi sono inviati da\nProtonMail, che non fornisce dati agli investigatori privati senza\nordine giudiziario. La HR chiede all’analista OSINT se è possibile\nricavare informazioni sul mittente.</p>\n<p><strong>Pianificazione:</strong> EEI 1: Chi potrebbe essere il\nmittente? EEI 2: L’indirizzo è usato altrove? EEI 3: I messaggi\ncontengono metadati utili?</p>\n<p><strong>Step 1 – Analisi della struttura.</strong></p>\n<p><code>hr_avvisato2024</code> → l’account è stato creato nel 2024 (o\nil mittente vuole far credere di conoscere la HR e di averla\n“avvisata”). <code>@proton.me</code> → ProtonMail: provider di posta\ncriptata, nessun dato di registrazione accessibile, nessun IP originante\nnegli header (tutto anonimizzato da Proton).</p>\n<p><strong>Step 2 – Analisi degli header.</strong></p>\n<p>Incollando l’email in Postal/MXToolbox: gli header mostrano solo i\nserver Proton, nessun IP originante visibile (ProtonMail rimuove l’IP\ndell’utente). SPF e DKIM validi (il messaggio è autentico, non\nspoofato). Il <code>Message-ID</code> conferma invio da ProtonMail.</p>\n<p>→ Dall’email non si ricavano dati tecnici sul mittente.</p>\n<p><strong>Step 3 – Holehe e OSINT Industries.</strong></p>\n<p><code>hr_avvisato2024@proton.me</code> su Holehe: 0 risultati\n(account probabilmente creato di recente solo per questo scopo).</p>\n<p><strong>Step 4 – IntelX.</strong></p>\n<p>Ricerca su IntelX: 0 occorrenze. L’indirizzo non compare in paste o\nbreach noti (creato recentemente).</p>\n<p><strong>Step 5 – Analisi testuale dei messaggi.</strong></p>\n<p>I messaggi mostrano: italiano corretto, nessun errore di ortografia,\nuso di espressioni tipiche del settore HR, orari di invio tra le 9:00 e\nle 17:00 nei giorni feriali, conoscenza di dettagli interni specifici\n(nomi di colleghi, eventi recenti).</p>\n<p><strong>Analisi.</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Indizio</th>\n<th>Classificazione</th>\n<th>Inferenza</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Account ProtonMail anonimo</td>\n<td>A2</td>\n<td>Mittente sa come anonimizzarsi</td>\n</tr>\n<tr>\n<td>Conoscenza di dettagli interni</td>\n<td>B2</td>\n<td>Alta probabilità di persona interna o ex dipendente</td>\n</tr>\n<tr>\n<td>Orari feriali 9-17</td>\n<td>C3</td>\n<td>Possibile dipendente con accesso da postazione aziendale</td>\n</tr>\n<tr>\n<td>Italiano corretto, lessico HR</td>\n<td>C3</td>\n<td>Persona con formazione nel settore</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Conclusioni nel report.</strong></p>\n<blockquote>\n<p>“Le tecniche OSINT disponibili non hanno permesso di identificare il\nmittente attraverso l’indirizzo email: ProtonMail non espone metadati\ntecnici e l’account non risulta usato altrove. Tuttavia, l’analisi\nlinguistica e dei contenuti dei messaggi suggerisce con alta probabilità\nche il mittente abbia accesso a informazioni interne riservate. Si\nraccomanda di avviare una <strong>procedura interna</strong> di verifica\ndegli accessi (log di sistema, badge di accesso fisico nelle date di\ninvio) e, se necessario, di presentare un esposto alla <strong>Polizia\nPostale</strong> per procedere con indagini che richiedono ordini\ngiudiziari (richiesta dei dati di registrazione a ProtonMail).”</p>\n</blockquote>\n<p><strong>Lezioni apprese:</strong> - Non sempre è possibile\nidentificare il mittente con strumenti OSINT passivi. Riconoscere il\nlimite è parte integrante del lavoro. - L’analisi testuale e\ncomportamentale può compensare la mancanza di dati tecnici. - Il report\nnon promette risultati impossibili e indirizza verso le autorità\ncompetenti.</p>\n<hr />\n<h2 id=\"esercizi-pratici\">Esercizi pratici</h2>\n<p><strong>Esercizio 1 – Analisi strutturale (15 min)</strong> Prendi\nqueste email e analizza la struttura di ciascuna: cosa puoi dedurre su\nciascun indirizzo?</p>\n<pre><code>giovanni.ferrari.1965@tin.it\nadmin+test@company-example.it\nx7r9q@mailinator.com\nmario@rossi.me\ng.bianchi+linkedin@gmail.com</code></pre>\n<p><strong>Esercizio 2 – Leggi gli header (30 min)</strong> Apri\nun’email ricevuta (preferibilmente da una newsletter o un’azienda, non\npersonale). Visualizza il sorgente completo. Identifica: l’IP originante\n(se visibile), il server di invio reale, lo stato di SPF e DKIM. Incolla\ngli header in MXToolbox e documenta i risultati.</p>\n<p><strong>Esercizio 3 – Holehe sul tuo indirizzo (20 min)</strong>\nInstalla Holehe (<code>pip3 install holehe</code>) e lancialo sul tuo\nindirizzo email principale. Documenta su quante piattaforme la tua email\nè registrata. Sei sorpreso?</p>\n<p><strong>Esercizio 4 – HIBP (10 min)</strong> Verifica su HIBP la tua\nemail principale e almeno un’email alternativa. In quanti breach\ncompare? Quali servizi erano coinvolti?</p>\n<p><strong>Esercizio 5 – Gravatar check (15 min)</strong> Usa lo script\ndi questa lezione per calcolare l’hash MD5 di cinque email diverse (tue\no di test) e controlla se esistono account Gravatar. Documenta i\nrisultati.</p>\n<p><strong>Esercizio 6 – Flusso completo (60 min)</strong> Scegli un\nindirizzo email pubblico di un personaggio pubblico (es. un’email\nistituzionale pubblicata sul sito del Comune, un’email professionale\ntrovata in un comunicato stampa). Esegui il flusso completo: struttura →\nMX → Gravatar → Holehe → HIBP. Scrivi un mini-report di una pagina con i\nrisultati.</p>\n<hr />\n","quiz":[{"q":"Cosa rivela il sub-address +amazon in mario+amazon@gmail.com?","opts":{"a":"L'email è falsa","b":"Mario usa Amazon con quell'email","c":"L'email appartiene a qualcuno che lavora in Amazon","d":"Il provider è diverso da Gmail"},"correct":"b","why":"Il sub-address +amazon indica che l'utente ha usato quella variante per registrarsi su Amazon"},{"q":"Il campo Received: negli header di un'email registra:","opts":{"a":"Il contenuto del messaggio","b":"Il percorso del messaggio attraverso i server di posta","c":"La firma digitale del mittente","d":"La data di scadenza del messaggio"},"correct":"b","why":"Ogni server aggiunge un header Received:: insieme ricostruiscono il percorso del messaggio"},{"q":"SPF: fail in un header email indica:","opts":{"a":"Il messaggio è stato recapitato con ritardo","b":"Il server di invio non è autorizzato a inviare per quel dominio: possibile spoofing","c":"La firma DKIM è invalida","d":"Il messaggio è stato filtrato come spam"},"correct":"b","why":"SPF fail indica che il server di invio non è autorizzato dal dominio: possibile spoofing"},{"q":"Holehe verifica la presenza di un'email su un sito:","opts":{"a":"Accedendo all'account con credenziali trovate in breach","b":"Usando la funzione di recupero password o le API del sito","c":"Eseguendo una scansione delle porte del server mail","d":"Cercando l'email su Google"},"correct":"b","why":"Holehe sfrutta le funzioni di recupero password o le API dei siti, senza accedere agli account"},{"q":"OSINT Industries si distingue perché:","opts":{"a":"È completamente gratuito","b":"Permette la ricerca per email, username e telefono con pivot integrato","c":"Funziona solo per email americane","d":"Cerca solo nei data breach"},"correct":"b","why":"OSINT Industries cerca per email, username e telefono e fa pivot integrati tra i risultati"},{"q":"Quale strumento analizza automaticamente gli header di un'email ricevuta?","opts":{"a":"Holehe","b":"Maigret","c":"Postal / MXToolbox Header Analyzer","d":"IntelX"},"correct":"c","why":"Gli analizzatori di header come quello di MXToolbox interpretano automaticamente header, percorso e autenticazione"},{"q":"IntelX si differenzia da HIBP principalmente perché:","opts":{"a":"È gratuito e senza limiti","b":"Mostra solo se un'email è in un breach, non i dettagli","c":"Indicizza paste site, dark web, Telegram e archivi storici, non solo breach","d":"Funziona solo per indirizzi .gov"},"correct":"c","why":"IntelX non si limita ai breach: indicizza paste, dark web, Telegram e archivi storici"},{"q":"LeakCheck, nel piano a pagamento, può mostrare:","opts":{"a":"Solo il nome del breach","b":"Password hashate o in chiaro, nome, telefono, IP di registrazione","c":"Solo la data del breach","d":"Solo le email coinvolte, senza altri dettagli"},"correct":"b","why":"Il piano a pagamento di LeakCheck mostra i campi trapelati: password, nome, telefono, IP"},{"q":"Quale di queste azioni è LECITA nell'analisi email OSINT?","opts":{"a":"Usare una password trovata su LeakCheck per accedere all'account di qualcuno","b":"Verificare se un'email compare in HIBP","c":"Scaricare e conservare l'intero database di un breach","d":"Accedere all'account Gmail del soggetto sfruttando una vulnerabilità"},"correct":"b","why":"Verificare un'email su HIBP è una consultazione passiva e lecita; le altre opzioni sono accessi abusivi o trattamenti illeciti"},{"q":"La presenza di @proton.me come dominio di un'email sospetta indica:","opts":{"a":"Il mittente è italiano","b":"L'email è certamente falsa","c":"Il mittente usa un provider di posta criptata che non espone i dati del mittente","d":"L'IP del mittente è sempre visibile negli header"},"correct":"c","why":"Proton è un provider di posta cifrata che non espone l'IP del mittente negli header"}]},{"title":"Identificazione Telefonica e B2B","html":"<h1\nid=\"lezione-6-servizi-di-identificazione-telefonica-e-multiutenza\">Lezione\n6 – Servizi di Identificazione Telefonica e MultiUtenza</h1>\n<blockquote>\n<p><em>“Un numero di telefono è come un’impronta digitale: unico,\npersistente, e collegato a quasi tutto.”</em> — ricercatore OSINT</p>\n</blockquote>\n<hr />\n<h2 id=\"obiettivi-di-apprendimento\">Obiettivi di apprendimento</h2>\n<p>Al termine di questa lezione sarai in grado di:</p>\n<ol type=\"1\">\n<li>comprendere la struttura tecnica di un numero di telefono (formato\nE.164, prefissi, MNP) e le informazioni che contiene;</li>\n<li>usare i principali servizi <strong>CallerID</strong> (Truecaller,\nGetContact, Sync.me, NumLookup) per identificare il proprietario di un\nnumero;</li>\n<li>applicare tecniche di <strong>reverse lookup</strong> su più\npiattaforme in modo sistematico;</li>\n<li>sfruttare le app di messaggistica (WhatsApp, Telegram, Signal,\nViber) per ricavare informazioni da un numero senza contattare il\nsoggetto;</li>\n<li>gestire la ricerca su <strong>contatti multipli</strong> (liste di\nnumeri) con automazione Python;</li>\n<li>applicare le tecniche <strong>B2B</strong>: trovare email aziendali\ne numeri di telefono diretti a partire da nome, azienda o dominio;</li>\n<li>rispettare i vincoli legali italiani ed europei (GDPR, normativa\nsulle comunicazioni elettroniche) in ogni fase.</li>\n</ol>\n<hr />\n<h2 id=\"introduzione\">1. Introduzione</h2>\n<p>Il numero di telefono è oggi uno dei selettori di identità più\npotenti in assoluto, spesso superiore all’email per le seguenti\nragioni:</p>\n<ul>\n<li><strong>Unicità pratica</strong>: un numero di telefono attivo è\nlegato a un contratto con un operatore, che in Italia richiede per legge\nun documento d’identità (SIM reali). I numeri VoIP e eSIM abbassano\nquesta barriera ma non la eliminano.</li>\n<li><strong>Persistenza</strong>: le persone cambiano email con relativa\nfacilità, ma cambiano numero di telefono raramente (portabilità, costi,\ninertia).</li>\n<li><strong>Collegamento alle app</strong>: WhatsApp, Telegram, Signal,\nViber, iMessage usano il numero come identificatore. Un numero attivo è\nquasi sempre collegato a uno o più di questi servizi.</li>\n<li><strong>Registrazione ai servizi</strong>: molte piattaforme usano\nil numero come secondo fattore di autenticazione o come alternativa\nall’email.</li>\n<li><strong>Rubrica condivisa</strong>: servizi come Truecaller e\nGetContact raccolgono i contatti degli utenti con il consenso (o senza\npiena consapevolezza) di chi viene salvato in rubrica, creando database\nenormi di associazioni numero↔︎nome.</li>\n</ul>\n<p>In questa lezione vediamo come trasformare un numero di telefono in\ninformazioni utili e come trovare numeri a partire da altri\nselettori.</p>\n<hr />\n<h2 id=\"struttura-di-un-numero-di-telefono\">2. Struttura di un numero di\ntelefono</h2>\n<h3 id=\"il-formato-e.164\">2.1 Il formato E.164</h3>\n<p>Lo standard internazionale per i numeri di telefono è\n<strong>E.164</strong>:</p>\n<pre><code>  +39 02 1234567\n  │   │  └──────── Numero locale (area code + subscriber)\n  │   └─────────── Codice area / prefisso locale\n  └─────────────── Prefisso paese (Country Code)</code></pre>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Componente</th>\n<th>Esempio</th>\n<th>Note</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Country Code (CC)</td>\n<td><code>+39</code> = Italia, <code>+1</code> = USA/Canada,\n<code>+7</code> = Russia</td>\n<td>Sempre obbligatorio nel formato internazionale</td>\n</tr>\n<tr>\n<td>Area code</td>\n<td><code>02</code> = Milano, <code>06</code> = Roma, <code>011</code> =\nTorino</td>\n<td>Solo per fissi; i mobili italiani non hanno area code</td>\n</tr>\n<tr>\n<td>Subscriber number</td>\n<td>Restante parte</td>\n<td>Identifica il singolo utente nell’area</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Numeri mobili italiani</strong>: iniziano sempre con\n<code>3</code> (es. <code>+39 333 1234567</code>). I prefissi mobili\n(<code>320-329</code>, <code>330-339</code>, <code>340-349</code>,\n<code>350-359</code>, <code>360-369</code>, <code>370-379</code>,\n<code>380-389</code>, <code>390-399</code>) identificano\n(grossolanamente) l’operatore originale, ma la <strong>portabilità del\nnumero</strong> (MNP) rende questa informazione non più affidabile.</p>\n<h3 id=\"carrier-lookup-e-mnp\">2.2 Carrier lookup e MNP</h3>\n<p>Il <strong>carrier lookup</strong> identifica l’operatore attuale di\nun numero. Poiché in Italia vige la Mobile Number Portability (MNP), un\nnumero che inizia con <code>333</code> (TIM) potrebbe ora essere su\nIliad, WindTre o Vodafone.</p>\n<p>Strumenti: - <strong>NumVerify</strong> (https://numverify.com): API\nper validazione e carrier lookup. Piano gratuito: 100 richieste/mese. -\n<strong>Twilio Lookup</strong> (https://www.twilio.com/lookup): API\nprofessionale, a pagamento per uso esteso. - <strong>OSINT\nIndustries</strong>: include carrier lookup nella ricerca per\nnumero.</p>\n<pre class=\"python\"><code>#!/usr/bin/env python3\n&quot;&quot;&quot;\nnumverify_lookup.py – Carrier lookup via NumVerify API.\nRichiede: pip3 install requests\n          API key gratuita su https://numverify.com/product\n&quot;&quot;&quot;\nimport os\nimport requests\n\nAPI_KEY = os.environ.get(&quot;NUMVERIFY_API_KEY&quot;, &quot;&quot;)\nBASE = &quot;http://apilayer.net/api/validate&quot;  # NumVerify\n\n\ndef lookup(numero: str) -&gt; dict:\n    &quot;&quot;&quot;\n    Effettua un carrier lookup.\n    numero: in formato E.164 senza il + (es. &#39;393331234567&#39;)\n    &quot;&quot;&quot;\n    r = requests.get(\n        BASE,\n        params={\n            &quot;access_key&quot;: API_KEY,\n            &quot;number&quot;: numero,\n            &quot;country_code&quot;: &quot;&quot;,\n            &quot;format&quot;: 1,\n        },\n        timeout=10,\n    )\n    r.raise_for_status()\n    return r.json()\n\n\ndef stampa(dati: dict) -&gt; None:\n    print(f&quot;\\n📱 Carrier Lookup&quot;)\n    print(f&quot;  Numero:       {dati.get(&#39;international_format&#39;, &#39;N/A&#39;)}&quot;)\n    print(f&quot;  Valido:       {dati.get(&#39;valid&#39;, &#39;N/A&#39;)}&quot;)\n    print(f&quot;  Paese:        {dati.get(&#39;country_name&#39;, &#39;N/A&#39;)} ({dati.get(&#39;country_code&#39;, &#39;&#39;)})&quot;)\n    print(f&quot;  Tipo:         {dati.get(&#39;line_type&#39;, &#39;N/A&#39;)}&quot;)  # mobile / landline / voip\n    print(f&quot;  Carrier:      {dati.get(&#39;carrier&#39;, &#39;N/A&#39;)}&quot;)\n    print(f&quot;  Area:         {dati.get(&#39;location&#39;, &#39;N/A&#39;)}&quot;)\n\n\nif __name__ == &quot;__main__&quot;:\n    numero = input(&quot;Numero (es. +39 333 1234567): &quot;).strip().replace(&quot; &quot;, &quot;&quot;).lstrip(&quot;+&quot;)\n    dati = lookup(numero)\n    stampa(dati)</code></pre>\n<h3 id=\"numeri-voip-e-virtuali\">2.3 Numeri VoIP e virtuali</h3>\n<p>I numeri <strong>VoIP</strong> (es. Skype, Google Voice, Twilio,\nSipGate) non sono associati a una SIM fisica e spesso non richiedono\ndocumento d’identità per l’acquisto. Riconoscerli è importante:</p>\n<ul>\n<li>Il carrier lookup restituisce <code>line_type: voip</code>.</li>\n<li>Alcune app di messaggistica (WhatsApp, Telegram) non funzionano o\nfunzionano con limitazioni su numeri VoIP.</li>\n<li>Piattaforme come <strong>SMSPool</strong>,\n<strong>OnlineSIM</strong>, <strong>SMS-Activate</strong> forniscono\nnumeri virtuali temporanei per la verifica SMS: usati da chi vuole\nanonimizzarsi.</li>\n</ul>\n<hr />\n<h2 id=\"i-servizi-callerid\">3. I servizi CallerID</h2>\n<h3 id=\"come-funzionano-i-servizi-callerid\">3.1 Come funzionano i\nservizi CallerID</h3>\n<p>I servizi <strong>CallerID</strong> (identificazione del chiamante)\ncome Truecaller, GetContact e Sync.me funzionano in modo simile:</p>\n<ol type=\"1\">\n<li>L’utente installa l’app e concede l’accesso alla propria\n<strong>rubrica telefonica</strong>.</li>\n<li>L’app carica sul server tutti i numeri della rubrica con i nomi con\ncui sono stati salvati.</li>\n<li>Il server aggrega milioni di rubriche: se lo stesso numero è salvato\nda molte persone con lo stesso nome, il sistema acquisisce un’alta\nconfidenza sull’identità.</li>\n<li>Quando qualcuno cerca un numero, il sistema restituisce il nome più\nfrequentemente associato.</li>\n</ol>\n<p><strong>Implicazione OSINT:</strong> questi database contengono dati\ndi persone che non hanno mai installato l’app, ma che sono state salvate\nin rubrica da chi l’ha installata. È un meccanismo di raccolta dati di\nmassa che solleva serie questioni di consenso (vedi box legale).</p>\n<h3 id=\"truecaller\">3.2 Truecaller</h3>\n<p><strong>Truecaller</strong> (https://www.truecaller.com) è il\nservizio CallerID più diffuso al mondo con oltre 350 milioni di utenti\nattivi. Ha una copertura particolarmente ampia in India, Medio Oriente e\nAfrica, ma cresce anche in Europa.</p>\n<p><strong>Accesso:</strong> - <strong>App mobile</strong>: la funzione\nprincipale. Ricerca diretta di numeri dall’app. - <strong>Sito\nweb</strong>: https://www.truecaller.com/search/it/NUMERO consente la\nricerca senza installare l’app (risultati limitati senza account). -\n<strong>API non ufficiale</strong>: esiste ma viola i ToS; non la\nusiamo.</p>\n<p><strong>Cosa mostra (se il numero è nel database):</strong> - Nome\ncon cui è salvato più frequentemente. - Foto del profilo (se l’utente ha\nun account Truecaller). - Tag (“spam”, “telemarketing”, “truffa”)\nassegnati dagli utenti. - Localizzazione approssimativa (operatore\ntelefonico + area). - Link a profili social (se l’utente ha collegato il\nsuo account).</p>\n<p><strong>Ricerca da browser (senza account):</strong></p>\n<pre><code>https://www.truecaller.com/search/it/+39-333-1234567</code></pre>\n<p><strong>Truecaller per numeri aziendali</strong>: Truecaller ha anche\nuna piattaforma <strong>Business</strong> che permette alle aziende di\nverificare il proprio numero e aggiungere informazioni ufficiali. Questi\ndati sono più affidabili dei dati da rubrica.</p>\n<h3 id=\"getcontact\">3.3 GetContact</h3>\n<p><strong>GetContact</strong> (https://www.getcontact.com) funziona in\nmodo simile a Truecaller ma ha una caratteristica unica molto utile per\nl’OSINT: mostra <strong>tutti i tag</strong> con cui un numero è stato\nsalvato in rubrica, non solo il più frequente.</p>\n<p>Questo significa che puoi vedere: - “Mario ufficio” - “Mario plumber”\n- “Mario Rossi TIM” - “Fornitore Mario”</p>\n<p>Questa lista di tag può rivelare molto sul soggetto: professione,\nrelazioni, contesto.</p>\n<p><strong>Accesso:</strong> - <strong>App mobile</strong>: accesso\ncompleto con account. - <strong>Sito web</strong>:\nhttps://web.getcontact.com (ricerca con numero, richiede\nregistrazione).</p>\n<p><strong>Limitazioni:</strong> GetContact mostra un numero limitato di\ntag nel piano gratuito. Il piano premium mostra tutti i tag.</p>\n<h3 id=\"sync.me\">3.4 Sync.me</h3>\n<p><strong>Sync.me</strong> (https://sync.me) è un servizio CallerID\nmeno noto ma con buona copertura europea. Aggrega dati da Facebook,\nLinkedIn e altre fonti social oltre alla rubrica degli utenti.</p>\n<p><strong>Caratteristica distintiva:</strong> Sync.me mostra spesso la\n<strong>foto di profilo Facebook</strong> o LinkedIn associata al\nnumero, se il soggetto ha collegato il numero al proprio profilo\nsocial.</p>\n<p><strong>Accesso:</strong> principalmente tramite app mobile. La\nricerca via web è limitata.</p>\n<h3 id=\"numlookup-e-whocalledme\">3.5 NumLookup e WhoCalledMe</h3>\n<p><strong>NumLookup</strong> (https://www.numlookup.com): reverse phone\nlookup gratuito, orientato principalmente al mercato USA ma con dati\neuropei. Aggrega report di spam, commenti degli utenti su numeri\nsospetti.</p>\n<p><strong>WhoCalledMe</strong> (https://whocalledme.com): database\ncomunitario di numeri con commenti degli utenti. Ottimo per numeri di\ntelemarketing o truffe.</p>\n<p><strong>Chi ha chiamato</strong> (https://www.chihachiamato.it):\nequivalente italiano, specifico per numeri italiani. Contiene\nsegnalazioni di spam e telemarketing da utenti italiani.</p>\n<h3 id=\"tabella-comparativa-dei-servizi-callerid\">3.6 Tabella\ncomparativa dei servizi CallerID</h3>\n<table>\n<colgroup>\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Servizio</th>\n<th>Copertura migliore</th>\n<th>Dati aggiuntivi</th>\n<th>Accesso web</th>\n<th>Gratuito</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Truecaller</td>\n<td>Global, India, ME</td>\n<td>Spam tags, foto, social</td>\n<td>Sì (limitato)</td>\n<td>Sì (base)</td>\n</tr>\n<tr>\n<td>GetContact</td>\n<td>Europa, Turchia</td>\n<td>Tutti i tag rubrica</td>\n<td>Sì (con reg.)</td>\n<td>Sì (base)</td>\n</tr>\n<tr>\n<td>Sync.me</td>\n<td>USA, Europa</td>\n<td>Facebook/LinkedIn foto</td>\n<td>Limitato</td>\n<td>Sì (base)</td>\n</tr>\n<tr>\n<td>NumLookup</td>\n<td>USA</td>\n<td>Tipo linea, operatore</td>\n<td>Sì</td>\n<td>Sì</td>\n</tr>\n<tr>\n<td>WhoCalledMe</td>\n<td>USA</td>\n<td>Commenti utenti</td>\n<td>Sì</td>\n<td>Sì</td>\n</tr>\n<tr>\n<td>ChiHaChiamato</td>\n<td>Italia</td>\n<td>Segnalazioni spam IT</td>\n<td>Sì</td>\n<td>Sì</td>\n</tr>\n<tr>\n<td>OSINT Industries</td>\n<td>Global</td>\n<td>Pivot completo</td>\n<td>Sì</td>\n<td>Parziale</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"ricerca-su-whatsapp\">3.7 Ricerca su WhatsApp</h3>\n<p>WhatsApp usa il numero di telefono come identificatore. Se il\nsoggetto usa WhatsApp, puoi trovare:</p>\n<ul>\n<li><strong>Foto del profilo</strong> (anche senza salvare il numero,\naprendo <code>https://wa.me/NUMERO</code> da browser).</li>\n<li><strong>Nome visualizzato</strong> (se il numero è nella tua rubrica\ne lo ha impostato come visibile).</li>\n<li><strong>“Ultimo accesso”</strong> e <strong>“Online”</strong> (se il\nsoggetto non ha disattivato queste informazioni nelle impostazioni\nprivacy).</li>\n<li><strong>Status / Biografia</strong>.</li>\n</ul>\n<p><strong>Come controllare un numero su WhatsApp senza\nsalvarlo:</strong> 1. Apri <code>https://wa.me/393331234567</code> nel\nbrowser (formato E.164 senza il <code>+</code>). 2. WhatsApp Web ti\nchiederà di aprire l’app: se il numero è registrato, vedrai l’opzione di\nchat. Se non è registrato, otterrai un errore.</p>\n<p>Alternativamente, usa <strong>WAMR</strong> o strumenti OSINT\ndedicati a WhatsApp.</p>\n<h3 id=\"ricerca-su-telegram\">3.8 Ricerca su Telegram</h3>\n<p>Telegram non mostra il numero di un utente pubblicamente, ma puoi\ncercare: - Se l’utente ha uno <strong>username pubblico</strong>:\n<code>https://t.me/USERNAME</code>. - Se conosci il numero,\naggiungendolo a Telegram potrai vedere il profilo (nome, foto, bio,\nusername) se l’utente non ha impostato la massima privacy. - L’API di\nTelegram (<code>telethon</code>) permette una ricerca più sistematica\n(vedi Lezione 7).</p>\n<h3 id=\"script-python-flusso-di-ricerca-su-un-numero\">3.9 Script Python:\nflusso di ricerca su un numero</h3>\n<pre class=\"python\"><code>#!/usr/bin/env python3\n&quot;&quot;&quot;\nphone_pivot.py – Genera il flusso OSINT per un numero di telefono.\nNon esegue chiamate API automatiche: produce i link da verificare manualmente.\n&quot;&quot;&quot;\nimport re\nfrom urllib.parse import quote\n\n\ndef normalizza(numero: str) -&gt; str:\n    &quot;&quot;&quot;Normalizza il numero in formato E.164 senza il +.&quot;&quot;&quot;\n    n = re.sub(r&quot;[^\\d+]&quot;, &quot;&quot;, numero)\n    if n.startswith(&quot;+&quot;):\n        n = n[1:]\n    elif n.startswith(&quot;0039&quot;):\n        n = &quot;39&quot; + n[4:]\n    elif n.startswith(&quot;00&quot;):\n        n = n[2:]\n    return n\n\n\ndef genera_link(numero_e164: str) -&gt; dict:\n    &quot;&quot;&quot;Genera i link per la ricerca manuale su ogni servizio.&quot;&quot;&quot;\n    n_plus = f&quot;+{numero_e164}&quot;\n    n_wa = numero_e164  # WhatsApp vuole il numero senza +\n\n    return {\n        &quot;Truecaller&quot;: f&quot;https://www.truecaller.com/search/it/{n_plus.replace(&#39;+&#39;, &#39;%2B&#39;)}&quot;,\n        &quot;GetContact (web)&quot;: &quot;https://web.getcontact.com (inserisci manualmente)&quot;,\n        &quot;NumLookup&quot;: f&quot;https://www.numlookup.com/{numero_e164}&quot;,\n        &quot;ChiHaChiamato&quot;: f&quot;https://www.chihachiamato.it/{numero_e164}&quot;,\n        &quot;WhatsApp&quot;: f&quot;https://wa.me/{n_wa}&quot;,\n        &quot;Telegram&quot;: &quot;Cerca il numero nell&#39;app Telegram&quot;,\n        &quot;OSINT Industries&quot;: f&quot;https://osint.industries/?s={quote(n_plus)}&amp;t=phone&quot;,\n        &quot;Sync.me&quot;: f&quot;https://sync.me/search/?number={numero_e164}&quot;,\n        &quot;Carrier Lookup (NumVerify)&quot;: f&quot;https://numverify.com/v2/validate?number={numero_e164}&quot;,\n    }\n\n\ndef analizza_prefisso_it(numero: str) -&gt; str:\n    &quot;&quot;&quot;Analisi del prefisso per numeri italiani.&quot;&quot;&quot;\n    if not numero.startswith(&quot;39&quot;):\n        return &quot;Numero non italiano&quot;\n    locale = numero[2:]\n    if locale.startswith(&quot;3&quot;):\n        # Numero mobile\n        operatori = {\n            &quot;320&quot;: &quot;WindTre (orig.)&quot;, &quot;327&quot;: &quot;WindTre (orig.)&quot;,\n            &quot;328&quot;: &quot;WindTre (orig.)&quot;, &quot;329&quot;: &quot;WindTre (orig.)&quot;,\n            &quot;330&quot;: &quot;WindTre (orig.)&quot;, &quot;333&quot;: &quot;TIM (orig.)&quot;,\n            &quot;334&quot;: &quot;TIM (orig.)&quot;, &quot;335&quot;: &quot;TIM (orig.)&quot;,\n            &quot;336&quot;: &quot;TIM (orig.)&quot;, &quot;337&quot;: &quot;TIM (orig.)&quot;,\n            &quot;338&quot;: &quot;TIM (orig.)&quot;, &quot;339&quot;: &quot;TIM (orig.)&quot;,\n            &quot;340&quot;: &quot;WindTre (orig.)&quot;, &quot;341&quot;: &quot;WindTre (orig.)&quot;,\n            &quot;342&quot;: &quot;WindTre (orig.)&quot;, &quot;345&quot;: &quot;Vodafone (orig.)&quot;,\n            &quot;346&quot;: &quot;Vodafone (orig.)&quot;, &quot;347&quot;: &quot;Vodafone (orig.)&quot;,\n            &quot;348&quot;: &quot;Vodafone (orig.)&quot;, &quot;349&quot;: &quot;Vodafone (orig.)&quot;,\n            &quot;350&quot;: &quot;Iliad (orig.)&quot;, &quot;351&quot;: &quot;Iliad (orig.)&quot;,\n            &quot;370&quot;: &quot;Iliad (orig.)&quot;, &quot;371&quot;: &quot;WindTre (orig.)&quot;,\n            &quot;373&quot;: &quot;WindTre (orig.)&quot;, &quot;375&quot;: &quot;WindTre (orig.)&quot;,\n            &quot;377&quot;: &quot;WindTre (orig.)&quot;, &quot;380&quot;: &quot;WindTre (orig.)&quot;,\n            &quot;388&quot;: &quot;Vodafone (orig.)&quot;, &quot;389&quot;: &quot;Vodafone (orig.)&quot;,\n            &quot;390&quot;: &quot;TIM (orig.)&quot;, &quot;391&quot;: &quot;TIM (orig.)&quot;,\n            &quot;392&quot;: &quot;Vodafone (orig.)&quot;, &quot;393&quot;: &quot;TIM (orig.)&quot;,\n        }\n        prefisso3 = locale[:3]\n        operatore = operatori.get(prefisso3, &quot;Operatore non mappato&quot;)\n        return f&quot;Mobile IT – Prefisso {prefisso3} ({operatore}) [MNP: potrebbe essere cambiato]&quot;\n    elif locale.startswith(&quot;0&quot;):\n        return f&quot;Fisso IT – Prefisso area {locale[:2 if locale[1]!=&#39;0&#39; else 3]}&quot;\n    elif locale.startswith(&quot;89&quot;) or locale.startswith(&quot;80&quot;):\n        return &quot;Numero speciale IT (premium/gratuito)&quot;\n    return &quot;Formato non riconosciuto&quot;\n\n\nif __name__ == &quot;__main__&quot;:\n    numero_input = input(&quot;Numero da analizzare (es. +39 333 1234567): &quot;).strip()\n    e164 = normalizza(numero_input)\n\n    print(f&quot;\\n{&#39;=&#39;*60}&quot;)\n    print(f&quot;  OSINT PHONE PIVOT – +{e164}&quot;)\n    print(f&quot;{&#39;=&#39;*60}\\n&quot;)\n    print(f&quot;  Formato E.164:  +{e164}&quot;)\n    print(f&quot;  Analisi:        {analizza_prefisso_it(e164)}\\n&quot;)\n\n    print(&quot;🔗 Link per la ricerca (verificare manualmente):\\n&quot;)\n    for servizio, link in genera_link(e164).items():\n        print(f&quot;  {servizio:&lt;25} {link}&quot;)\n    print()</code></pre>\n<hr />\n<h2 id=\"lavorare-con-contatti-multipli\">4. Lavorare con contatti\nmultipli</h2>\n<h3 id=\"scenari-di-ricerca-su-liste-di-numeri\">4.1 Scenari di ricerca su\nliste di numeri</h3>\n<p>In alcune indagini (sicurezza aziendale, anti-frode, giornalismo\ninvestigativo) si lavora con <strong>liste di numeri</strong> piuttosto\nche con un singolo numero. Esempi:</p>\n<ul>\n<li>Lista dei numeri di un’organizzazione sospetta ricavata da un\nleak.</li>\n<li>Lista di numeri di telefono da verificare come parte di una due\ndiligence.</li>\n<li>Numeri estratti da un documento o da un database pubblico.</li>\n<li>Numeri associati a una rete di account social.</li>\n</ul>\n<h3 id=\"normalizzazione-di-una-lista-di-numeri\">4.2 Normalizzazione di\nuna lista di numeri</h3>\n<p>Il primo passo è <strong>normalizzare</strong> tutti i numeri in\nformato E.164, eliminando formati inconsistenti:</p>\n<pre class=\"python\"><code>#!/usr/bin/env python3\n&quot;&quot;&quot;\nnormalize_phones.py – Normalizza una lista di numeri in formato E.164.\nInput: file di testo con un numero per riga (qualsiasi formato)\nOutput: file CSV con numero originale e numero normalizzato\nRichiede: pip3 install phonenumbers\n&quot;&quot;&quot;\nimport csv\nimport sys\nimport phonenumbers  # pip3 install phonenumbers\nfrom pathlib import Path\n\n\ndef normalizza_phonenumbers(numero_raw: str, paese_default: str = &quot;IT&quot;) -&gt; str | None:\n    &quot;&quot;&quot;\n    Normalizza un numero usando la libreria phonenumbers di Google.\n    Restituisce il numero in formato E.164 o None se non valido.\n    &quot;&quot;&quot;\n    try:\n        parsed = phonenumbers.parse(numero_raw, paese_default)\n        if phonenumbers.is_valid_number(parsed):\n            return phonenumbers.format_number(\n                parsed, phonenumbers.PhoneNumberFormat.E164\n            )\n        return None\n    except phonenumbers.phonenumberutil.NumberParseException:\n        return None\n\n\ndef processa_lista(file_input: str, file_output: str, paese: str = &quot;IT&quot;) -&gt; None:\n    &quot;&quot;&quot;Processa una lista di numeri e salva i risultati normalizzati.&quot;&quot;&quot;\n    input_path = Path(file_input)\n    if not input_path.exists():\n        print(f&quot;⚠ File non trovato: {file_input}&quot;); return\n\n    numeri_raw = [r.strip() for r in input_path.read_text(encoding=&quot;utf-8&quot;).splitlines()\n                  if r.strip()]\n\n    risultati = []\n    validi = 0\n    for n in numeri_raw:\n        normalizzato = normalizza_phonenumbers(n, paese)\n        stato = &quot;valido&quot; if normalizzato else &quot;invalido&quot;\n        if normalizzato:\n            validi += 1\n        risultati.append({\n            &quot;originale&quot;: n,\n            &quot;e164&quot;: normalizzato or &quot;&quot;,\n            &quot;stato&quot;: stato,\n        })\n\n    with open(file_output, &quot;w&quot;, newline=&quot;&quot;, encoding=&quot;utf-8&quot;) as f:\n        writer = csv.DictWriter(f, fieldnames=[&quot;originale&quot;, &quot;e164&quot;, &quot;stato&quot;])\n        writer.writeheader()\n        writer.writerows(risultati)\n\n    print(f&quot;✔ Processati {len(numeri_raw)} numeri: {validi} validi, &quot;\n          f&quot;{len(numeri_raw)-validi} invalidi&quot;)\n    print(f&quot;  Output: {file_output}&quot;)\n\n\nif __name__ == &quot;__main__&quot;:\n    file_in = sys.argv[1] if len(sys.argv) &gt; 1 else input(&quot;File di input: &quot;)\n    file_out = file_in.replace(&quot;.txt&quot;, &quot;_normalizzati.csv&quot;)\n    paese = input(&quot;Paese default (es. IT, US, DE) [IT]: &quot;).strip() or &quot;IT&quot;\n    processa_lista(file_in, file_out, paese)</code></pre>\n<h3 id=\"verifica-in-batch-whatsapp\">4.3 Verifica in batch: WhatsApp</h3>\n<p>WhatsApp permette una verifica indiretta dell’esistenza di un numero\ntramite l’URL <code>https://wa.me/NUMERO</code>. Con uno script Python\nsi può automatizzare il controllo, ma <strong>attenzione ai ToS di\nWhatsApp</strong>: l’automazione è vietata e può portare al ban del\nnumero usato per la verifica.</p>\n<p><strong>Alternativa lecita</strong>: usare le API ufficiali di\nWhatsApp Business (per chi ha un account business verificato).</p>\n<h3 id=\"verifica-in-batch-carrier-lookup\">4.4 Verifica in batch: carrier\nlookup</h3>\n<p>Per liste di poche centinaia di numeri, è praticabile l’uso dell’API\nNumVerify (piano gratuito: 100/mese; piano base: 10.000/mese):</p>\n<pre class=\"python\"><code>#!/usr/bin/env python3\n&quot;&quot;&quot;\nbatch_carrier_lookup.py – Carrier lookup in batch via NumVerify.\nRichiede: pip3 install requests\n          API key su https://numverify.com\n&quot;&quot;&quot;\nimport csv\nimport os\nimport time\nimport requests\n\nAPI_KEY = os.environ.get(&quot;NUMVERIFY_API_KEY&quot;, &quot;&quot;)\nBASE = &quot;http://apilayer.net/api/validate&quot;\nPAUSA = 1.0  # secondi tra le richieste\n\n\ndef lookup(numero_e164: str) -&gt; dict:\n    &quot;&quot;&quot;Carrier lookup per un singolo numero (E.164 senza il +).&quot;&quot;&quot;\n    n = numero_e164.lstrip(&quot;+&quot;)\n    r = requests.get(\n        BASE,\n        params={&quot;access_key&quot;: API_KEY, &quot;number&quot;: n, &quot;format&quot;: 1},\n        timeout=10,\n    )\n    r.raise_for_status()\n    return r.json()\n\n\ndef processa_csv(file_input: str, file_output: str) -&gt; None:\n    &quot;&quot;&quot;\n    Legge un CSV con colonna &#39;e164&#39; e aggiunge carrier info.\n    Prodotto da normalize_phones.py.\n    &quot;&quot;&quot;\n    with open(file_input, encoding=&quot;utf-8&quot;) as f:\n        righe = list(csv.DictReader(f))\n\n    numeri_validi = [r for r in righe if r.get(&quot;stato&quot;) == &quot;valido&quot; and r.get(&quot;e164&quot;)]\n    print(f&quot;🔍 Lookup per {len(numeri_validi)} numeri validi...&quot;)\n\n    risultati = []\n    for i, r in enumerate(numeri_validi, 1):\n        e164 = r[&quot;e164&quot;]\n        try:\n            dati = lookup(e164)\n            r.update({\n                &quot;line_type&quot;: dati.get(&quot;line_type&quot;, &quot;&quot;),\n                &quot;carrier&quot;: dati.get(&quot;carrier&quot;, &quot;&quot;),\n                &quot;location&quot;: dati.get(&quot;location&quot;, &quot;&quot;),\n                &quot;country&quot;: dati.get(&quot;country_name&quot;, &quot;&quot;),\n            })\n            print(f&quot;  [{i}/{len(numeri_validi)}] {e164}: {dati.get(&#39;carrier&#39;, &#39;N/A&#39;)} ({dati.get(&#39;line_type&#39;, &#39;&#39;)})&quot;)\n        except Exception as e:\n            r.update({&quot;line_type&quot;: &quot;error&quot;, &quot;carrier&quot;: str(e), &quot;location&quot;: &quot;&quot;, &quot;country&quot;: &quot;&quot;})\n            print(f&quot;  [{i}/{len(numeri_validi)}] {e164}: ⚠ {e}&quot;)\n        risultati.append(r)\n        time.sleep(PAUSA)\n\n    # Scrivi output\n    campi = list(risultati[0].keys()) if risultati else []\n    with open(file_output, &quot;w&quot;, newline=&quot;&quot;, encoding=&quot;utf-8&quot;) as f:\n        writer = csv.DictWriter(f, fieldnames=campi)\n        writer.writeheader()\n        writer.writerows(risultati)\n    print(f&quot;\\n✔ Risultati salvati in {file_output}&quot;)\n\n\nif __name__ == &quot;__main__&quot;:\n    file_in = input(&quot;CSV di input (da normalize_phones.py): &quot;)\n    processa_csv(file_in, file_in.replace(&quot;.csv&quot;, &quot;_carrier.csv&quot;))</code></pre>\n<h3 id=\"de-anonimizzare-una-lista-il-pivot-rubrica\">4.5 De-anonimizzare\nuna lista: il pivot rubrica</h3>\n<p>Un metodo OSINT avanzato per lavorare con liste di numeri è il\n<strong>pivot rubrica</strong>:</p>\n<ol type=\"1\">\n<li>Crei un account di test su una piattaforma social (es. Telegram,\nWhatsApp Business test).</li>\n<li>Importi la lista di numeri come contatti.</li>\n<li>La piattaforma ti mostra quali numeri corrispondono ad account\nregistrati, con nome visualizzato e foto.</li>\n</ol>\n<blockquote>\n<p><strong>Avvertenza etica e legale:</strong> questa tecnica è molto\ninvasiva e potenzialmente contraria ai ToS delle piattaforme e al GDPR.\nVa usata solo in contesti professionali con adeguata base giuridica (es.\nindagini aziendali con autorizzazione, indagini giornalistiche di\ninteresse pubblico). Non è appropriata per curiosità personale.</p>\n</blockquote>\n<hr />\n<h2 id=\"b2b-ricerca-email-e-numeri-telefonici-in-ambito-aziendale\">5.\nB2B: ricerca email e numeri telefonici in ambito aziendale</h2>\n<h3 id=\"introduzione-al-contesto-b2b\">5.1 Introduzione al contesto\nB2B</h3>\n<p>In ambito <strong>B2B</strong> (Business-to-Business) e nella due\ndiligence aziendale, la ricerca OSINT si sposta dal singolo individuo\nverso l’organizzazione:</p>\n<ul>\n<li>Trovare l’email del responsabile acquisti di un’azienda.</li>\n<li>Verificare i numeri di contatto pubblicati da una società.</li>\n<li>Identificare i decision maker di un’organizzazione target.</li>\n<li>Mappare la struttura dei contatti di un’azienda concorrente.</li>\n</ul>\n<p>Questa è anche la base del <strong>social engineering</strong>\n(Lezione 12): prima di costruire un pretexting, devi sapere a chi stai\nparlando e quali contatti hai.</p>\n<h3 id=\"fonti-primarie-per-la-ricerca-b2b-in-italia\">5.2 Fonti primarie\nper la ricerca B2B in Italia</h3>\n<p><strong>Registro delle Imprese / InfoCamere (CCIAA):</strong> - Ogni\nazienda italiana è iscritta al Registro delle Imprese. - Dati\ndisponibili: sede legale, numero di telefono della sede, indirizzo PEC,\namministratori, soci, oggetto sociale, bilanci (per le SRL/SpA). -\nAccesso: https://www.registroimprese.it (alcune informazioni gratuite,\nvisure complete a pagamento: ~€6).</p>\n<p><strong>INI-PEC:</strong> - Indice Nazionale degli Indirizzi PEC di\nimprese e professionisti. - Accesso gratuito: https://www.inipec.gov.it\n- Cerca per nome azienda o codice fiscale → ottieni l’indirizzo PEC\nufficiale.</p>\n<p><strong>ANAC – Autorità Nazionale Anticorruzione:</strong> - Bandi,\nappalti, sanzioni. Spesso include contatti dei responsabili di\nprocedura. - https://www.anticorruzione.it</p>\n<p><strong>Portale ATECO:</strong> - Classifica le aziende per attività\neconomica. Utile per trovare aziende in un settore specifico.</p>\n<p><strong>Albo dei Dottori Commercialisti e degli Esperti Contabili,\nOAI, OdA, etc.:</strong> - Per professionisti con albo obbligatorio.</p>\n<h3 id=\"linkedin-lo-strumento-b2b-per-eccellenza\">5.3 LinkedIn: lo\nstrumento B2B per eccellenza</h3>\n<p><strong>LinkedIn</strong> è la fonte primaria per trovare email e\nnumeri di professionisti:</p>\n<p><strong>Ricerca per azienda:</strong></p>\n<pre><code>site:linkedin.com/in &quot;nome azienda&quot; &quot;titolo&quot; &quot;Milano&quot;</code></pre>\n<p><strong>Google Dork per LinkedIn:</strong></p>\n<pre><code>site:linkedin.com/in &quot;direttore vendite&quot; &quot;Rossi SpA&quot;\nsite:linkedin.com/company &quot;example srl&quot;</code></pre>\n<p><strong>Estrazione email da LinkedIn:</strong> Molti profili LinkedIn\nmostrano l’email di contatto agli utenti collegati (1° grado). Alcuni\nstrumenti (come <strong>Hunter.io</strong>) estraggono pattern email da\nLinkedIn senza dover stabilire connessioni.</p>\n<p><strong>LinkedIn Sales Navigator</strong> (a pagamento): permette\nricerche avanzate per settore, dimensione aziendale, titolo, geografia.\nÈ lo strumento usato dai commerciali, ma è utile anche per l’OSINT.</p>\n<h3 id=\"hunter.io-per-il-b2b\">5.4 Hunter.io per il B2B</h3>\n<p>Abbiamo già visto Hunter nella Lezione 4. Nel contesto B2B è ancora\npiù potente:</p>\n<p><strong>Ricerca del formato email di un’azienda:</strong></p>\n<pre><code>https://hunter.io/search/DOMINIO.IT</code></pre>\n<p>Hunter restituisce: - Il <strong>pattern</strong> email usato\ndall’azienda (es. <code>{first}.{last}@azienda.it</code>). - Le email\ntrovate pubblicamente sui siti web, documenti, comunicati. - Il numero\ndi email nel database. - Le fonti da cui sono state estratte.</p>\n<p><strong>Esempio pratico:</strong> - Cerchi <code>illimity.it</code>\nsu Hunter. - Hunter ti dice che il pattern è\n<code>{first}.{last}@illimity.it</code>. - Cerchi su LinkedIn il nome\ndel CFO: “Roberto Ferrari”. - Generi l’email:\n<code>roberto.ferrari@illimity.it</code>. - Verifichi con Hunter Email\nVerifier.</p>\n<h3 id=\"snov.io-e-apollo.io\">5.5 Snov.io e Apollo.io</h3>\n<p><strong>Snov.io</strong> (https://snov.io) e\n<strong>Apollo.io</strong> (https://www.apollo.io) sono strumenti di\nsales intelligence usati dalle aziende per trovare contatti commerciali.\nPer l’OSINT B2B sono utili perché:</p>\n<ul>\n<li>Database di oltre 200 milioni di contatti aziendali.</li>\n<li>Ricerca per azienda, settore, titolo, paese.</li>\n<li>Verifica email integrata.</li>\n<li>Piano gratuito con crediti limitati.</li>\n</ul>\n<h3 id=\"numeri-di-telefono-aziendali-fonti-dirette\">5.6 Numeri di\ntelefono aziendali: fonti dirette</h3>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Fonte</th>\n<th>Cosa cerca</th>\n<th>Accesso</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Sito web dell’azienda</strong></td>\n<td>Numero principale, contatti dei reparti</td>\n<td>Diretto</td>\n</tr>\n<tr>\n<td><strong>Google My Business</strong></td>\n<td>Numero e indirizzo del punto vendita/ufficio</td>\n<td>Google Maps</td>\n</tr>\n<tr>\n<td><strong>Pagine Gialle / Kompass</strong></td>\n<td>Numeri aziendali italiani</td>\n<td>Diretto</td>\n</tr>\n<tr>\n<td><strong>Registro Imprese</strong></td>\n<td>Numero della sede legale</td>\n<td>A pagamento (visura)</td>\n</tr>\n<tr>\n<td><strong>LinkedIn</strong></td>\n<td>Numero di cellulare (se condiviso)</td>\n<td>Accesso con account</td>\n</tr>\n<tr>\n<td><strong>Hunter.io</strong></td>\n<td>Solo email (non numeri)</td>\n<td>Parzialmente gratuito</td>\n</tr>\n<tr>\n<td><strong>Rocket Reach</strong></td>\n<td>Email + telefono da fonti aggregatr</td>\n<td>A pagamento</td>\n</tr>\n<tr>\n<td><strong>ZoomInfo</strong></td>\n<td>Database B2B completo (USA-centrico)</td>\n<td>A pagamento</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"la-tecnica-del-contatto-diretto-aziendale\">5.7 La tecnica del\n“contatto diretto” aziendale</h3>\n<p>Spesso la ricerca più efficace per trovare il numero diretto di un\nprofessionista è la più semplice:</p>\n<ol type=\"1\">\n<li><strong>Chiama il centralino</strong>: molte aziende hanno un\ncentralino che passa le chiamate ai dipendenti.</li>\n<li><strong>Cerca l’annuncio di lavoro</strong>: gli annunci di lavoro\ndell’azienda spesso includono il contatto del referente HR.</li>\n<li><strong>Cerca comunicati stampa</strong>: i comunicati aziendali\nincludono spesso email e numeri dei responsabili comunicazione.</li>\n<li><strong>Cerca presentazioni e slide</strong>: molti professionisti\ncaricano le proprie slide con i contatti inclusi.</li>\n</ol>\n<pre><code>site:example.it filetype:pdf &quot;contatti&quot; OR &quot;contact&quot; OR &quot;dott.&quot; OR &quot;ing.&quot;</code></pre>\n<h3 id=\"script-python-b2b-contact-finder\">5.8 Script Python: B2B contact\nfinder</h3>\n<pre class=\"python\"><code>#!/usr/bin/env python3\n&quot;&quot;&quot;\nb2b_contact_finder.py – Cerca contatti B2B usando fonti aperte.\nGenera query di ricerca pronte e verifica con Hunter.io (API key necessaria).\nRichiede: pip3 install requests\n&quot;&quot;&quot;\nimport os\nimport requests\nfrom urllib.parse import quote\n\nHUNTER_KEY = os.environ.get(&quot;HUNTER_API_KEY&quot;, &quot;&quot;)\n\n\ndef cerca_hunter_dominio(dominio: str) -&gt; dict | None:\n    &quot;&quot;&quot;Cerca il pattern email e i contatti trovati per un dominio.&quot;&quot;&quot;\n    if not HUNTER_KEY:\n        print(&quot;⚠ HUNTER_API_KEY non impostata: skip Hunter.io&quot;)\n        return None\n    r = requests.get(\n        &quot;https://api.hunter.io/v2/domain-search&quot;,\n        params={&quot;domain&quot;: dominio, &quot;api_key&quot;: HUNTER_KEY, &quot;limit&quot;: 10},\n        timeout=15,\n    )\n    r.raise_for_status()\n    return r.json().get(&quot;data&quot;, {})\n\n\ndef genera_query(nome: str, cognome: str, azienda: str, dominio: str) -&gt; list[str]:\n    &quot;&quot;&quot;Genera query di ricerca per trovare contatti B2B.&quot;&quot;&quot;\n    queries = [\n        f&#39;&quot;{nome} {cognome}&quot; site:linkedin.com/in&#39;,\n        f&#39;&quot;{nome} {cognome}&quot; &quot;{azienda}&quot; site:linkedin.com&#39;,\n        f&#39;&quot;{nome} {cognome}&quot; &quot;@{dominio}&quot;&#39;,\n        f&#39;&quot;{nome} {cognome}&quot; &quot;{azienda}&quot; filetype:pdf&#39;,\n        f&#39;site:{dominio} &quot;{nome}&quot; OR &quot;{cognome}&quot;&#39;,\n        f&#39;&quot;{azienda}&quot; &quot;direttore&quot; OR &quot;responsabile&quot; OR &quot;manager&quot; site:linkedin.com/in&#39;,\n    ]\n    return queries\n\n\ndef genera_email_ipotesi(nome: str, cognome: str, dominio: str) -&gt; list[str]:\n    &quot;&quot;&quot;Genera ipotesi di email aziendali.&quot;&quot;&quot;\n    n, c = nome.lower(), cognome.lower()\n    n1, c1 = n[0], c[0]\n    pattern = [\n        f&quot;{n}.{c}@{dominio}&quot;,\n        f&quot;{n1}.{c}@{dominio}&quot;,\n        f&quot;{n}.{c1}@{dominio}&quot;,\n        f&quot;{n}{c}@{dominio}&quot;,\n        f&quot;{c}.{n}@{dominio}&quot;,\n        f&quot;{c}@{dominio}&quot;,\n        f&quot;{n}@{dominio}&quot;,\n    ]\n    return pattern\n\n\nif __name__ == &quot;__main__&quot;:\n    print(&quot;=== B2B Contact Finder ===\\n&quot;)\n    nome = input(&quot;Nome: &quot;).strip()\n    cognome = input(&quot;Cognome: &quot;).strip()\n    azienda = input(&quot;Nome azienda: &quot;).strip()\n    dominio = input(&quot;Dominio (es. example.it): &quot;).strip()\n\n    print(f&quot;\\n📋 Query di ricerca:\\n&quot;)\n    for q in genera_query(nome, cognome, azienda, dominio):\n        enc = quote(q)\n        print(f&quot;  Google: https://www.google.com/search?q={enc}&quot;)\n    print()\n\n    # Hunter.io\n    dati_hunter = cerca_hunter_dominio(dominio)\n    if dati_hunter:\n        pattern = dati_hunter.get(&quot;pattern&quot;, &quot;non trovato&quot;)\n        print(f&quot;🎯 Pattern Hunter.io per {dominio}: {pattern}&quot;)\n        emails = [e[&quot;value&quot;] for e in dati_hunter.get(&quot;emails&quot;, [])]\n        if emails:\n            print(f&quot;   Email trovate: {&#39;, &#39;.join(emails[:5])}&quot;)\n        print()\n\n    # Ipotesi email\n    print(f&quot;📧 Ipotesi email per {nome} {cognome} @{dominio}:&quot;)\n    for email in genera_email_ipotesi(nome, cognome, dominio):\n        print(f&quot;  {email}&quot;)</code></pre>\n<hr />\n<h2 id=\"box-legale-ed-etico\">⚖️ Box legale ed etico</h2>\n<h3 id=\"callerid-e-gdpr-una-tensione-irrisolta\">CallerID e GDPR: una\ntensione irrisolta</h3>\n<p>I servizi CallerID come Truecaller e GetContact operano in una\n<strong>zona grigia del GDPR</strong> particolarmente delicata.</p>\n<p><strong>Il problema del consenso:</strong> - Chi scarica l’app e\ncarica la propria rubrica dà il consenso al trattamento dei propri dati.\nMa i numeri nella rubrica appartengono ad altre persone che non hanno\nmai dato consenso. - Il Garante per la Protezione dei Dati Personali\nitaliano e l’EDPB (European Data Protection Board) hanno più volte\nsottolineato che questo meccanismo è problematico. -\n<strong>Truecaller</strong>, in risposta alle contestazioni europee, ha\nintrodotto la possibilità di richiedere la rimozione del proprio numero\ndal database (https://www.truecaller.com/unlisting).</p>\n<p><strong>L’analista OSINT:</strong> - Può usare Truecaller e\nGetContact per ricerche su numeri nel contesto di un’indagine con base\ngiuridica (indagine aziendale, giornalismo di interesse pubblico,\nsicurezza informatica). - Non può usarli per soddisfare curiosità\npersonale o per monitorare persone nella propria vita privata. - Deve\ndocumentare la base giuridica dell’indagine.</p>\n<h3 id=\"comunicazioni-elettroniche-e-intercettazioni\">Comunicazioni\nelettroniche e intercettazioni</h3>\n<p>Il <strong>Codice delle comunicazioni elettroniche</strong> (D.Lgs.\n259/2003) e il <strong>Codice Penale</strong> (art. 617 e seguenti)\nvietano: - Intercettare conversazioni telefoniche senza autorizzazione\ngiudiziaria. - Installare app-spia su telefoni altrui (stalkerware). -\nUsare IMSI catcher o stingray (dispositivi che simulano una BTS per\nintercettare traffico GSM).</p>\n<p>Queste attività sono <strong>reati gravi</strong>, indipendentemente\ndal fatto che vengano svolte “solo per vedere”.</p>\n<h3\nid=\"numeri-voip-e-sim-prepagate-responsabilità-del-ricercatore\">Numeri\nVoIP e SIM prepagate: responsabilità del ricercatore</h3>\n<p>In Italia, le SIM prepagate richiedono documento d’identità per la\nregistrazione (D.Lgs. 109/2008 e successive modifiche). I numeri VoIP\nsono soggetti a regole variabili a seconda del provider.</p>\n<p>Se durante un’indagine trovi un numero VoIP o una SIM prepagata\nanonima, questo è un <strong>dato di fatto</strong> (il soggetto ha\nscelto di anonimizzarsi) che va incluso nel report come tale, senza\ntentare di bypassare l’anonimizzazione con metodi illegali.</p>\n<h3 id=\"b2b-e-gdpr-i-dati-professionali\">B2B e GDPR: i dati\nprofessionali</h3>\n<p>Una nota importante: il GDPR si applica anche ai dati di\n<strong>contatto professionale</strong> (email aziendale, numero\ndiretto). Tuttavia, il considerando 14 del GDPR chiarisce che le persone\ngiuridiche non sono direttamente tutelate dal GDPR. I dati di contatto\ndi persone fisiche in contesto lavorativo (nome, email aziendale, numero\ndiretto) sono comunque dati personali ma il trattamento per finalità di\ncomunicazione business-to-business trova solitamente base giuridica nel\n<strong>legittimo interesse</strong> (art. 6(1)(f) GDPR), purché: - Il\ndato sia trattato solo per finalità professionali pertinenti. - Il\nsoggetto possa opporsi. - Il trattamento non prevalga sugli interessi\ndell’interessato.</p>\n<hr />\n<h2 id=\"caso-di-studio-il-numero-che-non-doveva-esistere\">Caso di\nstudio: “Il numero che non doveva esistere”</h2>\n<blockquote>\n<p><em>Dati fittizi.</em></p>\n</blockquote>\n<p><strong>Scenario.</strong> Un’azienda di e-commerce riceve ordini\ntruffaldini ripetuti da diversi account, tutti creati con email\nusa-e-getta. L’unico elemento comune è un numero di telefono di verifica\nSMS sempre diverso, ma con un pattern: tutti iniziano con\n<code>+1876</code> (prefisso della Giamaica) e sono numeri VoIP.</p>\n<p><strong>Requisito.</strong> Identificare il modus operandi e, se\npossibile, tracciare l’origine delle frodi.</p>\n<p><strong>Pianificazione – EEI:</strong> 1. I numeri\n<code>+1876-XXX-XXXX</code> sono reali o VoIP? 2. Tutti i numeri\nappartengono allo stesso operatore/servizio? 3. Ci sono account social o\nprofili online associati? 4. Esiste un pattern nei timing degli\nordini?</p>\n<p><strong>Step 1 – Carrier Lookup.</strong></p>\n<p>Lookup via NumVerify di tre numeri del pattern: tutti restituiscono\n<code>line_type: voip</code>, carrier <code>Vonage API</code> (un\nfornitore di API SMS per sviluppatori).</p>\n<p><strong>Step 2 – Ricerca su OSINT Industries.</strong></p>\n<p>I numeri non appaiono su nessuna piattaforma social. Nessun profilo\nWhatsApp associato.</p>\n<p><strong>Step 3 – Truecaller e GetContact.</strong></p>\n<p>Nessun risultato per nessuno dei numeri: confermano essere numeri\nvirtuali mai usati per chiamate reali.</p>\n<p><strong>Step 4 – Analisi temporale degli ordini.</strong></p>\n<p>Gli ordini arrivano sempre tra le 02:00 e le 05:00 (ora italiana),\ncon frequenza di 1-3 al giorno, mai nei weekend. L’orario UTC\ncorrispondente è 00:00-03:00 UTC, che corrisponde alle ore diurne negli\nUSA orientali o America Centrale.</p>\n<p><strong>Step 5 – Analisi tecnica delle richieste HTTP.</strong></p>\n<p>L’IP degli ordini (fornito dal sistema e-commerce) risulta su Shodan\ncome un exit node di una VPN commerciale (NordVPN, server in Polonia).\nL’User-Agent è sempre lo stesso: <code>Python-requests/2.28.1</code> →\nordini automatizzati con uno script Python.</p>\n<p><strong>Analisi.</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Prova</th>\n<th>Classificazione</th>\n<th>Inferenza</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Numeri VoIP Vonage API</td>\n<td>A1</td>\n<td>Automazione: l’autore usa API per generare numeri</td>\n</tr>\n<tr>\n<td>Nessuna presenza su CallerID/social</td>\n<td>A2</td>\n<td>Numeri creati ad hoc, non personali</td>\n</tr>\n<tr>\n<td>Orari 00:00-03:00 UTC</td>\n<td>B2</td>\n<td>Autore probabilmente in fuso UTC-5/-6 (Americas)</td>\n</tr>\n<tr>\n<td>User-Agent Python-requests</td>\n<td>A1</td>\n<td>Script automatizzato</td>\n</tr>\n<tr>\n<td>VPN exit in Polonia</td>\n<td>B3</td>\n<td>Oscuramento dell’origine reale</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Conclusioni nel report.</strong></p>\n<blockquote>\n<p>“È <strong>quasi certo</strong> (confidenza <strong>alta</strong>)\nche gli ordini fraudolenti siano generati da uno script automatizzato\nche usa l’API Vonage per ottenere numeri virtuali usa-e-getta a scopo di\nverifica SMS. L’autore opera probabilmente da un fuso UTC-5/-6, usa una\nVPN per nascondere l’IP reale e non ha presenza su piattaforme CallerID\no social. Si raccomanda di bloccare: (1) numeri di telefono con prefisso\n<code>+1876</code> nella fase di verifica SMS; (2) richieste con\nUser-Agent <code>Python-requests</code>; (3) IP degli exit node\nVonage/VPN noti (lista disponibile su servizi come IPinfo o MaxMind). Si\nraccomanda anche di presentare un esposto alle autorità (Polizia\nPostale) con i log forniti.”</p>\n</blockquote>\n<hr />\n<h2 id=\"esercizi-pratici\">Esercizi pratici</h2>\n<p><strong>Esercizio 1 – Struttura del numero (15 min)</strong> Analizza\nquesti numeri e determina: paese, tipo (mobile/fisso/VoIP), operatore\nprobabile per i numeri italiani:</p>\n<pre><code>+39 06 12345678\n+39 350 1234567\n+1 555 123 4567\n+44 20 7946 0958\n+39 800 123 456</code></pre>\n<p><strong>Esercizio 2 – Reverse lookup (20 min)</strong> Prendi il\nnumero pubblico del Comune di Milano (trovalo sul sito istituzionale).\nCercalo su Truecaller, ChiHaChiamato e NumLookup. Documenta cosa\nrestituisce ciascun servizio e confronta.</p>\n<p><strong>Esercizio 3 – Script phone_pivot.py (15 min)</strong> Lancia\nlo script <code>phone_pivot.py</code> sul tuo numero di telefono. Apri i\nlink generati e verifica cosa trovano Truecaller e GetContact sul tuo\nnumero.</p>\n<p><strong>Esercizio 4 – Normalizzazione di una lista (30 min)</strong>\nCrea un file <code>numeri_test.txt</code> con 10 numeri in formati\ndiversi (es. <code>06-12345678</code>, <code>+39 333 1234567</code>,\n<code>0039 02 12345678</code>, <code>3381234567</code>). Lancia\n<code>normalize_phones.py</code> e verifica la normalizzazione.</p>\n<p><strong>Esercizio 5 – B2B: trova i contatti di un’azienda pubblica\n(30 min)</strong> Scegli un’azienda italiana con sito web (es. una PMI\nlocale). Usa Hunter.io, la ricerca su LinkedIn e i Google dork per\ntrovare il pattern email, almeno tre contatti con nome e ruolo, e il\nnumero di telefono diretto (non solo il centralino). Documenta ogni\npasso.</p>\n<p><strong>Esercizio 6 – Carrier lookup via API (30 min)</strong>\nRegistra un account gratuito su NumVerify. Ottieni la tua API key. Usa\nlo script <code>numverify_lookup.py</code> per fare il lookup di tre\nnumeri diversi (il tuo, il numero del tuo medico di base, il numero di\nun’azienda). Documenta i risultati.</p>\n<hr />\n","quiz":[{"q":"Cosa garantisce la Mobile Number Portability (MNP)?","opts":{"a":"Che il numero sia sempre mobile","b":"Che il numero rimanga lo stesso quando si cambia operatore","c":"Che il numero sia portabile all'estero gratuitamente","d":"Che l'operatore non possa vedere le chiamate"},"correct":"b","why":"La MNP permette di tenere lo stesso numero cambiando operatore: per questo il prefisso non indica più con certezza il gestore"},{"q":"Come funzionano i servizi CallerID come Truecaller?","opts":{"a":"Intercettano le chiamate in tempo reale","b":"Raccolgono le rubriche degli utenti per costruire un database nome↔numero","c":"Accedono al database dell'operatore telefonico","d":"Usano solo dati pubblici dei social network"},"correct":"b","why":"I servizi CallerID costruiscono il database nome↔numero raccogliendo le rubriche dei propri utenti"},{"q":"Quale operatore è associato in origine al prefisso mobile italiano 350?","opts":{"a":"TIM","b":"Vodafone","c":"WindTre","d":"Iliad"},"correct":"d","why":"Il prefisso 350 è stato assegnato in origine a Iliad"},{"q":"GetContact si distingue da Truecaller perché:","opts":{"a":"È completamente gratuito","b":"Mostra tutti i tag con cui il numero è stato salvato in rubrica","c":"Funziona solo in Italia","d":"Non richiede installazione dell'app"},"correct":"b","why":"GetContact mostra tutti i nomi (tag) con cui il numero è stato salvato nelle rubriche altrui"},{"q":"Il campo line_type: voip nel carrier lookup indica:","opts":{"a":"Il numero è su una linea VoIP, non associato a una SIM fisica","b":"Il numero non esiste","c":"Il numero è un fisso aziendale","d":"Il numero è internazionale"},"correct":"a","why":"voip indica una linea virtuale non legata a una SIM fisica, spesso usata per anonimizzarsi"},{"q":"Qual è la fonte più affidabile per trovare l'indirizzo PEC ufficiale di un'azienda italiana?","opts":{"a":"Google","b":"LinkedIn","c":"INI-PEC (inipec.gov.it)","d":"Truecaller"},"correct":"c","why":"INI-PEC è il registro ufficiale delle PEC di imprese e professionisti"},{"q":"Hunter.io, in ambito B2B, è utilizzato principalmente per:","opts":{"a":"Trovare numeri di telefono aziendali","b":"Scoprire il pattern email di un'azienda e le email dei dipendenti","c":"Verificare se un'email è in un data breach","d":"Analizzare gli header di messaggi email"},"correct":"b","why":"Hunter.io individua il pattern delle email aziendali (es. nome.cognome@) e gli indirizzi dei dipendenti"},{"q":"L'uso di IMSI catcher per intercettare traffico GSM è:","opts":{"a":"Legale se usato da privati per sicurezza personale","b":"Legale solo con VPN","c":"Un reato ai sensi degli articoli 617 e seguenti del Codice Penale","d":"Consentito per uso investigativo privato"},"correct":"c","why":"Intercettare comunicazioni con un IMSI catcher è reato (artt. 617 e seguenti c.p.)"},{"q":"In quale fuso orario si trova probabilmente un soggetto che esegue operazioni tra le 00:00 e le 03:00 UTC?","opts":{"a":"Europa centrale (CET)","b":"Asia orientale (JST)","c":"America orientale o centrale (UTC-5/-6)","d":"Australia orientale (AEST)"},"correct":"c","why":"Tra le 00:00 e le 03:00 UTC sono le 19–22 nella costa est USA: tipica attività serale americana"},{"q":"Quale strumento è più adatto per trovare i contatti diretti dei manager di un'azienda italiana?","opts":{"a":"Shodan","b":"Censys","c":"LinkedIn combinato con Hunter.io e Google Dork","d":"Truecaller"},"correct":"c","why":"La combinazione di LinkedIn, Hunter.io e Google Dork è il metodo più efficace per i contatti professionali"}]},{"title":"Telegram","html":"<h1 id=\"lezione-7-telegram-e-le-sue-specificità\">Lezione 7 – Telegram e\nle Sue Specificità</h1>\n<blockquote>\n<p><em>“Telegram non è anonimo per default. È solo più difficile da\nmonitorare di altri — finché non sai dove guardare.”</em> — ricercatore\nOSINT</p>\n</blockquote>\n<hr />\n<h2 id=\"obiettivi-di-apprendimento\">Obiettivi di apprendimento</h2>\n<p>Al termine di questa lezione sarai in grado di:</p>\n<ol type=\"1\">\n<li>comprendere la storia e l’architettura tecnica di Telegram e perché\nè una piattaforma di grande interesse OSINT;</li>\n<li>riconoscere le informazioni che si possono estrarre da utenti,\ngruppi e canali senza strumenti avanzati;</li>\n<li>usare dork specializzati per trovare link d’invito a gruppi e canali\nprivati;</li>\n<li>sfruttare siti che listano canali (TGStat, Telemetr,\nRecordedTelegram) per ricerche strutturate;</li>\n<li>usare <strong>Telepathy</strong> e <strong>TeleRecon</strong> per la\nraccolta automatizzata di dati;</li>\n<li>monitorare lo stato online/offline di un utente con script\nPython;</li>\n<li>interpretare l’ID numerico di un utente per stimare la data di\ncreazione dell’account;</li>\n<li>applicare il quadro legale GDPR e ToS di Telegram in modo\nconsapevole.</li>\n</ol>\n<hr />\n<h2 id=\"introduzione\">1. Introduzione</h2>\n<p>Telegram è diventata una delle piattaforme più studiate dagli\nanalisti OSINT per una ragione precisa: <strong>offre ambienti di\ncomunicazione semi-pubblica</strong> — canali con milioni di iscritti,\ngruppi fino a 200.000 membri, bot programmabili, API aperte — che\nnessun’altra app di messaggistica principale mette a disposizione con la\nstessa facilità.</p>\n<p>Al tempo stesso, è ampiamente usata da organizzazioni criminali,\nmovimenti estremisti, reti di disinformazione e traffici illeciti,\nproprio perché la percezione (spesso errata) di anonimato è alta.</p>\n<p>Per l’analista OSINT, Telegram è dunque sia un <strong>archivio\nricchissimo di informazioni aperte</strong> sia un ambiente in cui\nmuoversi con estrema cautela metodologica e legale.</p>\n<hr />\n<h2 id=\"cosè-telegram-e-la-sua-storia\">2. Cos’è Telegram e la sua\nstoria</h2>\n<h3 id=\"origini-e-fondatori\">2.1 Origini e fondatori</h3>\n<p><strong>Telegram</strong> è stato fondato nel 2013 dai fratelli\n<strong>Pavel Durov</strong> e <strong>Nikolai Durov</strong>, già\ncreatori del social network russo VKontakte (VK). Pavel Durov, dopo aver\nceduto il controllo di VK sotto pressione governativa, fondò Telegram\ncome piattaforma di comunicazione con focus sulla privacy e sulla\nresistenza alla censura.</p>\n<p>La sede legale di Telegram è stata spostata più volte (Berlino,\nLondra, Dubai). Dal 2021 ha sede a Dubai (EAU). Questo ha implicazioni\nimportanti per le richieste di dati da parte delle forze dell’ordine:\nTelegram risponde alle autorità solo in casi di terrorismo e solo\ntramite procedure internazionali (MLAT).</p>\n<h3 id=\"tappe-principali\">2.2 Tappe principali</h3>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Anno</th>\n<th>Evento</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2013</td>\n<td>Lancio di Telegram (agosto); crittografia MTProto sviluppata da\nNikolai Durov</td>\n</tr>\n<tr>\n<td>2014</td>\n<td>Raggiunge 50 milioni di utenti attivi mensili</td>\n</tr>\n<tr>\n<td>2015</td>\n<td>Lancio dei canali pubblici e dei supergruppi</td>\n</tr>\n<tr>\n<td>2016</td>\n<td>Lancio delle chiamate vocali crittografate</td>\n</tr>\n<tr>\n<td>2018</td>\n<td>Tentativo fallito di lancio di TON (blockchain) + ban russo poi\nrevocato nel 2020</td>\n</tr>\n<tr>\n<td>2019</td>\n<td>Proteste Hong Kong: Telegram usato massicciamente</td>\n</tr>\n<tr>\n<td>2021</td>\n<td>Raggiunge 500 milioni di utenti attivi mensili</td>\n</tr>\n<tr>\n<td>2022</td>\n<td>Russia invade l’Ucraina: Telegram diventa canale informativo\nprincipale del conflitto</td>\n</tr>\n<tr>\n<td>2023</td>\n<td>Superati 800 milioni di utenti attivi mensili; monetizzazione con\nPremium</td>\n</tr>\n<tr>\n<td>2024</td>\n<td>Arresto di Pavel Durov in Francia (agosto); Telegram aumenta la\ncooperazione con le autorità</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"architettura-tecnica-rilevante\">2.3 Architettura tecnica\nrilevante</h3>\n<p><strong>MTProto</strong>: il protocollo di crittografia proprietario\nsviluppato da Nikolai Durov. Usa crittografia simmetrica AES-256 per le\nsessioni di rete e crittografia end-to-end solo per le <strong>chat\nsegrete</strong> (non per le chat normali, i canali e i gruppi, che sono\ncrittografati in transito ma accessibili ai server Telegram).</p>\n<p><strong>Cloud storage</strong>: i messaggi di chat normali, canali e\ngruppi sono memorizzati sui server Telegram (architettura cloud). Questo\nsignifica che Telegram tecnicamente <em>può</em> accedervi. Le\n<strong>chat segrete</strong> usano E2E e non sono memorizzate sui\nserver.</p>\n<p><strong>Data center distribuiti</strong>: Telegram ha data center in\ndiverse giurisdizioni (UE, USA, Asia) per resistenza alla censura.</p>\n<hr />\n<h2 id=\"registrazione-e-creazione-dellaccount\">3. Registrazione e\ncreazione dell’account</h2>\n<h3 id=\"come-ci-si-registra-su-telegram\">3.1 Come ci si registra su\nTelegram</h3>\n<p>La registrazione a Telegram richiede: 1. Un <strong>numero di\ntelefono</strong> (per la verifica OTP via SMS o chiamata). 2. Un\n<strong>nome</strong> (non verificato: può essere falso). 3.\nOpzionalmente: un <strong>username</strong>, una <strong>foto\nprofilo</strong>, una <strong>bio</strong>.</p>\n<p>Non è richiesta nessuna email, documento d’identità o carta di\ncredito. Questo rende Telegram relativamente facile da usare in modo\npseudoanonimo.</p>\n<h3 id=\"implicazioni-per-losint\">3.2 Implicazioni per l’OSINT</h3>\n<ul>\n<li>Il numero di telefono è l’unico dato verificato: se l’operatore\ntelefonico e la giurisdizione cooperano, è il punto di partenza per\nl’identificazione legale.</li>\n<li>Il nome visualizzato è completamente falso per molti utenti: non\nfare affidamento su di esso senza corroborazione.</li>\n<li>L’<strong>username</strong> è opzionale e modificabile: come visto\nnella Lezione 4, va trattato come pseudonimo persistente ma non\nimmutabile.</li>\n<li>L’<strong>ID numerico</strong> è l’unico identificatore immutabile e\npermanente.</li>\n</ul>\n<h3 id=\"account-di-ricerca-dedicato\">3.3 Account di ricerca\ndedicato</h3>\n<p>Per fare OSINT su Telegram è <strong>indispensabile</strong> creare\nun account di ricerca dedicato, separato dal proprio account\npersonale:</p>\n<ul>\n<li>Usa un numero di telefono virtuale (es. da SMS-Activate o OnlineSIM)\no una SIM prepagata anonima.</li>\n<li>Non collegare questo account al tuo vero numero, email o dispositivi\npersonali.</li>\n<li>Usa un device dedicato o una VM per le attività di ricerca.</li>\n<li>Non usare il tuo nome o foto reale.</li>\n</ul>\n<p><strong>Perché?</strong> Quando entri in un gruppo o scarichi i\nmessaggi di un canale, il tuo account viene registrato. Se il soggetto\ndell’indagine è avversariale (es. organizzazione criminale), potrebbe\nnotare la tua presenza e contromisurare.</p>\n<hr />\n<h2 id=\"bot-su-telegram\">4. Bot su Telegram</h2>\n<h3 id=\"cosa-sono-i-bot-telegram\">4.1 Cosa sono i bot Telegram</h3>\n<p>I <strong>bot</strong> di Telegram sono account speciali gestiti da\nsoftware esterno (non da esseri umani). Sono identificati dal suffisso\n<code>bot</code> nel nome e dal flag <code>is_bot: true</code> nell’API.\nNon possono iniziare conversazioni per primi (salvo i bot di\nbroadcasting) e non vedono i messaggi degli altri utenti nei gruppi\n(salvo se menzionati o se l’admin ha concesso i permessi).</p>\n<p>I bot si creano tramite <strong><span class=\"citation\"\ndata-cites=\"BotFather\">@BotFather</span></strong>, il bot ufficiale di\nTelegram per la gestione dei bot.</p>\n<h3 id=\"tipi-di-bot-rilevanti-per-losint\">4.2 Tipi di bot rilevanti per\nl’OSINT</h3>\n<p><strong>Bot informativi / lookup:</strong> Forniscono informazioni su\nutenti, canali, numeri. Alcuni sono legittimi; molti operano con dati\nottenuti illecitamente.</p>\n<p><strong>Bot di archiviazione:</strong> Archiviano messaggi da canali\nspecifici, spesso usati per salvare contenuti prima che vengano\neliminati.</p>\n<p><strong>Bot di ricerca:</strong> Permettono di cercare messaggi,\nutenti o canali per keyword.</p>\n<p><strong>Bot di monitoring:</strong> Notificano quando viene\npubblicato un nuovo messaggio su un canale monitorato.</p>\n<h3 id=\"esempi-di-bot-utili-per-losint\">4.3 Esempi di bot utili per\nl’OSINT</h3>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Bot</th>\n<th>Funzione</th>\n<th>Legittimità</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>@BotFather</code></td>\n<td>Crea e gestisce bot; mostra info sui bot esistenti</td>\n<td>✔ Ufficiale</td>\n</tr>\n<tr>\n<td><code>@getidsbot</code></td>\n<td>Mostra ID numerico di utenti, chat, messaggi</td>\n<td>✔ Legittimo</td>\n</tr>\n<tr>\n<td><code>@username_to_id_bot</code></td>\n<td>Converte username in ID numerico</td>\n<td>✔ Legittimo</td>\n</tr>\n<tr>\n<td><code>@creationfinder_bot</code></td>\n<td>Stima la data di creazione di un account dall’ID</td>\n<td>✔ Legittimo</td>\n</tr>\n<tr>\n<td><code>@tgdb_bot</code></td>\n<td>Ricerca canali e gruppi nel DB TGStat</td>\n<td>✔ Legittimo</td>\n</tr>\n<tr>\n<td><code>@IntelligenceX_bot</code></td>\n<td>Ricerca su IntelX da Telegram</td>\n<td>✔ Legittimo (con account)</td>\n</tr>\n<tr>\n<td><code>@SangMataInfo_bot</code></td>\n<td>Storico degli username di un utente</td>\n<td>⚠ Controverso</td>\n</tr>\n<tr>\n<td><code>@EyeOfGod_bot</code> / simili</td>\n<td>Ricerca su database non autorizzati</td>\n<td>✗ Illegale</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>Regola d’oro:</strong> se un bot afferma di poter fornire\nnome completo, indirizzo, numero di telefono o dati bancari di un\nqualsiasi utente senza fonti dichiarate, sta usando database ottenuti\nillecitamente. Usarlo ti espone a responsabilità legale.</p>\n</blockquote>\n<h3 id=\"come-analizzare-un-bot-per-osint\">4.4 Come analizzare un bot per\nOSINT</h3>\n<p>Quando incontri un bot sconosciuto nel corso di un’indagine:</p>\n<ol type=\"1\">\n<li>Invia <code>/start</code> e analizza la risposta: include link a\nsiti web? Email di supporto? Username dell’autore?</li>\n<li>Cerca il nome del bot su Google:\n<code>\"@nomedelbot\" site:github.com</code> per trovare il codice\nsorgente.</li>\n<li>Usa <code>@BotFather</code> con <code>/mybots</code> (solo per bot\nche possiedi) o cerca il bot su <a\nhref=\"https://botlist.me\">Botlist.me</a>.</li>\n<li>Cerca l’username del bot su TGStat: i bot vengono talvolta\nmenzionati nei canali.</li>\n</ol>\n<hr />\n<h2 id=\"utenti-e-informazioni-rilevanti-a-fini-osint\">5. Utenti e\ninformazioni rilevanti a fini OSINT</h2>\n<h3 id=\"cosa-è-visibile-di-un-utente-telegram\">5.1 Cosa è visibile di un\nutente Telegram</h3>\n<p>Le informazioni visibili di un utente dipendono dalle sue\nimpostazioni privacy:</p>\n<table>\n<thead>\n<tr>\n<th>Informazione</th>\n<th>Visibile a</th>\n<th>Default</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Nome visualizzato</td>\n<td>Tutti</td>\n<td>Sì</td>\n</tr>\n<tr>\n<td>Username (<code>@</code>)</td>\n<td>Tutti (se impostato)</td>\n<td>Opzionale</td>\n</tr>\n<tr>\n<td>Foto profilo</td>\n<td>Tutti / Contatti / Nessuno</td>\n<td>Tutti</td>\n</tr>\n<tr>\n<td>Bio</td>\n<td>Tutti / Contatti / Nessuno</td>\n<td>Tutti</td>\n</tr>\n<tr>\n<td>Numero di telefono</td>\n<td>Tutti / Contatti / Nessuno</td>\n<td>Solo contatti</td>\n</tr>\n<tr>\n<td>Ultimo accesso</td>\n<td>Tutti / Contatti / Nessuno</td>\n<td>Contatti</td>\n</tr>\n<tr>\n<td>ID numerico</td>\n<td>Sempre (via API/bot)</td>\n<td>N/A</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"come-ottenere-lid-numerico-di-un-utente\">5.2 Come ottenere l’ID\nnumerico di un utente</h3>\n<p><strong>Metodo 1 – Via <span class=\"citation\"\ndata-cites=\"getidsbot\">@getidsbot</span>:</strong> 1. Aggiungi\n<code>@getidsbot</code> a un gruppo in cui è presente l’utente target
