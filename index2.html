sta(file_username: str, output_csv: str) -&gt; None:\n    username_list = Path(file_username).read_text().splitlines()\n    username_list = [u.strip() for u in username_list if u.strip()]\n\n    risultati = []\n    for username in tqdm(username_list, desc=&quot;Verifica HIBP&quot;):\n        email = f&quot;{username}@{DOMINIO}&quot;\n        breach = controlla_email_hibp(email)\n        risultati.append({\n            &quot;username&quot;: username,\n            &quot;email&quot;: email,\n            &quot;breach_count&quot;: len(breach),\n            &quot;breach_nomi&quot;: &quot;; &quot;.join(breach),\n        })\n        time.sleep(PAUSA)\n\n    # Salva\n    with open(output_csv, &quot;w&quot;, newline=&quot;&quot;, encoding=&quot;utf-8&quot;) as f:\n        writer = csv.DictWriter(f, fieldnames=risultati[0].keys())\n        writer.writeheader()\n        writer.writerows(risultati)\n\n    a_rischio = [r for r in risultati if r[&quot;breach_count&quot;] &gt; 0]\n    print(f&quot;\\n✔ Verificati: {len(risultati)}&quot;)\n    print(f&quot;   A rischio (in almeno 1 breach): {len(a_rischio)}&quot;)\n    print(f&quot;   Report: {output_csv}&quot;)\n\n\nif __name__ == &quot;__main__&quot;:\n    processa_lista(&quot;username_list.txt&quot;, &quot;hibp_risultati.csv&quot;)</code></pre>\n<p><strong>Risultati:</strong> su 10.000 username verificati, 847 email\naziendali risultano in almeno un breach (8,47%). Di questi, 134\ncompaiono nel breach di LinkedIn 2016, che include le password. Il\nreport viene inviato al team IT per il reset forzato delle password.</p>\n<hr />\n<h2 id=\"esercizi-pratici\">Esercizi pratici</h2>\n<p><strong>Esercizio 1 – Setup ambiente (20 min)</strong> Crea una\ncartella <code>osint_python</code>, un ambiente virtuale e installa le\nlibrerie fondamentali. Crea un file <code>.env</code> con una chiave API\nfittizia e verifica che <code>load_dotenv()</code> la carichi\ncorrettamente.</p>\n<p><strong>Esercizio 2 – requests patterns (30 min)</strong> Usa lo\nscript <code>requests_patterns.py</code> per fare una richiesta a\n<code>httpbin.org/get</code>. Verifica: il tuo User-Agent appare come un\nbrowser reale? Aggiungi un proxy Tor\n(<code>socks5://127.0.0.1:9050</code>) e verifica l’IP.</p>\n<p><strong>Esercizio 3 – BeautifulSoup (30 min)</strong> Scegli un sito\ndi notizie italiano con contenuto pubblico. Scrivi uno script che estrae\ntitolo, URL e data degli ultimi 10 articoli. Salva in CSV.</p>\n<p><strong>Esercizio 4 – pandas analysis (25 min)</strong> Scarica il\ntuo export personale di HIBP (o crea un CSV fittizio con 5 breach). Usa\n<code>pandas</code> per calcolare: quali breach contengono password? In\nquale anno c’è stato il breach più recente?</p>\n<p><strong>Esercizio 5 – Pipeline OSINT (45 min)</strong> Lancia\n<code>osint_pipeline.py</code> sulla tua email. Analizza il JSON\nprodotto. Quanti breach? Hai un account Gravatar? Il dominio ha record\nMX?</p>\n<p><strong>Esercizio 6 – NLP keyword extraction (30 min)</strong>\nScarica il testo di 3 articoli di giornale su un evento di cronaca\nrecente. Usa <code>estrai_keyword()</code> per trovare le 20 parole più\nfrequenti. Crea la word cloud.</p>\n<p><strong>Esercizio 7 – NetworkX (40 min)</strong> Prendi i dati di\nforward di un canale Telegram (da Telepathy, Lezione 7). Costruisci il\ngrafo con NetworkX. Qual è il nodo con la più alta betweenness\ncentrality? Salva la visualizzazione del grafo.</p>\n<p><strong>Esercizio 8 – Report generator (25 min)</strong> Usa i\nrisultati della Pipeline (Esercizio 5) per generare un report HTML con\n<code>report_generator.py</code>. Aprilo nel browser. Se hai WeasyPrint\ninstallato, convertilo in PDF.</p>\n<hr />\n","quiz":[{"q":"Perché si usa un file .env invece di inserire le credenziali direttamente nel codice?","opts":{"a":"Per rendere il codice più veloce","b":"Per evitare che le credenziali vengano accidentalmente committate su repository pubblici","c":"Perché Python non supporta le stringhe hardcoded","d":"Per aumentare la sicurezza della crittografia"},"correct":"b","why":"Il file .env evita che le credenziali vengano committate accidentalmente su repository pubblici"},{"q":"Il parametro backoff_factor nell'oggetto Retry di requests serve a:","opts":{"a":"Aumentare la velocità delle richieste successive","b":"Aumentare progressivamente il tempo di attesa tra i retry in caso di errore","c":"Cambiare automaticamente il proxy dopo ogni errore","d":"Limitare il numero massimo di byte scaricati"},"correct":"b","why":"backoff_factor aumenta progressivamente il tempo di attesa tra i retry"},{"q":"BeautifulSoup è usato principalmente per:","opts":{"a":"Fare richieste HTTP a API JSON","b":"Analizzare e navigare il DOM di pagine HTML/XML","c":"Creare grafici e visualizzazioni","d":"Analizzare il traffico di rete"},"correct":"b","why":"BeautifulSoup analizza e naviga il DOM HTML/XML"},{"q":"In pandas, il metodo value_counts() su una colonna restituisce:","opts":{"a":"I valori unici della colonna","b":"La frequenza di ogni valore nella colonna, ordinata per frequenza decrescente","c":"La somma di tutti i valori numerici","d":"I valori mancanti (NaN)"},"correct":"b","why":"value_counts() restituisce la frequenza di ogni valore, ordinata in modo decrescente"},{"q":"La libreria rich in Python è usata per:","opts":{"a":"Analizzare dati JSON da API","b":"Produrre output formattato (tabelle, colori, barre di avanzamento) nel terminale","c":"Cifrare le comunicazioni di rete","d":"Fare scraping di pagine JavaScript"},"correct":"b","why":"rich produce output formattato (tabelle, colori, barre di avanzamento) nel terminale"},{"q":"Il principio k-anonymity usato dall'API HIBP Pwned Passwords serve a:","opts":{"a":"Cifrare la password prima di inviarla","b":"Verificare la password senza inviarla: si invia solo il prefisso SHA-1 e si confronta localmente","c":"Randomizzare le richieste per evitare il rate limiting","d":"Dividere il database in K partizioni"},"correct":"b","why":"k-anonymity di HIBP: si invia solo il prefisso SHA-1, il confronto avviene in locale"},{"q":"In NetworkX, la betweenness centrality di un nodo misura:","opts":{"a":"Il numero di connessioni dirette del nodo","b":"Quante volte il nodo si trova sul percorso più breve tra due altri nodi (è un \"ponte\")","c":"La distanza media del nodo da tutti gli altri","d":"Il numero di triangoli in cui è coinvolto il nodo"},"correct":"b","why":"La betweenness centrality conta quante volte un nodo è sul percorso più breve tra altri due"},{"q":"Quale libreria Python si usa per la Named Entity Recognition (NER) in italiano?","opts":{"a":"pandas","b":"requests","c":"spaCy con il modello it_core_news_sm","d":"BeautifulSoup"},"correct":"c","why":"spaCy con it_core_news_sm fa NER in italiano"},{"q":"Lo scraping automatizzato di contenuti pubblici da siti web è:","opts":{"a":"Sempre illegale in Italia","b":"Sempre legale se i dati sono pubblici","c":"Generalmente tollerato per finalità di ricerca ma soggetto ai ToS; vietato se causa danno al servizio o aggira misure tecniche","d":"Legale solo con autorizzazione scritta del sito"},"correct":"c","why":"Lo scraping è tollerato per ricerca e giornalismo; è vietato se causa danno o aggira misure tecniche"},{"q":"Un file requirements.txt in un progetto Python serve a:","opts":{"a":"Elencare i file da escludere dal repository","b":"Documentare le dipendenze del progetto per replicabilità","c":"Contenere le variabili d'ambiente del progetto","d":"Definire le route dell'applicazione web"},"correct":"b","why":"requirements.txt documenta le dipendenze per la replicabilità del progetto"}]},{"title":"SIGINT: Aeromobili","html":"<h1 id=\"lezione-11-sigint-aeromobili\">Lezione 11 – SIGINT:\nAeromobili</h1>\n<blockquote>\n<p><em>“Ogni aereo in volo trasmette la propria identità e posizione — a\nchi sa ascoltare.”</em> — pratica OSINT aeronautica</p>\n</blockquote>\n<hr />\n<h2 id=\"obiettivi-di-apprendimento\">Obiettivi di apprendimento</h2>\n<p>Al termine di questa lezione sarai in grado di:</p>\n<ol type=\"1\">\n<li>comprendere il funzionamento tecnico del sistema\n<strong>ADS-B</strong> e come i dati di volo vengono trasmessi e\nricevuti;</li>\n<li>usare i principali strumenti di tracking in tempo reale,\ndistinguendo tra piattaforme <strong>filtrate</strong> e <strong>non\nfiltrate</strong>;</li>\n<li>decodificare i <strong>codici aeronautici</strong> fondamentali\n(ICAO hex, Squawk, callsign, Mode S);</li>\n<li>automatizzare la raccolta di dati di volo tramite API e script\nPython;</li>\n<li>consultare database extraeuropei e non ufficiali per voli non\nvisibili sulle piattaforme standard;</li>\n<li>ricercare incidenti aerei, dati di sicurezza, registrazioni degli\naeromobili e licenze dei piloti;</li>\n<li>tracciare i movimenti dei voli cargo.</li>\n</ol>\n<hr />\n<h2 id=\"come-funziona-il-tracking-degli-aerei-ads-b\">1. Come funziona il\ntracking degli aerei (ADS-B)</h2>\n<h3 id=\"il-sistema-ads-b\">1.1 Il sistema ADS-B</h3>\n<p><strong>ADS-B</strong> (Automatic Dependent Surveillance–Broadcast) è\nil sistema di sorveglianza aeronautica che ha progressivamente\nsostituito il radar secondario tradizionale. Ogni aeromobile\nequipaggiato con un transponder ADS-B trasmette <strong>automaticamente\ne continuamente</strong> le proprie informazioni di volo su una\nfrequenza radio standard.</p>\n<p><strong>Caratteristiche tecniche:</strong></p>\n<table>\n<thead>\n<tr>\n<th>Parametro</th>\n<th>Valore</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Frequenza di trasmissione</td>\n<td><strong>1090 MHz</strong> (universale)</td>\n</tr>\n<tr>\n<td>Tecnologia</td>\n<td>Burst radio, non crittografati</td>\n</tr>\n<tr>\n<td>Intervallo di trasmissione</td>\n<td>Ogni ~0,5 secondi</td>\n</tr>\n<tr>\n<td>Portata tipica</td>\n<td>~250–400 km (dipende dall’altitudine)</td>\n</tr>\n<tr>\n<td>Ricezione a terra</td>\n<td>Ricevitore SDR (~10€) o antenna dedicata</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Informazioni trasmesse:</strong> - <strong>Codice ICAO\nhex</strong> (24 bit): identificativo univoco permanente dell’aeromobile\n(equivalente al numero di telaio di un’auto). - <strong>Posizione\nGPS</strong>: latitudine e longitudine. - <strong>Altitudine\nbarometrica</strong>. - <strong>Velocità</strong> (ground speed e\nairspeed). - <strong>Rotta</strong> (heading). - <strong>Tasso di\nsalita/discesa</strong> (vertical rate). - <strong>Callsign</strong>\n(identificativo di volo, es. <code>AZA123</code>). - <strong>Squawk\ncode</strong> (codice transponder, 4 cifre ottali).</p>\n<h3 id=\"come-i-dati-arrivano-su-internet\">1.2 Come i dati arrivano su\ninternet</h3>\n<p>La rete di tracking globale funziona grazie a <strong>ricevitori\nvolontari</strong> distribuiti in tutto il mondo:</p>\n<pre><code>AEROMOBILE\n    │\n    │ trasmette su 1090 MHz (ADS-B)\n    ▼\nRICEVITORE SDR\n(utente volontario, ricevitore RTL-SDR ~10€ + antenna)\n    │\n    │ invia i dati via internet\n    ▼\nSERVER AGGREGATORE\n(FlightAware, FlightRadar24, OpenSky Network...)\n    │\n    │ elabora, visualizza, distribuisce via API\n    ▼\nUTENTE FINALE / OSINT ANALYST</code></pre>\n<p><strong>Conseguenza per l’OSINT:</strong> i dati ADS-B sono\n<strong>pubblici per design</strong>, non richiedono hacking o accesso\nnon autorizzato. Raccoglierli è tecnicamente equivalente ad ascoltare\nuna trasmissione radio pubblica.</p>\n<h3 id=\"limitazioni-del-sistema-ads-b\">1.3 Limitazioni del sistema\nADS-B</h3>\n<ul>\n<li><strong>Non tutti gli aerei trasmettono ADS-B</strong>: aerei\nleggeri, elicotteri, aerei militari, jet privati possono avere\ntransponder spenti o non equipaggiati.</li>\n<li><strong>I dati possono essere spoofati</strong>: un aeromobile può\ntrasmettere dati falsi. Raro ma possibile.</li>\n<li><strong>Copertura ridotta in aree remote</strong>: l’oceano, le zone\npolari e i paesi in via di sviluppo hanno meno ricevitori → gap nella\ncopertura.</li>\n<li><strong>Filtraggio governativo</strong>: alcuni paesi (es. Cina,\nIran, Russia) limitano la disponibilità dei dati ADS-B alle piattaforme\ncommerciali.</li>\n</ul>\n<h3 id=\"mode-s-e-mlat\">1.4 Mode S e MLAT</h3>\n<p><strong>Mode S</strong> è il protocollo transponder che include la\ntrasmissione del codice ICAO hex. È il predecessore di ADS-B e non\ninclude necessariamente la posizione GPS.</p>\n<p><strong>MLAT</strong> (Multilateration): tecnica alternativa\nall’ADS-B GPS. Quando un aeromobile non trasmette posizione GPS, la sua\nposizione viene calcolata triangolando i segnali ricevuti da\n<strong>almeno 4 ricevitori</strong> in posizioni diverse. Questo\npermette di tracciare anche aerei senza ADS-B completo.</p>\n<hr />\n<h2 id=\"tracking-di-aerei-in-tempo-reale-tools-filtrati\">2. Tracking di\naerei in tempo reale – Tools filtrati</h2>\n<p>I <strong>tool filtrati</strong> sono le piattaforme commerciali più\nnote che, per accordi con le compagnie aeree e i governi, oscurano certi\nvoli su richiesta (LADD negli USA, opt-out in Europa).</p>\n<h3 id=\"flightradar24\">2.1 FlightRadar24</h3>\n<p><strong>FlightRadar24</strong> (https://www.flightradar24.com) è la\npiattaforma di tracking più usata al mondo, con un’interfaccia intuitiva\ne copertura globale eccellente.</p>\n<p><strong>Caratteristiche:</strong> - Mappa in tempo reale con tutti i\nvoli commerciali visibili. - Storico dei voli degli ultimi 12 mesi\n(piano gratuito: 3 mesi). - Dettagli su ogni volo: rotta, altitudine,\nvelocità, aeromobile, compagnia, numeri di serie. - Alert: notifiche su\nvoli specifici. - <strong>FlightRadar24 Play</strong>: replay dei voli\nstorici.</p>\n<p><strong>Per l’OSINT:</strong> - Identifica la rotta di un volo\nsospetto. - Verifica se un aeromobile privato è atterrato in un certo\naeroporto. - Confronta il callsign dichiarato con la rotta effettiva. -\nStorico dei movimenti di un aeromobile specifico (per codice ICAO o\nnumero di registrazione).</p>\n<p><strong>Dati visibili (piano gratuito):</strong> - Posizione in tempo\nreale, rotta, altitudine, velocità. - Aeromobile (tipo, compagnia). -\nOrario di partenza/arrivo stimato.</p>\n<p><strong>Dati solo a pagamento:</strong> - Storico completo &gt; 3\nmesi. - Informazioni avanzate (numero di serie motori, età aeromobile).\n- Accesso API.</p>\n<p><strong>URL di ricerca per codice ICAO:</strong></p>\n<pre><code>https://www.flightradar24.com/data/aircraft/ICAO_HEX</code></pre>\n<p>Es.:\n<code>https://www.flightradar24.com/data/aircraft/4b1810</code></p>\n<h3 id=\"flightaware\">2.2 FlightAware</h3>\n<p><strong>FlightAware</strong> (https://www.flightaware.com) è la\npiattaforma americana di riferimento, con la migliore copertura degli\nStati Uniti e del Nord America.</p>\n<p><strong>Caratteristiche:</strong> - Tracking in tempo reale. -\nStorico dei voli per aeromobile (con numero di coda N-number negli USA).\n- <strong>Firehose</strong>: API commerciale per dati in tempo reale\n(usata da aeroporti e compagnie). - <strong>AeroAPI</strong>: API per\nsviluppatori (piani a pagamento).</p>\n<p><strong>Per l’OSINT:</strong> - Cerca un aeromobile per numero di\ncoda USA (es. <code>N12345</code>). - Studia lo storico dei movimenti di\nun jet privato. - Verifica l’aeroporto di origine/destinazione\neffettivo.</p>\n<p><strong>URL:</strong></p>\n<pre><code>https://www.flightaware.com/live/flight/N12345\nhttps://www.flightaware.com/resources/registration/N12345</code></pre>\n<h3 id=\"perché-i-tool-filtrati-oscurano-certi-voli\">2.3 Perché i tool\nfiltrati oscurano certi voli</h3>\n<p><strong>LADD (Limiting Aircraft Data Displayed):</strong> negli USA,\nil programma FAA LADD permette ai proprietari di aeromobili privati di\nrichiedere il blocco della visualizzazione sulle piattaforme\ncommerciali. Molti jet privati di personalità, politici e aziende ne\nusufruiscono.</p>\n<p><strong>Accordi con le compagnie aeree:</strong> alcune compagnie in\ncerti paesi (soprattutto quelli con regimi autoritari) ottengono\nl’oscuramento dei propri voli dalle piattaforme.</p>\n<p><strong>Risposta OSINT:</strong> i tool <strong>non filtrati</strong>\n(sezione successiva) ricevono gli stessi segnali ADS-B ma non applicano\nquesti filtri.</p>\n<hr />\n<h2 id=\"tracking-di-aerei-in-tempo-reale-tools-non-filtrati\">3. Tracking\ndi aerei in tempo reale – Tools non filtrati</h2>\n<p>I <strong>tool non filtrati</strong> mostrano i voli che le\npiattaforme commerciali oscurano, inclusi jet privati sotto LADD e voli\nmilitari che trasmettono ADS-B.</p>\n<h3 id=\"opensky-network\">3.1 OpenSky Network</h3>\n<p><strong>OpenSky Network</strong> (https://opensky-network.org) è una\nrete di ricerca accademica fondata dall’Università di Kaiserslautern e\ndall’ETH di Zurigo. Non applica filtri commerciali e fornisce:</p>\n<ul>\n<li>Dati in tempo reale (con ~5-10 secondi di ritardo).</li>\n<li>Storico completo degli ultimi 30 giorni (account gratuito) o anni\n(account ricercatore).</li>\n<li><strong>API completamente gratuita</strong> per ricercatori e\nsviluppatori.</li>\n<li>Dataset scaricabili per analisi accademiche.</li>\n</ul>\n<p><strong>Sito:</strong> https://opensky-network.org <strong>API\nREST:</strong> https://opensky-network.org/apidoc/</p>\n<h3 id=\"ads-b-exchange\">3.2 ADS-B Exchange</h3>\n<p><strong>ADS-B Exchange</strong> (https://www.adsbexchange.com) è la\npiattaforma <strong>completamente non filtrata</strong> più nota. Non\naccetta richieste di oscuramento da nessuno — né da governi, né da\naziende, né da privati.</p>\n<p><strong>Caratteristiche:</strong> - Nessun filtro: se l’aeromobile\ntrasmette ADS-B, è visibile. - Voli militari USA (Predator, Global Hawk,\nB-2, ecc.) spesso visibili. - Jet privati sotto LADD visibili. - Feed in\ntempo reale e API. - <strong>Globe</strong>\n(https://globe.adsbexchange.com): visualizzazione globale avanzata.</p>\n<p><strong>API di ADS-B Exchange:</strong></p>\n<pre><code>https://adsbexchange.com/api/aircraft/json/lat/45.46/lon/9.18/dist/250/</code></pre>\n<p>Parametri: <code>lat</code>, <code>lon</code> (coordinate centro),\n<code>dist</code> (raggio in miglia nautiche).</p>\n<h3 id=\"altri-tool-non-filtrati\">3.3 Altri tool non filtrati</h3>\n<table>\n<thead>\n<tr>\n<th>Strumento</th>\n<th>URL</th>\n<th>Note</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>ADSB.fi</strong></td>\n<td>adsb.fi</td>\n<td>Community-based, nessun filtro</td>\n</tr>\n<tr>\n<td><strong>Plane Finder</strong></td>\n<td>planefinder.net</td>\n<td>Parzialmente non filtrato</td>\n</tr>\n<tr>\n<td><strong>RadarBox</strong></td>\n<td>radarbox.com</td>\n<td>Dati quasi in tempo reale</td>\n</tr>\n<tr>\n<td><strong>OpenSky API</strong></td>\n<td>opensky-network.org</td>\n<td>Migliore per automazione</td>\n</tr>\n<tr>\n<td><strong>Globe ADSBX</strong></td>\n<td>globe.adsbexchange.com</td>\n<td>Visualizzazione avanzata</td>\n</tr>\n<tr>\n<td><strong>Tar1090</strong></td>\n<td>(self-hosted)</td>\n<td>Installazione locale su Raspberry Pi</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"tracking-di-voli-militari\">3.4 Tracking di voli militari</h3>\n<p>I voli militari <strong>a volte</strong> trasmettono ADS-B,\nspecialmente aerei da trasporto, aeroambulanze, UAV di ricognizione. I\ncaccia e gli aerei da combattimento raramente lo fanno.</p>\n<p><strong>Strumenti specializzati:</strong></p>\n<table>\n<thead>\n<tr>\n<th>Strumento</th>\n<th>URL</th>\n<th>Specialità</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>ADS-B Exchange</strong></td>\n<td>adsbexchange.com</td>\n<td>Migliore per militari USA</td>\n</tr>\n<tr>\n<td><strong>Military Radar</strong></td>\n<td>militaryradar.eu</td>\n<td>Voli militari europei</td>\n</tr>\n<tr>\n<td><strong>Scramble.nl</strong></td>\n<td>scramble.nl</td>\n<td>Database aeromobili militari</td>\n</tr>\n<tr>\n<td><strong>JetPhotos</strong></td>\n<td>jetphotos.com</td>\n<td>Foto e identificazione</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Squawk codes militari</strong> (vedi sezione 4 per il codice\ncompleto): - <code>7777</code>: intercettazione attiva (militare usa\nquesto per identificarsi all’ATC) - <code>0000</code>: transponder in\ntest o reset</p>\n<hr />\n<h2 id=\"codici-da-tenere-a-mente\">4. Codici da tenere a mente</h2>\n<h3 id=\"il-codice-icao-hex-mode-s-address\">4.1 Il codice ICAO hex (Mode\nS address)</h3>\n<p>Il <strong>codice ICAO hex</strong> (o Mode S address) è un\nidentificatore univoco a 24 bit assegnato a ogni aeromobile registrato.\nÈ espresso in esadecimale (6 caratteri, es. <code>4B1810</code>).</p>\n<p><strong>Come decodificare il paese dal codice ICAO:</strong> I primi\ncaratteri del codice ICAO indicano il paese di registrazione:</p>\n<table>\n<thead>\n<tr>\n<th>Prefisso hex</th>\n<th>Paese</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>3C</code> – <code>3F</code></td>\n<td>Germania</td>\n</tr>\n<tr>\n<td><code>4B</code></td>\n<td>Svizzera</td>\n</tr>\n<tr>\n<td><code>4C</code> – <code>4F</code></td>\n<td>Spagna</td>\n</tr>\n<tr>\n<td><code>50</code> – <code>53</code></td>\n<td>Francia</td>\n</tr>\n<tr>\n<td><code>48</code> – <code>49</code></td>\n<td>Gran Bretagna</td>\n</tr>\n<tr>\n<td><code>4D</code></td>\n<td>Portogallo</td>\n</tr>\n<tr>\n<td><code>40</code> – <code>43</code></td>\n<td>Italia</td>\n</tr>\n<tr>\n<td><code>A0</code> – <code>BF</code></td>\n<td>USA</td>\n</tr>\n<tr>\n<td><code>89</code></td>\n<td>Giappone</td>\n</tr>\n<tr>\n<td><code>780</code> – <code>79F</code></td>\n<td>Russia</td>\n</tr>\n<tr>\n<td><code>78</code></td>\n<td>Cina</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Strumenti per la decodifica:</strong> -\nhttps://www.icao.int/safety/iStars/Pages/Aircraft-Registration-Search.aspx\n- https://www.flightaware.com/resources/registration/ -\nhttps://www.planespotters.net (cerca per ICAO hex)</p>\n<h3 id=\"squawk-codes\">4.2 Squawk codes</h3>\n<p>Il <strong>codice Squawk</strong> è un codice a 4 cifre ottali (0-7\nper ogni cifra, quindi 0000-7777) che il pilota imposta nel transponder\nsu istruzione del controllo del traffico aereo (ATC).</p>\n<p><strong>Squawk speciali di emergenza:</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Codice</th>\n<th>Significato</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>7500</code></td>\n<td><strong>Hijacking in corso</strong> (dirottamento)</td>\n</tr>\n<tr>\n<td><code>7600</code></td>\n<td><strong>Perdita di comunicazione radio</strong> (NORDO)</td>\n</tr>\n<tr>\n<td><code>7700</code></td>\n<td><strong>Emergenza generale</strong> (Mayday)</td>\n</tr>\n<tr>\n<td><code>1200</code></td>\n<td>VFR standard USA (volo a vista non controllato)</td>\n</tr>\n<tr>\n<td><code>2000</code></td>\n<td>Volo IFR senza assegnazione ATC (ingresso in spazio non\ncontrollato)</td>\n</tr>\n<tr>\n<td><code>7777</code></td>\n<td>Intercettazione militare in corso</td>\n</tr>\n<tr>\n<td><code>0000</code></td>\n<td>Test / reset transponder</td>\n</tr>\n<tr>\n<td><code>7400</code></td>\n<td>UAV che ha perso il link con il pilota (in certi paesi)</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"callsign-vs.-numero-di-coda\">4.3 Callsign vs. Numero di\ncoda</h3>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Identificatore</th>\n<th>Cos’è</th>\n<th>Esempio</th>\n<th>Mutabilità</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Callsign</strong></td>\n<td>Identificativo di volo assegnato per ogni singolo volo</td>\n<td><code>AZA123</code>, <code>SPAR19</code></td>\n<td>Cambia per ogni volo</td>\n</tr>\n<tr>\n<td><strong>Numero di coda</strong> (N-number / tail number)</td>\n<td>Numero di registrazione fisicamente scritto sull’aeromobile</td>\n<td><code>N123AB</code>, <code>I-AIRB</code></td>\n<td>Permanente (finché registrato)</td>\n</tr>\n<tr>\n<td><strong>ICAO hex</strong></td>\n<td>Codice hardware del transponder</td>\n<td><code>4B1810</code></td>\n<td>Permanente per l’aeromobile</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Nota importante per l’OSINT:</strong> il callsign può\nrivelare il tipo di volo: - Prefisso della compagnia aerea\n(<code>AZ</code> = Alitalia/ITA, <code>FR</code> = Ryanair,\n<code>KL</code> = KLM). - <code>SPAR</code> = US Air Force Special Air\nMission (jet presidenziali e di Stato USA). - <code>RCH</code> = US Air\nForce Reach (voli di trasporto). - <code>REACH</code> = USAF Air\nMobility Command. - <code>RRR</code> = voli Royal Air Force (UK). -\nCallsign di 5-6 caratteri alfanumerici senza pattern riconoscibile →\nspesso jet privato o volo charter.</p>\n<h3 id=\"categorie-di-emitter-ads-b\">4.4 Categorie di emitter ADS-B</h3>\n<p>Il campo “Category” del messaggio ADS-B indica il tipo di\naeromobile:</p>\n<table>\n<thead>\n<tr>\n<th>Codice</th>\n<th>Tipo</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>A1</td>\n<td>Aereo leggero (&lt; 15.500 lb)</td>\n</tr>\n<tr>\n<td>A2</td>\n<td>Aereo medio</td>\n</tr>\n<tr>\n<td>A3</td>\n<td>Aereo pesante (&gt; 300.000 lb)</td>\n</tr>\n<tr>\n<td>A5</td>\n<td>Alto vortice (es. B747)</td>\n</tr>\n<tr>\n<td>A7</td>\n<td>Elicottero / girocottero</td>\n</tr>\n<tr>\n<td>B1</td>\n<td>Aliante</td>\n</tr>\n<tr>\n<td>B2</td>\n<td>Aeromobile più leggero dell’aria</td>\n</tr>\n<tr>\n<td>B4</td>\n<td>UAV / drone</td>\n</tr>\n<tr>\n<td>C1 – C7</td>\n<td>Veicoli a terra (emergenza, servizio, ostacolo)</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2 id=\"automazione\">5. Automazione</h2>\n<h3 id=\"opensky-api\">5.1 OpenSky API</h3>\n<p>L’API di OpenSky è la scelta migliore per l’automazione: gratuita,\nstabile e ben documentata.</p>\n<pre class=\"python\"><code>#!/usr/bin/env python3\n&quot;&quot;&quot;\nopensky_tracker.py – Tracking aerei in tempo reale con OpenSky API.\nFiltra per area geografica e mostra i voli attivi.\nRichiede: pip3 install requests rich\n&quot;&quot;&quot;\nimport os\nimport time\nimport requests\nfrom rich.console import Console\nfrom rich.table import Table\nfrom datetime import datetime, timezone\n\nconsole = Console()\n\nOPENSKY_USER = os.environ.get(&quot;OPENSKY_USER&quot;, &quot;&quot;)\nOPENSKY_PASS = os.environ.get(&quot;OPENSKY_PASS&quot;, &quot;&quot;)\nBASE_URL = &quot;https://opensky-network.org/api&quot;\n\n\ndef get_stati_volo(\n    lat_min: float, lat_max: float,\n    lon_min: float, lon_max: float\n) -&gt; list[dict]:\n    &quot;&quot;&quot;\n    Ottieni tutti i voli attivi in un&#39;area geografica.\n    Restituisce una lista di dict con i dati di ogni aeromobile.\n    &quot;&quot;&quot;\n    params = {\n        &quot;lamin&quot;: lat_min, &quot;lamax&quot;: lat_max,\n        &quot;lomin&quot;: lon_min, &quot;lomax&quot;: lon_max,\n    }\n    auth = (OPENSKY_USER, OPENSKY_PASS) if OPENSKY_USER else None\n\n    try:\n        r = requests.get(\n            f&quot;{BASE_URL}/states/all&quot;,\n            params=params, auth=auth, timeout=15\n        )\n        r.raise_for_status()\n    except requests.RequestException as e:\n        console.print(f&quot;[red]✗ Errore: {e}[/red]&quot;)\n        return []\n\n    dati = r.json()\n    stati = dati.get(&quot;states&quot;, []) or []\n\n    # Campi: [icao24, callsign, origin_country, time_position, last_contact,\n    #          longitude, latitude, baro_altitude, on_ground, velocity,\n    #          true_track, vertical_rate, sensors, geo_altitude,\n    #          squawk, spi, position_source]\n    voli = []\n    for s in stati:\n        voli.append({\n            &quot;icao24&quot;:      s[0] or &quot;&quot;,\n            &quot;callsign&quot;:    (s[1] or &quot;&quot;).strip() or &quot;N/D&quot;,\n            &quot;paese&quot;:       s[2] or &quot;&quot;,\n            &quot;lon&quot;:         s[5],\n            &quot;lat&quot;:         s[6],\n            &quot;altitudine&quot;:  round(s[7] * 3.28084) if s[7] else 0,  # ft\n            &quot;a_terra&quot;:     s[8],\n            &quot;velocita&quot;:    round(s[9] * 1.94384) if s[9] else 0,  # knots\n            &quot;rotta&quot;:       round(s[10]) if s[10] else 0,  # gradi\n            &quot;squawk&quot;:      s[14] or &quot;&quot;,\n            &quot;vs&quot;:          round(s[11] * 196.85) if s[11] else 0,  # fpm\n        })\n\n    return voli\n\n\ndef mostra_voli(voli: list[dict], titolo: str = &quot;Voli attivi&quot;) -&gt; None:\n    &quot;&quot;&quot;Mostra i voli in una tabella rich.&quot;&quot;&quot;\n    table = Table(title=titolo, show_lines=False,\n                  header_style=&quot;bold cyan&quot;)\n    table.add_column(&quot;ICAO&quot;, style=&quot;yellow&quot;, min_width=8)\n    table.add_column(&quot;Callsign&quot;, style=&quot;white&quot;, min_width=10)\n    table.add_column(&quot;Paese&quot;, style=&quot;dim&quot;, min_width=10)\n    table.add_column(&quot;Alt (ft)&quot;, justify=&quot;right&quot;)\n    table.add_column(&quot;Vel (kt)&quot;, justify=&quot;right&quot;)\n    table.add_column(&quot;Rotta °&quot;, justify=&quot;right&quot;)\n    table.add_column(&quot;Squawk&quot;, style=&quot;magenta&quot;)\n    table.add_column(&quot;Stato&quot;)\n\n    for v in sorted(voli, key=lambda x: x[&quot;altitudine&quot;], reverse=True):\n        squawk_style = &quot;bold red&quot; if v[&quot;squawk&quot;] in (&quot;7500&quot;,&quot;7600&quot;,&quot;7700&quot;) else &quot;magenta&quot;\n        stato = &quot;🛬 Terra&quot; if v[&quot;a_terra&quot;] else &quot;✈ Volo&quot;\n        table.add_row(\n            v[&quot;icao24&quot;],\n            v[&quot;callsign&quot;],\n            v[&quot;paese&quot;],\n            str(v[&quot;altitudine&quot;]),\n            str(v[&quot;velocita&quot;]),\n            str(v[&quot;rotta&quot;]),\n            f&quot;[{squawk_style}]{v[&#39;squawk&#39;]}[/{squawk_style}]&quot; if v[&quot;squawk&quot;] else &quot;&quot;,\n            stato,\n        )\n\n    console.print(table)\n    console.print(f&quot;[dim]Totale: {len(voli)} aeromobili | &quot;\n                  f&quot;{datetime.now(timezone.utc).strftime(&#39;%H:%M:%S&#39;)} UTC[/dim]&quot;)\n\n\ndef monitora_squawk_emergenza(\n    lat_min: float, lat_max: float,\n    lon_min: float, lon_max: float,\n    squawk_alert: set = {&quot;7500&quot;, &quot;7600&quot;, &quot;7700&quot;},\n    intervallo: int = 30\n) -&gt; None:\n    &quot;&quot;&quot;\n    Monitora un&#39;area e notifica quando viene impostato uno squawk di emergenza.\n    &quot;&quot;&quot;\n    console.print(f&quot;[bold yellow]🔭 Monitoring emergenze avviato[/bold yellow]&quot;)\n    console.print(f&quot;   Squawk monitorati: {squawk_alert}&quot;)\n    console.print(f&quot;   Intervallo: {intervallo}s\\n&quot;)\n\n    visti = set()  # ICAO già notificati per non ripetere\n\n    while True:\n        voli = get_stati_volo(lat_min, lat_max, lon_min, lon_max)\n        for v in voli:\n            if v[&quot;squawk&quot;] in squawk_alert:\n                chiave = f&quot;{v[&#39;icao24&#39;]}_{v[&#39;squawk&#39;]}&quot;\n                if chiave not in visti:\n                    visti.add(chiave)\n                    console.print(\n                        f&quot;\\n[bold red]🚨 SQUAWK {v[&#39;squawk&#39;]}![/bold red] &quot;\n                        f&quot;ICAO: {v[&#39;icao24&#39;]} | Callsign: {v[&#39;callsign&#39;]} | &quot;\n                        f&quot;Paese: {v[&#39;paese&#39;]} | Alt: {v[&#39;altitudine&#39;]}ft&quot;\n                    )\n        time.sleep(intervallo)\n\n\nif __name__ == &quot;__main__&quot;:\n    print(&quot;=== OpenSky Tracker ===&quot;)\n    print(&quot;1) Voli su Italia  2) Inserisci area manuale  3) Monitor emergenze Italia&quot;)\n    scelta = input(&quot;Scelta: &quot;).strip()\n\n    # Italia: bbox approssimativo\n    lat_min, lat_max, lon_min, lon_max = 36.0, 47.1, 6.6, 18.8\n\n    if scelta == &quot;2&quot;:\n        lat_min = float(input(&quot;Latitudine minima: &quot;))\n        lat_max = float(input(&quot;Latitudine massima: &quot;))\n        lon_min = float(input(&quot;Longitudine minima: &quot;))\n        lon_max = float(input(&quot;Longitudine massima: &quot;))\n\n    if scelta == &quot;3&quot;:\n        monitora_squawk_emergenza(lat_min, lat_max, lon_min, lon_max)\n    else:\n        voli = get_stati_volo(lat_min, lat_max, lon_min, lon_max)\n        mostra_voli(voli, titolo=f&quot;Voli attivi su area [{lat_min},{lat_max}]x[{lon_min},{lon_max}]&quot;)</code></pre>\n<h3 id=\"storico-voli-con-opensky\">5.2 Storico voli con OpenSky</h3>\n<pre class=\"python\"><code>#!/usr/bin/env python3\n&quot;&quot;&quot;\nopensky_storico.py – Recupera lo storico dei voli di un aeromobile specifico.\nRichiede account OpenSky per i dati storici &gt; 1 ora.\n&quot;&quot;&quot;\nimport os\nimport time\nimport requests\nimport csv\nfrom datetime import datetime, timezone\n\nOPENSKY_USER = os.environ.get(&quot;OPENSKY_USER&quot;, &quot;&quot;)\nOPENSKY_PASS = os.environ.get(&quot;OPENSKY_PASS&quot;, &quot;&quot;)\nBASE = &quot;https://opensky-network.org/api&quot;\n\n\ndef storico_aeromobile(icao24: str, inizio: int, fine: int) -&gt; list[dict]:\n    &quot;&quot;&quot;\n    Recupera lo storico posizioni di un aeromobile in un intervallo temporale.\n    icao24: codice ICAO hex (es. &#39;4b1810&#39;)\n    inizio/fine: timestamp Unix UTC\n    &quot;&quot;&quot;\n    auth = (OPENSKY_USER, OPENSKY_PASS) if OPENSKY_USER else None\n    r = requests.get(\n        f&quot;{BASE}/tracks/all&quot;,\n        params={&quot;icao24&quot;: icao24.lower(), &quot;time&quot;: inizio},\n        auth=auth, timeout=30\n    )\n    if r.status_code == 404:\n        print(f&quot;⚠ Nessun dato per {icao24}&quot;)\n        return []\n    r.raise_for_status()\n    data = r.json()\n\n    punti = []\n    for p in data.get(&quot;path&quot;, []):\n        ts, lat, lon, alt, rotta, a_terra = p\n        punti.append({\n            &quot;timestamp&quot;: datetime.fromtimestamp(ts, tz=timezone.utc).isoformat(),\n            &quot;latitudine&quot;: lat,\n            &quot;longitudine&quot;: lon,\n            &quot;altitudine_m&quot;: alt,\n            &quot;rotta&quot;: rotta,\n            &quot;a_terra&quot;: a_terra,\n        })\n    return punti\n\n\ndef voli_recenti_aeromobile(icao24: str, giorni: int = 7) -&gt; list[dict]:\n    &quot;&quot;&quot;Recupera i voli completati da un aeromobile negli ultimi N giorni.&quot;&quot;&quot;\n    auth = (OPENSKY_USER, OPENSKY_PASS) if OPENSKY_USER else None\n    fine = int(time.time())\n    inizio = fine - (giorni * 86400)\n\n    r = requests.get(\n        f&quot;{BASE}/flights/aircraft&quot;,\n        params={&quot;icao24&quot;: icao24.lower(), &quot;begin&quot;: inizio, &quot;end&quot;: fine},\n        auth=auth, timeout=30\n    )\n    if r.status_code in (404, 400):\n        return []\n    r.raise_for_status()\n\n    voli = []\n    for v in r.json():\n        voli.append({\n            &quot;icao24&quot;: v.get(&quot;icao24&quot;, &quot;&quot;),\n            &quot;callsign&quot;: (v.get(&quot;callsign&quot;) or &quot;&quot;).strip(),\n            &quot;partenza_ts&quot;: datetime.fromtimestamp(\n                v[&quot;firstSeen&quot;], tz=timezone.utc).isoformat() if v.get(&quot;firstSeen&quot;) else &quot;&quot;,\n            &quot;arrivo_ts&quot;: datetime.fromtimestamp(\n                v[&quot;lastSeen&quot;], tz=timezone.utc).isoformat() if v.get(&quot;lastSeen&quot;) else &quot;&quot;,\n            &quot;aeroporto_partenza&quot;: v.get(&quot;estDepartureAirport&quot;, &quot;&quot;),\n            &quot;aeroporto_arrivo&quot;: v.get(&quot;estArrivalAirport&quot;, &quot;&quot;),\n        })\n    return voli\n\n\nif __name__ == &quot;__main__&quot;:\n    icao = input(&quot;Codice ICAO hex (es. 4b1810): &quot;).strip().lower()\n    giorni = int(input(&quot;Ultimi N giorni [7]: &quot;).strip() or &quot;7&quot;)\n\n    print(f&quot;\\n🔍 Voli recenti per {icao} (ultimi {giorni} giorni):\\n&quot;)\n    voli = voli_recenti_aeromobile(icao, giorni)\n    if not voli:\n        print(&quot;  Nessun dato disponibile.&quot;)\n    else:\n        for v in voli:\n            print(f&quot;  {v[&#39;partenza_ts&#39;][:10]}  {v[&#39;callsign&#39;]:&lt;12}  &quot;\n                  f&quot;{v[&#39;aeroporto_partenza&#39;] or &#39;???&#39;} → {v[&#39;aeroporto_arrivo&#39;] or &#39;???&#39;}&quot;)\n\n        output = f&quot;voli_{icao}_{giorni}d.csv&quot;\n        with open(output, &quot;w&quot;, newline=&quot;&quot;, encoding=&quot;utf-8&quot;) as f:\n            writer = csv.DictWriter(f, fieldnames=voli[0].keys())\n            writer.writeheader()\n            writer.writerows(voli)\n        print(f&quot;\\n✔ Salvato: {output}&quot;)</code></pre>\n<h3 id=\"adsbx-api-per-voli-non-filtrati\">5.3 ADSBX API per voli non\nfiltrati</h3>\n<pre class=\"python\"><code>#!/usr/bin/env python3\n&quot;&quot;&quot;\nadsbx_tracker.py – Ricerca aerei in tempo reale con ADS-B Exchange API.\nNon filtrata: mostra voli oscurati da FlightRadar24 e FlightAware.\nRichiede: pip3 install requests\nAPI chiave da: https://adsbexchange.com/data/\n&quot;&quot;&quot;\nimport os\nimport requests\n\nADSBX_KEY = os.environ.get(&quot;ADSBX_API_KEY&quot;, &quot;&quot;)\nBASE = &quot;https://adsbexchange.com/api/aircraft/v2&quot;\n\n\ndef cerca_per_area(lat: float, lon: float, raggio_nm: int = 100) -&gt; list[dict]:\n    &quot;&quot;&quot;Cerca aerei in un&#39;area circolare (raggio in miglia nautiche).&quot;&quot;&quot;\n    r = requests.get(\n        f&quot;{BASE}/lat/{lat}/lon/{lon}/dist/{raggio_nm}/&quot;,\n        headers={&quot;api-auth&quot;: ADSBX_KEY},\n        timeout=15,\n    )\n    r.raise_for_status()\n    return r.json().get(&quot;ac&quot;, [])\n\n\ndef cerca_per_icao(icao24: str) -&gt; dict | None:\n    &quot;&quot;&quot;Cerca un aeromobile specifico per codice ICAO.&quot;&quot;&quot;\n    r = requests.get(\n        f&quot;{BASE}/icao/{icao24.upper()}/&quot;,\n        headers={&quot;api-auth&quot;: ADSBX_KEY},\n        timeout=15,\n    )\n    if r.status_code == 404:\n        return None\n    r.raise_for_status()\n    aerei = r.json().get(&quot;ac&quot;, [])\n    return aerei[0] if aerei else None\n\n\ndef filtra_militari(aerei: list[dict]) -&gt; list[dict]:\n    &quot;&quot;&quot;Filtra solo gli aerei probabilmente militari.&quot;&quot;&quot;\n    militari = []\n    for a in aerei:\n        callsign = a.get(&quot;flight&quot;, &quot;&quot;).strip()\n        tipo = a.get(&quot;t&quot;, &quot;&quot;)\n        # Callsign tipici militari USA\n        prefissi_mil = (&quot;RCH&quot;, &quot;SPAR&quot;, &quot;REACH&quot;, &quot;RRR&quot;, &quot;JAKE&quot;,\n                        &quot;IRON&quot;, &quot;DUKE&quot;, &quot;BOXER&quot;, &quot;WOLF&quot;, &quot;HAWK&quot;)\n        if any(callsign.startswith(p) for p in prefissi_mil):\n            militari.append(a)\n        # Tipi di aeromobile tipicamente militari\n        elif tipo in (&quot;C17&quot;, &quot;C130&quot;, &quot;C135&quot;, &quot;E3&quot;, &quot;P8&quot;, &quot;RC135&quot;,\n                      &quot;E8&quot;, &quot;U2&quot;, &quot;B52&quot;, &quot;B2&quot;, &quot;F16&quot;, &quot;F18&quot;, &quot;F35&quot;,\n                      &quot;KC135&quot;, &quot;KC10&quot;, &quot;MQ9&quot;, &quot;RQ4&quot;):\n            militari.append(a)\n    return militari\n\n\nif __name__ == &quot;__main__&quot;:\n    if not ADSBX_KEY:\n        print(&quot;⚠ Imposta ADSBX_API_KEY&quot;)\n        exit(1)\n\n    print(&quot;1) Cerca per area  2) Cerca per ICAO  3) Filtra militari su Italia&quot;)\n    scelta = input(&quot;Scelta: &quot;).strip()\n\n    if scelta == &quot;1&quot;:\n        lat = float(input(&quot;Latitudine: &quot;))\n        lon = float(input(&quot;Longitudine: &quot;))\n        nm = int(input(&quot;Raggio nm [100]: &quot;).strip() or &quot;100&quot;)\n        aerei = cerca_per_area(lat, lon, nm)\n        print(f&quot;\\n✈ {len(aerei)} aerei trovati:&quot;)\n        for a in aerei[:20]:\n            print(f&quot;  {a.get(&#39;hex&#39;,&#39;&#39;):8} {a.get(&#39;flight&#39;,&#39;N/D&#39;):12} &quot;\n                  f&quot;{a.get(&#39;t&#39;,&#39;&#39;):6} alt:{a.get(&#39;alt_baro&#39;,0)}ft&quot;)\n\n    elif scelta == &quot;2&quot;:\n        icao = input(&quot;ICAO hex: &quot;).strip()\n        a = cerca_per_icao(icao)\n        if a:\n            for k, v in a.items():\n                print(f&quot;  {k:&lt;20} {v}&quot;)\n        else:\n            print(&quot;⚠ Aeromobile non trovato&quot;)\n\n    elif scelta == &quot;3&quot;:\n        aerei = cerca_per_area(41.9, 12.5, 500)  # Centro Italia, 500nm\n        militari = filtra_militari(aerei)\n        print(f&quot;\\n🪖 Probabili voli militari ({len(militari)}):&quot;)\n        for a in militari:\n            print(f&quot;  {a.get(&#39;hex&#39;,&#39;&#39;):8} {a.get(&#39;flight&#39;,&#39;&#39;):12} &quot;\n                  f&quot;{a.get(&#39;t&#39;,&#39;&#39;):6} {a.get(&#39;alt_baro&#39;,0)}ft &quot;\n                  f&quot;{a.get(&#39;lat&#39;,0):.2f},{a.get(&#39;lon&#39;,0):.2f}&quot;)</code></pre>\n<hr />\n<h2 id=\"database-extraeuropei-e-non-ufficiali\">6. Database extraeuropei\ne non ufficiali</h2>\n<h3 id=\"risorse-globali\">6.1 Risorse globali</h3>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Risorsa</th>\n<th>URL</th>\n<th>Contenuto</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Planespotters.net</strong></td>\n<td>planespotters.net</td>\n<td>Registrazioni globali, foto, operatori</td>\n</tr>\n<tr>\n<td><strong>JetPhotos</strong></td>\n<td>jetphotos.com</td>\n<td>Database fotografico con ICAO e registrazione</td>\n</tr>\n<tr>\n<td><strong>Airframes.org</strong></td>\n<td>airframes.org</td>\n<td>Registrazioni USA e canadesi</td>\n</tr>\n<tr>\n<td><strong>ch-aviation</strong></td>\n<td>ch-aviation.com</td>\n<td>Database commerciale (compagnie, flotte)</td>\n</tr>\n<tr>\n<td><strong>ACAS/CASA</strong></td>\n<td>casa.gov.au</td>\n<td>Registrazioni australiane</td>\n</tr>\n<tr>\n<td><strong>TC Canada</strong></td>\n<td>tc.canada.ca</td>\n<td>Registrazioni canadesi</td>\n</tr>\n<tr>\n<td><strong>ANAC Brasile</strong></td>\n<td>anac.gov.br</td>\n<td>Registrazioni brasiliane</td>\n</tr>\n<tr>\n<td><strong>Scramble</strong></td>\n<td>scramble.nl</td>\n<td>Militari: identificazione e storico</td>\n</tr>\n<tr>\n<td><strong>GlobalAir</strong></td>\n<td>globalair.com</td>\n<td>N-number USA + valutazione aeromobili</td>\n</tr>\n<tr>\n<td><strong>FAA</strong></td>\n<td>registry.faa.gov</td>\n<td>Registro USA (N-number), gratuito e completo</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"registro-faa-usa-il-più-ricco\">6.2 Registro FAA (USA): il più\nricco</h3>\n<p>Il <strong>registro FAA</strong>\n(https://registry.faa.gov/aircraftinquiry/) permette di cercare\nqualsiasi aeromobile americano (prefisso N-number) e ottenere: -\nProprietario attuale (persona fisica o azienda). - Indirizzo del\nproprietario. - Tipo e modello di aeromobile. - Data di prima\nregistrazione. - Storico dei proprietari. - Stato della registrazione\n(attivo, cancellato, riservato).</p>\n<pre class=\"bash\"><code># Esempio di ricerca via cURL\ncurl &quot;https://registry.faa.gov/aircraftinquiry/Search/NNumberResult?nNumberTxt=N12345&quot;</code></pre>\n<p><strong>Perché è importante:</strong> molti jet privati utilizzati da\nmiliardari, politici e aziende sono registrati negli USA. Il FAA\nregistry è pubblico e permette di collegare il tail number al\nproprietario reale — a meno che non usino LLC schermo (frequente).</p>\n<h3 id=\"identificare-i-proprietari-reali-le-llc-schermo\">6.3\nIdentificare i proprietari reali: le LLC schermo</h3>\n<p>Un’azienda che non vuole che il proprio aeromobile sia tracciato\nregistra l’aeromobile su una <strong>LLC</strong> (Limited Liability\nCompany) con nome generico (es. “Aviation Holdings LLC”) nello stato del\nDelaware o Nevada. Il registro FAA mostra la LLC, non il proprietario\nfinale.</p>\n<p><strong>Come andare oltre:</strong> 1. Cerca la LLC nel registro\ndelle imprese dello stato (es. Delaware:\nhttps://icis.corp.delaware.gov/). 2. Consulta il database OpenCorporates\n(https://opencorporates.com) per trovare l’agente registrato. 3. Usa\nOSINT Industries o Hunter.io per trovare chi gestisce l’email/sito della\nLLC. 4. Cerca l’aeromobile su JetPhotos: le foto degli spotter spesso\nriportano il proprietario reale o il passeggero famoso.</p>\n<hr />\n<h2 id=\"incidenti-e-sicurezza-aerea\">7. Incidenti e sicurezza aerea</h2>\n<h3 id=\"database-degli-incidenti\">7.1 Database degli incidenti</h3>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Risorsa</th>\n<th>URL</th>\n<th>Contenuto</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>ICAO ADREP</strong></td>\n<td>icao.int/safety/airnavigation</td>\n<td>Database internazionale incidenti (ICAO)</td>\n</tr>\n<tr>\n<td><strong>ASN Aviation Safety Network</strong></td>\n<td>aviation-safety.net</td>\n<td>Incidenti globali dal 1919</td>\n</tr>\n<tr>\n<td><strong>NTSB</strong></td>\n<td>ntsb.gov</td>\n<td>Incidenti USA (investigazioni complete)</td>\n</tr>\n<tr>\n<td><strong>ENAC</strong></td>\n<td>enac.gov.it</td>\n<td>Incidenti italiani</td>\n</tr>\n<tr>\n<td><strong>ANSV</strong></td>\n<td>ansv.it</td>\n<td>Agenzia Nazionale Sicurezza del Volo (IT)</td>\n</tr>\n<tr>\n<td><strong>BEA</strong></td>\n<td>bea.aero</td>\n<td>Incidenti francesi</td>\n</tr>\n<tr>\n<td><strong>BST/BFU</strong></td>\n<td>bfu-web.de</td>\n<td>Incidenti tedeschi</td>\n</tr>\n<tr>\n<td><strong>AAIB</strong></td>\n<td>gov.uk/aaib</td>\n<td>Incidenti britannici</td>\n</tr>\n<tr>\n<td><strong>SKYbrary</strong></td>\n<td>skybrary.aero</td>\n<td>Knowledge base sicurezza aerea</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"aviation-safety-network-asn\">7.2 Aviation Safety Network\n(ASN)</h3>\n<p><strong>ASN</strong> (https://aviation-safety.net) è il database più\ncompleto sugli incidenti aerei pubblicamente disponibile: - Ogni\nincidente è classificato per gravità, tipo, fase di volo, causa. -\nStorie complete di incidenti famosi. - Ricerca per tipo di aeromobile,\ncompagnia, anno, paese.</p>\n<p><strong>Per l’OSINT:</strong> se stai indagando su una compagnia\naerea o su un aeromobile specifico, controlla se è coinvolto in\nincidenti passati.</p>\n<h3 id=\"ntsb-indagini-usa\">7.3 NTSB: indagini USA</h3>\n<p>Il <strong>NTSB</strong> (National Transportation Safety Board)\npubblica le indagini complete sugli incidenti statunitensi, inclusi: -\nTrascrizioni del CVR (Cockpit Voice Recorder). - Dati del FDR (Flight\nData Recorder). - Rapporti finali con cause accertate.</p>\n<p>Ricerca: https://data.ntsb.gov/carol-main-public/basic-search</p>\n<hr />\n<h2 id=\"database-ufficiali\">8. Database ufficiali</h2>\n<h3 id=\"registro-aeromobili-per-paese\">8.1 Registro aeromobili per\npaese</h3>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Paese</th>\n<th>Ente</th>\n<th>URL</th>\n<th>Prefisso</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Italia</strong></td>\n<td>ENAC</td>\n<td>enac.gov.it/registro-aeromobili</td>\n<td><code>I-</code></td>\n</tr>\n<tr>\n<td><strong>USA</strong></td>\n<td>FAA</td>\n<td>registry.faa.gov</td>\n<td><code>N</code></td>\n</tr>\n<tr>\n<td><strong>UK</strong></td>\n<td>CAA</td>\n<td>srs.caa.co.uk</td>\n<td><code>G-</code></td>\n</tr>\n<tr>\n<td><strong>Germania</strong></td>\n<td>LBA</td>\n<td>lba.de</td>\n<td><code>D-</code></td>\n</tr>\n<tr>\n<td><strong>Francia</strong></td>\n<td>DGAC</td>\n<td>certificat-immatriculation.aviation-civile.gouv.fr</td>\n<td><code>F-</code></td>\n</tr>\n<tr>\n<td><strong>Svizzera</strong></td>\n<td>FOCA</td>\n<td>bazl.admin.ch</td>\n<td><code>HB-</code></td>\n</tr>\n<tr>\n<td><strong>Europa</strong></td>\n<td>EASA</td>\n<td>easa.europa.eu</td>\n<td>Vari</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"registro-icao\">8.2 Registro ICAO</h3>\n<p>L’<strong>ICAO</strong> (International Civil Aviation Organization)\nmantiene il database ufficiale delle designazioni ICAO: - <strong>ICAO\nAircraft Type Designators</strong>: codici di 4 caratteri per ogni tipo\ndi aeromobile (es. <code>B738</code> = Boeing 737-800). -\n<strong>Airline Designators</strong>: prefissi dei callsign per ogni\ncompagnia (es. <code>AZ</code> = ITA Airways). - <strong>Airport\nCodes</strong>: ICAO a 4 lettere (es. <code>LIRF</code> = Roma\nFiumicino).</p>\n<p><strong>Strumenti di supporto:</strong></p>\n<pre class=\"python\"><code>#!/usr/bin/env python3\n&quot;&quot;&quot;\ndecodifica_icao.py – Decodifica codici ICAO comuni.\n&quot;&quot;&quot;\n\n# Prefissi ICAO hex → paese (selezione)\nICAO_PREFISSI = {\n    (0x400000, 0x43FFFF): &quot;Italia&quot;,\n    (0x440000, 0x447FFF): &quot;Lussemburgo&quot;,\n    (0x448000, 0x44FFFF): &quot;Austria&quot;,\n    (0x450000, 0x457FFF): &quot;Belgio&quot;,\n    (0x458000, 0x45FFFF): &quot;Francia (Dom-Tom)&quot;,\n    (0x460000, 0x467FFF): &quot;Francia&quot;,\n    (0x468000, 0x46FFFF): &quot;Spagna&quot;,\n    (0x470000, 0x477FFF): &quot;Portogallo&quot;,\n    (0x478000, 0x47FFFF): &quot;Svizzera&quot;,\n    (0x480000, 0x487FFF): &quot;Gran Bretagna&quot;,\n    (0x3C0000, 0x3FFFFF): &quot;Germania&quot;,\n    (0xA00000, 0xAFFFFF): &quot;USA&quot;,\n    (0xC00000, 0xC3FFFF): &quot;Canada&quot;,\n}\n\n# Callsign OACI → compagnia aerea\nCALLSIGN_COMPAGNIA = {\n    &quot;AZ&quot;: &quot;ITA Airways (ex Alitalia)&quot;, &quot;FR&quot;: &quot;Ryanair&quot;,\n    &quot;U2&quot;: &quot;easyJet&quot;, &quot;VY&quot;: &quot;Vueling&quot;, &quot;W6&quot;: &quot;Wizz Air&quot;,\n    &quot;LH&quot;: &quot;Lufthansa&quot;, &quot;AF&quot;: &quot;Air France&quot;, &quot;BA&quot;: &quot;British Airways&quot;,\n    &quot;KL&quot;: &quot;KLM&quot;, &quot;IB&quot;: &quot;Iberia&quot;, &quot;SK&quot;: &quot;SAS&quot;,\n    &quot;EK&quot;: &quot;Emirates&quot;, &quot;QR&quot;: &quot;Qatar Airways&quot;, &quot;EY&quot;: &quot;Etihad&quot;,\n    &quot;AA&quot;: &quot;American Airlines&quot;, &quot;UA&quot;: &quot;United Airlines&quot;, &quot;DL&quot;: &quot;Delta&quot;,\n    &quot;SPAR&quot;: &quot;USAF Special Air Mission&quot;, &quot;RCH&quot;: &quot;USAF Air Mobility Command&quot;,\n}\n\n# Squawk → significato\nSQUAWK_SPECIALI = {\n    &quot;7500&quot;: &quot;🚨 HIJACKING – Dirottamento in corso&quot;,\n    &quot;7600&quot;: &quot;📻 NORDO – Perdita comunicazioni radio&quot;,\n    &quot;7700&quot;: &quot;🆘 MAYDAY – Emergenza generale&quot;,\n    &quot;1200&quot;: &quot;VFR standard USA&quot;,\n    &quot;2000&quot;: &quot;IFR senza assegnazione ATC&quot;,\n    &quot;7777&quot;: &quot;🪖 Intercettazione militare&quot;,\n}\n\n\ndef decodifica_icao_hex(hex_str: str) -&gt; str:\n    &quot;&quot;&quot;Trova il paese da un codice ICAO hex.&quot;&quot;&quot;\n    try:\n        val = int(hex_str.replace(&quot; &quot;, &quot;&quot;), 16)\n    except ValueError:\n        return &quot;Formato non valido&quot;\n    for (minv, maxv), paese in ICAO_PREFISSI.items():\n        if minv &lt;= val &lt;= maxv:\n            return paese\n    return &quot;Sconosciuto&quot;\n\n\ndef decodifica_callsign(callsign: str) -&gt; str:\n    &quot;&quot;&quot;Trova la compagnia dal prefisso del callsign.&quot;&quot;&quot;\n    callsign = callsign.strip().upper()\n    for prefisso, nome in CALLSIGN_COMPAGNIA.items():\n        if callsign.startswith(prefisso):\n            return nome\n    return &quot;Compagnia sconosciuta o privato&quot;\n\n\nif __name__ == &quot;__main__&quot;:\n    print(&quot;=== Decodifica ICAO ===&quot;)\n    hex_code = input(&quot;ICAO hex (es. 4B1810): &quot;).strip()\n    callsign = input(&quot;Callsign (es. AZ123): &quot;).strip()\n    squawk = input(&quot;Squawk (es. 7700): &quot;).strip()\n\n    print(f&quot;\\n  Paese:    {decodifica_icao_hex(hex_code)}&quot;)\n    print(f&quot;  Compagnia: {decodifica_callsign(callsign)}&quot;)\n    if squawk in SQUAWK_SPECIALI:\n        print(f&quot;  Squawk:   {SQUAWK_SPECIALI[squawk]}&quot;)</code></pre>\n<hr />\n<h2 id=\"informazioni-sugli-aeroporti\">9. Informazioni sugli\naeroporti</h2>\n<h3 id=\"database-degli-aeroporti\">9.1 Database degli aeroporti</h3>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Risorsa</th>\n<th>URL</th>\n<th>Contenuto</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>OurAirports</strong></td>\n<td>ourairports.com</td>\n<td>Database globale scaricabile CSV</td>\n</tr>\n<tr>\n<td><strong>ICAO</strong></td>\n<td>icao.int</td>\n<td>Codici ICAO ufficiali</td>\n</tr>\n<tr>\n<td><strong>FlightAware</strong></td>\n<td>flightaware.com/live/airport</td>\n<td>Traffico in tempo reale per aeroporto</td>\n</tr>\n<tr>\n<td><strong>Airport-data.com</strong></td>\n<td>airport-data.com</td>\n<td>Foto, info tecniche</td>\n</tr>\n<tr>\n<td><strong>SkyVector</strong></td>\n<td>skyvector.com</td>\n<td>Mappe aeronautiche VFR/IFR</td>\n</tr>\n<tr>\n<td><strong>AIP Italia</strong></td>\n<td>enav.it</td>\n<td>Pubblicazione di Informazioni Aeronautiche</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"struttura-dei-codici-aeroporto\">9.2 Struttura dei codici\naeroporto</h3>\n<p>Ogni aeroporto ha <strong>due codici</strong>: -\n<strong>ICAO</strong> (4 lettere): usato dai piloti e dal controllo del\ntraffico (es. <code>LIRF</code> = Roma Fiumicino). -\n<strong>IATA</strong> (3 lettere): usato dai passeggeri e dalle\ncompagnie (es. <code>FCO</code> = Roma Fiumicino).</p>\n<p>Il prefisso ICAO indica il paese/regione: - <code>LI</code> = Italia\n- <code>EG</code> = Gran Bretagna - <code>ED</code> / <code>ET</code> =\nGermania - <code>LF</code> = Francia - <code>LE</code> = Spagna -\n<code>K</code> = USA continentale - <code>PA</code> = Alaska</p>\n<h3 id=\"traffico-in-tempo-reale-per-aeroporto\">9.3 Traffico in tempo\nreale per aeroporto</h3>\n<p><strong>FlightAware per aeroporto:</strong></p>\n<pre><code>https://www.flightaware.com/live/airport/ICAO</code></pre>\n<p><strong>OpenSky per aeroporto:</strong></p>\n<pre class=\"python\"><code>def voli_da_aeroporto(icao_aeroporto: str, ore: int = 1) -&gt; list[dict]:\n    &quot;&quot;&quot;Recupera i voli partiti da un aeroporto nelle ultime N ore.&quot;&quot;&quot;\n    fine = int(time.time())\n    inizio = fine - (ore * 3600)\n    r = requests.get(\n        f&quot;https://opensky-network.org/api/flights/departure&quot;,\n        params={&quot;airport&quot;: icao_aeroporto, &quot;begin&quot;: inizio, &quot;end&quot;: fine},\n        auth=(OPENSKY_USER, OPENSKY_PASS) if OPENSKY_USER else None,\n        timeout=15\n    )\n    r.raise_for_status()\n    return r.json()</code></pre>\n<hr />\n<h2 id=\"dettagli-su-licenze-dei-piloti\">10. Dettagli su licenze dei\npiloti</h2>\n<h3 id=\"registro-dei-piloti-italiani-enac\">10.1 Registro dei piloti\nitaliani (ENAC)</h3>\n<p>L’<strong>ENAC</strong> (Ente Nazionale per l’Aviazione Civile) non\npubblica un registro pubblico consultabile online dei piloti italiani,\nper motivi di privacy. Le informazioni sulle licenze sono accessibili\nsolo tramite richiesta formale o ai datori di lavoro con accesso al\nsistema ECCAIRS.</p>\n<p><strong>Cosa è pubblicamente disponibile:</strong> - Conferma che una\nlicenza è valida (su richiesta motivata). - I titolari di Certificato di\nOperatore Aereo (COA) sono spesso presenti sul sito ENAC.</p>\n<h3 id=\"faa-airmen-inquiry-usa\">10.2 FAA Airmen Inquiry (USA)</h3>\n<p>Il <strong>FAA Airmen Inquiry</strong>\n(https://amsrvs.registry.faa.gov/airmeninquiry/) è il registro pubblico\ndei piloti americani. Permette di cercare: - Nome e cognome del pilota.\n- Tipo di certificato (PPL, CPL, ATP, ecc.). - Abilitazioni (type\nrating: quali aeromobili può pilotare). - Stato della certificazione\n(attivo, sospeso, revocato). - Città di residenza (solo stato USA).</p>\n<p><strong>Non mostra</strong>: indirizzo completo, data di nascita,\nnumero di licenza.</p>\n<p><strong>Uso OSINT:</strong> se vuoi verificare se una persona afferma\ndi essere un pilota certificato negli USA, puoi confermarlo o smentirlo\ncon questa ricerca.</p>\n<h3 id=\"easa-part-fcl\">10.3 EASA Part-FCL</h3>\n<p>Le licenze europee sono regolate da <strong>EASA Part-FCL</strong>.\nLe autorità nazionali (ENAC per l’Italia, CAA per UK, LBA per Germania,\necc.) mantengono i registri ma solo alcune li rendono parzialmente\npubblici.</p>\n<p><strong>CAA UK</strong> (https://www.caa.co.uk): ha un registro\nparzialmente pubblico per verificare le licenze britanniche.</p>\n<hr />\n<h2 id=\"tracking-cargo\">11. Tracking cargo</h2>\n<h3 id=\"caratteristiche-dei-voli-cargo\">11.1 Caratteristiche dei voli\ncargo</h3>\n<p>I <strong>voli cargo</strong> hanno caratteristiche che li rendono\ninteressanti per l’OSINT: - Operano spesso di notte (minimizzando\nl’impatto sul traffico passeggeri). - Usano aeromobili dedicati (Boeing\n747-8F, 767F, 777F; Airbus A330F, A400M per militari). - Hanno callsign\ndi compagnie cargo specializzate (DHL, FedEx, UPS, Cargolux, Air France\nCargo, ecc.). - Spesso seguono rotte meno standard rispetto ai voli di\nlinea.</p>\n<h3 id=\"strumenti-per-il-cargo-tracking\">11.2 Strumenti per il cargo\ntracking</h3>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Strumento</th>\n<th>URL</th>\n<th>Note</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>FlightRadar24</strong></td>\n<td>flightradar24.com</td>\n<td>Filtra per tipo “cargo”</td>\n</tr>\n<tr>\n<td><strong>ADS-B Exchange</strong></td>\n<td>adsbexchange.com</td>\n<td>Non filtrato, include cargo discreti</td>\n</tr>\n<tr>\n<td><strong>Cargo-partner</strong></td>\n<td>cargo-partner.com/track</td>\n<td>Tracking shipment (non aeromobili)</td>\n</tr>\n<tr>\n<td><strong>CargoMonitor</strong></td>\n<td>cargomonitor.com</td>\n<td>Monitoring cargo aereo</td>\n</tr>\n<tr>\n<td><strong>Freightos</strong></td>\n<td>freightos.com</td>\n<td>Piattaforma logistics con tracking</td>\n</tr>\n<tr>\n<td><strong>Flightradar24 Cargo</strong></td>\n<td>(filtro nella piattaforma)</td>\n<td>Tipo aeromobile: 74F, 77F, 76F</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"identificare-voli-cargo-militari\">11.3 Identificare voli cargo\nmilitari</h3>\n<p>I voli cargo militari americani usano callsign specifici: -\n<code>RCH</code> (Reach): US Air Force Air Mobility Command. -\n<code>JAKE</code>: voli di trasporto dell’esercito USA. -\n<code>BOXER</code>, <code>WOLF</code>: vari callsign USAF. -\n<code>MAGMA</code>: voli CIA (documentati dalla ricerca di\nBellingcat).</p>\n<p><strong>MAGMA flights:</strong> Bellingcat e altri investigatori\nOSINT hanno documentato come voli con callsign <code>MAGMA</code>\n(registrati su Gulfstream intestati a contractor della CIA) fossero\nusati per le renditions straordinarie (trasferimenti segreti di\ndetenuti). Questa scoperta è avvenuta combinando: 1. Tracking ADS-B di\naerei con tail number noti. 2. Ricerca sui registri FAA per trovare i\nproprietari delle LLC. 3. Ricerca sui database aziendali per collegare\nle LLC alla CIA.</p>\n<hr />\n<h2 id=\"box-legale-ed-etico\">⚖️ Box legale ed etico</h2>\n<h3 id=\"legalità-del-tracking-ads-b\">Legalità del tracking ADS-B</h3>\n<p>Ricevere segnali ADS-B è <strong>assolutamente legale</strong> in\nItalia e nella quasi totalità dei paesi: le trasmissioni ADS-B sono\nsegnali radio non crittografati su frequenze pubbliche, equivalenti ad\nascoltare la radio. La ricezione passiva non richiede\nautorizzazioni.</p>\n<p>Pubblicare i dati ricevuti è anch’essa generalmente legale (libera\nmanifestazione del pensiero, informazione di pubblica utilità).</p>\n<p><strong>Eccezioni:</strong> - Alcuni paesi (Cina, Russia, Iran)\nvietano la pubblicazione di dati di tracking aerei militari. - La\nFrancia ha temporaneamente limitato la pubblicazione di voli militari\ndurante certi esercizi.</p>\n<h3 id=\"uso-investigativo\">Uso investigativo</h3>\n<p>Il tracking aeronautico è stato usato con grande efficacia da: -\n<strong>Bellingcat</strong>: per tracciare aerei militari russi in\nUcraina e Siria. - <strong>giornalisti investigativi</strong>: per\ntracciare jet privati di oligarchi russi dopo il 2022. -\n<strong>attivisti</strong>: per documentare voli di deportazione\nirregolari.</p>\n<p>Questi usi sono stati riconosciuti come legittimi nell’ambito del\ngiornalismo investigativo.</p>\n<h3 id=\"privacy-e-jet-privati\">Privacy e jet privati</h3>\n<p>In Europa, il GDPR crea tensioni con il tracking dei jet privati: i\nproprietari di aerei hanno sostenuto che i loro movimenti costituiscono\ndati personali tutelati. Tuttavia, i tribunali europei hanno\ngeneralmente ritenuto che i dati di volo (trasmessi su frequenze\npubbliche, registrati nei registri aziendali) non godano di una\nragionevole aspettativa di riservatezza nel contesto del trasporto aereo\ncivile.</p>\n<p><strong>Elon Musk e <span class=\"citation\"\ndata-cites=\"ElonJet\">@ElonJet</span></strong>: il caso del bot Twitter\nche tracciava il jet privato di Elon Musk ha portato alla messa in\ndiscussione dei limiti del tracking aereo. Musk ha fatto pressione su\nTwitter/X per rimuovere l’account, poi ha acquistato Twitter anche per\nquesto motivo. Il creatore del bot (Jack Sweeney) ha trasferito il\nservizio su Mastodon e Telegram.</p>\n<hr />\n<h2 id=\"caso-di-studio-il-cargo-fantasma\">Caso di studio: “Il cargo\nfantasma”</h2>\n<blockquote>\n<p><em>Scenario fittizio.</em></p>\n</blockquote>\n<p><strong>Scenario.</strong> Un giornalista investigativo riceve una\nsoffiata: un aereo cargo di una piccola compagnia charter effettua voli\nsospetti tra l’Europa e una regione di conflitto, trasportando materiale\nnon dichiarato. Il callsign usato cambia di frequente. Il giornalista\ndeve verificare e documentare questi movimenti.</p>\n<p><strong>Step 1 – Identificazione del codice ICAO.</strong> La\nsoffiata include il tipo di aeromobile (Antonov An-12) e la base\noperativa approssimativa (aeroporto dell’Europa dell’Est). Cerca su\nPlanespotters.net: “An-12” + “compagnia charter” → lista di An-12 attivi\ncon ICAO hex.</p>\n<p><strong>Step 2 – Tracking su ADS-B Exchange.</strong> Carica i codici\nICAO su ADS-B Exchange (non filtrato). Trova 3 An-12 che trasmettono\nADS-B irregolarmente. Uno di questi (<code>UR-BKP</code>, bandiera\nucraina) mostra un tracciato che include uno scalo in una zona non\ndichiarata nella rotta ufficiale.</p>\n<p><strong>Step 3 – Storico OpenSky.</strong></p>\n<pre class=\"python\"><code>voli = voli_recenti_aeromobile(&quot;XXABCD&quot;, giorni=30)</code></pre>\n<p>Il risultato mostra 8 voli negli ultimi 30 giorni. 5 dei voli hanno\naeroporto di destinazione <code>OAIX</code> (Bagram, Afghanistan) o\n<code>OJAM</code> (Amman, Giordania) ma l’aeromobile non trasmette la\nposizione durante una parte del volo (troncatura del tracciato).</p>\n<p><strong>Step 4 – Registro FAA e Planespotters.</strong> Il numero di\ncoda porta a una LLC maltese. OpenCorporates mostra che la LLC è stata\ncreata 6 mesi prima e ha un agente registrato di comodo a Malta.</p>\n<p><strong>Step 5 – Correlazione con immagini satellitari.</strong>\nUsando Sentinel Hub, viene verificata la presenza dell’aeromobile\nall’aeroporto di scalo nella data indicata dall’ADS-B: ✔ l’ombra di un\ngrande aeromobile a quattro motori è visibile sul piazzale.</p>\n<p><strong>Step 6 – Controllo incidenti.</strong> Su ASN Aviation Safety\nNetwork: il numero di coda dell’aeromobile risulta in una notifica ENAC\nper violazione delle norme di manutenzione nel 2021.</p>\n<p><strong>Conclusioni nel report:</strong></p>\n<blockquote>\n<p>“L’aeromobile [ICAO] ha effettuato almeno 8 voli negli ultimi 30\ngiorni, con destinazioni che includono aeroporti in zone di conflitto. I\ntracciati ADS-B mostrano troncature sistematiche in corrispondenza delle\naree sensibili, suggerendo lo spegnimento intenzionale del transponder.\nLa proprietà è oscurata da una LLC maltese priva di attività\nverificabile. L’analisi satellitare conferma la presenza dell’aeromobile\nnell’aeroporto di scalo alla data identificata. Queste prove,\ncomplessivamente, sono coerenti con la soffiata ricevuta e sufficienti\nper continuare l’indagine giornalistica.”</p>\n</blockquote>\n<hr />\n<h2 id=\"esercizi-pratici\">Esercizi pratici</h2>\n<p><strong>Esercizio 1 – FlightRadar24 (20 min)</strong> Apri\nFlightRadar24. Clicca su 5 aerei sopra l’Italia. Per ciascuno documenta:\nICAO hex, callsign, tipo, compagnia, altitudine. Prova a decodificare il\npaese dall’ICAO hex usando la tabella della lezione.</p>\n<p><strong>Esercizio 2 – ADS-B Exchange vs FR24 (20 min)</strong> Apri\nADS-B Exchange e FlightRadar24 in parallelo. Nella stessa area\ngeografica, ci sono aerei visibili su ADSBX ma non su FR24? Se sì,\ndocumenta il callsign e il tipo.</p>\n<p><strong>Esercizio 3 – Squawk di emergenza (15 min)</strong> Usa lo\nscript <code>opensky_tracker.py</code> per visualizzare i voli\nsull’Italia. Ci sono squawk speciali visibili? Modifica lo script per\naggiungere un alert sonoro (es. <code>print(\"\\a\")</code>) quando viene\nrilevato uno squawk 7700.</p>\n<p><strong>Esercizio 4 – Storico voli (30 min)</strong> Scegli un\naeromobile pubblico noto (es. un Boeing 737 di Ryanair che conosci).\nTrova il suo ICAO hex su FlightRadar24. Usa\n<code>voli_recenti_aeromobile()</code> per recuperare gli ultimi 7\ngiorni di voli. Quante rotte diverse ha effettuato?</p>\n<p><strong>Esercizio 5 – FAA Registry (20 min)</strong> Vai su\nhttps://registry.faa.gov/aircraftinquiry/. Cerca 3 aeromobili con\nN-number diversi (puoi trovarne su FlightRadar24). Chi sono i\nproprietari dichiarati? Ci sono LLC? Cerca le LLC su OpenCorporates.</p>\n<p><strong>Esercizio 6 – ASN database (20 min)</strong> Vai su\naviation-safety.net. Cerca gli incidenti per un tipo di aeromobile (es.\nBoeing 737 MAX). Quanti incidenti sono registrati? Qual è stato\nl’incidente più recente?</p>\n<p><strong>Esercizio 7 – Cargo tracking (25 min)</strong> Su\nFlightRadar24, filtra per tipo di aeromobile <code>B748</code> (Boeing\n747-8F) o <code>B77F</code> (Boeing 777F). Identifica 3 voli cargo\nattivi. Per ciascuno: chi è la compagnia? Quale rotta sta seguendo?\nL’aeromobile è visibile anche su ADS-B Exchange?</p>\n<hr />\n","quiz":[{"q":"Su quale frequenza trasmettono i segnali ADS-B?","opts":{"a":"121.5 MHz (frequenza di emergenza)","b":"406 MHz (ELT)","c":"1090 MHz","d":"8.364 MHz (HF)"},"correct":"c","why":"ADS-B trasmette su 1090 MHz"},{"q":"Il codice ICAO hex di un aeromobile è:","opts":{"a":"Il codice del volo assegnato dalla compagnia","b":"Il codice permanente a 24 bit del transponder, univoco per ogni aeromobile","c":"Il codice impostato dal pilota su istruzione dell'ATC","d":"Il codice IATA dell'aeroporto di partenza"},"correct":"b","why":"Il codice ICAO hex è permanente, a 24 bit, univoco per ogni transponder"},{"q":"Lo squawk 7500 indica:","opts":{"a":"Perdita di comunicazioni radio","b":"Emergenza medica a bordo","c":"Dirottamento in corso","d":"Volo VFR non controllato"},"correct":"c","why":"Squawk 7500 = dirottamento in corso"},{"q":"ADS-B Exchange è preferito a FlightRadar24 per l'OSINT perché:","opts":{"a":"Ha un'interfaccia più moderna","b":"Non applica filtri: mostra anche voli oscurati da LADD e voli militari","c":"Ha dati più accurati grazie a migliori ricevitori","d":"È gratuito e senza limitazioni di orario"},"correct":"b","why":"ADS-B Exchange non applica filtri commerciali: mostra anche voli oscurati da LADD"},{"q":"L'MLAT (Multilateration) viene usato quando:","opts":{"a":"L'aeromobile non ha il GPS attivo: la posizione viene triangolata da più ricevitori","b":"Il segnale GPS è disturbato dalla ionosfera","c":"L'aeromobile vola a più di 40.000 piedi","d":"Il transponder è in modalità A/C (senza Mode S)"},"correct":"a","why":"MLAT triangola la posizione dai segnali ricevuti da 4 o più ricevitori quando manca il GPS"},{"q":"Il FAA Registry è utile per l'OSINT perché:","opts":{"a":"Mostra il piano di volo di tutti gli aerei americani","b":"Contiene il proprietario dichiarato di ogni aeromobile registrato negli USA, accessibile gratuitamente","c":"Mostra le licenze di tutti i piloti mondiali","d":"Registra automaticamente i passeggeri di ogni volo"},"correct":"b","why":"Il FAA Registry contiene il proprietario dichiarato di ogni aeromobile con N-number"},{"q":"I callsign che iniziano con RCH appartengono a:","opts":{"a":"Royal Canadian Air Force","b":"US Air Force Air Mobility Command (voli di trasporto)","c":"Red Cross Humanitarian flights","d":"Ryanair Charter"},"correct":"b","why":"RCH = US Air Force Air Mobility Command"},{"q":"Per quale ragione un proprietario di jet privato registra l'aeromobile su una LLC del Delaware?","opts":{"a":"Per ottenere sconti sulle tasse aeroportuali","b":"Per oscurare la propria identità come proprietario reale nei registri pubblici","c":"Perché il Delaware ha più spazio aereo disponibile","d":"Per ottenere l'accesso prioritario agli slot aeroportuali"},"correct":"b","why":"La LLC del Delaware oscura l'identità del proprietario reale nei registri pubblici"},{"q":"Il callsign MAGMA è noto nell'OSINT aeronautico perché:","opts":{"a":"È il callsign standard dei cargo FedEx in Europa","b":"Voli con questo callsign sono stati collegati a operazioni CIA di rendition straordinaria","c":"È il callsign dei voli di addestramento NATO","d":"Identifica i voli dell'Agenzia Europea per la Sicurezza Aerea"},"correct":"b","why":"I voli MAGMA sono stati collegati a operazioni CIA di rendition straordinaria"},{"q":"Quale banca dati pubblica permette di verificare se un pilota è certificato dalla FAA?","opts":{"a":"ICAO Safety Database","b":"OpenSky Network","c":"FAA Airmen Inquiry (amsrvs.registry.faa.gov)","d":"Aviation Safety Network"},"correct":"c","why":"FAA Airmen Inquiry (amsrvs.registry.faa.gov) verifica le certificazioni dei piloti USA"}]},{"title":"Social Engineering","html":"<h1 id=\"lezione-12-social-engineering\">Lezione 12 – Social\nEngineering</h1>\n<blockquote>\n<p><em>“Puoi avere la tecnologia di sicurezza più avanzata al mondo — ma\nbasta una telefonata ben costruita per aggirarla.”</em> — Kevin Mitnick,\n<em>The Art of Deception</em> (2002)</p>\n</blockquote>\n<hr />\n<h2 id=\"obiettivi-di-apprendimento\">Obiettivi di apprendimento</h2>\n<p>Al termine di questa lezione sarai in grado di:</p>\n<ol type=\"1\">\n<li>definire il Social Engineering e comprendere perché l’essere umano è\nil vettore di attacco più vulnerabile in qualsiasi sistema;</li>\n<li>classificare le principali <strong>tecniche di ingegneria\nsociale</strong> e riconoscerne i segnali;</li>\n<li>applicare i sei <strong>principi di persuasione</strong> di Cialdini\nal contesto dell’analisi delle minacce;</li>\n<li>comprendere cos’è l’<strong>elicitazione</strong>, come si distingue\ndall’interrogatorio e perché è così efficace;</li>\n<li>collegare le tecniche di elicitazione ai <strong>bisogni umani\nfondamentali</strong> (Maslow, SDT);</li>\n<li>identificare le <strong>tendenze naturali</strong> che rendono le\npersone vulnerabili all’elicitazione;</li>\n<li>riconoscere e neutralizzare le principali tecniche di elicitazione\nquando vengono usate contro di te;</li>\n<li>applicare consapevolmente principi di elicitazione in contesti OSINT\nlegittimi (interviste, conversazioni di ricerca).</li>\n</ol>\n<hr />\n<h2 id=\"tecniche-di-ingegneria-sociale\">1. Tecniche di ingegneria\nsociale</h2>\n<h3 id=\"definizione\">1.1 Definizione</h3>\n<p>Il <strong>Social Engineering</strong> (ingegneria sociale) è\nl’insieme delle tecniche psicologiche e comportamentali usate per\nmanipolare le persone affinché compiano azioni o divulghino informazioni\nche normalmente non farebbero o non condividerebbero.</p>\n<p>A differenza degli attacchi tecnici (che sfruttano vulnerabilità nel\nsoftware), il Social Engineering sfrutta le <strong>vulnerabilità nella\npsicologia umana</strong>: il desiderio di essere utili, la paura\ndell’autorità, la fiducia nel prossimo, la tendenza alla coerenza, il\nbisogno di appartenenza sociale.</p>\n<blockquote>\n<p><strong>Differenza fondamentale rispetto all’OSINT puro:</strong>\nl’OSINT raccoglie informazioni già esistenti e accessibili senza\ninterazione con il target. Il Social Engineering interagisce attivamente\ncon le persone per ottenere informazioni o indurre comportamenti. La\nsoglia etica e legale è molto più alta.</p>\n</blockquote>\n<h3 id=\"il-fattore-umano-come-vettore-principale\">1.2 Il fattore umano\ncome vettore principale</h3>\n<p>Studi ripetuti dimostrano che la causa principale delle violazioni di\nsicurezza informatica non è tecnica ma umana. Alcune statistiche:</p>\n<ul>\n<li>Il <strong>95%</strong> degli attacchi informatici di successo\ninizia con un elemento di Social Engineering (IBM Security, 2023).</li>\n<li>Il <strong>phishing</strong> (una forma di Social Engineering\ndigitale) è il vettore di attacco iniziale nel <strong>36%</strong>\ndelle violazioni di dati (Verizon DBIR, 2023).</li>\n<li>Il tempo medio per cadere in una trappola di phishing ben costruita:\n<strong>meno di 60 secondi</strong>.</li>\n</ul>\n<p><strong>Perché il cervello umano è vulnerabile:</strong> Il cervello\numano non è progettato per elaborare ogni decisione razionalmente. Usa\ndue sistemi (Daniel Kahneman, <em>Thinking, Fast and Slow</em>): -\n<strong>Sistema 1</strong>: rapido, automatico, intuitivo, basato su\neuristiche e scorciatoie mentali. - <strong>Sistema 2</strong>: lento,\ndeliberato, razionale, analitico.</p>\n<p>Le tecniche di Social Engineering <strong>sovraccaricano il Sistema\n2</strong> (urgenza, stress, distrazione) e <strong>sfruttano il Sistema\n1</strong> (autorità, fiducia, reciprocità). La vittima reagisce\nistintivamente invece di ragionare.</p>\n<h3 id=\"classificazione-delle-tecniche\">1.3 Classificazione delle\ntecniche</h3>\n<p>Le tecniche di Social Engineering si dividono per\n<strong>canale</strong> e per <strong>obiettivo</strong>:</p>\n<p><strong>Per canale:</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Tecnica</th>\n<th>Canale</th>\n<th>Descrizione</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Phishing</strong></td>\n<td>Email</td>\n<td>Email falsa che induce a cliccare un link o divulgare\ncredenziali</td>\n</tr>\n<tr>\n<td><strong>Spear phishing</strong></td>\n<td>Email</td>\n<td>Phishing personalizzato su un target specifico</td>\n</tr>\n<tr>\n<td><strong>Vishing</strong></td>\n<td>Voce (telefono/VoIP)</td>\n<td>Truffa telefonica con impersonificazione</td>\n</tr>\n<tr>\n<td><strong>Smishing</strong></td>\n<td>SMS</td>\n<td>Phishing via SMS</td>\n</tr>\n<tr>\n<td><strong>Pretexting</strong></td>\n<td>Vari</td>\n<td>Creazione di un contesto/storia falsa per giustificare la\nrichiesta</td>\n</tr>\n<tr>\n<td><strong>Baiting</strong></td>\n<td>Fisico/digitale</td>\n<td>Lasciare un’USB infetta o un link allettante</td>\n</tr>\n<tr>\n<td><strong>Tailgating</strong></td>\n<td>Fisico</td>\n<td>Seguire qualcuno in un’area protetta</td>\n</tr>\n<tr>\n<td><strong>Quid pro quo</strong></td>\n<td>Vari</td>\n<td>Offrire qualcosa in cambio di informazioni/accesso</td>\n</tr>\n<tr>\n<td><strong>Elicitazione</strong></td>\n<td>Conversazione</td>\n<td>Estrazione di informazioni senza che la vittima ne sia\nconsapevole</td>\n</tr>\n<tr>\n<td><strong>Impersonation</strong></td>\n<td>Vari</td>\n<td>Fingere di essere qualcun altro (tecnico IT, dirigente,\nispettore)</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Per obiettivo:</strong> - <strong>Raccolta di\ninformazioni</strong>: ottenere dati (password, dati personali, segreti\naziendali). - <strong>Accesso fisico</strong>: entrare in spazi\nprotetti. - <strong>Accesso digitale</strong>: ottenere credenziali o\nfar installare malware. - <strong>Manipolazione\ncomportamentale</strong>: far compiere un’azione (bonifico, firma di\ncontratto).</p>\n<h3 id=\"il-ciclo-del-social-engineering\">1.4 Il ciclo del Social\nEngineering</h3>\n<p>Ogni attacco di Social Engineering segue un ciclo simile:</p>\n<pre><code>  1. RICOGNIZIONE\n     │  Chi è il target? Quali informazioni pubbliche esistono?\n     │  OSINT: LinkedIn, social media, sito aziendale, WHOIS\n     ▼\n  2. COSTRUZIONE DEL PRETESTO\n     │  Chi sarò? Quale storia costruirò?\n     │  Identità, backstory, documenti, accento, vocabolario\n     ▼\n  3. CONTATTO E RAPPORT\n     │  Primo contatto: costruire fiducia rapidamente\n     │  Mirroring, linguaggio del corpo, tono di voce\n     ▼\n  4. ELICITAZIONE / MANIPOLAZIONE\n     │  Usare i principi psicologici per estrarre informazioni o azioni\n     │  Reciprocità, autorità, urgenza, scarsità\n     ▼\n  5. CHIUSURA\n     │  Ottenere ciò che si cerca e uscire dalla conversazione\n     │  Senza lasciare sospetti (o con un alibi)\n     ▼\n  6. POST-EXECUTION\n     Coprire le tracce, mantenere la storia coerente</code></pre>\n<hr />\n<h2 id=\"tecniche-di-persuasione\">2. Tecniche di persuasione</h2>\n<h3 id=\"i-sei-principi-di-cialdini\">2.1 I sei principi di Cialdini</h3>\n<p><strong>Robert Cialdini</strong>, psicologo sociale americano, ha\nidentificato nei suoi libri <em>Influence</em> (1984) e\n<em>Pre-Suasion</em> (2016) i sei principi fondamentali della\npersuasione sociale. Sono la base teorica su cui si costruisce qualsiasi\ntecnica di Social Engineering efficace.</p>\n<hr />\n<h4 id=\"reciprocità\">2.1.1 Reciprocità</h4>\n<p><strong>Il principio:</strong> Le persone si sentono obbligate a\nrestituire ciò che hanno ricevuto. Un favore, un regalo,\nun’informazione, anche piccoli, creano un senso di debito\npsicologico.</p>\n<p><strong>In natura:</strong> nel regno animale e nelle culture umane\ndi ogni epoca, la reciprocità è il fondamento della cooperazione\nsociale.</p>\n<p><strong>Come viene sfruttata:</strong> - Il social engineer offre\nqualcosa di piccolo (informazione, aiuto, elogio) prima di chiedere. -\nNelle frodi telefoniche: “Le sto dando questa informazione\ngratuitamente, sa? Allora mi dica…” - Nelle email di phishing: allegano\nqualcosa di utile (un report, un documento) prima di chiedere le\ncredenziali.</p>\n<p><strong>Come riconoscerla:</strong> quando qualcuno ti offre qualcosa\nche non hai chiesto e subito dopo avanza una richiesta, attiva il\nSistema 2.</p>\n<hr />\n<h4 id=\"impegno-e-coerenza\">2.1.2 Impegno e coerenza</h4>\n<p><strong>Il principio:</strong> Una volta che una persona si è\nimpegnata in una posizione, tende a comportarsi in modo coerente con\nquell’impegno, anche se le condizioni cambiano. Le persone vogliono\napparire coerenti a se stesse e agli altri.</p>\n<p><strong>Come viene sfruttata:</strong> -\n<strong>Foot-in-the-door</strong>: iniziare con una piccola richiesta\nche la vittima accetta, poi scalare. - “Le posso fare solo una piccola\ndomanda?” → poi ancora → poi ancora. - <strong>Pre-impegno\nverbale</strong>: “Lei è una persona che tiene alla sicurezza dei\nclienti, vero?” → “Allora capirà perché devo verificare…” -\n<strong>Ingresso a bassa pressione</strong>: firmare una petizione\ninnocua oggi → essere chiamati ad agire domani sulla base di quella\nfirma.</p>\n<p><strong>Come riconoscerla:</strong> attenzione quando qualcuno usa le\ntue risposte precedenti per giustificare richieste successive.</p>\n<hr />\n<h4 id=\"prova-sociale\">2.1.3 Prova sociale</h4>\n<p><strong>Il principio:</strong> In situazioni di incertezza, le\npersone guardano al comportamento degli altri per determinare il\ncomportamento corretto. “Se tutti lo fanno, dev’essere giusto.”</p>\n<p><strong>Come viene sfruttata:</strong> - “Tutti i dipendenti del suo\nufficio hanno già aggiornato le credenziali.” - “Il suo collega Marco mi\nha detto di contattarla direttamente.” - Email di phishing con loghi di\naziende note e contatori di utenti (“47.000 persone hanno già aderito”).\n- Recensioni false per aumentare la credibilità di un sito truffa.</p>\n<p><strong>Come riconoscerla:</strong> la prova sociale diventa\nmanipolazione quando non puoi verificare dir
