ettamente il comportamento\ndegli “altri”.</p>\n<hr />\n<h4 id=\"autorità\">2.1.4 Autorità</h4>\n<p><strong>Il principio:</strong> Le persone tendono a obbedire alle\nfigure di autorità (reale o percepita), anche quando le istruzioni sono\ndannose per loro o per altri. L’esperimento di Milgram (1963) ha\ndimostrato che la maggioranza delle persone applica scosse elettriche\ndolorose su istruzione di una figura autoritaria.</p>\n<p><strong>Come viene sfruttata:</strong> - Fingersi un tecnico IT, un\ndirigente, un ispettore fiscale, un agente di polizia. - Usare titoli,\ngergo tecnico, uniformi, badge (fisicamente o citandoli verbalmente). -\n<strong>CEO fraud / Business Email Compromise (BEC)</strong>: email\napparentemente dall’amministratore delegato che chiede un bonifico\nurgente. - “Parla con il dottor Rossi del reparto legale? La chiamo io\nstesso su istruzione del Direttore.”</p>\n<p><strong>Come riconoscerla:</strong> verifica sempre l’identità di chi\nrivendica autorità attraverso un canale <strong>separato</strong> da\nquello usato per il contatto. Richiama il numero ufficiale dell’azienda,\nnon quello fornito dal chiamante.</p>\n<hr />\n<h4 id=\"simpatia-liking\">2.1.5 Simpatia (Liking)</h4>\n<p><strong>Il principio:</strong> Le persone sono più facilmente\npersuase da chi gli piace. I fattori che aumentano la simpatia sono:\nsomiglianza, familiarità, attrattività fisica, complimenti, associazione\ncon cose positive.</p>\n<p><strong>Come viene sfruttata:</strong> - Il social engineer fa\nricerca OSINT sul target e usa interessi comuni (“Anche lei è tifoso\ndella Juventus?”). - Si adatta al tono e allo stile comunicativo della\nvittima (mirroring). - Usa il nome della vittima frequentemente nella\nconversazione. - Si presenta come raccomandato da un amico/collega\ncomune. - Usa un tono caldo, amichevole, quasi confidenziale.</p>\n<p><strong>Come riconoscerla:</strong> ti senti stranamente a tuo agio\ncon qualcuno che hai appena incontrato? Chiedi se stai reagendo alla\npersona o al contenuto della sua richiesta.</p>\n<hr />\n<h4 id=\"scarsità-e-urgenza\">2.1.6 Scarsità e urgenza</h4>\n<p><strong>Il principio:</strong> Le persone attribuiscono maggiore\nvalore alle cose rare o che stanno per diventare indisponibili.\nL’urgenza è una forma di scarsità temporale.</p>\n<p><strong>Come viene sfruttata:</strong> - “C’è solo 1 ora per\nrispondere, altrimenti il suo conto verrà bloccato.” - “È l’ultima\npossibilità per aggiornare le sue credenziali prima della migrazione del\nsistema.” - “Le mando un link che scade tra 10 minuti.” - “Se non agisce\nadesso, perderà l’accesso ai suoi dati.”</p>\n<p>L’urgenza <strong>bypassa il pensiero critico</strong>: non c’è tempo\nper verificare, bisogna agire subito.</p>\n<p><strong>Come riconoscerla:</strong> qualsiasi richiesta urgente che\npreviene la verifica è un segnale d’allarme. Le organizzazioni legittime\nnon ti bloccano l’accesso in 10 minuti senza preavviso.</p>\n<h3 id=\"il-settimo-principio-unità-unity\">2.2 Il settimo principio:\nUnità (Unity)</h3>\n<p>Cialdini ha aggiunto un settimo principio in <em>Pre-Suasion</em>\n(2016):</p>\n<p><strong>Il principio:</strong> Le persone sono più facilmente\npersuase da chi percepiscono come parte del proprio gruppo (famiglia,\ntribù, squadra, nazione, ideologia). Non è simpatia per la persona, ma\n<strong>identità condivisa</strong>.</p>\n<p><strong>Come viene sfruttata:</strong> - “Siamo entrambi della\nvecchia guardia qui in azienda, sai com’è…” - Infiltrazione in comunità\nonline fingendo di condividere valori o credenze. - “Come italiano, lei\ncapisce quanto sia importante…” - Il social engineering ideologico:\nreclutamento di insider attraverso la leva dell’identità di gruppo.</p>\n<hr />\n<h2 id=\"elicitazione\">3. Elicitazione</h2>\n<h3 id=\"definizione-e-origine\">3.1 Definizione e origine</h3>\n<p><strong>L’elicitazione</strong> è una tecnica specifica di raccolta\ndi informazioni che consiste nell’estrarre dati da un interlocutore nel\ncorso di una conversazione apparentemente normale, senza che questi si\nrenda conto di stare rivelando informazioni sensibili.</p>\n<p>Il termine viene dall’intelligence militare e dai servizi segreti,\ndove è usata dagli agenti per raccogliere informazioni da fonti umane\n(HUMINT) senza ricorrere all’interrogatorio formale.</p>\n<p><strong>Differenze fondamentali:</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr>\n<th></th>\n<th>Interrogatorio</th>\n<th>Elicitazione</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Dinamica</strong></td>\n<td>Domande dirette e risposte</td>\n<td>Conversazione naturale</td>\n</tr>\n<tr>\n<td><strong>Consapevolezza</strong></td>\n<td>Il soggetto sa di essere interrogato</td>\n<td>Il soggetto non sa di essere la fonte</td>\n</tr>\n<tr>\n<td><strong>Resistenza</strong></td>\n<td>Alta (il soggetto è in guardia)</td>\n<td>Bassa (il soggetto è a suo agio)</td>\n</tr>\n<tr>\n<td><strong>Contesto</strong></td>\n<td>Formale, ufficiale</td>\n<td>Informale, casuale</td>\n</tr>\n<tr>\n<td><strong>Pressione</strong></td>\n<td>Esplicita</td>\n<td>Assente o molto sottile</td>\n</tr>\n<tr>\n<td><strong>Applicabilità</strong></td>\n<td>Soggetti in custodia o disponibili</td>\n<td>Qualsiasi conversazione</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Efficacia dell’elicitazione:</strong> Le persone sono\nnaturalmente portate a essere cooperative, utili e socievoli. In una\nconversazione normale, la guardia è bassa. Il soggetto può rivelare\ninformazioni significative semplicemente cercando di essere utile o di\napparire competente.</p>\n<h3 id=\"contesti-di-uso-legittimo-nellosint\">3.2 Contesti di uso\nlegittimo nell’OSINT</h3>\n<p>L’elicitazione è uno strumento legittimo in molti contesti\nprofessionali:</p>\n<ul>\n<li><strong>Intelligence e sicurezza nazionale</strong>: raccolta di\ninformazioni da fonti umane.</li>\n<li><strong>Giornalismo investigativo</strong>: interviste che rivelano\npiù del previsto.</li>\n<li><strong>Sicurezza aziendale (red team)</strong>: simulazione di\nattacchi per testare la resilienza dei dipendenti.</li>\n<li><strong>Ricerca accademica</strong>: interviste qualitative che\nesplorano argomenti sensibili.</li>\n<li><strong>Negoziazione</strong>: estrazione di informazioni sulla\ncontroparte prima di una trattativa.</li>\n<li><strong>Indagini private</strong> (con incarico legittimo): ottenere\ninformazioni da fonti che non coopererebbero in un’intervista\nformale.</li>\n</ul>\n<p><strong>Limiti etici e legali:</strong> L’uso dell’elicitazione su\npersone private per ottenere informazioni a loro danno, per truffarle o\nper finalità illegali configura: - Truffa (art. 640 c.p.) se si causa un\ndanno patrimoniale. - Frode informatica (art. 640-ter c.p.) se\nl’obiettivo è l’accesso a sistemi informatici. - Violazione della\nprivacy se i dati raccolti vengono trattati illecitamente.</p>\n<hr />\n<h2 id=\"elicitazione-e-bisogni-umani\">4. Elicitazione e bisogni\numani</h2>\n<h3 id=\"la-gerarchia-di-maslow\">4.1 La gerarchia di Maslow</h3>\n<p>Il modello più noto dei bisogni umani è la <strong>gerarchia di\nMaslow</strong> (Abraham Maslow, 1943), spesso rappresentata come una\npiramide:</p>\n<pre><code>                    ╔══════════════╗\n                    ║ AUTOREALIZ.  ║  Raggiungere il proprio potenziale\n                  ╔═══════════════════╗\n                  ║ STIMA / STATUS  ║  Essere rispettati, competenti\n                ╔═══════════════════════╗\n                ║  APPARTENENZA      ║  Amore, amicizia, gruppo\n              ╔═══════════════════════════╗\n              ║  SICUREZZA             ║  Protezione, stabilità\n            ╔═══════════════════════════════╗\n            ║  FISIOLOGICI             ║  Cibo, acqua, riposo\n            ╚═══════════════════════════════╝</code></pre>\n<p><strong>Come l’elicitazione si collega a Maslow:</strong></p>\n<p>Ogni tecnica di elicitazione fa leva su uno o più bisogni della\ngerarchia:</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Bisogno</th>\n<th>Tecnica collegata</th>\n<th>Esempio</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Fisiologico</strong></td>\n<td>Creazione di disagio → offerta di sollievo</td>\n<td>“Dev’essere stressante gestire questa situazione… le posso dare una\nmano se…”</td>\n</tr>\n<tr>\n<td><strong>Sicurezza</strong></td>\n<td>Paura → promessa di protezione</td>\n<td>“C’è una minaccia al vostro sistema, ma se mi dice X posso\naiutarla”</td>\n</tr>\n<tr>\n<td><strong>Appartenenza</strong></td>\n<td>Leva identitaria, amicizia simulata</td>\n<td>“Noi del settore ci capiamo tra di noi…”</td>\n</tr>\n<tr>\n<td><strong>Stima</strong></td>\n<td>Adulazione, appello alla competenza</td>\n<td>“Lei è chiaramente l’esperto di questo, sicuramente saprà…”</td>\n</tr>\n<tr>\n<td><strong>Autorealizzazione</strong></td>\n<td>Opportunità esclusiva, contributo a causa nobile</td>\n<td>“Ha l’occasione di fare la differenza su questa ricerca…”</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"self-determination-theory-sdt\">4.2 Self-Determination Theory\n(SDT)</h3>\n<p>La <strong>Teoria dell’Autodeterminazione</strong> di Deci e Ryan\n(1985) identifica tre bisogni psicologici fondamentali che motivano il\ncomportamento umano:</p>\n<ol type=\"1\">\n<li><strong>Autonomia</strong>: il bisogno di sentirsi autori delle\nproprie azioni, non costretti.</li>\n<li><strong>Competenza</strong>: il bisogno di sentirsi efficaci e\ncapaci.</li>\n<li><strong>Relazionalità</strong>: il bisogno di connessione con gli\naltri.</li>\n</ol>\n<p><strong>Come l’elicitazione sfrutta questi bisogni:</strong></p>\n<p><strong>Autonomia</strong>: un elicitatore esperto non ordina mai —\nchiede, suggerisce, lascia scegliere. “Ovviamente lei sa meglio di me,\nma…” La vittima si sente libera di scegliere, anche se la scelta è stata\npredisposta.</p>\n<p><strong>Competenza</strong>: le domande che fanno emergere\nl’expertise della vittima la rendono pronta a condividere. Nessuno\nresiste alla tentazione di dimostrare quanto ne sa su un argomento di\ncui è esperta.</p>\n<p><strong>Relazionalità</strong>: la conversazione crea un legame.\nRompere quel legame (rifiutare di rispondere, sembrare scortesi) va\ncontro il bisogno di relazionalità. Quindi si coopera.</p>\n<hr />\n<h2 id=\"tendenze-naturali-suscettibili-di-elicitazione\">5. Tendenze\nnaturali suscettibili di elicitazione</h2>\n<p>Le seguenti tendenze sono presenti in quasi tutte le persone e\nrappresentano i vettori principali di vulnerabilità\nall’elicitazione.</p>\n<h3 id=\"il-desiderio-di-essere-utili-e-cooperativi\">5.1 Il desiderio di\nessere utili e cooperativi</h3>\n<p>Gli esseri umani sono animali sociali. La cooperazione è codificata\nnella nostra natura evolutiva. Quando qualcuno ci chiede aiuto in modo\ncortese, la risposta default è cercare di essere utili.</p>\n<p><strong>Come viene sfruttata:</strong> il social engineer inquadra la\nrichiesta come una necessità di aiuto, non come una domanda di\ninformazioni riservate. “Mi potrebbe aiutare a capire come funziona\nquesto processo?” anziché “Qual è la password del sistema?”.</p>\n<p><strong>Segnale di allarme:</strong> stai divulgando informazioni\nsolo perché ti senti “obbligato” a essere utile?</p>\n<h3 id=\"il-bisogno-di-riempire-il-silenzio\">5.2 Il bisogno di riempire\nil silenzio</h3>\n<p>Il silenzio nelle conversazioni crea <strong>disagio\npsicologico</strong>. La maggior parte delle persone si sente spinta a\nriempire il vuoto, spesso dicendo più del necessario.</p>\n<p><strong>Come viene sfruttata:</strong> - L’elicitatore fa una domanda\ne poi tace. - Il silenzio aumenta il disagio. - La vittima parla per\nriempire il vuoto, rivelando più di quanto intendesse.</p>\n<p><strong>Tecnica correlata:</strong> il <strong>“comfortable\nsilence”</strong> — usato da investigatori, giornalisti e terapeuti per\nfar parlare l’interlocutore. Non richiedono mai una risposta\nesplicitamente: fanno la domanda e aspettano.</p>\n<h3 id=\"il-desiderio-di-sembrare-esperti-e-informati\">5.3 Il desiderio\ndi sembrare esperti e informati</h3>\n<p>Le persone amano dimostrarsi competenti nel loro campo. Una domanda\nche mette in risalto la loro expertise attiva questo bisogno e le porta\na condividere informazioni dettagliate.</p>\n<p><strong>Come viene sfruttata:</strong> - “Ho sentito che voi di\n[azienda] avete un sistema avanzato di gestione dei dati… come funziona\nesattamente?” - “Lei conosce questo campo meglio di chiunque, mi\nsaprebbe spiegare…” - La vittima espande volontariamente la risposta per\ndimostrare la propria competenza.</p>\n<h3 id=\"la-tendenza-alla-reciprocità-informativa\">5.4 La tendenza alla\nreciprocità informativa</h3>\n<p>Se qualcuno condivide un’informazione con noi, ci sentiamo spinti a\ncondividere qualcosa in cambio. È una forma specifica del principio di\nreciprocità applicata alla conversazione.</p>\n<p><strong>Come viene sfruttata:</strong> - L’elicitatore condivide per\nprimo un’informazione (vera o falsa, ma credibile) per innescare la\nreciprocità. - “Ho sentito che l’anno prossimo ci sarà una\nristrutturazione nel vostro reparto IT…” → la vittima conferma o\nsmentisce con dettagli. - Tecnicamente si chiama <strong>“statement\nfishing”</strong>: affermare qualcosa invece di chiederlo.</p>\n<h3 id=\"la-dissonanza-cognitiva-e-il-bisogno-di-coerenza\">5.5 La\ndissonanza cognitiva e il bisogno di coerenza</h3>\n<p>Quando le nostre azioni non sono coerenti con le nostre credenze,\nsperimentiamo <strong>disagio cognitivo</strong> (dissonanza). Per\nridurlo, modifichiamo il comportamento o le credenze.</p>\n<p><strong>Come viene sfruttata:</strong> - “Lei è una persona che tiene\nalla trasparenza, giusto?” → “Certo.” → “Allora non avrà problemi a\ncondividere…” - Una volta che la persona ha dichiarato un valore, viene\nmessa in posizione di doverlo dimostrare.</p>\n<h3 id=\"la-tendenza-a-sottovalutare-gli-estranei-come-minaccia\">5.6 La\ntendenza a sottovalutare gli estranei come minaccia</h3>\n<p>La maggior parte delle persone valuta il rischio in base all’aspetto,\nal comportamento e al contesto — non alle intenzioni reali. Un social\nengineer ben vestito, con linguaggio professionale e un pretesto\ncredibile viene percepito come sicuro.</p>\n<p><strong>Come viene sfruttata:</strong> - Uniforme o abbigliamento\nprofessionale. - Gergo tecnico del settore (acquisito tramite OSINT\npreliminare). - Riferimento a nomi e ruoli reali dell’organizzazione. -\nPretesto coerente con il contesto (orario, luogo, situazione).</p>\n<h3 id=\"leffetto-alone\">5.7 L’effetto alone</h3>\n<p><strong>L’effetto alone</strong> (halo effect) è la tendenza a\nestendere un’impressione positiva in un’area a tutte le altre aree. Se\nqualcuno sembra simpatico, intelligente e professionale, tendiamo ad\nassumerlo affidabile anche senza prove.</p>\n<p><strong>Come viene sfruttata:</strong> - Primo impatto curato:\nsorriso, stretta di mano, abbigliamento. - Citazione di un ente o\npersona rispettata all’inizio della conversazione. - Tono di voce calmo\ne sicuro (che trasmette competenza e autorità).</p>\n<h3 id=\"la-tendenza-a-non-verificare-in-contesti-formali\">5.8 La\ntendenza a non verificare in contesti formali</h3>\n<p>Nelle interazioni formali o professionali, le persone tendono a non\nverificare l’identità di chi si presenta con autorità, per non sembrare\nscortesi o sospettosi.</p>\n<p><strong>Come viene sfruttata:</strong> - In un contesto aziendale,\nmostrare un badge (anche falso) e agire con sicurezza è sufficiente per\nsuperare molti controlli. - Al telefono, usare il nome di un collega o\ndi un dirigente abbassa le difese. - “Mi ha inviato il dottor Bianchi\ndel reparto compliance” → chi verifica?</p>\n<hr />\n<h2 id=\"tecniche\">6. Tecniche</h2>\n<h3 id=\"statement-fishing-affermazioni-esca\">6.1 Statement Fishing\n(Affermazioni Esca)</h3>\n<p><strong>Descrizione:</strong> invece di fare una domanda diretta (che\npotrebbe mettere in guardia l’interlocutore), si fa\nun’<strong>affermazione</strong> — vera, falsa o parzialmente vera — e\nsi osserva la reazione.</p>\n<p><strong>Meccanismo:</strong> le persone tendono a correggere\naffermazioni false, soprattutto quando coinvolgono la loro area di\ncompetenza. La correzione fornisce l’informazione cercata.</p>\n<p><strong>Esempi:</strong> - “Ho sentito che il vostro sistema di\nautenticazione usa ancora l’SMS come secondo fattore.” → La vittima\ncorregge: “No, siamo passati a un’app nel 2023.” (Informazione ottenuta:\nl’azienda usa un’app di autenticazione dal 2023.) - “Credo che il vostro\nufficio di Roma gestisca questa procedura.” → “No no, è tutto\ncentralizzato a Milano, reparto Compliance.” (Informazione: struttura\norganizzativa.)</p>\n<p><strong>Come difendersi:</strong> prima di correggere un’affermazione\nsu argomenti sensibili, chiediti perché questa persona fa\nquell’affermazione e cosa otterrebbe dalla tua correzione.</p>\n<hr />\n<h3 id=\"feigned-ignorance-ignoranza-simulata\">6.2 Feigned Ignorance\n(Ignoranza simulata)</h3>\n<p><strong>Descrizione:</strong> l’elicitatore finge di non capire o di\nessere molto meno esperto di quanto sia, inducendo l’interlocutore a\nspiegare in dettaglio.</p>\n<p><strong>Meccanismo:</strong> sfrutta il bisogno di sembrare\ncompetenti e il naturale impulso a insegnare quando qualcuno non\ncapisce.</p>\n<p><strong>Esempi:</strong> - “Non sono molto ferrato di tecnologia…\ncome funziona questo tipo di sistema?” - “Perdonami, non lavoro in\nquesto settore… quando dici che il sistema ha una vulnerabilità, cosa\nintendi esattamente?” - “Ho solo un background commerciale… mi puoi\nspiegare dal principio come gestite la sicurezza dei dati?”</p>\n<p><strong>Variante:</strong> l’esperto che finge di non capire per far\nespandere la risposta. “Certo, ma non sono sicuro di capire il dettaglio\ntecnico… potrebbe spiegarmi più precisamente?”</p>\n<p><strong>Come difendersi:</strong> attenzione a chi sembra stranamente\npoco informato su argomenti che dovrebbe conoscere nel suo ruolo. Limita\nle spiegazioni ai dettagli strettamente necessari.</p>\n<hr />\n<h3 id=\"flattery-and-ego-appeal-adulazione-e-appello-allego\">6.3\nFlattery and Ego Appeal (Adulazione e appello all’ego)</h3>\n<p><strong>Descrizione:</strong> complimentarsi con la vittima sulla sua\ncompetenza, reputazione o posizione per innescare il bisogno di\nconfermare quell’immagine positiva attraverso il comportamento\nrichiesto.</p>\n<p><strong>Meccanismo:</strong> sfrutta il bisogno di stima e di\nconferma dell’identità competente.</p>\n<p><strong>Esempi:</strong> - “Le parlerei solo perché tutti dicono che\nlei è la persona più esperta di questo argomento in azienda.” - “Ho\nletto il suo paper su questo argomento — è stato davvero illuminante.\nEcco perché volevo chiederle…” - “Il suo team ha una reputazione di\neccellenza nel settore. Come riesce a gestire X?”</p>\n<p><strong>Come difendersi:</strong> i complimenti non giustificano la\ncondivisione di informazioni sensibili. Un professionista competente sa\nanche quando non rispondere.</p>\n<hr />\n<h3 id=\"quid-pro-quo-informativo\">6.4 Quid Pro Quo informativo</h3>\n<p><strong>Descrizione:</strong> offrire un’informazione (vera o falsa)\nin cambio di un’altra, sfruttando la reciprocità informativa.</p>\n<p><strong>Meccanismo:</strong> la condivisione di informazioni crea\nun’aspettativa di reciprocità. La vittima sente di dover “bilanciare” lo\nscambio.</p>\n<p><strong>Esempi:</strong> - “Le dico una cosa che non tutti sanno: il\nvostro concorrente X sta pianificando di…” → “Davvero? Allora le dico\nuna cosa anche io…” - “Tra colleghi del settore ci diciamo queste cose…\nil nostro sistema funziona così. E il vostro?” - Condividere un dato\nvero ma non riservato per ottenere un dato riservato in cambio.</p>\n<p><strong>Come difendersi:</strong> uno scambio informativo non è una\ntransazione obbligatoria. Puoi ricevere un’informazione senza doverne\ndare una in cambio.</p>\n<hr />\n<h3\nid=\"deliberate-false-statement-affermazione-deliberatamente-falsa\">6.5\nDeliberate False Statement (Affermazione deliberatamente falsa)</h3>\n<p><strong>Descrizione:</strong> variante estrema dello Statement\nFishing. Si fa un’affermazione consapevolmente falsa e provocatoria,\nsapendo che l’interlocutore non potrà resistere a correggerla.</p>\n<p><strong>Meccanismo:</strong> sfrutta il bisogno di accuratezza e di\ndifesa della propria reputazione professionale.</p>\n<p><strong>Esempi:</strong> - “Ho letto che la vostra azienda ha avuto\nuna violazione dei dati l’anno scorso.” → “Assolutamente no! Non abbiamo\nmai avuto violazioni. Il nostro sistema di sicurezza è…” (Informazione:\nl’azienda crede di non aver avuto violazioni e ha un sistema X.) - “Voi\nusate ancora il vecchio sistema legacy, giusto?” → “Macché! Siamo\npassati al cloud nel 2022, con infrastruttura AWS…” (Informazione:\nmigrazione cloud completata nel 2022 su AWS.)</p>\n<p><strong>Come difendersi:</strong> non sentirti obbligato a correggere\naffermazioni errate quando coinvolgono sistemi o processi interni\nsensibili.</p>\n<hr />\n<h3 id=\"bracketing-inquadramento-in-range\">6.6 Bracketing (Inquadramento\nin range)</h3>\n<p><strong>Descrizione:</strong> quando si cerca un valore numerico\nsconosciuto, si propone un range deliberatamente esagerato per indurre\nla vittima a “correggere” verso il valore reale.</p>\n<p><strong>Meccanismo:</strong> le persone tendono a correggere le stime\nerrate verso il valore reale. Sfrutta il bisogno di accuratezza.</p>\n<p><strong>Esempi:</strong> - “Quanti dipendenti ha il vostro reparto\nIT? Immagino siano centinaia…” → “No no, siamo solo 12 persone.”\n(Informazione: team IT piccolo di 12 persone.) - “Il vostro budget per\nla sicurezza sarà nell’ordine dei 5 milioni…” → “Magari! Siamo molto più\ncontenuti, tra i 200 e i 300 mila euro.”</p>\n<p><strong>Come difendersi:</strong> non correggere stime su dati\naziendali sensibili (organico, budget, infrastruttura) a interlocutori\nnon verificati.</p>\n<hr />\n<h3 id=\"pretexting-avanzato\">6.7 Pretexting avanzato</h3>\n<p><strong>Descrizione:</strong> costruire una storia di copertura\n(pretesto) dettagliata e credibile che giustifichi logicamente la\nrichiesta di informazioni.</p>\n<p><strong>Elementi di un pretesto efficace:</strong> -\n<strong>Identità</strong>: chi si è (ruolo, azienda, contesto). -\n<strong>Motivazione</strong>: perché si ha bisogno dell’informazione. -\n<strong>Urgenza contestuale</strong>: perché adesso. - <strong>Prova di\nlegittimità</strong>: riferimento a persone reali, documenti, sistemi. -\n<strong>Familiarità con il contesto</strong>: usare termini tecnici e\nnomi specifici dell’organizzazione.</p>\n<p><strong>Esempio:</strong> Contesto: un social engineer vuole sapere\nquali software usa un’azienda target. Pretesto: “Buongiorno, sono Luca\nFerretti del supporto tecnico di Oracle. Stiamo effettuando una verifica\npost-aggiornamento per tutti i clienti che hanno la licenza Enterprise.\nIl suo collega, credo si chiami Marco, ha segnalato un problema con\nl’integrazione. Ho bisogno di verificare la versione del software e la\nconfigurazione attuale del vostro sistema.”</p>\n<p>Il pretesto include: ruolo credibile (Oracle support), urgenza\n(verifica post-update), riferimento a un collega (Marco, nome comune),\nrichiesta specifica (versione software, configurazione).</p>\n<p><strong>Come difendersi:</strong> verifica sempre l’identità del\nchiamante attraverso un canale separato. Richiama il numero ufficiale\ndell’azienda del fornitore, non quello fornito dal chiamante.</p>\n<hr />\n<h3 id=\"comfort-e-rapport-building\">6.8 Comfort e Rapport Building</h3>\n<p><strong>Descrizione:</strong> costruire un senso di fiducia e comfort\nprima di avanzare qualsiasi richiesta. Il rapport è la base di ogni\ninterazione di Social Engineering efficace.</p>\n<p><strong>Tecniche di rapport:</strong> - <strong>Mirroring</strong>:\nreplicare sottilmente il linguaggio del corpo, il ritmo vocale, le\nscelte lessicali dell’interlocutore. - <strong>Nome</strong>: usare il\nnome della persona frequentemente ma naturalmente. - <strong>Interessi\ncomuni</strong>: riferire a hobby, squadre di calcio, eventi locali\ntrovati tramite OSINT. - <strong>Validazione</strong>: dare ragione\nall’interlocutore, mostrare comprensione. - <strong>Humor\nappropriato</strong>: una risata condivisa abbassa le difese. -\n<strong>Ascolto attivo</strong>: annuire, fare domande pertinenti,\nmostrare genuino interesse.</p>\n<p><strong>Come difendersi:</strong> il rapport non è un problema di per\nsé — il problema è quando porta a condividere informazioni che non\ncondivideresti normalmente. Periodicamente “disconnettiti” mentalmente\ndalla conversazione e valuta cosa stai dicendo.</p>\n<hr />\n<h3 id=\"il-silenzio-strategico\">6.9 Il Silenzio Strategico</h3>\n<p><strong>Descrizione:</strong> l’elicitatore pone una domanda o fa\nun’affermazione e poi tace, resistendo all’impulso naturale di riempire\nil silenzio, aspettando che sia la vittima a farlo.</p>\n<p><strong>Meccanismo:</strong> il silenzio nelle conversazioni crea\ndisagio. La persona che ha meno tolleranza al silenzio parla per\nriempirlo, rivelando spesso più del necessario.</p>\n<p><strong>Usato da:</strong> investigatori, giornalisti, terapeuti,\nnegoziatori, venditori esperti.</p>\n<p><strong>Esempio:</strong> “Quindi mi stava dicendo che il vostro\nsistema di backup…” [pausa di 5-10 secondi] La vittima, per riempire il\nsilenzio, completa spontaneamente la frase con informazioni non\nrichieste.</p>\n<p><strong>Come difendersi:</strong> impara a tollerare il silenzio. Se\nnon sai cosa rispondere, puoi semplicemente dire “non ho informazioni su\nquesto” e aspettare tu stesso.</p>\n<hr />\n<h3 id=\"tabella-riepilogativa-delle-tecniche\">6.10 Tabella riepilogativa\ndelle tecniche</h3>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Tecnica</th>\n<th>Meccanismo psicologico</th>\n<th>Bisogno sfruttato</th>\n<th>Efficacia</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Statement Fishing</td>\n<td>Impulso a correggere</td>\n<td>Competenza, accuratezza</td>\n<td>★★★★</td>\n</tr>\n<tr>\n<td>Feigned Ignorance</td>\n<td>Impulso a insegnare</td>\n<td>Competenza, altruismo</td>\n<td>★★★★</td>\n</tr>\n<tr>\n<td>Adulazione / Ego Appeal</td>\n<td>Conferma dell’identità</td>\n<td>Stima</td>\n<td>★★★</td>\n</tr>\n<tr>\n<td>Quid Pro Quo informativo</td>\n<td>Reciprocità</td>\n<td>Equità sociale</td>\n<td>★★★★</td>\n</tr>\n<tr>\n<td>Affermazione falsa</td>\n<td>Impulso a correggere</td>\n<td>Accuratezza, reputazione</td>\n<td>★★★</td>\n</tr>\n<tr>\n<td>Bracketing</td>\n<td>Ancora cognitiva</td>\n<td>Accuratezza numerica</td>\n<td>★★★</td>\n</tr>\n<tr>\n<td>Pretexting</td>\n<td>Plausibilità contestuale</td>\n<td>Fiducia, autorità</td>\n<td>★★★★★</td>\n</tr>\n<tr>\n<td>Rapport Building</td>\n<td>Legame interpersonale</td>\n<td>Appartenenza, relazione</td>\n<td>★★★★★</td>\n</tr>\n<tr>\n<td>Silenzio strategico</td>\n<td>Disagio del silenzio</td>\n<td>Appartenenza</td>\n<td>★★★★</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2 id=\"difendersi-dal-social-engineering\">7. Difendersi dal Social\nEngineering</h2>\n<h3 id=\"il-modello-verifica-rallenta-rifiuta\">7.1 Il modello “Verifica –\nRallenta – Rifiuta”</h3>\n<p>Ogni volta che si riceve una richiesta inaspettata (soprattutto se\nurgente o autorevole), applicare questo modello:</p>\n<pre><code>  RICHIESTA RICEVUTA\n          │\n          ├── È inaspettata?      → SÌ → Rallenta, non agire subito\n          │\n          ├── C&#39;è urgenza?        → SÌ → Segnale d&#39;allarme: l&#39;urgenza è una tecnica\n          │\n          ├── Rivendica autorità? → SÌ → Verifica tramite canale separato\n          │\n          ├── Chiede informazioni → SÌ → Qual è la base giuridica per condividerle?\n          │    riservate?\n          │\n          └── Ti fa sentire       → SÌ → Analizza la fonte di quel disagio\n               a disagio?</code></pre>\n<h3 id=\"igiene-informativa\">7.2 Igiene informativa</h3>\n<ul>\n<li><strong>Principio del “bisogno di sapere”</strong>: condividi\ninformazioni solo con chi ne ha reale necessità.</li>\n<li><strong>Compartimentazione</strong>: non condividere informazioni su\nsistemi, processi o persone fuori dal contesto appropriato.</li>\n<li><strong>Verifica sistematica</strong>: ogni richiesta di\ninformazioni sensibili va verificata attraverso un canale\nindipendente.</li>\n<li><strong>Cultura della sicurezza</strong>: in un’organizzazione, il\nrifiuto di condividere informazioni non verificate non deve essere\nvissuto come scortesia ma come professionalità.</li>\n</ul>\n<h3 id=\"red-team-e-simulazioni\">7.3 Red Team e simulazioni</h3>\n<p>Il modo più efficace per prepararsi al Social Engineering è\n<strong>subirlo in modo controllato</strong>: - <strong>Campagne di\nphishing simulate</strong> (es. con KnowBe4 o Proofpoint): testare\nquanti dipendenti cliccano su link di phishing. - <strong>Vishing\ntest</strong>: chiamate simulate al help desk aziendale per testare se\ncedono credenziali. - <strong>Physical penetration testing</strong>:\nsimulazione di tailgating e accesso fisico non autorizzato. -\n<strong>Debriefing costruttivo</strong>: chi “cade” nella trappola\nsimulata non viene punito ma formato.</p>\n<hr />\n<h2 id=\"box-legale-ed-etico\">⚖️ Box legale ed etico</h2>\n<h3 id=\"social-engineering-come-reato\">Social Engineering come\nreato</h3>\n<p>L’ingegneria sociale, quando usata per ottenere vantaggi illeciti,\nconfigura diversi reati nel Codice Penale italiano:</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Reato</th>\n<th>Articolo c.p.</th>\n<th>Applicazione</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Truffa</strong></td>\n<td>640</td>\n<td>Indurre in errore con artifizi per ottenere un profitto</td>\n</tr>\n<tr>\n<td><strong>Frode informatica</strong></td>\n<td>640-ter</td>\n<td>Truffa che coinvolge sistemi informatici</td>\n</tr>\n<tr>\n<td><strong>Sostituzione di persona</strong></td>\n<td>494</td>\n<td>Fingersi un’altra persona</td>\n</tr>\n<tr>\n<td><strong>Accesso abusivo</strong></td>\n<td>615-ter</td>\n<td>Ottenere accesso a sistemi tramite Social Engineering</td>\n</tr>\n<tr>\n<td><strong>Violazione corrispondenza</strong></td>\n<td>616</td>\n<td>Accedere a comunicazioni altrui</td>\n</tr>\n<tr>\n<td><strong>Estorsione</strong></td>\n<td>629</td>\n<td>Usare la paura per ottenere qualcosa</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"uso-legittimo-red-team-e-awareness\">Uso legittimo: red team e\nawareness</h3>\n<p>Le simulazioni di Social Engineering a fini di sicurezza aziendale\nsono <strong>pienamente legali</strong> se: - C’è un mandato scritto\ndell’azienda committente. - Il perimetro e le regole di ingaggio sono\nchiaramente definiti. - Non vengono coinvolte terze parti non\nconsapevoli. - I dati raccolti vengono usati solo per il fine dichiarato\n(miglioramento della sicurezza).</p>\n<h3 id=\"elicitazione-giornalistica\">Elicitazione giornalistica</h3>\n<p>L’elicitazione nel giornalismo investigativo è protetta dalla libertà\ndi stampa (art. 21 Cost. e art. 10 CEDU) quando: - Serve a documentare\nfatti di interesse pubblico. - Non viola la privacy in modo\nsproporzionato. - Non causa danni gratuiti a persone private. - Le\ninformazioni ottenute vengono usate per la pubblicazione\ngiornalistica.</p>\n<hr />\n<h2 id=\"caso-di-studio-la-telefonata-del-tecnico\">Caso di studio: “La\ntelefonata del tecnico”</h2>\n<blockquote>\n<p><em>Scenario fittizio, ma basato su pattern di attacco\nreali.</em></p>\n</blockquote>\n<p><strong>Scenario.</strong> Un dipendente dell’azienda X riceve una\ntelefonata da un “tecnico del supporto informatico” che si presenta come\nLuca Ferretti. Il tecnico dice che il server aziendale ha subito\nun’anomalia e che ha bisogno di verificare le credenziali del dipendente\nper un test di ripristino urgente. L’attacco viene documentato in un\nreport di red team post-incidente.</p>\n<p><strong>Analisi delle tecniche usate:</strong></p>\n<p><strong>[1] Autorità:</strong> “Sono del supporto informatico\naziendale” → il ruolo evoca autorità senza richiedere verifica.</p>\n<p><strong>[2] Urgenza + Scarsità temporale:</strong> “C’è un’anomalia\nsul server e dobbiamo risolverla entro le 15:00 altrimenti perdiamo\ntutti i dati della giornata” → urgenza che bypassa il pensiero\ncritico.</p>\n<p><strong>[3] Prova sociale:</strong> “Ho già parlato con il suo\ncollega Marco che mi ha confermato di essere libero per questa verifica”\n→ citazione di un nome reale (trovato su LinkedIn in fase di OSINT).</p>\n<p><strong>[4] Feigned Ignorance:</strong> “Tecnicamente non sono io ad\nessere esperto del vostro sistema specifico — lei sa come funziona il\nreset delle credenziali nel vostro pannello?” → la vittima spiega il\nprocesso.</p>\n<p><strong>[5] Rapport Building:</strong> durante tutta la conversazione\nil tecnico usa il nome della vittima, si scusa per il disturbo,\nringrazia continuamente.</p>\n<p><strong>[6] Statement Fishing:</strong> “Immagino che il vostro\nsistema di backup sia su cloud, giusto, tipo Azure?” → la vittima\ncorregge: “No, abbiamo tutto on-premise nel datacenter di via\nMonviso.”</p>\n<p><strong>Risultato dell’analisi:</strong> la vittima non ha fornito le\ncredenziali (a differenza di quanto il social engineer volesse) ma ha\ninvolontariamente rivelato: l’infrastruttura on-premise, l’indirizzo del\ndatacenter, il nome di un collega, il processo di reset delle\ncredenziali.</p>\n<p><strong>Lezioni apprese:</strong> 1. Nessun sistema legittimo chiede\ncredenziali via telefono. 2. L’urgenza è il segnale d’allarme più forte:\nrallenta. 3. Citare un collega non verifica l’identità del chiamante. 4.\nInformazioni apparentemente innocue (indirizzo del datacenter) sono\npreziose per un attaccante. 5. Verifica sempre chiamando il numero\nufficiale dell’IT, non quello del chiamante.</p>\n<hr />\n<h2 id=\"esercizi-pratici\">Esercizi pratici</h2>\n<p><strong>Esercizio 1 – Analisi di Cialdini (20 min)</strong> Analizza\nle ultime 5 email commerciali che hai ricevuto (newsletter, offerte,\necc.). Identifica quali dei sei principi di Cialdini vengono usati in\nciascuna. Quale principio è più frequente?</p>\n<p><strong>Esercizio 2 – Statement Fishing (30 min — in coppia)</strong>\nCon un partner, uno fa il ruolo dell’“elicitatore” e l’altro del\n“soggetto”. Il soggetto sceglie mentalmente un argomento su cui sa molto\n(hobby, lavoro, interesse). L’elicitatore deve scoprirlo senza fare\ndomande dirette, solo attraverso affermazioni parzialmente false.\nCambiate i ruoli. Riflessione: quando ci si accorge di essere stati\nelicitati?</p>\n<p><strong>Esercizio 3 – Analisi di un video di Social Engineering (30\nmin)</strong> Cerca su YouTube “social engineering demo” o “vishing\ndemo”. Guarda un video autentico di dimostrazione. Identifica: quali\nprincipi di Cialdini vengono usati? Quale tecnica di elicitazione\nprevale? Quali segnali d’allarme potevano essere riconosciuti?</p>\n<p><strong>Esercizio 4 – Costruzione di un pretesto (40 min — solo per\nstudio)</strong> <strong>Solo a scopo educativo e su se stessi.</strong>\nImmagina di dover fare un’intervista OSINT a una fonte che normalmente\nnon parlerebbe. Costruisci un pretesto eticamente accettabile (no\ninganno su identità): quale ruolo puoi adottare legittimamente? Quale\nmotivazione puoi presentare onestamente? Come costruiresti rapport?</p>\n<p><strong>Esercizio 5 – Analisi dei bisogni (20 min)</strong> Per ogni\nprincipio di Cialdini, identifica il livello della gerarchia di Maslow a\ncui si collega prevalentemente. Perché alcuni principi si collegano a\npiù livelli contemporaneamente?</p>\n<p><strong>Esercizio 6 – Test di tolleranza al silenzio (15 min — in\ncoppia)</strong> In una conversazione con un partner, poni una domanda\naperta e poi tieni il silenzio per almeno 10 secondi. Osserva la\nreazione. Poi il partner fa lo stesso con te. Quanti secondi di silenzio\nriuscite a tollerare prima di sentire il bisogno di parlare?</p>\n<hr />\n","quiz":[{"q":"Il Social Engineering si distingue dagli attacchi tecnici perché:","opts":{"a":"Richiede competenze informatiche avanzate","b":"Sfrutta le vulnerabilità psicologiche umane invece delle vulnerabilità del software","c":"È meno efficace ma più rapido","d":"Può essere usato solo in ambienti digitali"},"correct":"b","why":"Il Social Engineering sfrutta vulnerabilità psicologiche, non tecniche"},{"q":"Il principio di reciprocità di Cialdini viene sfruttato quando:","opts":{"a":"Il social engineer finge di avere autorità per imporre una richiesta","b":"Il social engineer offre qualcosa prima di chiedere, creando un senso di debito psicologico","c":"Il social engineer crea urgenza per impedire la riflessione","d":"Il social engineer finge di essere un membro del gruppo della vittima"},"correct":"b","why":"Reciprocità: offerta prima → senso di debito → richiesta"},{"q":"L'elicitazione si distingue dall'interrogatorio principalmente perché:","opts":{"a":"L'elicitazione è illegale mentre l'interrogatorio è legale","b":"L'elicitazione avviene in una conversazione apparentemente normale e il soggetto non è consapevole di essere la fonte","c":"L'interrogatorio richiede meno preparazione","d":"L'elicitazione è usata solo dai servizi segreti"},"correct":"b","why":"L'elicitazione avviene in una conversazione normale; il soggetto non sa di essere la fonte"},{"q":"Quale bisogno di Maslow viene sfruttato dalla tecnica della \"feigned ignorance\" (ignoranza simulata)?","opts":{"a":"Bisogno fisiologico","b":"Bisogno di sicurezza","c":"Bisogno di stima e competenza","d":"Bisogno di autorealizzazione"},"correct":"c","why":"La feigned ignorance sfrutta il bisogno di stima e di dimostrare competenza"},{"q":"Lo Statement Fishing consiste in:","opts":{"a":"Fare domande dirette molto rapide per non dare tempo di riflettere","b":"Fare affermazioni parzialmente false o errate per indurre la vittima a correggere rivelando l'informazione vera","c":"Fingere di non capire per far spiegare la vittima nel dettaglio","d":"Offrire un'informazione in cambio di un'altra"},"correct":"b","why":"Statement Fishing: affermazione falsa o parziale → la vittima corregge rivelando l'informazione vera"},{"q":"Il silenzio strategico nell'elicitazione sfrutta:","opts":{"a":"Il bisogno di sicurezza della vittima","b":"L'effetto alone","c":"Il disagio psicologico causato dal silenzio nelle conversazioni, che spinge a parlare per riempirlo","d":"Il principio di scarsità temporale"},"correct":"c","why":"Il silenzio crea disagio psicologico → la vittima parla per riempirlo"},{"q":"Il bracketing è efficace per ottenere informazioni numeriche perché:","opts":{"a":"Genera urgenza nella risposta","b":"La vittima tende a correggere le stime errate avvicinandosi al valore reale","c":"Sfrutta il principio di reciprocità","d":"Bypassa il sistema 1 del pensiero"},"correct":"b","why":"Il bracketing propone un intervallo esagerato → la vittima corregge avvicinandosi al valore reale"},{"q":"Quale dei seguenti è il segnale d'allarme più forte che una richiesta potrebbe essere Social Engineering?","opts":{"a":"Il chiamante usa il tuo nome","b":"La richiesta viene fatta via email","c":"C'è una forte urgenza che impedisce di verificare l'identità e di riflettere","d":"Il chiamante conosce il nome di un tuo collega"},"correct":"c","why":"L'urgenza impedisce verifica e pensiero critico: è il segnale d'allarme più forte"},{"q":"In Italia, usare una falsa identità per ottenere credenziali di accesso a un sistema informatico configura:","opts":{"a":"Solo una violazione dei ToS del servizio","b":"Sostituzione di persona (art. 494 c.p.) e accesso abusivo a sistemi informatici (art. 615-ter c.p.)","c":"Solo responsabilità civile","d":"Nessun reato se il sistema è aziendale e non governativo"},"correct":"b","why":"Art. 494 (sostituzione di persona) + art. 615-ter (accesso abusivo) c.p."},{"q":"Per difendersi da una telefonata sospetta di un \"tecnico IT\", la prima azione corretta è:","opts":{"a":"Fornire le credenziali solo dopo che il tecnico ha risposto a una domanda di sicurezza","b":"Riagganciare immediatamente senza dire nulla","c":"Verificare l'identità richiamando il numero ufficiale dell'IT aziendale, non quello fornito dal chiamante","d":"Chiedere il nome del supervisore del tecnico"},"correct":"c","why":"Verifica sempre richiamando il numero ufficiale dell'IT, non quello fornito dal chiamante"}]},{"title":"Intelligence Aziendale e Registri Pubblici","html":"<h1 id=\"lezione-13\">Lezione 13 – Intelligence Aziendale e Registri Pubblici</h1>\n<blockquote>\n<p><em>“Segui le carte: le aziende mentono meno dei loro siti web.”</em></p>\n</blockquote>\n<hr />\n<h2 id=\"obiettivi-di-apprendimento\">Obiettivi di apprendimento</h2>\n<p>Al termine di questa lezione sarai in grado di:</p>\n<ol type=\"1\">\n<li>distinguere le principali fonti pubbliche italiane e internazionali su imprese, immobili e veicoli;</li>\n<li>applicare un metodo di indagine su un’impresa a partire dai suoi identificatori;</li>\n<li>riconoscere segnali di allarme tipici di società di comodo;</li>\n<li>rispettare i limiti di accesso e la normativa sui dati personali.</li>\n</ol>\n<hr />\n<h2 id=\"registri\">1. Perché i registri pubblici sono una miniera</h2>\n<p>Le imprese lasciano tracce ufficiali, <strong>affidabili e datate</strong>: atti costitutivi, amministratori, bilanci, procedure concorsuali, appalti. Sono fonti aperte a tutti gli effetti, ma l’accesso a certi dettagli può essere a pagamento o limitato a chi dimostra un interesse legittimo.</p>\n<h3 id=\"it\">1.1 Le fonti italiane</h3>\n<table>\n<thead><tr><th>Fonte</th><th>Cosa contiene</th><th>Note</th></tr></thead>\n<tbody>\n<tr><td><strong>Registro delle Imprese</strong> (Camere di Commercio / InfoCamere)</td><td>Ragione sociale, sede, oggetto sociale, amministratori, soci (per alcune forme), bilanci depositati</td><td>Visure ordinarie e storiche, in gran parte a pagamento</td></tr>\n<tr><td><strong>Gazzetta Ufficiale</strong></td><td>Atti normativi, avvisi, annunci legali di società</td><td>Ricerca gratuita</td></tr>\n<tr><td><strong>ANAC e Amministrazione Trasparente</strong></td><td>Appalti, incarichi, affidamenti pubblici</td><td>Utile per legami tra imprese e PA</td></tr>\n<tr><td><strong>Catasto e Conservatoria</strong></td><td>Proprietà immobiliari, ipoteche</td><td>Visure a pagamento tramite Agenzia delle Entrate</td></tr>\n<tr><td><strong>PRA</strong></td><td>Proprietà dei veicoli registrati</td><td>Visura per targa, a pagamento</td></tr>\n</tbody></table>\n<h3 id=\"int\">1.2 Fonti internazionali</h3>\n<ul>\n<li><strong>OpenCorporates</strong>: aggregatore globale di registri societari;</li>\n<li><strong>Companies House</strong> (Regno Unito) e <strong>SEC EDGAR</strong> (USA): dati gratuiti e molto dettagliati;</li>\n<li><strong>VIES</strong>: verifica della validità di una partita IVA intracomunitaria;</li>\n<li><strong>GLEIF</strong>: codici LEI e struttura di gruppo;</li>\n<li><strong>ICIJ Offshore Leaks Database</strong> e <strong>OpenSanctions</strong>: società offshore, persone politicamente esposte e liste sanzionatorie.</li>\n</ul>\n<blockquote>\n<p>Il registro dei <strong>titolari effettivi</strong> non è più liberamente consultabile: dopo la sentenza della Corte di giustizia UE del novembre 2022 l’accesso richiede un interesse legittimo.</p>\n</blockquote>\n<h2 id=\"metodo\">2. Metodo di indagine su un’impresa</h2>\n<ol type=\"1\">\n<li><strong>Identificatori</strong>: parti da denominazione, partita IVA o codice fiscale; sono i selettori più solidi.</li>\n<li><strong>Persone</strong>: elenca amministratori, soci e sindaci, poi cerca le loro altre cariche.</li>\n<li><strong>Struttura</strong>: ricostruisci controllate, controllanti e catene societarie.</li>\n<li><strong>Storico</strong>: cambi di sede, di denominazione, di amministratore, procedure concorsuali.</li>\n<li><strong>Riscontri</strong>: sito web, domini, social aziendali, appalti, annunci di lavoro.</li>\n</ol>\n<h3 id=\"red\">2.1 Segnali di allarme</h3>\n<ul>\n<li>sede legale presso domiciliatari o uffici virtuali condivisi da decine di società;</li>\n<li>cambi frequenti di amministratore o di ragione sociale;</li>\n<li>capitale minimo, nessun dipendente, fatturato incoerente con l’attività dichiarata;</li>\n<li>amministratori con molte cariche in società poi cessate.</li>\n</ul>\n<p><em>Esempio:</em> un fornitore sconosciuto propone un contratto. Con la partita IVA verifichi su VIES che sia attiva, poi dalla visura controlli data di costituzione, amministratori e bilanci. Una società nata da due mesi con sede in un ufficio condiviso richiede ulteriori cautele.</p>\n<h2 id=\"limiti\">3. Limiti e correttezza</h2>\n<p>I dati di persone fisiche restano <strong>dati personali</strong> anche se contenuti in un registro pubblico: applica finalità, proporzionalità e minimizzazione (GDPR). Un registro dice cosa è <em>dichiarato</em>, non cosa è <em>vero</em>: incrocia sempre più fonti.</p>\n","quiz":[{"q":"Qual è il selettore più solido per avviare una ricerca su un’impresa italiana?","opts":{"a":"Il nome del sito web","b":"Partita IVA o codice fiscale","c":"Il logo aziendale","d":"Il numero di dipendenti"},"correct":"b","why":"Partita IVA e codice fiscale sono identificatori univoci e ufficiali; i nomi commerciali possono essere ambigui o cambiare."},{"q":"A cosa serve il servizio VIES?","opts":{"a":"A verificare la validità di una partita IVA intracomunitaria","b":"A consultare i bilanci delle società italiane","c":"A visualizzare le proprietà catastali","d":"A cercare persone sanzionate"},"correct":"a","why":"VIES è il sistema europeo per controllare se una partita IVA intracomunitaria è valida."},{"q":"Quale elemento è un tipico segnale di allarme per una società di comodo?","opts":{"a":"Bilanci depositati regolarmente","b":"Sede presso un ufficio virtuale condiviso da molte società e frequenti cambi di amministratore","c":"Presenza di un sito web","d":"Oggetto sociale molto dettagliato"},"correct":"b","why":"Sedi condivise, cambi continui di amministratori e struttura minima sono indicatori classici di società cartiere o di comodo."},{"q":"Cosa ha cambiato la sentenza della Corte di giustizia UE del 2022 sui titolari effettivi?","opts":{"a":"Ha reso pubblici tutti i registri","b":"Ha eliminato l’obbligo di registrazione","c":"Ha limitato l’accesso pubblico, che ora richiede un interesse legittimo","d":"Non ha avuto effetti"},"correct":"c","why":"La Corte ha ritenuto sproporzionato l’accesso libero e generalizzato, restringendolo a chi dimostra un interesse legittimo."},{"q":"Perché un dato presente in un registro pubblico va comunque trattato con cautela?","opts":{"a":"Perché è sempre falso","b":"Perché resta dato personale e il suo uso deve rispettare finalità e proporzionalità","c":"Perché è coperto da segreto militare","d":"Perché non può essere salvato"},"correct":"b","why":"La natura pubblica della fonte non elimina gli obblighi del GDPR: finalità, minimizzazione e proporzionalità restano validi."}]},{"title":"Intelligence Tecnica: Domini e Infrastruttura","html":"<h1 id=\"lezione-14\">Lezione 14 – Intelligence Tecnica: Domini e Infrastruttura</h1>\n<blockquote>\n<p><em>“Ogni sito web è un’impronta: sta a te leggerla senza toccare nulla.”</em></p>\n</blockquote>\n<hr />\n<h2 id=\"obiettivi-di-apprendimento\">Obiettivi di apprendimento</h2>\n<p>Al termine di questa lezione sarai in grado di:</p>\n<ol type=\"1\">\n<li>leggere WHOIS e principali record DNS e trarne indicazioni investigative;</li>\n<li>scoprire sottodomini in modo passivo tramite Certificate Transparency;</li>\n<li>usare motori come Shodan e Censys nel rispetto dei limiti di legge;</li>\n<li>collegare più domini tramite pivoting su ID, nameserver e IP.</li>\n</ol>\n<hr />\n<h2 id=\"dns\">1. Dominio e DNS</h2>\n<p>Un dominio è un selettore ricco di informazioni: chi lo ha registrato, dove è ospitato, quali servizi usa, a cosa è collegato.</p>\n<h3 id=\"whois\">1.1 WHOIS e RDAP</h3>\n<p>Dopo il GDPR molti dati del titolare sono <strong>oscurati</strong>, ma restano utili data di registrazione, registrar, nameserver e, a volte, e-mail o organizzazione. Gli <em>storici</em> WHOIS (servizi come DomainTools o WhoisXML) possono mostrare dati precedenti all’oscuramento.</p>\n<h3 id=\"rec\">1.2 Record DNS fondamentali</h3>\n<table>\n<thead><tr><th>Record</th><th>Significato</th><th>Valore OSINT</th></tr></thead>\n<tbody>\n<tr><td><code>A</code> / <code>AAAA</code></td><td>Indirizzo IPv4 / IPv6</td><td>Hosting, altri domini sullo stesso IP</td></tr>\n<tr><td><code>MX</code></td><td>Server di posta</td><td>Provider e-mail usato</td></tr>\n<tr><td><code>NS</code></td><td>Nameserver</td><td>Gestore del DNS, possibili legami tra domini</td></tr>\n<tr><td><code>TXT</code></td><td>SPF, verifiche di proprietà</td><td>Servizi terzi usati dall’organizzazione</td></tr>\n<tr><td><code>CNAME</code></td><td>Alias</td><td>Servizi esterni collegati</td></tr>\n</tbody></table>\n<pre><code>dig example.com ANY +noall +answer\ndig MX example.com +short\nnslookup -type=TXT example.com</code></pre>\n<h2 id=\"ct\">2. Certificate Transparency e sottodomini</h2>\n<p>Ogni certificato TLS emesso da una CA pubblica viene registrato in log pubblici. Servizi come <strong>crt.sh</strong> e <strong>Censys</strong> permettono di scoprire sottodomini e infrastrutture dimenticate in modo <em>passivo</em>.</p>\n<pre><code>https://crt.sh/?q=%25.example.com</code></pre>\n<p>Strumenti come <strong>Amass</strong> e <strong>subfinder</strong> aggregano fonti passive per elencare i sottodomini.</p>\n<h2 id=\"shodan\">3. Motori di ricerca di dispositivi</h2>\n<p><strong>Shodan</strong>, <strong>Censys</strong> e <strong>ZoomEye</strong> indicizzano i servizi esposti su Internet. Esempi di filtri Shodan:</p>\n<pre><code>hostname:example.com\norg:\"Nome Organizzazione\" country:IT\nport:3389 country:IT</code></pre>\n<blockquote>\n<p><strong>Attenzione legale:</strong> consultare dati già indicizzati è OSINT; collegarsi, effettuare login o scansionare attivamente i sistemi trovati può integrare il reato di <strong>accesso abusivo a sistema informatico</strong> (art. 615-ter c.p.).</p>\n</blockquote>\n<h2 id=\"pivot\">4. Pivoting e storico</h2>\n<ul>\n<li><strong>Wayback Machine</strong>: versioni passate del sito, contatti e pagine rimosse;</li>\n<li><strong>urlscan.io</strong>: struttura, richieste e risorse caricate da una pagina;</li>\n<li><strong>BuiltWith / Wappalyzer</strong>: tecnologie usate e <em>ID di tracciamento</em> (Analytics, AdSense) condivisi tra siti dello stesso gestore;</li>\n<li><strong>Reverse IP e reverse e-mail</strong>: altri domini associati allo stesso indirizzo o contatto.</li>\n</ul>\n<p><em>Esempio:</em> un sito sospetto di phishing mostra lo stesso ID Google Analytics di altri tre domini: hai individuato un probabile unico gestore, da verificare con altri elementi (nameserver, certificati, date di registrazione).</p>\n","quiz":[{"q":"Quale record DNS indica il server di posta di un dominio?","opts":{"a":"A","b":"NS","c":"MX","d":"CNAME"},"correct":"c","why":"Il record MX indica i server incaricati di ricevere la posta del dominio."},{"q":"Cosa permette di fare crt.sh?","opts":{"a":"Scansionare le porte di un server","b":"Cercare certificati TLS registrati nei log pubblici e scoprire sottodomini","c":"Violare un certificato","d":"Vedere le e-mail di un dominio"},"correct":"b","why":"I log di Certificate Transparency sono pubblici: crt.sh li interroga in modo passivo."},{"q":"Quale attività può integrare il reato di accesso abusivo a sistema informatico?","opts":{"a":"Consultare un risultato già indicizzato da Shodan","b":"Leggere un record DNS pubblico","c":"Effettuare login su un servizio scoperto tramite Shodan senza autorizzazione","d":"Consultare la Wayback Machine"},"correct":"c","why":"Entrare in un sistema senza autorizzazione, anche se esposto, può violare l’art. 615-ter c.p.; la sola consultazione di dati indicizzati no."},{"q":"Perché lo stesso ID Google Analytics su più siti è utile?","opts":{"a":"Indica che i siti sono probabilmente gestiti dallo stesso soggetto","b":"Prova con certezza la proprietà legale","c":"Garantisce che i siti siano sicuri","d":"Non ha valore investigativo"},"correct":"a","why":"Un ID di tracciamento condiviso è un indizio di gestione comune, da confermare con altri riscontri."},{"q":"Dopo il GDPR cosa accade spesso ai dati WHOIS del titolare?","opts":{"a":"Diventano più dettagliati","b":"Vengono oscurati, restando però utili registrar, date e nameserver","c":"Vengono cancellati anche gli storici commerciali","d":"Sono sostituiti da dati fiscali"},"correct":"b","why":"Molti registrar oscurano i dati personali, ma restano disponibili altri metadati e storici di terze parti."}]},{"title":"Criptovalute e Blockchain","html":"<h1 id=\"lezione-15\">Lezione 15 – Criptovalute e Blockchain</h1>\n<blockquote>\n<p><em>“Il denaro digitale lascia una traccia indelebile: serve solo saperla seguire.”</em></p>\n</blockquote>\n<hr />\n<h2 id=\"obiettivi-di-apprendimento\">Obiettivi di apprendimento</h2>\n<p>Al termine di questa lezione sarai in grado di:</p>\n<ol type=\"1\">\n<li>spiegare perché le blockchain sono pseudonime e non anonime;</li>\n<li>usare block explorer e piattaforme di analisi per seguire i fondi;</li>\n<li>applicare euristiche di clustering conoscendone i limiti;</li>\n<li>riconoscere gli ostacoli (mixer, privacy coin, bridge) e gestire gli aspetti legali.</li>\n</ol>\n<hr />\n<h2 id=\"base\">1. Fondamenti: pseudonimia, non anonimato</h2>\n<p>Le principali blockchain (Bitcoin, Ethereum) sono <strong>registri pubblici e immutabili</strong>: ogni transazione è visibile a tutti. Gli indirizzi sono <em>pseudonimi</em>: il nome del titolare non compare, ma le tracce lasciate permettono spesso di collegarlo a un’identità reale.</p>\n<table>\n<thead><tr><th>Termine</th><th>Significato</th></tr></thead>\n<tbody>\n<tr><td><strong>Indirizzo</strong></td><td>Identificatore pubblico a cui si ricevono fondi</td></tr>\n<tr><td><strong>Hash di transazione</strong></td><td>Codice univoco di ogni trasferimento</td></tr>\n<tr><td><strong>Wallet</strong></td><td>Insieme di chiavi/indirizzi controllati da un utente</td></tr>\n<tr><td><strong>Exchange</strong></td><td>Piattaforma di scambio che, se regolamentata, applica KYC</td></tr>\n<tr><td><strong>UTXO / account</strong></td><td>Modello di Bitcoin (output non spesi) / modello di Ethereum (saldi)</td></tr>\n</tbody></table>\n<h2 id=\"expl\">2. Strumenti</h2>\n<ul>\n<li><strong>Block explorer</strong>: mempool.space e Blockchair (Bitcoin), <strong>Etherscan</strong> (Ethereum), Solscan (Solana);</li>\n<li><strong>Piattaforme di analisi e visualizzazione</strong>: Arkham Intelligence, MetaSleuth, Breadcrumbs; in ambito professionale Chainalysis, TRM Labs ed Elliptic;</li>\n<li><strong>Segnalazioni pubbliche</strong>: Chainabuse e Bitcoin Abuse per indirizzi associati a truffe.</li>\n</ul>\n<h2 id=\"tec\">3. Tecniche di tracciamento</h2>\n<ol type=\"1\">\n<li><strong>Raccolta</strong>: parti da un indirizzo o da un hash (da una truffa, un ransomware, un post).</li>\n<li><strong>Ricerca testuale dell’indirizzo</strong>: motori di ricerca, forum, Telegram, repository, pagine di donazione.</li>\n<li><strong>Clustering</strong>: indirizzi usati come input della stessa transazione sono verosimilmente controllati dallo stesso soggetto (euristica del <em>common input ownership</em>).</li>\n<li><strong>Indirizzo di resto</strong>: individuare l’output che torna al mittente aiuta a seguire i fondi.</li>\n<li><strong>Punti di contatto con il mondo reale</strong>: depositi verso exchange con KYC; i dati del titolare li può ottenere solo l’autorità giudiziaria.</li>\n</ol>\n<h3 id=\"osc\">3.1 Fattori che ostacolano l’analisi</h3>\n<ul>\n<li><strong>Mixer</strong> e servizi di <em>coinjoin</em>;</li>\n<li><strong>Privacy coin</strong> come Monero, che nascondono mittente, destinatario e importo;</li>\n<li><strong>Bridge cross-chain</strong> e rapidi passaggi tra molti indirizzi (<em>peel chain</em>).</li>\n</ul>\n<blockquote>\n<p>Le euristiche sono <strong>probabilistiche</strong>: riporta nel report il livello di confidenza e non attribuire mai un indirizzo a una persona senza riscontri indipendenti.</p>\n</blockquote>\n<h2 id=\"eti\">4. Aspetti legali ed etici</h2>\n<p>L’analisi di dati pubblici di blockchain è lecita, ma l’attribuzione a una persona identificata è un trattamento di dati personali. Se emergono reati (truffe, ransomware) segnala alle autorità invece di agire in proprio.</p>\n","quiz":[{"q":"Perché si dice che Bitcoin è pseudonimo e non anonimo?","opts":{"a":"Perché le transazioni sono cifrate","b":"Perché le transazioni sono pubbliche e gli indirizzi, pur senza nome, possono essere ricondotti a un’identità","c":"Perché non esistono indirizzi","d":"Perché solo le banche vedono i dati"},"correct":"b","why":"Il ledger è pubblico: gli indirizzi non riportano il nome, ma i comportamenti e i punti di contatto con exchange possono rivelare l’identità."},{"q":"Quale strumento è un block explorer per Ethereum?","opts":{"a":"mempool.space","b":"Etherscan","c":"Maigret","d":"Wayback Machine"},"correct":"b","why":"Etherscan è il principale explorer della rete Ethereum."},{"q":"Cosa afferma l’euristica del common input ownership?","opts":{"a":"Ogni indirizzo appartiene a una persona diversa","b":"Gli indirizzi usati come input nella stessa transazione sono verosimilmente controllati dallo stesso soggetto","c":"Gli exchange non usano indirizzi","d":"Gli output sono sempre anonimi"},"correct":"b","why":"Per firmare una transazione servono le chiavi di tutti gli input, quindi è probabile che siano sotto lo stesso controllo."},{"q":"Chi può ottenere i dati KYC di un titolare di conto su un exchange?","opts":{"a":"Chiunque tramite Etherscan","b":"L’autorità giudiziaria con richiesta formale","c":"L’investigatore OSINT in autonomia","d":"Qualsiasi utente registrato"},"correct":"b","why":"I dati KYC sono dati personali custoditi dall’exchange e accessibili tramite procedure legali."},{"q":"Quale elemento rende più difficile l’analisi forense di un flusso di fondi?","opts":{"a":"Un indirizzo riutilizzato","b":"L’uso di privacy coin come Monero o di mixer","c":"Un block explorer pubblico","d":"Una transazione con un solo input"},"correct":"b","why":"Privacy coin e mixer oscurano o rompono i legami tra mittente e destinatario."}]},{"title":"OPSEC, Prove e Reportistica","html":"<h1 id=\"lezione-16\">Lezione 16 – OPSEC, Prove e Reportistica</h1>\n<blockquote>\n<p><em>“Un’indagine senza documentazione è un’opinione.”</em></p>\n</blockquote>\n<hr />\n<h2 id=\"obiettivi-di-apprendimento\">Obiettivi di apprendimento</h2>\n<p>Al termine di questa lezione sarai in grado di:</p>\n<ol type=\"1\">\n<li>adottare misure di OPSEC per proteggere indagine e investigatore;</li>\n<li>documentare e preservare le evidenze garantendone l’integrità;</li>\n<li>valutare in modo strutturato affidabilità di fonte e informazione;</li>\n<li>redigere un rapporto chiaro e rispettare i principi etici e legali.</li>\n</ol>\n<hr />\n<h2 id=\"opsec\">1. OPSEC dell’investigatore</h2>\n<p>L’<strong>OPSEC</strong> (operations security) protegge te e l’indagine: se il soggetto capisce di essere osservato, l’attività è compromessa.</p>\n<ul>\n<li><strong>Separazione degli ambienti</strong>: macchina virtuale o profilo browser dedicato per ogni indagine;</li>\n<li><strong>Nessun legame personale</strong>: mai account, e-mail o dispositivi privati; se serve un profilo di servizio (<em>sock puppet</em>) rispetta le regole della piattaforma e la legge;</li>\n<li><strong>Rete</strong>: una VPN nasconde l’IP ma non il fingerprint del browser, né sostituisce le buone pratiche;</li>\n<li><strong>Nessuna interazione</strong>: guarda, non toccare. Richieste di amicizia, like e visualizzazioni possono tradirti;</li>\n<li><strong>Dati sicuri</strong>: archivi cifrati, accesso limitato, politica di conservazione.</li>\n</ul>\n<h2 id=\"doc\">2. Documentare e preservare le prove</h2>\n<ol type=\"1\">\n<li><strong>Cattura</strong>: screenshot completo con URL, data e ora visibili; salva anche la pagina in formato HTML o PDF.</li>\n<li><strong>Archiviazione</strong>: Wayback Machine o archive.today per copie indipendenti; strumenti come Hunchly automatizzano la raccolta.</li>\n<li><strong>Integrità</strong>: calcola l’<em>hash</em> del file per dimostrare che non è stato modificato.</li>\n<li><strong>Catena di custodia</strong>: registro di chi ha raccolto, copiato e consultato ogni elemento.</li>\n</ol>\n<pre><code>sha256sum screenshot_2025-01-15.png &gt;&gt; registro_hash.txt</code></pre>\n<h2 id=\"ver\">3. Verifica delle fonti</h2>\n<p>Valuta separatamente <strong>affidabilità della fonte</strong> e <strong>credibilità dell’informazione</strong>, ad esempio con la scala usata in ambito intelligence (fonte da A a F, informazione da 1 a 6). Cerca sempre almeno <strong>due fonti indipendenti</strong>: più repliche dello stesso articolo non contano come riscontri.</p>\n<h2 id=\"rep\">4. Il rapporto finale</h2>\n<table>\n<thead><tr><th>Sezione</th><th>Contenuto</th></tr></thead>\n<tbody>\n<tr><td>Sommario esecutivo</td><td>Conclusioni principali in poche righe</td></tr>\n<tr><td>Obiettivo e ambito</td><td>Richiesta, base legittima, limiti dell’incarico</td></tr>\n<tr><td>Metodologia</td><td>Fonti, strumenti, date e orari della raccolta</td></tr>\n<tr><td>Risultati</td><td>Fatti distinti da ipotesi, con livello di confidenza</td></tr>\n<tr><td>Limiti</td><td>Lacune, dati non verificati, possibili bias</td></tr>\n<tr><td>Allegati</td><td>Evidenze, hash, registro di custodia</td></tr>\n</tbody></table>\n<h3 id=\"rif\">4.1 Riferimenti</h3>\n<p>Schemi analoghi (piano di raccolta, matrice dei rischi, checklist di conformità legale, framework di verifica delle fonti, catena di custodia) sono proposti nel repository complementare <strong>JambaAcademy/OSINT</strong> (licenza MIT), da adattare al contesto italiano ed europeo.</p>\n<h2 id=\"eti\">5. Cornice etica e legale</h2>\n<p>Principi guida: <strong>finalità</strong> (solo scopi legittimi), <strong>proporzionalità</strong> (mezzi adeguati all’obiettivo), <strong>minimizzazione</strong> (solo i dati necessari), <strong>accuratezza</strong> e <strong>riservatezza</strong>. Per i dati personali valgono GDPR e Codice Privacy.</p>\n","quiz":[{"q":"Qual è il limite principale di una VPN per l’OPSEC?","opts":{"a":"Non nasconde l’indirizzo IP","b":"Non elimina il fingerprint del browser né sostituisce la separazione degli ambienti","c":"È illegale in Italia","d":"Rallenta sempre la connessione"},"correct":"b","why":"La VPN protegge l’IP ma non cancella altri identificativi come il fingerprint o i comportamenti dell’utente."},{"q":"A cosa serve calcolare l’hash di un file raccolto come prova?","opts":{"a":"A comprimerlo","b":"A dimostrare che non è stato modificato dopo la raccolta","c":"A renderlo anonimo","d":"A tradurlo"},"correct":"b","why":"L’hash è un’impronta: se il file cambia, cambia anche l’hash."},{"q":"Quando si può dire di avere un riscontro indipendente?","opts":{"a":"Quando due siti ripubblicano lo stesso articolo","b":"Quando due fonti distinte arrivano alla stessa informazione senza dipendere l’una dall’altra","c":"Quando l’informazione è condivisa molte volte","d":"Quando la fonte è famosa"},"correct":"b","why":"Contano fonti indipendenti: la ripetizione della stessa notizia non è conferma."},{"q":"Cosa deve contenere un buon rapporto OSINT oltre ai risultati?","opts":{"a":"Solo le conclusioni","b":"Metodologia, livello di confidenza, limiti e allegati","c":"Le opinioni personali dell’analista","d":"I dati degli account privati dell’investigatore"},"correct":"b","why":"Metodologia, confidenza e limiti rendono il lavoro verificabile e riproducibile."},{"q":"Cosa significa il principio di minimizzazione?","opts":{"a":"Raccogliere tutti i dati possibili","b":"Raccogliere solo i dati necessari rispetto allo scopo","c":"Cancellare ogni evidenza","d":"Usare un solo strumento"},"correct":"b","why":"Il GDPR richiede di trattare solo i dati adeguati, pertinenti e limitati a quanto necessario."}]}];
const TOTAL = LD.length;
const PASS = 0.75;  // soglia minima per superare il quiz

let st = { cur: -1, prog: {} };
// prog[i] = { answered: {qIdx: letter}, correct: Set }

// ── Storage ──────────────────────────────────────────────────────────────────
function loadSt() {
  try {
    const s = JSON.parse(localStorage.getItem('osint_v3') || 'null');
    if (!s) return;
    st.cur = s.cur ?? -1;
    for (const [k, v] of Object.entries(s.prog || {})) {
      st.prog[k] = { answered: v.answered || {}, correct: new Set(v.correct || []) };
    }
  } catch(e) {}
}

function saveSt() {
  const s = { cur: st.cur, prog: {} };
  for (const [k, v] of Object.entries(st.prog)) {
    s.prog[k] = { answered: v.answered, correct: [...v.correct] };
  }
  try { localStorage.setItem('osint_v3', JSON.stringify(s)); } catch(e) {}
}

// ── Helpers ──────────────────────────────────────────────────────────────────
function isDone(i) {
  const p = st.prog[i];
  if (!p) return false;
  const N = LD[i].quiz.length;
  return Object.keys(p.answered).length >= N && p.correct.size / N >= PASS;
}
function retry(i) {
  st.prog[i] = { answered: {}, correct: new Set() };
  saveSt();
  render();
  document.getElementById('main').scrollTo({ top: 0, behavior: 'smooth' });
}
function isOpen(i) { return i === 0 || isDone(i - 1); }

function escH(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Navigate ─────────────────────────────────────────────────────────────────
function go(i) {
  if (typeof i === 'string') i = parseInt(i);
  if (i >= 0 && !isOpen(i)) return;
  st.cur = i; saveSt();
  render();
  document.getElementById('main').scrollTo({ top: 0, behavior: 'smooth' });
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() { renderSidebar(); renderMain(); }

function renderSidebar() {
  const done = LD.filter((_,i) => isDone(i)).length;
  const pct  = Math.round(done / TOTAL * 100);
  document.getElementById('pfill').style.width = pct + '%';
  document.getElementById('ptxt').textContent = done + ' / ' + TOTAL + ' completate';

  document.getElementById('lnav').innerHTML = LD.map((l, i) => {
    let cls = 'locked', icon = '🔒';
    if      (isDone(i))       { cls = 'done';    icon = '✓'; }
    else if (i === st.cur)    { cls = 'current';  icon = i + 1; }
    else if (isOpen(i))       { cls = 'avail';    icon = i + 1; }
    const active = i === st.cur ? ' current' : '';
    return `<div class="l-item ${cls}${active}" onclick="go(${i})" title="${escH(l.title)}">
      <div class="l-icon">${icon}</div>
      <div class="l-title">${escH(l.title)}</div>
    </div>`;
  }).join('');
}

function renderMain() {
  const m = document.getElementById('main');
  if (st.cur < 0) { m.innerHTML = renderWelcome(); return; }

  const l = LD[st.cur], i = st.cur;
  m.innerHTML = `
    <div class="l-header">
      <div class="l-badge">Lezione ${i+1} di ${TOTAL}</div>
      <h2>${escH(l.title)}</h2>
    </div>
    <div class="content-area">
      <div class="lesson-body">${l.html}</div>
    </div>
    <div class="quiz-section" id="qsec">${renderQuiz(i)}</div>`;
}

function renderWelcome() {
  const done = LD.filter((_,i) => isDone(i)).length;
  const resume = done < TOTAL ? done : 0;
  const btn = done === 0 ? 'Inizia il Corso →' : done === TOTAL ? 'Rileggi dall\'inizio →' : 'Riprendi →';
  return `<div id="welcome"><div class="w-inner">
    <div class="w-logo">🔍</div>
    <h2>OSINT<br><span>Manuale Pratico</span></h2>
    <p>Un corso completo di Open Source Intelligence: dalla teoria agli strumenti avanzati,
       ricerca degli username, analisi di immagini, aeromobili, social engineering, intelligence aziendale, infrastruttura tecnica, blockchain e OPSEC.</p>
    <div class="stats-grid">
      <div class="stat-c"><div class="n">${TOTAL}</div><div class="l">Lezioni</div></div>
      <div class="stat-c"><div class="n">${LD.reduce((s,l)=>s+l.quiz.length,0)}</div><div class="l">Domande quiz</div></div>
      <div class="stat-c"><div class="n">${done}</div><div class="l">Completate</div></div>
    </div>
    <button class="btn-start" onclick="go(${resume})">${btn}</button>
  </div></div>`;
}

function renderQuiz(i) {
  const l  = LD[i];
  const p  = st.prog[i] || { answered: {}, correct: new Set() };
  const N  = l.quiz.length;
  const ans = Object.keys(p.answered).length;
  const ok  = p.correct.size;
  const all = ans >= N;

  let h = `<div class="quiz-hdr">
    <div class="quiz-ico">📝</div>
    <div class="quiz-hdr-text">
      <h3>Quiz di autoverifica</h3>
      <p>Servono almeno ${Math.ceil(N * PASS)} risposte corrette su ${N} (75%) per sbloccare la lezione successiva</p>
    </div>
    <div class="quiz-prog-badge"><span>${ans}</span> / ${N}</div>
  </div>`;

  l.quiz.forEach((q, qi) => {
    const userAns = p.answered[qi];
    const answered = userAns !== undefined;
    const isOk = p.correct.has(qi);
    const cardCls = answered ? (isOk ? ' ok' : ' err') : '';

    h += `<div class="q-card${cardCls}" id="qc-${i}-${qi}">
      <div class="q-num">Domanda ${qi+1}</div>
      <div class="q-text">${escH(q.q)}</div>
      <div class="opts">`;

    Object.keys(q.opts).sort().forEach(lt => {
      let cls = 'opt';
      if (answered) {
        if (lt === q.correct)  cls += ' correct';
        else if (lt === userAns) cls += ' wrong';
      }
      const dis = answered ? 'disabled' : '';
      h += `<button class="${cls}" ${dis} onclick="answer(${i},${qi},'${lt}')">
        <span class="opt-let">${lt}</span>
        <span>${escH(q.opts[lt])}</span>
      </button>`;
      if (answered && isOk && lt === q.correct && q.why) {
        h += `<div class="q-explain"><b>💡 Motivazione</b>${escH(q.why)}</div>`;
      }
    });

    h += `</div>`;
    if (answered) {
      if (isOk) {
        h += `<div class="q-feedback ok">✓ Risposta corretta!</div>`;
      } else {
        h += `<div class="q-feedback err">✗ Sbagliata — La risposta corretta era: <strong>${q.correct.toUpperCase()}</strong></div>`;
      }
    }
    h += `</div>`;
  });

  // Footer
  h += `<div class="quiz-footer">`;
  const passed = all && ok / N >= PASS;
  if (all && !passed) {
    const pct = Math.round(ok / N * 100);
    h += `<div class="quiz-fail">
      <div class="qf-ico">⚠️</div>
      <div class="qf-txt"><strong>Quiz non superato: ${ok}/${N} (${pct}%)</strong>
        <p>Il punteggio minimo è il 75%. Rileggi con attenzione la lezione: il quiz verrà
        azzerato e dovrai rispondere di nuovo a tutte le domande.</p></div>
      <button class="btn-next" onclick="retry(${i})">↺ Rileggi la lezione e riprova</button>
    </div>`;
    h += `</div>`;
    return h;
  }
  if (all) {
    const pct = Math.round(ok / N * 100);
    h += `<div class="quiz-score">✅ Superato! Punteggio: <strong>${ok}/${N}</strong> &nbsp;(${pct}%)</div>`;
  } else {
    h += `<div class="quiz-score">Rispondi a tutte le domande (minimo 75% corrette)</div>`;
  }

  const isLast = i === TOTAL - 1;
  if (isLast && passed) {
    h += `<button class="btn-next" onclick="showEnd()">Completa il corso 🎉</button>`;
  } else {
    h += `<button class="btn-next" ${passed ? '' : 'disabled'} onclick="go(${i+1})">
      Lezione successiva &rarr;
    </button>`;
  }
  h += `</div>`;
  return h;
}

// ── Answer a question ─────────────────────────────────────────────────────────
function answer(lessonI, qI, letter) {
  if (!st.prog[lessonI]) st.prog[lessonI] = { answered: {}, correct: new Set() };
  const p = st.prog[lessonI];
  if (p.answered[qI] !== undefined) return;  // already answered

  p.answered[qI] = letter;
  if (letter === LD[lessonI].quiz[qI].correct) p.correct.add(qI);
  saveSt();

  // Re-render quiz section only
  const qsec = document.getElementById('qsec');
  if (qsec) {
    const scrollY = document.getElementById('main').scrollTop;
    qsec.innerHTML = renderQuiz(lessonI);
    document.getElementById('main').scrollTop = scrollY;
    // Scroll to answered card
    const card = document.getElementById(`qc-${lessonI}-${qI}`);
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  renderSidebar();
}

function showEnd() {
  const totalOk  = Object.values(st.prog).reduce((s, p) => s + p.correct.size, 0);
  const totalAns = LD.reduce((s, l) => s + l.quiz.length, 0);
  const pct = Math.round(totalOk / totalAns * 100);
  document.getElementById('main').innerHTML = `<div id="welcome"><div class="w-inner">
    <div class="w-logo">🏆</div>
    <h2>Corso<br><span>Completato!</span></h2>
    <p>Hai completato tutte le ${TOTAL} lezioni del Manuale Pratico OSINT.<br>
       Sei ora pronto ad applicare le tecniche di intelligence in modo etico e professionale.</p>
    <div class="stats-grid">
      <div class="stat-c"><div class="n">${TOTAL}</div><div class="l">Lezioni</div></div>
      <div class="stat-c"><div class="n">${totalOk}</div><div class="l">Risposte corrette</div></div>
      <div class="stat-c"><div class="n">${pct}%</div><div class="l">Precisione</div></div>
    </div>
    <button class="btn-start" onclick="go(0)">Rileggi dall'inizio →</button>
  </div></div>`;
}

// ── Init ──────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => { loadSt(); render(); });
</script>
</body>
</html>
