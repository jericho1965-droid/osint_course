 vorresti rimuovere?</p>\n<p><strong>Esercizio 2 – Fatto, inferenza o opinione? (15 min)</strong>\nClassifica le seguenti frasi in F (fatto), I (inferenza) o O (opinione):\na) “Il post è stato pubblicato alle 23:14 secondo il timestamp della\npiattaforma.” b) “L’utente probabilmente vive a Milano, perché cita\nspesso locali della città.” c) “Questo utente è una persona\ninaffidabile.” d) “L’immagine contiene metadati EXIF con un modello di\nfotocamera Canon EOS 80D.” e) “Le foto sono state scattate dalla stessa\npersona, perché la fotocamera è la stessa.”</p>\n<p><strong>Esercizio 3 – Caccia al bias (30 min)</strong> Trova online\nun caso recente di notizia falsa o di errore di attribuzione, ad esempio\ndagli archivi di siti di fact-checking. Identifica almeno <strong>tre\nbias</strong> che hanno contribuito alla diffusione e spiega quale\ntecnica strutturata li avrebbe evitati.</p>\n<p><strong>Esercizio 4 – Matrice ACH (45 min)</strong> Scenario: un\naccount anonimo pubblica documenti interni di un’azienda. Formula almeno\n<strong>quattro ipotesi</strong> su chi possa essere l’autore (es.\ndipendente scontento, ex dipendente, attacco informatico esterno,\noperazione di depistaggio). Scrivi almeno <strong>sei prove\nipotetiche</strong> e costruisci la matrice. Quale prova sarebbe più\ndiagnostica?</p>\n<p><strong>Esercizio 5 – Linguaggio probabilistico (15 min)</strong>\nRiscrivi queste frasi usando la scala di probabilità e indicando la\nconfidenza: a) “Sicuramente è lui.” b) “Potrebbe essere stato scattato\nin Spagna.” c) “Non credo che i due account siano collegati.”</p>\n<p><strong>Esercizio 6 – Prepara il tuo laboratorio (60–90 min)</strong>\n1. Installa VirtualBox. 2. Scarica e importa una VM per OSINT (es. Trace\nLabs OSINT VM) oppure una Linux leggera. 3. Configura un browser\ndedicato con uBlock Origin. 4. Crea una cartella per le indagini con le\nsottocartelle <code>diario/</code>, <code>screenshot/</code> e\n<code>report/</code>.</p>\n<hr />\n","quiz":[{"q":"Qual è la differenza principale tra \"informazione\" e \"intelligence\"?","opts":{"a":"L'intelligence è sempre segreta","b":"L'intelligence è informazione valutata e analizzata per rispondere a un requisito decisionale","c":"L'informazione proviene da Internet, l'intelligence dai giornali","d":"Non c'è differenza"},"correct":"b","why":"L'informazione è il dato grezzo; diventa intelligence solo quando viene valutata, analizzata e messa al servizio di un requisito decisionale preciso"},{"q":"Quale di queste attività non è OSINT?","opts":{"a":"Consultare una visura camerale","b":"Analizzare i post pubblici di un profilo Instagram","c":"Accedere a un account e-mail con una password trovata in un data breach","d":"Usare la Wayback Machine per vedere una vecchia versione di un sito"},"correct":"c","why":"Usare credenziali trapelate per entrare in un account altrui è accesso abusivo (art. 615-ter c.p.): l'OSINT si limita a fonti lecitamente accessibili"},{"q":"Quale organizzazione nata nel 1939 è considerata uno dei primi esempi di OSINT strutturata?","opts":{"a":"Bellingcat","b":"BBC Monitoring Service","c":"NATO","d":"Open Source Center"},"correct":"b","why":"Il BBC Monitoring Service, nato nel 1939, ascoltava e trascriveva le trasmissioni radio straniere: uno dei primi esempi di OSINT organizzata"},{"q":"Cosa si intende per \"pivot\" nell'OSINT?","opts":{"a":"Un software di analisi dei grafi","b":"Usare un'informazione trovata come punto di partenza per nuove ricerche","c":"Cambiare argomento quando si è bloccati","d":"Un tipo di VPN"},"correct":"b","why":"Il pivot consiste nell'usare un dato trovato (username, email, telefono) come nuovo punto di partenza per estendere la ricerca"},{"q":"Nella scala dell'Ammiragliato, cosa indica la valutazione \"A4\"?","opts":{"a":"Fonte inaffidabile, informazione confermata","b":"Fonte completamente affidabile, informazione dubbia","c":"Fonte sconosciuta, informazione probabile","d":"Fonte affidabile, informazione confermata"},"correct":"b","why":"La lettera valuta la fonte (A = completamente affidabile), il numero l'informazione (4 = dubbia): le due valutazioni sono indipendenti"},{"q":"Dieci siti riportano la stessa notizia, ma tutti copiano lo stesso post originale. Questo fenomeno si chiama:","opts":{"a":"Bias di disponibilità","b":"Report circolare","c":"Effetto alone","d":"Pivot"},"correct":"b","why":"Il report circolare crea una falsa corroborazione: molte fonti apparenti risalgono in realtà a un'unica origine"},{"q":"Nell'ACH, l'ipotesi da preferire è quella:","opts":{"a":"con il maggior numero di prove a favore","b":"proposta dal cliente","c":"con il minor numero di prove incoerenti","d":"più semplice in assoluto"},"correct":"c","why":"L'ACH ragiona per falsificazione: vince l'ipotesi con meno prove incoerenti, non quella con più prove a favore"},{"q":"Un analista continua a seguire una pista sbagliata perché ci ha già dedicato dieci ore. Di quale bias si tratta?","opts":{"a":"Ancoraggio","b":"Costo irrecuperabile","c":"Senno di poi","d":"Mirror imaging"},"correct":"b","why":"Il bias del costo irrecuperabile spinge a proseguire per non \"sprecare\" l'investimento già fatto, anche quando la pista è sbagliata"},{"q":"Perché è pericoloso usare l'upscaling AI per \"migliorare\" un'immagine sfocata da usare come prova?","opts":{"a":"È illegale","b":"Gli algoritmi possono inventare dettagli che non esistono","c":"Riduce la risoluzione","d":"Cancella i metadati EXIF"},"correct":"b","why":"Gli algoritmi di upscaling generano pixel plausibili ma inventati: il risultato non ha valore probatorio"},{"q":"Secondo il GDPR, un dato personale pubblicato volontariamente su un social network:","opts":{"a":"non è più un dato personale","b":"può essere usato liberamente per qualsiasi scopo","c":"resta un dato personale, e il suo trattamento richiede una base giuridica","d":"diventa di proprietà della piattaforma"},"correct":"c","why":"Per il GDPR un dato resta personale anche se pubblicato dall'interessato; il suo trattamento richiede comunque una base giuridica e il rispetto delle finalità"},{"q":"Cosa indica la lettera \"S\" nel metodo SIFT?","opts":{"a":"Search","b":"Source","c":"Stop","d":"Share"},"correct":"c","why":"Nel metodo SIFT la S sta per \"Stop\": fermarsi prima di condividere o credere a un contenuto"},{"q":"Quale misura OPSEC è più importante per un principiante?","opts":{"a":"Usare il proprio account personale per comodità","b":"Non interagire mai con i soggetti dell'indagine e usare un ambiente separato","c":"Mettere \"mi piace\" ai post per vederne di più","d":"Condividere i risultati sui social"},"correct":"b","why":"Per non farsi scoprire e non contaminare l'indagine bisogna osservare senza interagire, da un ambiente separato da quello personale"}]},{"title":"Il Ciclo dell'Intelligence","html":"<h1 id=\"lezione-2-il-ciclo-dellintelligence\">Lezione 2 – Il Ciclo\ndell’Intelligence</h1>\n<blockquote>\n<p><em>“Senza processo, la raccolta è solo accumulo. Senza analisi, è\nsolo rumore.”</em> — Richards J. Heuer Jr., <em>Psychology of\nIntelligence Analysis</em></p>\n</blockquote>\n<hr />\n<h2 id=\"obiettivi-di-apprendimento\">Obiettivi di apprendimento</h2>\n<p>Al termine di questa lezione sarai in grado di:</p>\n<ol type=\"1\">\n<li>descrivere le fasi del <strong>Ciclo dell’Intelligence</strong> e\nspiegare il ruolo di ciascuna;</li>\n<li>redigere un corretto <strong>Requisito Informativo</strong> (RFI,\n<em>Request for Information</em>) partendo da un obiettivo\ngenerico;</li>\n<li>pianificare una raccolta strutturata usando il <strong>piano di\nraccolta</strong> (collection plan);</li>\n<li>applicare la <strong>scala dell’Ammiragliato</strong> per valutare\nin modo sistematico ogni fonte e ogni informazione;</li>\n<li>distinguere le diverse tecniche di analisi (temporale, geografica,\nrelazionale, comparativa) e sapere quando usarle;</li>\n<li>strutturare un <strong>report OSINT</strong> professionale, dal\nsommario esecutivo alle appendici;</li>\n<li>riconoscere i punti di errore più frequenti in ciascuna fase e\napplicare contromisure concrete.</li>\n</ol>\n<hr />\n<h2 id=\"perché-serve-un-ciclo\">1. Perché serve un ciclo</h2>\n<p>Nella lezione precedente abbiamo visto che un analista OSINT non è un\nsemplice ricercatore: trasforma dati grezzi in intelligence utile a\nprendere decisioni. Ma senza una struttura di processo, questa\ntrasformazione è casuale, irriproducibile e difficile da comunicare ad\naltri.</p>\n<p>Il <strong>Ciclo dell’Intelligence</strong> è il modello procedurale\nche organizza il lavoro in fasi logiche e sequenziali. Non è una formula\nmagica né una lista di passi burocratici: è uno strumento di controllo\ndella qualità, che aiuta a:</p>\n<ul>\n<li>non saltare passaggi critici sotto la pressione del tempo;</li>\n<li>sapere sempre in che fase ci si trova e cosa manca;</li>\n<li>separare la raccolta dall’analisi (confonderle produce i bias\npeggiori);</li>\n<li>produrre un risultato riproducibile e difendibile.</li>\n</ul>\n<p>Il modello è stato codificato durante la Seconda guerra mondiale nei\nservizi di intelligence angloamericani e da allora è rimasto\nsostanzialmente stabile. Le versioni variano da quattro a sei fasi a\nseconda dell’autore; in questo corso useremo il <strong>modello a cinque\nfasi</strong> adottato dalla NATO e diffuso nell’OSINT civile.</p>\n<pre><code>  ┌──────────────────────────────────────────────────────────────┐\n  │                                                              │\n  │   1. PIANIFICAZIONE     ────► 2. RACCOLTA                    │\n  │             ▲                      │                         │\n  │             │                      ▼                         │\n  │   5. DIFFUSIONE               3. ELABORAZIONE                │\n  │             ▲                      │                         │\n  │             │                      ▼                         │\n  │             └──────────────── 4. ANALISI                     │\n  │                                                              │\n  └──────────────────────────────────────────────────────────────┘\n      (il ciclo è iterativo: ogni ciclo informa il successivo)</code></pre>\n<p>Il ciclo è <strong>iterativo</strong>: le conclusioni di un ciclo\ndiventano punto di partenza per il ciclo successivo. Nuove informazioni\npossono riaprire fasi già completate. Un’indagine di qualità attraversa\nil ciclo più volte, affinando la comprensione ad ogni iterazione.</p>\n<hr />\n<h2 id=\"fase-1-pianificazione-e-direzione\">2. Fase 1 – Pianificazione e\ndirezione</h2>\n<h3 id=\"il-requisito-informativo-rfi\">2.1 Il Requisito Informativo\n(RFI)</h3>\n<p>Tutto inizia da una <strong>domanda</strong>. Nel gergo\ndell’intelligence questa domanda si chiama <strong>Requisito\nInformativo</strong> (<em>Intelligence Requirement</em>, IR) o, quando\nproviene da un cliente esterno, <strong>Request for Information</strong>\n(RFI).</p>\n<p>Un requisito ben formulato ha quattro caratteristiche:</p>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Caratteristica</th>\n<th>Significato</th>\n<th>Esempio sbagliato</th>\n<th>Esempio corretto</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Specifico</strong></td>\n<td>Riguarda un oggetto preciso</td>\n<td>“Dimmi tutto su Rossi SpA”</td>\n<td>“Chi sono i soci effettivi di Rossi SpA con quote superiori al\n5%?”</td>\n</tr>\n<tr>\n<td><strong>Verificabile</strong></td>\n<td>Ha una risposta oggettiva o misurabile</td>\n<td>“Rossi SpA è affidabile?”</td>\n<td>“Rossi SpA ha subito procedure concorsuali negli ultimi 10\nanni?”</td>\n</tr>\n<tr>\n<td><strong>Orientato alla decisione</strong></td>\n<td>Serve a scegliere un’azione</td>\n<td>“Curiosiamo un po’”</td>\n<td>“Devo decidere se firmare un contratto di fornitura da 200.000\n€”</td>\n</tr>\n<tr>\n<td><strong>Temporalmente delimitato</strong></td>\n<td>Ha una scadenza</td>\n<td>Nessuna</td>\n<td>“Risposta necessaria entro venerdì per il CdA”</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>Esercizio mentale:</strong> prima di iniziare qualunque\nindagine, scrivi la tua domanda e poi chiediti: <em>“Come farò a sapere\nquando ho risposto?”</em>. Se non riesci a rispondere, il requisito è\ntroppo vago.</p>\n</blockquote>\n<h3\nid=\"scomposizione-del-requisito-le-essential-elements-of-information-eei\">2.2\nScomposizione del requisito: le Essential Elements of Information\n(EEI)</h3>\n<p>Un requisito complesso si scompone in <strong>elementi informativi\nessenziali</strong> (EEI), cioè le singole sotto-domande a cui\nrispondere per soddisfare il requisito generale.</p>\n<p><strong>Esempio.</strong> Requisito generale: <em>“Identificare il\ngestore reale di un canale Telegram che diffonde\ndisinformazione”</em>.</p>\n<p>EEI: 1. Qual è lo username e l’ID numerico del canale? 2. Da quando è\nattivo? Con quale frequenza pubblica? 3. Ci sono altri canali o account\ncorrelati (stessa grafica, stesso stile, link incrociati)? 4. Il canale\nha un sito web, bot o gruppi affiliati? 5. L’amministratore ha commesso\nOPSEC errors (riferimenti a luogo, orario, identità, linguaggio)? 6. Ci\nsono informazioni tecniche (metadati nei media, domini registrati) che\npuntano a un’identità?</p>\n<p>Ogni EEI diventa un’unità di lavoro separata nel piano di\nraccolta.</p>\n<h3 id=\"il-piano-di-raccolta-collection-plan\">2.3 Il piano di raccolta\n(collection plan)</h3>\n<p>Il piano di raccolta è un documento semplice che risponde a: <em>“Per\nogni EEI, quali fonti cercherò? Con quale strumento? In quale\nordine?”</em>.</p>\n<p><strong>Modello base (foglio di calcolo o tabella\nMarkdown):</strong></p>\n<table style=\"width:99%;\">\n<colgroup>\n<col style=\"width: 14%\" />\n<col style=\"width: 14%\" />\n<col style=\"width: 14%\" />\n<col style=\"width: 14%\" />\n<col style=\"width: 14%\" />\n<col style=\"width: 14%\" />\n<col style=\"width: 14%\" />\n</colgroup>\n<thead>\n<tr>\n<th>EEI</th>\n<th>Priorità</th>\n<th>Fonti previste</th>\n<th>Strumenti</th>\n<th>Responsabile</th>\n<th>Scadenza</th>\n<th>Stato</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>ID numerico del canale</td>\n<td>Alta</td>\n<td>Telegram</td>\n<td>API Telegram, browser</td>\n<td>Io</td>\n<td>Dom</td>\n<td>✔</td>\n</tr>\n<tr>\n<td>Canali correlati</td>\n<td>Alta</td>\n<td>Telegram, web</td>\n<td>TGStat, Google Dork</td>\n<td>Io</td>\n<td>Mar</td>\n<td>In corso</td>\n</tr>\n<tr>\n<td>Sito web affiliato</td>\n<td>Media</td>\n<td>Web, WHOIS</td>\n<td>Whois.domaintools, DomainHistory</td>\n<td>Io</td>\n<td>Mer</td>\n<td>–</td>\n</tr>\n<tr>\n<td>Metadati immagini</td>\n<td>Bassa</td>\n<td>File scaricati dal canale</td>\n<td>ExifTool, mat2</td>\n<td>Io</td>\n<td>Gio</td>\n<td>–</td>\n</tr>\n</tbody>\n</table>\n<p>Il piano di raccolta ha tre funzioni: 1. <strong>Evitare di perdere\ntempo</strong> sulle fonti meno utili. 2. <strong>Tenere traccia di cosa\nè stato cercato</strong> (anche i risultati negativi sono dati!). 3.\n<strong>Separare la raccolta dall’analisi</strong>: si raccoglie prima,\nsi analizza dopo.</p>\n<blockquote>\n<p><strong>Errore frequente:</strong> iniziare a cercare senza un piano,\nlasciarsi trascinare dai risultati e dimenticare di verificare altre\nfonti. È il classico “tunnel effect”.</p>\n</blockquote>\n<h3 id=\"definire-le-assunzioni-di-partenza\">2.4 Definire le assunzioni\ndi partenza</h3>\n<p>Prima di raccogliere, elenca esplicitamente le <strong>assunzioni\nchiave</strong> su cui si regge la tua strategia. Ad esempio:</p>\n<ul>\n<li>“Assumo che il gestore del canale usi la stessa identità su più\npiattaforme.”</li>\n<li>“Assumo che il canale sia gestito da una sola persona, non da\nun’organizzazione.”</li>\n</ul>\n<p>Queste assunzioni potrebbero rivelarsi false. Averle scritte permette\ndi riconoscere quando la raccolta le smentisce, invece di ignorare i\nsegnali contrari (bias di conferma).</p>\n<hr />\n<h2 id=\"fase-2-raccolta\">3. Fase 2 – Raccolta</h2>\n<h3 id=\"tipologie-di-raccolta-osint\">3.1 Tipologie di raccolta\nOSINT</h3>\n<p>La raccolta si divide in due grandi modalità:</p>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Modalità</th>\n<th>Descrizione</th>\n<th>Esempio</th>\n<th>Rischio OPSEC</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Raccolta passiva</strong></td>\n<td>Si osservano fonti pubbliche senza interagire</td>\n<td>Leggere post, consultare WHOIS, vedere un profilo</td>\n<td>Basso (ma il tuo IP è loggato)</td>\n</tr>\n<tr>\n<td><strong>Raccolta attiva</strong></td>\n<td>Si interagisce con la fonte o con terze parti</td>\n<td>Inviare una richiesta FOIA, telefonare a un ufficio, iscriversi a un\nforum</td>\n<td>Alto: si rivela la propria presenza o interesse</td>\n</tr>\n</tbody>\n</table>\n<p>Nell’OSINT etico si cerca di restare nella raccolta\n<strong>passiva</strong>. La raccolta attiva è talvolta necessaria (ad\nesempio per i giornalisti che contattano i soggetti per il diritto di\nreplica) ma va pianificata con cura, soprattutto quando il soggetto è\navversariale o pericoloso.</p>\n<h3 id=\"le-categorie-di-fonti\">3.2 Le categorie di fonti</h3>\n<p>Ogni fonte si classifica in tre dimensioni:</p>\n<p><strong>1. Per livello di apertura:</strong> - Fonti\n<strong>completamente aperte</strong>: nessuna registrazione richiesta\n(Google, WHOIS, Registro Imprese). - Fonti <strong>aperte con\nregistrazione</strong>: accessibili a chiunque si iscriva (LinkedIn,\nforum, database accademici). - Fonti <strong>a pagamento</strong>:\naccessibili a chiunque le acquisti (visure camerali complete, dati\ngiudiziari, database di monitoring). - <strong>Fonti grigie</strong>:\ntecnicamente raggiungibili ma con problemi legali o etici (data breach,\ndeep web non indicizzato).</p>\n<p><strong>2. Per tipo di contenuto:</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Tipo</th>\n<th>Esempi</th>\n<th>Punti di forza</th>\n<th>Limiti</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Media</td>\n<td>Giornali, TV, blog, podcast</td>\n<td>Accessibili, indicizzati</td>\n<td>Già interpretati; possono avere bias editoriali</td>\n</tr>\n<tr>\n<td>Dati governativi</td>\n<td>ANAC, Gazzetta Ufficiale, sentenze, albi</td>\n<td>Ufficiali, affidabili</td>\n<td>Spesso lenti, frammentati, difficili da cercare</td>\n</tr>\n<tr>\n<td>Social media</td>\n<td>Facebook, X/Twitter, Instagram, Telegram</td>\n<td>Veloci, ricchi di metadati</td>\n<td>Rumorosi, manipolabili, volatili</td>\n</tr>\n<tr>\n<td>Dati tecnici</td>\n<td>DNS, WHOIS, certificati TLS, BGP, shodan</td>\n<td>Precisi, difficili da falsificare</td>\n<td>Richiedono competenze tecniche</td>\n</tr>\n<tr>\n<td>Dati commerciali</td>\n<td>Registro Imprese, Cerved, CompanyHouse</td>\n<td>Strutturati, aggiornati</td>\n<td>A pagamento o con accesso limitato</td>\n</tr>\n<tr>\n<td>Accademici</td>\n<td>Google Scholar, arxiv, PubMed</td>\n<td>Peer-reviewed, citabili</td>\n<td>Non sempre aggiornati su temi attuali</td>\n</tr>\n<tr>\n<td>Geospaziali</td>\n<td>Google Earth, Sentinel Hub, HERE</td>\n<td>Verificabili, comparabili nel tempo</td>\n<td>Risoluzione limitata; date non sempre precise</td>\n</tr>\n</tbody>\n</table>\n<p><strong>3. Per freschezza:</strong> - <strong>In tempo\nreale:</strong> social, news aggregator, feed RSS. -\n<strong>Storici:</strong> Wayback Machine, archive.today, Google Cache.\n- <strong>Periodici:</strong> aggiornamenti dei registri, bilanci\nannuali.</p>\n<h3 id=\"documentare-la-raccolta\">3.3 Documentare la raccolta</h3>\n<p>Ogni elemento raccolto va documentato <strong>immediatamente e con\nprecisione</strong>. La documentazione comprende:</p>\n<ol type=\"1\">\n<li><strong>URL originale</strong> (può sparire).</li>\n<li><strong>Data e ora di accesso</strong> (in UTC: evita ambiguità di\nfuso orario).</li>\n<li><strong>Screenshot</strong> con la barra degli indirizzi visibile\n(dimostra l’URL).</li>\n<li><strong>Copia archiviata</strong> su archive.today o Wayback Machine\n(immutabile).</li>\n<li><strong>Hash SHA-256 dello screenshot</strong> (integrità della\nprova).</li>\n<li><strong>Note contestuali</strong>: in quale ricerca hai trovato\nquesto dato? A quale EEI risponde?</li>\n</ol>\n<p>Lo script <code>diario_osint.py</code> della lezione precedente\nautomatizza questi passaggi. Ne vedremo una versione più avanzata nella\nsezione Python.</p>\n<blockquote>\n<p><strong>Risultati negativi</strong>: documenta anche quando una\nricerca non trova nulla! Un risultato negativo è un dato: se una persona\nnon appare su alcun social network, questo dice qualcosa (OPSEC\nintenzionale, profilo falso, generazione analogica, ecc.).</p>\n</blockquote>\n<h3 id=\"il-problema-della-volatilità\">3.4 Il problema della\nvolatilità</h3>\n<p>Le fonti OSINT sono <strong>volatili</strong>: post cancellati,\nprofili rimossi, siti offline, Wayback Machine che non ha indicizzato\nuna pagina. Questo rende la tempestività della documentazione\ncritica.</p>\n<p><strong>Strategie contro la volatilità:</strong> - Archivia\n<strong>subito</strong> ogni pagina su archive.today. - Usa\n<strong>Hunchly</strong> (vedi tabella strumenti) per catturare\nautomaticamente ogni pagina visitata durante l’indagine. - Per i video\n(YouTube, TikTok, Telegram), usa <strong>yt-dlp</strong> per scaricarli\nimmediatamente. - Per i post dei social, fai screenshot che includano\nmetadati visibili (data, username, URL). - Per i file (PDF, DOCX,\nimmagini), controlla i <strong>metadati prima di eliminarli o\nspostarli</strong>.</p>\n<h3 id=\"tool-di-raccolta-essenziali\">3.5 Tool di raccolta\nessenziali</h3>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Strumento</th>\n<th>Categoria</th>\n<th>Uso principale</th>\n<th>Gratuito?</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Wayback Machine (archive.org)</td>\n<td>Archivio</td>\n<td>Versioni storiche di qualsiasi pagina</td>\n<td>Sì</td>\n</tr>\n<tr>\n<td>archive.today</td>\n<td>Archivio</td>\n<td>Archiviazione on-demand, immutabile</td>\n<td>Sì</td>\n</tr>\n<tr>\n<td>Hunchly</td>\n<td>Estensione browser</td>\n<td>Cattura automatica di ogni pagina visitata</td>\n<td>No (prova gratuita)</td>\n</tr>\n<tr>\n<td>yt-dlp</td>\n<td>CLI</td>\n<td>Download di video da 1.000+ siti</td>\n<td>Sì</td>\n</tr>\n<tr>\n<td>ExifTool</td>\n<td>CLI</td>\n<td>Lettura e scrittura di metadati di file</td>\n<td>Sì</td>\n</tr>\n<tr>\n<td>Shodan</td>\n<td>Motore di ricerca</td>\n<td>Dispositivi connessi a Internet, header HTTP, certificati</td>\n<td>Sì (piano base)</td>\n</tr>\n<tr>\n<td>Censys</td>\n<td>Motore di ricerca</td>\n<td>Certificati TLS, host, domini</td>\n<td>Sì (piano base)</td>\n</tr>\n<tr>\n<td>DNSdumpster</td>\n<td>Web</td>\n<td>Record DNS, sottodomini, MX</td>\n<td>Sì</td>\n</tr>\n<tr>\n<td>ViewDNS.info</td>\n<td>Web</td>\n<td>WHOIS storico, IP, reverse DNS</td>\n<td>Sì</td>\n</tr>\n<tr>\n<td>Spiderfoot</td>\n<td>Framework</td>\n<td>Raccolta automatizzata multi-fonte</td>\n<td>Sì (open source)</td>\n</tr>\n<tr>\n<td>Maltego CE</td>\n<td>Grafo</td>\n<td>Visualizzazione e raccolta di entità correlate</td>\n<td>Sì (edizione community)</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2 id=\"fase-3-elaborazione\">4. Fase 3 – Elaborazione</h2>\n<h3 id=\"cosè-lelaborazione\">4.1 Cos’è l’elaborazione</h3>\n<p>L’elaborazione è la fase <strong>tra</strong> la raccolta grezza e\nl’analisi vera e propria. Il suo scopo è rendere i dati raccolti\n<strong>leggibili, confrontabili e analizzabili</strong>. In un’agenzia\ndi intelligence professionale questa fase include la traduzione, la\ntrascrizione, la decrittazione e la normalizzazione dei dati. Nell’OSINT\n“civile” comprende:</p>\n<ol type=\"1\">\n<li><strong>Organizzazione</strong>: raccogliere tutto in un unico\nambiente (foglio di calcolo, database, strumento di note come\nObsidian).</li>\n<li><strong>Normalizzazione</strong>: portare i dati in un formato\nomogeneo (es. tutte le date in ISO 8601: <code>YYYY-MM-DD</code>; tutti\ni numeri di telefono in formato internazionale <code>+39…</code>).</li>\n<li><strong>Deduplicazione</strong>: rimuovere duplicati e capire quali\nfonti riportano lo stesso dato (report circolare).</li>\n<li><strong>Arricchimento</strong>: aggiungere contesto a ciascun dato\n(es. convertire coordinate GPS in indirizzo; tradurre un testo;\ngeolocalizzare un IP).</li>\n<li><strong>Collegamento</strong>: creare le prime relazioni tra entità\n(persona A → username B → e-mail C → dominio D).</li>\n</ol>\n<h3 id=\"entità-e-relazioni-il-modello-e-r-per-losint\">4.2 Entità e\nrelazioni: il modello E-R per l’OSINT</h3>\n<p>Un modo efficace per visualizzare i dati elaborati è il\n<strong>modello entità-relazioni</strong> (E-R), semplificato:</p>\n<ul>\n<li><strong>Entità</strong>: gli oggetti dell’indagine (persona,\nazienda, username, e-mail, numero di telefono, dominio, indirizzo IP,\nluogo, evento, documento).</li>\n<li><strong>Relazioni</strong>: i legami tra entità (“usa”, “è\nproprietario di”, “ha pubblicato”, “è apparso in”, “ha risposto\na”).</li>\n<li><strong>Attributi</strong>: le proprietà di ciascuna entità (data di\ncreazione, lingua, frequenza di attività, geolocalizzazione).</li>\n</ul>\n<pre><code>  [Persona: Mario R.] ──usa──► [Username: mario_r_87]\n          │                           │\n        ha_profilo              è_iscritto_a\n          │                           │\n          ▼                           ▼\n  [LinkedIn: /in/mario-r]    [Forum: motoristiforum.it]\n          │                           │\n     telefono_indicato           post_del_2021\n          │                           │\n          ▼                           ▼\n  [+39 333 xxxxxxx]       [Città menzionata: Torino]</code></pre>\n<p>Strumenti come <strong>Maltego</strong>, <strong>draw.io</strong> o\nanche un semplice foglio di carta ti permettono di costruire e mantenere\naggiornato questo grafo durante l’indagine.</p>\n<h3 id=\"normalizzazione-delle-date-e-dei-fusi-orari\">4.3 Normalizzazione\ndelle date e dei fusi orari</h3>\n<p>Un errore banale ma frequente: non tenere conto dei fusi orari quando\nsi analizzano timestamp provenienti da piattaforme diverse.</p>\n<ul>\n<li>I social network mostrano l’ora <strong>nel fuso locale\ndell’utente</strong> (es. Instagram) oppure in UTC (es. Twitter/X nelle\nesportazioni API).</li>\n<li>I metadata EXIF delle foto registrano l’ora <strong>del\ndispositivo</strong>, che può essere scorretta o manipolata.</li>\n<li>I log di sistema e le blockchain usano generalmente <strong>Unix\ntimestamp</strong> (secondi dall’1/1/1970 UTC).</li>\n</ul>\n<p><strong>Regola:</strong> converti sempre tutto in\n<strong>UTC</strong> e annotalo. Poi, se necessario, converti nel fuso\nlocale del soggetto per capire l’ora locale in cui è avvenuto\nqualcosa.</p>\n<pre class=\"python\"><code># Conversione di timestamp tra fusi orari (Python stdlib)\nfrom datetime import datetime, timezone\nimport zoneinfo  # Python 3.9+\n\n# Timestamp UTC da una piattaforma\nts_utc = datetime(2026, 3, 15, 14, 32, 0, tzinfo=timezone.utc)\n\n# Converti nel fuso del soggetto (es. CET/CEST, Roma)\nfuso_roma = zoneinfo.ZoneInfo(&quot;Europe/Rome&quot;)\nts_locale = ts_utc.astimezone(fuso_roma)\n\nprint(f&quot;UTC:   {ts_utc.isoformat()}&quot;)\nprint(f&quot;Roma:  {ts_locale.isoformat()}&quot;)\n# UTC:   2026-03-15T14:32:00+00:00\n# Roma:  2026-03-15T15:32:00+01:00</code></pre>\n<hr />\n<h2 id=\"fase-4-analisi\">5. Fase 4 – Analisi</h2>\n<h3 id=\"cosa-significa-analizzare\">5.1 Cosa significa analizzare</h3>\n<p>L’analisi è il cuore del ciclo: è il momento in cui si\n<strong>risponde al requisito informativo</strong>. Non significa\ntrovare “la prova” come in un thriller; significa valutare le prove\ndisponibili, incrociarle, assegnare loro un grado di credibilità e\ntrarre conclusioni espresse con un grado di confidenza.</p>\n<p>L’analisi si svolge sempre su due livelli: - <strong>Primo\nlivello</strong>: cosa dicono i singoli dati? - <strong>Secondo\nlivello</strong>: cosa dicono i dati <em>nel loro insieme</em>? Quali\npattern emergono? Cosa manca?</p>\n<h3 id=\"tecniche-di-analisi\">5.2 Tecniche di analisi</h3>\n<h4 id=\"analisi-temporale\">5.2.1 Analisi temporale</h4>\n<p>L’analisi temporale studia <strong>quando</strong> si verifica\nqualcosa e cerca pattern nel tempo.</p>\n<p>Tipiche domande: - A che ora del giorno pubblica l’account? (Può\nsuggerire il fuso orario del gestore.) - L’attività è aumentata in\ncoincidenza con un evento reale? - C’è un pattern settimanale? (Es. solo\nnei giorni feriali: potrebbe essere un bot aziendale.) - L’account ha\navuto periodi di inattività? Quando e perché?</p>\n<p><strong>Strumento pratico:</strong> una linea del tempo (timeline).\nPuò essere disegnata a mano, su un foglio di calcolo (grafico a\ndispersione), o con strumenti dedicati come <strong>TimelineJS</strong>,\n<strong>Aeon Timeline</strong> o semplicemente\n<strong>Maltego</strong>.</p>\n<pre><code>Gen 2024: prima attività rilevata (post su forum)\nMar 2024: creazione account Telegram\nMag 2024: picco di attività (100+ post/settimana)   ← cosa è successo?\nLug 2024: silenzio di 3 settimane                   ← vacanze? arresto?\nAgo 2024: ripresa con nuovo stile di scrittura       ← cambio di gestore?\nOtt 2024: creazione canale YouTube (stesso avatar)</code></pre>\n<h4 id=\"analisi-geografica\">5.2.2 Analisi geografica</h4>\n<p>L’analisi geografica studia <strong>dove</strong> si trovano o si\nsono trovati i soggetti o gli eventi.</p>\n<p>Fonti di dati geografici: - <strong>Metadati EXIF</strong> delle foto\n(coordinate GPS integrate dallo smartphone). - <strong>Geolocalizzazione\nvisiva</strong>: riconoscere cartelli stradali, edifici, vegetazione,\narchitettura, montagne sullo sfondo (lo studieremo nella lezione sulla\nricerca inversa d’immagini). - <strong>IP geolocation</strong>:\napprossimativa (città/regione), non affidabile per gli indirizzi\nprecisi. - <strong>Check-in e tag</strong>: luoghi esplicitamente\nindicati nei post. - <strong>Metadati di video</strong>: alcuni\ndispositivi incorporano le coordinate nel file MP4. - <strong>Segnali\nADS-B e AIS</strong>: per aerei e navi (lezione 11).</p>\n<blockquote>\n<p><strong>Avvertenza sulla geolocalizzazione degli IP:</strong> un IP\npunta al provider o al punto di uscita VPN, non alla casa dell’utente.\nNon usarla mai come prova di localizzazione precisa.</p>\n</blockquote>\n<h4 id=\"analisi-relazionale-network-analysis\">5.2.3 Analisi relazionale\n(network analysis)</h4>\n<p>L’analisi relazionale studia <strong>chi conosce chi</strong> e le\nstrutture di rete tra entità. È utile per: - identificare l’account\ncentrale in una rete di disinformazione; - trovare connessioni tra\naziende o persone che sembrano indipendenti; - capire chi ha accesso a\nquale risorsa (documenti, gruppi, forum).</p>\n<p>Concetti base: - <strong>Nodo</strong>: un’entità (persona, account,\nazienda). - <strong>Arco</strong>: una relazione (seguono, commentano,\ncondividono, hanno lavorato insieme). - <strong>Centralità</strong>:\nmisura di quanto un nodo è “importante” nella rete (degree centrality,\nbetweenness, etc.). - <strong>Cluster</strong>: gruppi di nodi molto\nconnessi tra loro.</p>\n<p>Per indagini di piccole dimensioni si può disegnare il grafo a mano.\nPer reti più grandi, strumenti come <strong>Gephi</strong> (open source)\no il modulo Python <strong>NetworkX</strong> permettono calcoli e\nvisualizzazioni avanzate.</p>\n<h4 id=\"analisi-linguistica-e-stilometrica\">5.2.4 Analisi linguistica e\nstilometrica</h4>\n<p>L’analisi del testo può rivelare informazioni sull’autore: -\n<strong>Lingua madre</strong>: errori ricorrenti, strutture sintattiche\nanomale. - <strong>Idioletto</strong>: parole preferite, punteggiatura,\nabbreviazioni, emoji (la “firma” di uno scrittore). -\n<strong>Registro</strong>: formale/informale, tecnico/generico. -\n<strong>Orari di pubblicazione</strong> in relazione al fuso orario\nsuggerito dalla lingua. - <strong>Stilometria</strong>: confronto\nquantitativo dello stile con testi di autori noti.</p>\n<p>Strumenti: <strong>Linguistic Inquiry and Word Count</strong> (LIWC),\n<strong>JGAAP</strong> (Java Graphical Authorship Attribution Program),\nanalisi manuale.</p>\n<blockquote>\n<p><strong>Attenzione:</strong> la stilometria è un indizio, non una\nprova. Un autore esperto può cambiare stile, usare strumenti di\nparafrasi o pubblicare in una lingua non sua.</p>\n</blockquote>\n<h4 id=\"analisi-comparativa\">5.2.5 Analisi comparativa</h4>\n<p>Confrontare due o più entità per trovare similitudini e differenze: -\nDue avatar sono la stessa immagine? (hash dell’immagine, ricerca\ninversa) - Due account usano le stesse frasi ricorrenti? - Due aziende\nhanno lo stesso indirizzo registrato? - Due documenti hanno lo stesso\nautore nei metadati?</p>\n<h4 id=\"analisi-delle-anomalie\">5.2.6 Analisi delle anomalie</h4>\n<p>Cercare ciò che non torna, ciò che è assente o incongruente: - Un\naccount di “giovane universitario” che scrive solo tra le 9 e le 17 nei\ngiorni feriali. - Un’azienda con fatturato milionario e un solo\ndipendente. - Un profilo con 50.000 follower e post che ricevono sempre\n0 commenti. - Un documento PDF la cui data di creazione è precedente\nalla data degli eventi che descrive.</p>\n<h3 id=\"valutare-le-prove-la-scala-dellammiragliato-applicata\">5.3\nValutare le prove: la scala dell’Ammiragliato applicata</h3>\n<p>Abbiamo introdotto la scala A–F / 1–6 nella lezione precedente.\nVediamo come applicarla sistematicamente durante l’analisi.</p>\n<p><strong>Valutare la fonte (A–F):</strong></p>\n<p>Per classificare una fonte, chiediti: 1. Ho già usato questa fonte in\npassato? È risultata accurata? 2. La fonte ha un interesse a mentire o a\nesagerare? 3. La fonte ha accesso diretto all’informazione o la riporta\nda altri? 4. La fonte è identificata o anonima?</p>\n<table>\n<thead>\n<tr>\n<th>Tipo di fonte</th>\n<th>Classificazione tipica</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Registro delle Imprese, Gazzetta Ufficiale</td>\n<td>A o B</td>\n</tr>\n<tr>\n<td>Testata giornalistica affidabile con byline</td>\n<td>B o C</td>\n</tr>\n<tr>\n<td>Blog o sito di parte con track record buono</td>\n<td>C o D</td>\n</tr>\n<tr>\n<td>Account social verificato con track record</td>\n<td>B o C</td>\n</tr>\n<tr>\n<td>Account anonimo senza storia nota</td>\n<td>E o F</td>\n</tr>\n<tr>\n<td>Fonte umana non corroborata</td>\n<td>D o F</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Valutare l’informazione (1–6):</strong></p>\n<table>\n<thead>\n<tr>\n<th>Situazione</th>\n<th>Classificazione</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Confermata da tre fonti indipendenti con accesso diretto</td>\n<td>1</td>\n</tr>\n<tr>\n<td>Confermata da una fonte di livello A e coerente con il contesto</td>\n<td>2</td>\n</tr>\n<tr>\n<td>Una sola fonte affidabile, nessuna smentita</td>\n<td>3</td>\n</tr>\n<tr>\n<td>Fonte dubbia, nessuna conferma</td>\n<td>4</td>\n</tr>\n<tr>\n<td>Contraddetta da fonti più affidabili</td>\n<td>5</td>\n</tr>\n<tr>\n<td>Non valutabile (non si riesce a verificare né a escludere)</td>\n<td>6</td>\n</tr>\n</tbody>\n</table>\n<p><strong>La trappola del report circolare</strong>: come detto nella\nlezione 1, dieci fonti che riportano la stessa notizia non sono dieci\nconferme. Cerca la fonte primaria; se tutte derivano da un’unica fonte\noriginale, l’informazione è al massimo <strong>3</strong> o\n<strong>4</strong>, non <strong>1</strong>.</p>\n<h3 id=\"lanalisi-delle-ipotesi-concorrenti-ach-approfondimento\">5.4\nL’Analisi delle Ipotesi Concorrenti (ACH): approfondimento</h3>\n<p>Nella lezione precedente hai visto il metodo ACH in sintesi.\nApproffondiamo il passo più critico: <strong>cosa rende una prova\ndiagnostica?</strong></p>\n<p>Una prova è <strong>diagnostica</strong> se la sua presenza (o\nassenza) ha probabilità molto diverse sotto le diverse ipotesi. In altre\nparole, distingue tra le ipotesi.</p>\n<ul>\n<li>“L’account pubblica in italiano” → coerente con H1 (italiano), H2\n(italiano residente all’estero), H3 (non italiano che usa il\ntraduttore). <strong>Non diagnostica.</strong></li>\n<li>“L’account ha fatto riferimento a ‘bollette del gas’ e\n‘riscaldamento autonomo’” → molto più probabile in un italiano residente\nin Italia. <strong>Moderatamente diagnostica.</strong></li>\n<li>“I metadati delle foto mostrano GPS in latitudine 45.46, longitudine\n9.19 (Milano)” → fortemente diagnostica. <strong>Alta\ndiagnositicità.</strong></li>\n</ul>\n<p>Concentra le tue risorse di verifica sulle prove ad alta\ndiagnosticità. Le prove che “ci stanno bene” con tutte le ipotesi sono\nun conforto psicologico ma non fanno avanzare l’analisi.</p>\n<h3 id=\"livelli-di-confidenza-e-linguaggio-probabilistico-revisione\">5.5\nLivelli di confidenza e linguaggio probabilistico: revisione</h3>\n<p>Richiamiamo e integriamo la tabella della lezione 1, aggiungendo la\ndistinzione tra <strong>confidenza nell’analisi</strong> (quanto buone\nsono le prove) e <strong>probabilità dell’evento</strong> (quanto è\nprobabile la conclusione):</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Probabilità dell’evento</th>\n<th>Confidenza nell’analisi</th>\n<th>Come si scrive nel report</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Quasi certa (&gt;95%)</td>\n<td>Alta</td>\n<td>“È quasi certo (confidenza alta) che…”</td>\n</tr>\n<tr>\n<td>Molto probabile (80–90%)</td>\n<td>Alta</td>\n<td>“È altamente probabile (confidenza alta) che…”</td>\n</tr>\n<tr>\n<td>Probabile (60–75%)</td>\n<td>Media</td>\n<td>“È probabile (confidenza media) che…”</td>\n</tr>\n<tr>\n<td>Possibile (40–50%)</td>\n<td>Bassa</td>\n<td>“È possibile (confidenza bassa) che…”</td>\n</tr>\n<tr>\n<td>Improbabile (&lt;35%)</td>\n<td>Alta</td>\n<td>“È improbabile (confidenza alta) che…”</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>Regola d’oro:</strong> non usare mai “certamente” senza\n“confidenza alta” e prove solide. Non usare mai “è impossibile”.\nL’analista esprime gradi di probabilità, non certezze assolute.</p>\n</blockquote>\n<hr />\n<h2 id=\"fase-5-diffusione\">6. Fase 5 – Diffusione</h2>\n<h3 id=\"a-chi-serve-il-report\">6.1 A chi serve il report</h3>\n<p>Il <strong>report</strong> è il prodotto finale dell’intelligence: il\ndocumento (o la presentazione) che consegna le conclusioni al\ncommittente (cliente, redazione, team di sicurezza, magistratura, ecc.).\nIl report deve essere calibrato sul pubblico:</p>\n<ul>\n<li>Un <strong>manager</strong> vuole il sommario esecutivo e le\nraccomandazioni, non i dettagli tecnici.</li>\n<li>Un <strong>analista tecnico</strong> vuole le prove complete, le\nquery usate e il ragionamento.</li>\n<li>Un <strong>giudice o un avvocato</strong> vuole la catena di\ncustodia delle prove, le fonti citate in modo riproducibile e il\nmetodo.</li>\n<li>Un <strong>giornalista</strong> vuole i fatti verificati, le fonti\ncitabili e la distinzione chiara tra fatti e interpretazioni.</li>\n</ul>\n<h3 id=\"struttura-di-un-report-osint\">6.2 Struttura di un report\nOSINT</h3>\n<p>Un report professionale segue questa struttura:</p>\n<hr />\n<p><strong>REPORT OSINT – [titolo descrittivo] – [data]</strong>\n<strong>Classificazione:</strong> [es. Riservato / Solo per uso interno\n/ Pubblico] <strong>Autore:</strong> [nome o codice analista]\n<strong>Versione:</strong> 1.0</p>\n<hr />\n<p><strong>1. Sommario esecutivo</strong> (max 1 pagina) - Requisito\ninformativo originale. - Principali conclusioni (3–5 punti). - Grado di\nconfidenza complessivo. - Raccomandazioni operative, se richieste.</p>\n<p><strong>2. Metodologia</strong> - Periodo di indagine. - Fonti\nconsultate (categorie, non necessariamente i link completi in questa\nsezione). - Strumenti usati. - Limitazioni del metodo (cosa non è stato\npossibile verificare e perché).</p>\n<p><strong>3. Analisi</strong> - Presentazione strutturata delle prove\nper EEI. - Per ogni affermazione: classificazione della fonte (A–F) e\ncredibilità dell’informazione (1–6). - Separazione netta tra fatti\nosservati, inferenze e ipotesi. - Linguaggio probabilistico coerente. -\nIpotesi alternative considerate e perché sono state ritenute meno\nprobabili.</p>\n<p><strong>4. Conclusioni</strong> - Risposta al requisito informativo.\n- Grado di confidenza complessivo e ragioni. - Elementi che potrebbero\ncambiare la valutazione (indicatori da monitorare).</p>\n<p><strong>5. Appendici</strong> - Screenshot archiviati (con hash). -\nLink e URL completi. - Diario d’indagine (se richiesto). - Tabelle di\ndati grezzi.</p>\n<hr />\n<h3 id=\"cosa-non-scrivere-in-un-report\">6.3 Cosa non scrivere in un\nreport</h3>\n<ul>\n<li><strong>Non scrivere mai “so che”</strong>: usa “i dati indicano”,\n“è probabile”, “le prove suggeriscono”.</li>\n<li><strong>Non omettere le ipotesi alternative</strong>: anche se le\nhai escluse, citarle dimostra rigore.</li>\n<li><strong>Non includere informazioni irrilevanti</strong>: ogni dato\nnel report deve rispondere al requisito o spiegare il metodo.</li>\n<li><strong>Non confondere la tua opinione con l’analisi</strong>: se\naggiungi un giudizio personale, marcalo esplicitamente come tale.</li>\n<li><strong>Non menzionare dati personali non necessari</strong>:\nrispetta il principio di minimizzazione del GDPR.</li>\n<li><strong>Non includere prove non verificate</strong>: meglio scrivere\n“non è stato possibile verificare X” che presentare un dato dubbio come\ncerto.</li>\n</ul>\n<h3 id=\"il-feedback-chiudere-il-ciclo\">6.4 Il feedback: chiudere il\nciclo</h3>\n<p>Dopo la diffusione, il committente risponde con un\n<strong>feedback</strong>: - Le informazioni sono state utili? Hanno\nrisposto al requisito? - Sono emerse nuove domande che richiedono un\naltro ciclo? - Le conclusioni sono state confermate o smentite da eventi\nsuccessivi?</p>\n<p>Il feedback è l’unico modo per migliorare come analista. Tieni\ntraccia delle tue previsioni e di quante si sono rivelate corrette: è la\n<strong>calibrazione</strong>, la capacità di far corrispondere la tua\nconfidenza alla frequenza reale di successo.</p>\n<hr />\n<h2 id=\"errori-frequenti-in-ogni-fase\">7. Errori frequenti in ogni\nfase</h2>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Fase</th>\n<th>Errore tipico</th>\n<th>Conseguenza</th>\n<th>Contromisura</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Pianificazione</td>\n<td>Requisito vago o framing sbagliato</td>\n<td>Si risponde alla domanda sbagliata</td>\n<td>Riformula il requisito in modo neutro e misurabile</td>\n</tr>\n<tr>\n<td>Pianificazione</td>\n<td>Nessun piano di raccolta</td>\n<td>Si perde tempo, si dimenticano fonti</td>\n<td>Scrivi il collection plan prima di aprire il browser</td>\n</tr>\n<tr>\n<td>Raccolta</td>\n<td>Non documentare i risultati negativi</td>\n<td>Si perde un dato importante</td>\n<td>Annota sempre “cercato X su Y: nessun risultato”</td>\n</tr>\n<tr>\n<td>Raccolta</td>\n<td>Non archiviare subito le pagine</td>\n<td>La prova sparisce</td>\n<td>Archivia ogni pagina su archive.today appena la trovi</td>\n</tr>\n<tr>\n<td>Raccolta</td>\n<td>Interagire con il soggetto</td>\n<td>Si rivela la propria identità</td>\n<td>Raccolta passiva per default; l’attiva richiede pianificazione</td>\n</tr>\n<tr>\n<td>Elaborazione</td>\n<td>Non normalizzare i dati</td>\n<td>Confronti errati (fusi orari, formati)</td>\n<td>Stabilisci un formato standard (UTC, E.164, ISO 8601)</td>\n</tr>\n<tr>\n<td>Elaborazione</td>\n<td>Non deduplicare</td>\n<td>Report circolare</td>\n<td>Risali sempre alla fonte primaria</td>\n</tr>\n<tr>\n<td>Analisi</td>\n<td>Mescolare raccolta e analisi</td>\n<td>Bias di conferma durante la raccolta</td>\n<td>Separa nettamente le due fasi</td>\n</tr>\n<tr>\n<td>Analisi</td>\n<td>Non esprimere l’incertezza</td>\n<td>Il committente è ingannato sulla solidità delle conclusioni</td>\n<td>Usa sempre la scala probabilistica</td>\n</tr>\n<tr>\n<td>Diffusione</td>\n<td>Report senza limitazioni</td>\n<td>Il committente non sa dove le conclusioni sono deboli</td>\n<td>Includi sempre una sezione “limitazioni del metodo”</td>\n</tr>\n<tr>\n<td>Diffusione</td>\n<td>Non chiedere feedback</td>\n<td>Non si migliora</td>\n<td>Richiedi esplicitamente un follow-up</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2 id=\"python-per-il-ciclo-un-mini-framework-di-raccolta\">8. Python per\nil ciclo: un mini-framework di raccolta</h2>\n<p>Nella lezione su Python approfondiremo tecniche avanzate. Qui vediamo\nun esempio pratico direttamente legato al ciclo: uno script che\nstruttura il piano di raccolta e aggiorna automaticamente lo stato delle\nEEI.</p>\n<pre class=\"python\"><code>#!/usr/bin/env python3\n&quot;&quot;&quot;\ncollection_plan.py – Gestione del piano di raccolta OSINT.\nSalva le EEI in un file JSON e aggiorna il loro stato.\nUso: python3 collection_plan.py\n&quot;&quot;&quot;\nimport json\nimport os\nfrom datetime import datetime, timezone\n\nFILE_PIANO = &quot;collection_plan.json&quot;\n\n\ndef carica_piano() -&gt; list[dict]:\n    &quot;&quot;&quot;Carica il piano di raccolta dal file JSON.&quot;&quot;&quot;\n    if os.path.exists(FILE_PIANO):\n        with open(FILE_PIANO, encoding=&quot;utf-8&quot;) as f:\n            return json.load(f)\n    return []\n\n\ndef salva_piano(piano: list[dict]) -&gt; None:\n    &quot;&quot;&quot;Salva il piano di raccolta nel file JSON.&quot;&quot;&quot;\n    with open(FILE_PIANO, &quot;w&quot;, encoding=&quot;utf-8&quot;) as f:\n        json.dump(piano, f, ensure_ascii=False, indent=2)\n\n\ndef aggiungi_eei(piano: list[dict]) -&gt; None:\n    &quot;&quot;&quot;Aggiunge una nuova EEI al piano.&quot;&quot;&quot;\n    eei = {\n        &quot;id&quot;: len(piano) + 1,\n        &quot;domanda&quot;: input(&quot;Domanda (EEI): &quot;),\n        &quot;priorita&quot;: input(&quot;Priorità (alta/media/bassa): &quot;),\n        &quot;fonti_previste&quot;: input(&quot;Fonti previste (es. Telegram, WHOIS): &quot;),\n        &quot;strumenti&quot;: input(&quot;Strumenti (es. TGStat, dnsdumpster): &quot;),\n        &quot;scadenza&quot;: input(&quot;Scadenza (YYYY-MM-DD): &quot;),\n        &quot;stato&quot;: &quot;in attesa&quot;,\n        &quot;note&quot;: &quot;&quot;,\n        &quot;creato_il&quot;: datetime.now(timezone.utc).isoformat(timespec=&quot;seconds&quot;),\n    }\n    piano.append(eei)\n\n\ndef aggiorna_stato(piano: list[dict]) -&gt; None:\n    &quot;&quot;&quot;Aggiorna lo stato di una EEI esistente.&quot;&quot;&quot;\n    if not piano:\n        print(&quot;Nessuna EEI nel piano.&quot;); return\n    mostra_piano(piano)\n    try:\n        idx = int(input(&quot;Numero EEI da aggiornare: &quot;)) - 1\n    except ValueError:\n        print(&quot;Numero non valido.&quot;); return\n    if not 0 &lt;= idx &lt; len(piano):\n        print(&quot;EEI non trovata.&quot;); return\n    piano[idx][&quot;stato&quot;] = input(\n        f&quot;Nuovo stato (attuale: {piano[idx][&#39;stato&#39;]}): &quot;\n    )\n    piano[idx][&quot;note&quot;] = input(&quot;Note aggiuntive: &quot;)\n\n\ndef mostra_piano(piano: list[dict]) -&gt; None:\n    &quot;&quot;&quot;Stampa il piano in forma tabellare.&quot;&quot;&quot;\n    STATI = {&quot;in attesa&quot;: &quot;⏳&quot;, &quot;in corso&quot;: &quot;🔄&quot;, &quot;completato&quot;: &quot;✔&quot;,\n             &quot;negativo&quot;: &quot;✗&quot;, &quot;bloccato&quot;: &quot;🚫&quot;}\n    print(f&quot;\\n{&#39;#&#39;:&gt;3} {&#39;EEI&#39;:&lt;40} {&#39;P&#39;:&gt;5} {&#39;Stato&#39;:&lt;12}&quot;)\n    print(&quot;-&quot; * 65)\n    for eei in piano:\n        icona = STATI.get(eei[&quot;stato&quot;], &quot;?&quot;)\n        print(f&quot;{eei[&#39;id&#39;]:&gt;3} {eei[&#39;domanda&#39;][:40]:&lt;40} &quot;\n              f&quot;{eei[&#39;priorita&#39;][:5]:&gt;5} {icona} {eei[&#39;stato&#39;]}&quot;)\n    print()\n\n\ndef menu() -&gt; None:\n    &quot;&quot;&quot;Menu principale.&quot;&quot;&quot;\n    piano = carica_piano()\n    while True:\n        print(&quot;\\n=== Piano di raccolta OSINT ===&quot;)\n        print(&quot;1) Aggiungi EEI  2) Aggiorna stato  3) Mostra piano  4) Esci&quot;)\n        scelta = input(&quot;Scelta: &quot;).strip()\n        if scelta == &quot;1&quot;:\n            aggiungi_eei(piano)\n            salva_piano(piano)\n            print(&quot;✔ EEI aggiunta.&quot;)\n        elif scelta == &quot;2&quot;:\n            aggiorna_stato(piano)\n            salva_piano(piano)\n            print(&quot;✔ Stato aggiornato.&quot;)\n        elif scelta == &quot;3&quot;:\n            mostra_piano(piano)\n        elif scelta == &quot;4&quot;:\n            print(&quot;Piano salvato. Arrivederci.&quot;); break\n\n\nif __name__ == &quot;__main__&quot;:\n    menu()</code></pre>\n<blockquote>\n<p><strong>Come usarlo.</strong> Avvia lo script all’inizio di ogni\nindagine. Aggiungi le EEI durante la pianificazione, aggiorna lo stato\nman mano che raccogli. Alla fine avrai un registro completo di cosa hai\ncercato, con quale strumento e con quale risultato.</p>\n</blockquote>\n<hr />\n<h2 id=\"box-legale-ed-etico\">⚖️ Box legale ed etico</h2>\n<h3 id=\"il-ciclo-e-la-legalità-ogni-fase-ha-i-suoi-vincoli\">Il Ciclo e\nla legalità: ogni fase ha i suoi vincoli</h3>\n<p><strong>Pianificazione.</strong> Non è illegale pianificare\nun’indagine, ma definire a priori un obiettivo illecito (es. “scoprire\ntutto sull’ex coniuge per stalking”) rende le fasi successive penalmente\nrilevanti.</p>\n<p><strong>Raccolta.</strong> Come abbiamo visto, la raccolta è lecita\nquando le fonti sono pubblicamente accessibili e non si violano sistemi\nprotetti. Attenzione a: - <strong>Scraping aggressivo</strong>: colpire\nun server con migliaia di richieste automatiche può configurare il reato\ndi <em>accesso abusivo</em> (art. 615-ter c.p.) o causare responsabilità\ncivile per danni. Usa sempre rate limiting (vedi lezione Python). -\n<strong>Download di materiale protetto da copyright</strong>: le\ninformazioni sono libere, i testi e le immagini no. Fai screenshot per\nuso proprio e cita le fonti nel report. - <strong>Infiltrazione in\ngruppi privati</strong>: iscriversi a un gruppo chiuso con un account\nfalso per raccogliere informazioni è in una zona grigia etica e può\navere rilievo penale (art. 494 c.p. se si impersona qualcuno di\nreale).</p>\n<p><strong>Elaborazione e analisi.</strong> Conservare dati personali\nraccolti durante un’indagine è un <strong>trattamento ai sensi del\nGDPR</strong>. Vanno rispettati i principi di: -\n<strong>Minimizzazione</strong>: non conservare più dati del necessario.\n- <strong>Limitazione della finalità</strong>: i dati raccolti per una\nspecifica indagine non possono essere riutilizzati per scopi diversi. -\n<strong>Sicurezza</strong>: i file dell’indagine vanno protetti\n(crittografia del disco, accesso con password).</p>\n<p><strong>Diffusione.</strong> La pubblicazione di dati personali\n(anche di fonti aperte) nel report deve essere limitata a ciò che è\n<strong>strettamente necessario</strong> per rispondere al requisito.\nNon si pubblicano fotografie, indirizzi, numeri di telefono o altri dati\npersonali se non indispensabili. In ambito giornalistico si applica il\nprincipio della <strong>proporzionalità tra interesse pubblico e diritto\nalla privacy</strong>.</p>\n<h3 id=\"gdpr-art.-17-e-diritto-alloblio\">GDPR art. 17 e “diritto\nall’oblio”</h3>\n<p>Un dato che era pubblico in passato può essere stato rimosso\ndall’interessato. Il GDPR (art. 17) garantisce il diritto alla\ncancellazione. Usare una versione archiviata di un dato personale già\nrimosso richiede una base giuridica solida (es. interesse giornalistico,\nricerca accademica, esercizio di un diritto in sede giudiziaria).</p>\n<hr />\n<h2 id=\"strumenti-per-il-ciclo\">Strumenti per il ciclo</h2>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Strumento</th>\n<th>Fase</th>\n<th>Uso</th>\n<th>Link</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Obsidian</td>\n<td>Pianificazione / Elaborazione</td>\n<td>Note collegate, grafo delle relazioni, plugin OSINT</td>\n<td>https://obsidian.md</td>\n</tr>\n<tr>\n<td>Notion / Joplin</td>\n<td>Pianificazione</td>\n<td>Gestione del collection plan, tracker EEI</td>\n<td>https://www.notion.so</td>\n</tr>\n<tr>\n<td>Maltego CE</td>\n<td>Elaborazione / Analisi</td>\n<td>Grafo delle entità, pivot automatici</td>\n<td>https://www.maltego.com</td>\n</tr>\n<tr>\n<td>Gephi</td>\n<td>Analisi relazionale</td>\n<td>Visualizzazione e metriche di reti complesse</td>\n<td>https://gephi.org</td>\n</tr>\n<tr>\n<td>TimelineJS</td>\n<td>Analisi temporale</td>\n<td>Linee del tempo interattive</td>\n<td>https://timeline.knightlab.com</td>\n</tr>\n<tr>\n<td>i2 Analyst’s Notebook</td>\n<td>Analisi</td>\n<td>Standard de facto nei reparti investigativi (a pagamento)</td>\n<td>https://www.ibm.com/products/i2-analysts-notebook</td>\n</tr>\n<tr>\n<td>OSINT Industries</td>\n<td>Analisi / Aggregazione</td>\n<td>Pivot multi-fonte (e-mail, telefono, username)</td>\n<td>https://osint.industries</td>\n</tr>\n<tr>\n<td>Hunchly</td>\n<td>Raccolta</td>\n<td>Cattura automatica delle pagine durante la navigazione</td>\n<td>https://www.hunch.ly</td>\n</tr>\n<tr>\n<td>ExifTool</td>\n<td>Elaborazione</td>\n<td>Metadati di qualsiasi file</td>\n<td>https://exiftool.org</td>\n</tr>\n<tr>\n<td>yt-dlp</td>\n<td>Raccolta</td>\n<td>Download video da 1.000+ siti</td>\n<td>https://github.com/yt-dlp/yt-dlp</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2 id=\"caso-di-studio-il-consulente-fantasma\">Caso di studio: “Il\nconsulente fantasma”</h2>\n<blockquote>\n<p><em>Nomi, aziende e dettagli sono fittizi.</em></p>\n</blockquote>\n<p><strong>Requisito.</strong> Un’azienda italiana (chiamiamola Alfa\nSrl) sta per firmare un contratto da €150.000 con un consulente\nfreelance, tal dott. Enrico V., che dichiara di avere un curriculum\neccellente e clienti di primo piano. Il responsabile acquisti chiede una\nverifica prima della firma.</p>\n<p><strong>Pianificazione.</strong></p>\n<p>EEI: 1. Il dott. Enrico V. esiste come persona fisica verificabile?\n2. Le sue credenziali professionali (laurea, iscrizioni ad albi) sono\nverificabili? 3. I clienti che cita nel curriculum sono reali e\nconfermano di averlo ingaggiato? 4. Ha precedenti di controversie, cause\nlegali o procedimenti? 5. La sua partita IVA è regolare?</p>\n<p>Collection plan (estratto):</p>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr>\n<th>EEI</th>\n<th>Fonti</th>\n<th>Strumenti</th>\n<th>Priorità</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Identità</td>\n<td>LinkedIn, Google, CCIAA</td>\n<td>Browser, Google Dork</td>\n<td>Alta</td>\n</tr>\n<tr>\n<td>Credenziali</td>\n<td>Albi professionali (es. OAI, OdA), sito ateneo</td>\n<td>Ricerca diretta</td>\n<td>Alta</td>\n</tr>\n<tr>\n<td>Partita IVA</td>\n<td>Agenzia delle Entrate (verifica P.IVA pubblica), Registro\nImprese</td>\n<td>Sito AE, CCIAA</td>\n<td>Alta</td>\n</tr>\n<tr>\n<td>Clienti</td>\n<td>Siti web dei clienti dichiarati, LinkedIn</td>\n<td>Ricerca diretta</td>\n<td>Media</td>\n</tr>\n<tr>\n<td>Controversie</td>\n<td>Sentenze pubblicateTribunale (siti tribunali), Google</td>\n<td>Google Dork</td>\n<td>Media</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Raccolta (estratto).</strong></p>\n<ol type=\"1\">\n<li><strong>LinkedIn</strong>: esiste un profilo con il nome, ma creato\nsoli 8 mesi fa, con 3 connessioni. Foto del profilo: ricerca inversa →\nimmagine di stock da un sito di foto gratuite. <em>(Segnale\nd’allarme.)</em></li>\n<li><strong>Google</strong>: nessun risultato significativo per “Enrico\nV. consulente” + settore dichiarato. Il nome è molto comune; i risultati\npuntano a persone diverse.</li>\n<li><strong>Partita IVA</strong>: verificata su AE → regolare, aperta da\n14 mesi. Ma l’attività dichiarata non corrisponde a quella del profilo\nLinkedIn.</li>\n<li><strong>Clienti dichiarati</strong>: uno dei clienti di punta citati\nnel curriculum è una multinazionale. Ricerca sul sito della\nmultinazionale: nessun riferimento al dott. Enrico V. nel team, nei\ncomunicati o nei case study. Ricerca su LinkedIn: nessun dipendente o ex\ndipendente con questo nome nella timeframe dichiarata.</li>\n<li><strong>Albi</strong>: il settore di consulenza dichiarato non\nrichiede iscrizione a un albo regolamentato. Verificabile solo tramite\nreferenze.</li>\n</ol>\n<p><strong>Analisi.</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Prova</th>\n<th>H1: Profilo autentico</th>\n<th>H2: Identità parzialmente falsa</th>\n<th>H3: Frode completa</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>LinkedIn creato 8 mesi fa</td>\n<td>I</td>\n<td>C</td>\n<td>C</td>\n</tr>\n<tr>\n<td>Foto di stock</td>\n<td>I</td>\n<td>C</td>\n<td>C</td>\n</tr>\n<tr>\n<td>P.IVA regolare ma recente</td>\n<td>I</td>\n<td>C</td>\n<td>C</td>\n</tr>\n<tr>\n<td>Nessuna traccia dei clienti dichiarati</td>\n<td>I</td>\n<td>C</td>\n<td>C</td>\n</tr>\n<tr>\n<td>Nessun risultato di ricerca precedente</td>\n<td>I</td>\n<td>C</td>\n<td>C</td>\n</tr>\n<tr>\n<td><strong>Incoerenze</strong></td>\n<td><strong>5</strong></td>\n<td><strong>0</strong></td>\n<td><strong>0</strong></td>\n</tr>\n</tbody>\n</table>\n<p>H1 (profilo autentico) ha 5 incoerenze. H2 e H3 sono entrambe\ncoerenti con i dati; senza ulteriori prove non è possibile distinguerle.\nLa probabilità che il profilo sia autentico è <strong>altamente\nimprobabile</strong> (confidenza alta, dati di buona qualità).</p>\n<p><strong>Conclusioni del report.</strong></p>\n<blockquote>\n<p>“È <strong>altamente improbabile</strong> (confidenza\n<strong>alta</strong>) che il dott. Enrico V. abbia le credenziali e\nl’esperienza dichiarate. La foto del profilo LinkedIn è un’immagine di\nstock non originale; non è stato trovato alcun riscontro indipendente\ndei clienti di punta dichiarati; il profilo è stato creato meno di un\nanno fa e ha una presenza online trascurabile. Si raccomanda di\n<strong>non procedere alla firma</strong> e di richiedere referenze\nverificabili direttamente ai clienti dichiarati, possibilmente tramite\ncanale ufficiale (non un recapito fornito dal soggetto stesso). Si\nconsiglia anche di verificare l’identità tramite documento d’identità e\ncodice fiscale.”</p>\n</blockquote>\n<p><strong>Lezioni apprese.</strong> - Il ciclo ha permesso di\nrispondere al requisito in meno di mezza giornata. - Il piano di\nraccolta ha evitato di perdersi in ricerche inutili. - La matrice ACH ha\nreso evidente, in modo non ambiguo, quale ipotesi era insostenibile. -\nIl report separava i fatti (foto di stock: <strong>B2</strong>; P.IVA\nregolare: <strong>A1</strong>) dalle inferenze, senza accuse dirette non\ndocumentate.</p>\n<hr />\n<h2 id=\"esercizi-pratici\">Esercizi pratici</h2>\n<p><strong>Esercizio 1 – Riformula il requisito (20 min)</strong> Un\ncliente ti dice: <em>“Voglio sapere tutto sul mio concorrente\nprincipale”</em>. Scrivi almeno <strong>cinque EEI</strong> che\nscompongono questo requisito generico in domande specifiche,\nverificabili e orientate alla decisione.</p>\n<p><strong>Esercizio 2 – Costruisci un collection plan (30 min)</strong>\nScenario: devi verificare la reputazione online di un’associazione\nno-profit che ha chiesto un finanziamento alla tua organizzazione.\nCostruisci un collection plan con almeno otto EEI, indicando per\nciascuna le fonti previste, gli strumenti e la priorità.</p>\n<p><strong>Esercizio 3 – Valuta le fonti (15 min)</strong> Assegna a\nciascuna fonte un codice A–F e a ciascuna informazione un codice 1–6: a)\nIl sito della Camera di Commercio indica che Rossi SpA ha sede a Milano\n(A__, __1). b) Un post anonimo su Reddit afferma che Rossi SpA ha\nlicenziato 50 dipendenti la settimana scorsa. c) La stessa notizia dei\nlicenziamenti è ripresa da sette siti di news, tutti che citano il\nmedesimo post Reddit. d) Un articolo del <em>Sole 24 Ore</em> con firma\nriporta che Rossi SpA è in trattativa per una fusione, citando tre fonti\nanonime interne. e) Hai trovato nel WHOIS il nome e l’indirizzo e-mail\ndel registrante di un dominio sospetto.</p>\n<p><strong>Esercizio 4 – Costruisci una timeline (45 min)</strong>\nScegli un evento di cronaca recente che è stato documentato passo per\npasso sui social. Costruisci una timeline degli eventi usando solo fonti\naperte (notizie, post archiviati, comunicati). Indica per ogni evento la\nfonte, la classificazione (A–F / 1–6) e l’ora in UTC.</p>\n<p><strong>Esercizio 5 – Scrivi un mini-report (60 min)</strong> Prendi\nil risultato dell’esercizio 1 della lezione precedente (autoanalisi\ndella tua impronta digitale). Scrivi un mini-report formale di una\npagina, con: sommario esecutivo, tre fatti osservati (con\nclassificazione), due inferenze (con grado di confidenza) e una\nraccomandazione operativa.</p>\n<p><strong>Esercizio 6 – Esplora il collection_plan.py (30 min)</strong>\nLancia lo script <code>collection_plan.py</code> e inserisci le EEI\ndell’esercizio 2. Aggiorna lo stato man mano che svolgi la raccolta.</p>\n<hr />\n","quiz":[{"q":"Quale fase del Ciclo dell'Intelligence precede immediatamente la raccolta?","opts":{"a":"Analisi","b":"Pianificazione","c":"Elaborazione","d":"Diffusione"},"correct":"b","why":"La pianificazione definisce requisiti e fonti: senza di essa la raccolta è casuale"},{"q":"Un \"risultato negativo\" nella raccolta (cerco X e non lo trovo) è:","opts":{"a":"un dato inutile, da ignorare","b":"un errore del metodo","c":"un dato da documentare: l'assenza di informazioni è informativa","d":"una prova che il soggetto non esiste"},"correct":"c","why":"Anche l'assenza di un dato è informativa e va documentata, indicando dove e come si è cercato"},{"q":"Quale di queste pratiche contrasta meglio la volatilità delle fonti OSINT?","opts":{"a":"Fare uno screenshot e salvarlo sul desktop","b":"Archiviare la pagina su archive.today appena la si trova, con hash dello screenshot","c":"Copiare il testo in un documento Word","d":"Ricordare mentalmente l'URL"},"correct":"b","why":"L'archiviazione immediata su un servizio terzo, con hash dello screenshot, conserva la prova e ne dimostra l'integrità"},{"q":"Nella scala dell'Ammiragliato, una notizia classificata A4 indica:","opts":{"a":"Fonte sconosciuta, informazione confermata","b":"Fonte completamente affidabile, informazione dubbia","c":"Fonte affidabile, informazione probabilmente vera","d":"Fonte inaffidabile, informazione improbabile"},"correct":"b","why":"A = fonte completamente affidabile; 4 = informazione dubbia. Anche una fonte ottima può riportare un dato incerto"},{"q":"Cosa rende \"diagnostica\" una prova nell'ACH?","opts":{"a":"Che sia molto lunga e dettagliata","b":"Che provenga da una fonte autorevole","c":"Che abbia probabilità molto diverse sotto le diverse ipotesi","d":"Che sia stata raccolta per prima"},"correct":"c","why":"Una prova è diagnostica se la sua probabilità cambia molto da un'ipotesi all'altra: solo così aiuta a discriminare"},{"q":"La normalizzazione delle date in UTC serve a:","opts":{"a":"ridurre lo spazio occupato dai file","b":"rispettare il GDPR","c":"evitare errori di confronto tra timestamp da fusi orari diversi","d":"nascondere il fuso orario del soggetto"},"correct":"c","why":"Convertire tutto in UTC evita errori nel confrontare timestamp registrati in fusi orari diversi"},{"q":"Nel report OSINT, le ipotesi alternative:","opts":{"a":"non vanno incluse: confondono il lettore","b":"vanno incluse e spiegate, anche se poi escluse","c":"vanno incluse solo se probabili quanto quella principale","d":"sono opzionali, a discrezione dell'analista"},"correct":"b","why":"Le ipotesi alternative vanno sempre riportate, spiegando perché sono state scartate: rendono il report trasparente e verificabile"},{"q":"Uno scraping aggressivo che colpisce un server con migliaia di richieste automatiche può configurare:","opts":{"a":"una violazione del GDPR articolo 6","b":"il reato di diffamazione","c":"una possibile violazione dell'art. 615-ter c.p. e/o responsabilità civile","d":"nessun problema legale se il sito è pubblico"},"correct":"c","why":"Uno scraping che sovraccarica un server può configurare reati informatici (es. art. 615-ter c.p.) e responsabilità civile"},{"q":"La \"calibrazione\" di un analista è:","opts":{"a":"la capacità di usare correttamente gli strumenti tecnici","b":"la corrispondenza tra il grado di confidenza dichiarato e la frequenza reale di successo","c":"la velocità con cui produce i report","d":"il numero di fonti consultate per ogni indagine"},"correct":"b","why":"Un analista è calibrato quando, dichiarando il 70% di confidenza, ha ragione circa 7 volte su 10"},{"q":"Qual è lo scopo principale della fase di diffusione?","opts":{"a":"Archiviare il diario d'indagine","b":"Raccogliere ulteriori fonti","c":"Consegnare le conclusioni al committente in forma utile alla decisione","d":"Eliminare i dati personali raccolti"},"correct":"c","why":"La diffusione consegna al committente le conclusioni in una forma utile a prendere una decisione"}]},{"title":"Motori di Ricerca e Dork","html":"<h1 id=\"lezione-3-motori-di-ricerca-avanzati-e-dork\">Lezione 3 – Motori\ndi Ricerca Avanzati e Dork</h1>\n<blockquote>\n<p><em>“Google sa già tutto. Il problema è sapere come\nchiederglielo.”</em> — anonimo, community OSINT</p>\n</blockquote>\n<hr />\n<h2 id=\"obiettivi-di-apprendimento\">Obiettivi di apprendimento</h2>\n<p>Al termine di questa lezione sarai in grado di:</p>\n<ol type=\"1\">\n<li>capire perché i motori di ricerca generici non bastano e come si\ndifferenziano tra loro per l’OSINT;</li>\n<li>usare gli <strong>operatori avanzati</strong> di Google, Bing,\nYandex e DuckDuckGo in modo sistematico;</li>\n<li>costruire e combinare <strong>Google Dork</strong> complessi per\ntrovare informazioni esposte inavvertitamente;</li>\n<li>interrogare <strong>Shodan</strong>, <strong>Censys</strong> e\n<strong>URLScan</strong> per scoprire dispositivi, servizi e\ninfrastrutture esposte su Internet;</li>\n<li>usare <strong>VirusTotal</strong> come strumento di ricognizione su\nURL, domini, IP e file;</li>\n<li>costruire un flusso di lavoro integrato che combina più motori\nspecializzati;</li>\n<li>documentare correttamente ogni query con timestamp e archivio, nel\nrispetto del quadro legale.</li>\n</ol>\n<hr />\n<h2 id=\"motori-di-ricerca-avanzati-e-dork-panoramica\">1. Motori di\nricerca avanzati e Dork: panoramica</h2>\n<h3 id=\"perché-i-motori-generalisti-non-bastano\">1.1 Perché i motori\ngeneralisti non bastano</h3>\n<p>Un motore di ricerca generico come Google indicizza <strong>una\nfrazione minuscola del web</strong>: si stima tra il 4% e il 16% dei\ncontenuti pubblicamente accessibili. Il resto è composto da:</p>\n<ul>\n<li><strong>Deep web</strong>: pagine non indicizzate dai motori (aree\nprotette da login, contenuti dinamici generati al momento della\nrichiesta, documenti non linkati).</li>\n<li><strong>Dark web</strong>: reti overlay come Tor, raggiungibili solo\ncon software dedicato.</li>\n<li><strong>Web dimenticato</strong>: pagine esistenti ma non più\nlinkate da nessuno, contenuti su sottodomini non pubblicizzati, vecchie\nversioni di siti.</li>\n</ul>\n<p>Per l’analista OSINT, le opportunità più interessanti si trovano\nproprio in questo “web dimenticato”: file di configurazione esposti,\nbackup di database, documenti interni pubblicati per errore, sottodomini\ndi test, pannelli di amministrazione accessibili.</p>\n<p>I motori di ricerca specializzati (Shodan, Censys, URLScan) spingono\nancora più in là: non indicizzano contenuti testuali, ma <strong>banner\nTCP/IP, certificati TLS, intestazioni HTTP, script di pagina</strong>.\nSono gli occhi dell’analista sull’infrastruttura tecnica di un\nobiettivo.</p>\n<h3 id=\"cosè-un-dork\">1.2 Cos’è un “dork”</h3>\n<p>Il termine <strong>dork</strong> (o <strong>Google dork</strong>, più\nin generale <strong>search dork</strong>) indica una query costruita con\noperatori avanzati per trovare informazioni specifiche che una ricerca\nnormale non restituirebbe. Il termine deriva dal gergo informatico\namericano degli anni ’90 e fu popolarizzato da <strong>Johnny\nLong</strong>, che nel 2004 pubblicò il sito <strong>Google Hacking\nDatabase</strong> (GHDB), ancora attivo su Exploit-DB.</p>\n<p>Un dork non è uno strumento di attacco. È una <strong>query\nraffinata</strong> che sfrutta gli stessi operatori disponibili a\nchiunque. Tuttavia, poiché può rivelare file sensibili esposti per\nerrore, il suo utilizzo richiede consapevolezza etica e legale (vedi box\na fine lezione).</p>\n<h3 id=\"flusso-di-lavoro-consigliato\">1.3 Flusso di lavoro\nconsigliato</h3>\n<p>Prima di iniziare a interrogare i motori, definisci:</p>\n<ol type=\"1\">\n<li><strong>Il tuo selettore di partenza</strong>: dominio, nome, IP,\nusername, e-mail…</li>\n<li><strong>Cosa stai cercando</strong>: documenti, credenziali,\nsottodomini, tecnologie, presenze social…</li>\n<li><strong>In quale motore</strong>: Google per contenuti testuali;\nBing/Yandex per risultati diversi; Shodan/Censys per infrastruttura;\nVirusTotal per reputazione; URLScan per comportamento delle pagine.</li>\n<li><strong>Come documenterai</strong>: screenshot + archivio su\narchive.today per ogni risultato significativo.</li>\n</ol>\n<hr />\n<h2 id=\"google-dork\">2. Google Dork</h2>\n<h3 id=\"gli-operatori-di-base\">2.1 Gli operatori di base</h3>\n<p>Google supporta una serie di <strong>operatori speciali</strong>\nnella query. La conoscenza completa di questi operatori è la base di\nogni ricerca avanzata.</p>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Operatore</th>\n<th>Sintassi</th>\n<th>Significato</th>\n<th>Esempio</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>site:</code></td>\n<td><code>site:dominio.it</code></td>\n<td>Limita i risultati a un dominio o sottodominio</td>\n<td><code>site:comune.milano.it</code></td>\n</tr>\n<tr>\n<td><code>filetype:</code></td>\n<td><code>filetype:pdf</code></td>\n<td>Cerca file di un determinato tipo</td>\n<td><code>filetype:xlsx site:gov.it</code></td>\n</tr>\n<tr>\n<td><code>intitle:</code></td>\n<td><code>intitle:parola</code></td>\n<td>La parola deve essere nel titolo della pagina</td>\n<td><code>intitle:\"index of\"</code></td>\n</tr>\n<tr>\n<td><code>allintitle:</code></td>\n<td><code>allintitle:parole</code></td>\n<td>Tutte le parole devono essere nel titolo</td>\n<td><code>allintitle:login admin panel</code></td>\n</tr>\n<tr>\n<td><code>inurl:</code></td>\n<td><code>inurl:parola</code></td>\n<td>La parola deve essere nell’URL</td>\n<td><code>inurl:admin site:example.com</code></td>\n</tr>\n<tr>\n<td><code>allinurl:</code></td>\n<td><code>allinurl:parole</code></td>\n<td>Tutte le parole nell’URL</td>\n<td><code>allinurl:wp-admin login</code></td>\n</tr>\n<tr>\n<td><code>intext:</code></td>\n<td><code>intext:parola</code></td>\n<td>La parola deve essere nel corpo del testo</td>\n<td><code>intext:\"password\" filetype:txt</code></td>\n</tr>\n<tr>\n<td><code>allintext:</code></td>\n<td><code>allintext:parole</code></td>\n<td>Tutte le parole nel corpo del testo</td>\n<td></td>\n</tr>\n<tr>\n<td><code>cache:</code></td>\n<td><code>cache:url</code></td>\n<td>Mostra la copia in cache di una pagina</td>\n<td><code>cache:example.com</code></td>\n</tr>\n<tr>\n<td><code>link:</code></td>\n<td><code>link:dominio</code></td>\n<td>Pagine che linkano a un dominio (deprecato)</td>\n<td></td>\n</tr>\n<tr>\n<td><code>related:</code></td>\n<td><code>related:dominio</code></td>\n<td>Siti simili a un dominio</td>\n<td><code>related:corriere.it</code></td>\n</tr>\n<tr>\n<td><code>info:</code></td>\n<td><code>info:url</code></td>\n<td>Informazioni di Google su un URL</td>\n<td></td>\n</tr>\n<tr>\n<td><code>\"...\"</code></td>\n<td><code>\"frase esatta\"</code></td>\n<td>Ricerca frase esatta</td>\n<td><code>\"mario rossi\" \"via roma\" genova</code></td>\n</tr>\n<tr>\n<td><code>-</code></td>\n<td><code>-parola</code></td>\n<td>Esclude una parola</td>\n<td><code>rossi -mario</code></td>\n</tr>\n<tr>\n<td><code>OR</code> / <code>\\|</code></td>\n<td><code>A OR B</code></td>\n<td>Risultati che contengono A o B</td>\n<td><code>filetype:pdf OR filetype:doc</code></td>\n</tr>\n<tr>\n<td><code>*</code></td>\n<td><code>\"mario * rossi\"</code></td>\n<td>Jolly per una o più parole</td>\n<td><code>\"direttore * di azienda\"</code></td>\n</tr>\n<tr>\n<td><code>..</code></td>\n<td><code>2020..2024</code></td>\n<td>Intervallo numerico</td>\n<td><code>bilancio 2020..2024 site:example.it</code></td>\n</tr>\n<tr>\n<td><code>before:</code></td>\n<td><code>before:2023-01-01</code></td>\n<td>Risultati precedenti a una data</td>\n<td><code>site:example.it before:2022-06-01</code></td>\n</tr>\n<tr>\n<td><code>after:</code></td>\n<td><code>after:2023-01-01</code></td>\n<td>Risultati successivi a una data</td>\n<td><code>site:example.it after:2023-01-01</code></td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>Nota importante:</strong> Google rimuove o depreca operatori\nperiodicamente. <code>cache:</code> e <code>link:</code> sono sempre\nmeno affidabili. Verifica sempre cosa funziona nella sessione\ncorrente.</p>\n</blockquote>\n<h3 id=\"combinare-gli-operatori-esempi-pratici\">2.2 Combinare gli\noperatori: esempi pratici</h3>\n<p>La potenza dei dork sta nella <strong>combinazione</strong>. Vediamo\nesempi progressivamente più raffinati.</p>\n<p><strong>Trovare documenti interni esposti su un sito:</strong></p>\n<pre><code>site:example.com filetype:pdf OR filetype:docx OR filetype:xlsx</code></pre>\n<p><strong>Trovare pagine di login dimenticate:</strong></p>\n<pre><code>site:example.com inurl:login OR inurl:admin OR inurl:wp-admin</code></pre>\n<p><strong>Trovare file di configurazione esposti:</strong></p>\n<pre><code>site:example.com filetype:env OR filetype:cfg OR filetype:config OR filetype:ini</code></pre>\n<p><strong>Trovare directory listing aperte (file index):</strong></p>\n<pre><code>intitle:&quot;index of&quot; site:example.com</code></pre>\n<pre><code>intitle:&quot;index of&quot; &quot;parent directory&quot; site:example.com</code></pre>\n<p><strong>Trovare file di backup del database:</strong></p>\n<pre><code>site:example.com filetype:sql OR filetype:bak OR filetype:dump</code></pre>\n<p><strong>Trovare credenziali esposte su paste site:</strong></p>\n<pre><code>site:pastebin.com &quot;example.com&quot; password</code></pre>\n<p><strong>Trovare sottodomini non pubblicizzati:</strong></p>\n<pre><code>site:*.example.com -www</code></pre>\n<p><strong>Trovare file Excel con dati personali:</strong></p>\n<pre><code>site:gov.it filetype:xlsx &quot;codice fiscale&quot; OR &quot;nome cognome&quot;</code></pre>\n<p><strong>Trovare webcam accessibili:</strong></p>\n<pre><code>intitle:&quot;webcam&quot; inurl:view/index.shtml</code></pre>\n<p><strong>Trovare pannelli di amministrazione di router:</strong></p>\n<pre><code>intitle:&quot;router&quot; inurl:setup.htm</code></pre>\n<h3 id=\"dork-avanzati-per-osint-su-persone\">2.3 Dork avanzati per OSINT\nsu persone</h3>\n<p><strong>Trovare profili social collegati a una e-mail:</strong></p>\n<pre><code>&quot;mario.rossi@example.com&quot; site:linkedin.com OR site:facebook.com OR site:twitter.com</code></pre>\n<p><strong>Trovare menzioni di una persona in documenti\nufficiali:</strong></p>\n<pre><code>&quot;Mario Rossi&quot; filetype:pdf site:gov.it OR site:comune.*.it</code></pre>\n<p><strong>Trovare curriculum vitae esposti:</strong></p>\n<pre><code>&quot;mario rossi&quot; filetype:pdf &quot;curriculum vitae&quot; OR &quot;cv&quot;</code></pre>\n<p><strong>Trovare l’indirizzo di qualcuno nei registri\npubblici:</strong></p>\n<pre><code>&quot;Mario Rossi&quot; &quot;via&quot; OR &quot;corso&quot; OR &quot;piazza&quot; site:albo.*.it</code></pre>\n<h3 id=\"il-google-hacking-database-ghdb\">2.4 Il Google Hacking Database\n(GHDB)</h3>\n<p>Il <strong>GHDB</strong> è un catalogo pubblico di dork, mantenuto su\nExploit-DB. Contiene migliaia di query categorizzate per tipo:</p>\n<ul>\n<li><em>Footholds</em>: accessi a pannelli di amministrazione o\nlogin.</li>\n<li><em>Files containing usernames</em>: file che espongono nomi\nutente.</li>\n<li><em>Sensitive directories</em>: directory con contenuti\nsensibili.</li>\n<li><em>Web server detection</em>: identificazione del software del\nserver.</li>\n<li><em>Vulnerable files</em>: file associati a vulnerabilità note.</li>\n<li><em>Vulnerable servers</em>: server con configurazioni\nrischiose.</li>\n<li><em>Error messages</em>: messaggi di errore che rivelano tecnologie\no percorsi.</li>\n<li><em>Files containing passwords</em>: file con password in\nchiaro.</li>\n<li><em>Sensitive online shopping info</em>: dati di e-commerce\nesposti.</li>\n</ul>\n<p><strong>Link:</strong>\nhttps://www.exploit-db.com/google-hacking-database</p>\n<blockquote>\n<p><strong>Etica:</strong> il GHDB è uno strumento di ricognizione\nlegale. Trovare un file esposto non autorizza ad accedervi se richiede\ncredenziali, né a usarne il contenuto per scopi non leciti. La\nresponsabilità etica è dell’analista.</p>\n</blockquote>\n<h3 id=\"automazione-lo-script-python-per-i-dork\">2.5 Automazione: lo\nscript Python per i dork</h3>\n<pre class=\"python\"><code>#!/usr/bin/env python3\n&quot;&quot;&quot;\ngoogle_dork_builder.py – Costruisce e documenta query dork.\nNon effettua ricerche automatiche (violerebbe i ToS di Google).\nGenera query pronte da incollare nel browser e le salva nel diario.\n&quot;&quot;&quot;\nimport csv\nimport hashlib\nimport os\nfrom datetime import datetime, timezone\nfrom urllib.parse import quote_plus\n\nFILE_QUERY = &quot;dork_log.csv&quot;\nCAMPI = [&quot;timestamp_utc&quot;, &quot;motore&quot;, &quot;query_raw&quot;, &quot;query_url&quot;,\n         &quot;obiettivo&quot;, &quot;risultato_atteso&quot;, &quot;note&quot;]\n\n\ndef costruisci_dork() -&gt; dict:\n    &quot;&quot;&quot;Guida l&#39;utente nella costruzione di un dork.&quot;&quot;&quot;\n    print(&quot;\\n=== Costruttore di dork ===&quot;)\n    motore = input(&quot;Motore (google/bing/yandex/duckduckgo): &quot;).strip().lower()\n    parti = []\n\n    sito = input(&quot;site: (es. example.com, lascia vuoto per saltare): &quot;).strip()\n    if sito:\n        parti.append(f&quot;site:{sito}&quot;)\n\n    filetype = input(&quot;filetype: (es. pdf, xlsx, env): &quot;).strip()\n    if filetype:\n        parti.append(f&quot;filetype:{filetype}&quot;)\n\n    intitle = input(&quot;intitle: (parola nel titolo): &quot;).strip()\n    if intitle:\n        parti.append(f&#39;intitle:&quot;{intitle}&quot;&#39;)\n\n    inurl = input(&quot;inurl: (parola nell&#39;URL): &quot;).strip()\n    if inurl:\n        parti.append(f&quot;inurl:{inurl}&quot;)\n\n    intext = input(&quot;intext: (parola nel testo): &quot;).strip()\n    if intext:\n        parti.append(f&#39;intext:&quot;{intext}&quot;&#39;)\n\n    frase = input(&quot;Frase esatta (tra virgolette): &quot;).strip()\n    if frase:\n        parti.append(f&#39;&quot;{frase}&quot;&#39;)\n\n
