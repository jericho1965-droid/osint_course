<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>OSINT – Manuale Pratico | Corso Interattivo</title>
<meta name="description" content="Corso interattivo di Open Source Intelligence: 16 lezioni, quiz, strumenti e tecniche avanzate.">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070d1a;--sidebar:#0b1220;--card:#111827;--card2:#0f1e32;
  --border:#1e2d45;--accent:#00c8ff;--accent2:#0080a0;
  --text:#c8d8f0;--muted:#5a7090;
  --ok:#10b981;--err:#ef4444;--warn:#f59e0b;
  --locked:#2a3a55;--font:'Inter',system-ui,sans-serif;
  --mono:'JetBrains Mono','Fira Code',monospace;--r:10px;--sw:290px
}
html{font-size:16px;-webkit-font-smoothing:antialiased}
body{font-family:var(--font);background:var(--bg);color:var(--text);
  display:flex;height:100vh;overflow:hidden}

/* ── Sidebar ── */
#sidebar{width:var(--sw);min-width:var(--sw);background:var(--sidebar);
  border-right:1px solid var(--border);display:flex;flex-direction:column;
  height:100vh;overflow:hidden}
.brand{padding:20px 18px 14px;border-bottom:1px solid var(--border)}
.brand h1{font-size:13px;font-weight:800;text-transform:uppercase;
  letter-spacing:.1em;color:var(--accent)}
.brand p{font-size:11px;color:var(--muted);margin-top:3px}
.prog-wrap{padding:12px 18px;border-bottom:1px solid var(--border)}
.prog-lbl{font-size:11px;color:var(--muted);display:flex;
  justify-content:space-between;margin-bottom:6px}
.prog-lbl span{color:var(--accent);font-weight:700}
.prog-bg{height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));
  border-radius:2px;transition:width .5s ease}
.lesson-nav{flex:1;overflow-y:auto;padding:6px 0;
  scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.lesson-nav::-webkit-scrollbar{width:3px}
.lesson-nav::-webkit-scrollbar-thumb{background:var(--border)}
.l-item{display:flex;align-items:center;gap:10px;padding:9px 18px;
  cursor:pointer;border-left:3px solid transparent;transition:all .2s}
.l-item:hover:not(.locked){background:rgba(0,200,255,.05)}
.l-item.current{border-left-color:var(--accent);background:rgba(0,200,255,.08)}
.l-item.locked{cursor:not-allowed;opacity:.35}
.l-icon{width:26px;height:26px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-size:11px;
  flex-shrink:0;font-weight:700;transition:all .2s}
.l-item.done    .l-icon{background:var(--ok);color:#fff}
.l-item.current .l-icon{background:var(--accent);color:#000}
.l-item.avail   .l-icon{background:var(--card2);color:var(--text);
  border:1px solid var(--border)}
.l-item.locked  .l-icon{background:var(--locked);color:var(--muted)}
.l-title{font-size:12.5px;font-weight:500;line-height:1.3;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.l-item.done    .l-title{color:var(--muted)}
.l-item.current .l-title{color:var(--accent)}
.l-item.locked  .l-title{color:var(--muted)}
.sidebar-footer{padding:12px 18px;border-top:1px solid var(--border)}
.sidebar-footer button{background:none;border:none;color:var(--muted);
  font-size:12px;cursor:pointer;width:100%;text-align:left;font-family:var(--font);
  transition:color .2s}
.sidebar-footer button:hover{color:var(--text)}

/* ── Main ── */
#main{flex:1;height:100vh;overflow-y:auto;display:flex;flex-direction:column;
  scrollbar-width:thin;scrollbar-color:var(--border) transparent}
#main::-webkit-scrollbar{width:5px}
#main::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ── Lesson header ── */
.l-header{padding:30px 48px 22px;border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:10;
  background:rgba(7,13,26,.92);backdrop-filter:blur(14px)}
.l-badge{font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.1em;color:var(--accent);margin-bottom:6px}
.l-header h2{font-size:24px;font-weight:800;color:#fff;line-height:1.2}

/* ── Content area ── */
.content-area{padding:36px 48px;max-width:900px;width:100%}
.lesson-body h1{display:none}
.lesson-body h2{font-size:19px;font-weight:700;color:#fff;
  margin:30px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--border)}
.lesson-body h3{font-size:15px;font-weight:600;color:var(--accent);margin:22px 0 7px}
.lesson-body h4{font-size:14px;font-weight:600;color:var(--text);margin:14px 0 5px}
.lesson-body p{line-height:1.75;margin-bottom:12px}
.lesson-body ul,.lesson-body ol{margin:8px 0 14px 22px}
.lesson-body li{line-height:1.7;margin-bottom:5px}
.lesson-body strong{color:#fff;font-weight:600}
.lesson-body em{color:var(--muted)}
.lesson-body blockquote{border-left:3px solid var(--accent);padding:10px 18px;
  margin:18px 0;background:rgba(0,200,255,.05);border-radius:0 var(--r) var(--r) 0}
.lesson-body blockquote p{margin-bottom:0;color:var(--muted)}
.lesson-body table{width:100%;border-collapse:collapse;margin:18px 0;font-size:13.5px}
.lesson-body th{background:var(--card2);color:var(--accent);padding:9px 13px;
  text-align:left;font-weight:600;border-bottom:2px solid var(--accent2)}
.lesson-body td{padding:8px 13px;border-bottom:1px solid var(--border);vertical-align:top}
.lesson-body tr:nth-child(even) td{background:rgba(255,255,255,.02)}
.lesson-body pre{background:#0d1117;border:1px solid var(--border);border-radius:var(--r);
  padding:18px;overflow-x:auto;margin:18px 0;
  font-family:var(--mono);font-size:12.5px;line-height:1.6}
.lesson-body code{font-family:var(--mono);font-size:12.5px;
  background:rgba(0,200,255,.08);border:1px solid rgba(0,200,255,.15);
  padding:2px 5px;border-radius:4px;color:var(--accent)}
.lesson-body pre code{background:none;border:none;padding:0;color:#e6edf3}
hr{border:none;border-top:1px solid var(--border);margin:28px 0}

/* ── Quiz ── */
.quiz-section{padding:40px 48px;background:var(--card);
  border-top:2px solid var(--accent);position:relative}
.quiz-section::before{content:'';position:absolute;top:0;left:0;right:0;
  height:2px;background:linear-gradient(90deg,var(--accent2),var(--accent),var(--accent2))}
.quiz-hdr{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.quiz-ico{width:38px;height:38px;background:rgba(0,200,255,.1);
  border:1px solid rgba(0,200,255,.3);border-radius:var(--r);
  display:flex;align-items:center;justify-content:center;font-size:18px}
.quiz-hdr-text h3{font-size:18px;font-weight:700;color:#fff}
.quiz-hdr-text p{font-size:12px;color:var(--muted);margin-top:2px}
.quiz-prog-badge{margin-left:auto;font-size:12px;color:var(--muted);
  background:var(--card2);padding:4px 12px;border-radius:20px;
  border:1px solid var(--border);white-space:nowrap}
.quiz-prog-badge span{color:var(--accent);font-weight:700}

.q-card{background:var(--card2);border:1px solid var(--border);
  border-radius:var(--r);padding:22px;margin-bottom:14px;transition:border-color .3s}
.q-card.ok {border-color:var(--ok); background:rgba(16,185,129,.05)}
.q-card.err{border-color:var(--err);background:rgba(239,68,68,.05)}
.q-num{font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.1em;color:var(--accent);margin-bottom:9px}
.q-text{font-size:14.5px;font-weight:500;color:#fff;line-height:1.5;margin-bottom:16px}
.opts{display:grid;gap:7px}

.opt{display:flex;align-items:center;gap:11px;padding:11px 15px;
  background:var(--card);border:1px solid var(--border);border-radius:8px;
  cursor:pointer;transition:all .2s;width:100%;text-align:left;
  color:var(--text);font-size:13.5px;font-family:var(--font)}
.opt:hover:not(:disabled){border-color:var(--accent);background:rgba(0,200,255,.06);color:#fff}
.opt:disabled{cursor:default}
.opt-let{width:26px;height:26px;border-radius:6px;background:var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;flex-shrink:0;transition:all .2s}
.opt.correct{border-color:var(--ok);background:rgba(16,185,129,.1);color:#fff}
.opt.correct .opt-let{background:var(--ok);color:#fff}
.opt.wrong  {border-color:var(--err);background:rgba(239,68,68,.1);color:var(--err)}
.opt.wrong   .opt-let{background:var(--err);color:#fff}
.opt.reveal {border-color:var(--ok);background:rgba(16,185,129,.06)}
.opt.reveal  .opt-let{background:var(--ok);color:#fff}

.q-feedback{display:flex;align-items:center;gap:7px;margin-top:10px;
  font-size:12.5px;font-weight:600;padding:7px 11px;border-radius:6px}
.q-feedback.ok {color:var(--ok); background:rgba(16,185,129,.1)}
.q-feedback.err{color:var(--err);background:rgba(239,68,68,.1)}

.quiz-footer{margin-top:28px;display:flex;align-items:center;
  justify-content:space-between;gap:16px;flex-wrap:wrap}
.quiz-score{font-size:13.5px;color:var(--muted)}
.quiz-score strong{color:#fff;font-size:15px}

.btn-next{padding:13px 30px;background:linear-gradient(135deg,var(--accent2),var(--accent));
  color:#000;border:none;border-radius:var(--r);font-size:14.5px;font-weight:700;
  cursor:pointer;transition:all .25s;display:flex;align-items:center;gap:8px;
  font-family:var(--font)}
.btn-next:hover:not(:disabled){transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(0,200,255,.25)}
.btn-next:disabled{background:var(--border);color:var(--muted);
  cursor:not-allowed;transform:none;box-shadow:none}

.q-explain{margin-top:10px;padding:12px 15px;border-radius:8px;
  background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.35);
  border-left:4px solid var(--ok);font-size:13.5px;line-height:1.6;color:var(--text);
  animation:slideDown .35s ease}
.q-explain b{color:var(--ok);display:block;font-size:11px;text-transform:uppercase;
  letter-spacing:.08em;margin-bottom:4px}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px);max-height:0}
  to{opacity:1;transform:translateY(0);max-height:300px}}

.quiz-fail{flex:1;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:18px 20px;border:1px solid var(--err);border-radius:var(--r);
  background:rgba(239,68,68,.08);animation:shake .4s ease}
.qf-ico{font-size:28px}
.qf-txt{flex:1;min-width:220px}
.qf-txt strong{color:var(--err);font-size:15px}
.qf-txt p{font-size:13px;color:var(--text);margin-top:4px;line-height:1.5}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ── Welcome / Completion ── */
#welcome{flex:1;display:flex;align-items:center;justify-content:center;padding:48px}
.w-inner{max-width:520px;text-align:center}
.w-logo{font-size:60px;margin-bottom:20px}
.w-inner h2{font-size:30px;font-weight:800;color:#fff;margin-bottom:14px;line-height:1.2}
.w-inner h2 span{color:var(--accent)}
.w-inner p{color:var(--muted);font-size:15px;line-height:1.7;margin-bottom:28px}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px}
.stat-c{background:var(--card);border:1px solid var(--border);
  border-radius:var(--r);padding:14px}
.stat-c .n{font-size:26px;font-weight:800;color:var(--accent)}
.stat-c .l{font-size:11px;color:var(--muted);margin-top:3px}
.btn-start{padding:14px 36px;background:linear-gradient(135deg,var(--accent2),var(--accent));
  color:#000;border:none;border-radius:var(--r);font-size:15px;font-weight:700;
  cursor:pointer;transition:all .25s;font-family:var(--font)}
.btn-start:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,200,255,.3)}

@media(max-width:768px){
  :root{--sw:100%}
  body{flex-direction:column}
  #sidebar{width:100%;min-width:100%;height:auto;max-height:180px}
  #main{height:calc(100vh - 180px)}
  .content-area,.quiz-section{padding:20px}
  .l-header{padding:18px 20px}
}
</style>
</head>

<script>
const LD = [{"title":"Introduzione all'OSINT","html":"<h1\nid=\"lezione-1-introduzione-allosint-cosè-pensiero-critico-e-bias-umani\">Lezione\n1 – Introduzione all’OSINT: cos’è, Pensiero Critico e Bias Umani</h1>\n<blockquote>\n<p><em>“Il dato non è informazione, l’informazione non è conoscenza, la\nconoscenza non è intelligence.”</em> — adagio della comunità\nd’intelligence</p>\n</blockquote>\n<hr />\n<h2 id=\"obiettivi-di-apprendimento\">Obiettivi di apprendimento</h2>\n<p>Al termine di questa lezione sarai in grado di:</p>\n<ol type=\"1\">\n<li>definire con precisione che cos’è l’<strong>OSINT</strong> (<em>Open\nSource Intelligence</em>) e distinguerlo dalla semplice “ricerca su\nInternet”;</li>\n<li>collocare l’OSINT tra le altre discipline di intelligence (HUMINT,\nSIGINT, IMINT, GEOINT, ecc.);</li>\n<li>conoscere la storia dell’OSINT, dalla Seconda guerra mondiale ai\ngiorni nostri;</li>\n<li>riconoscere chi usa l’OSINT e per quali scopi: giornalismo,\ncybersecurity, due diligence, forze dell’ordine, ricerca\naccademica;</li>\n<li>comprendere perché il <strong>pensiero critico</strong> è lo\nstrumento più importante dell’analista, prima di qualunque\nsoftware;</li>\n<li>riconoscere i principali <strong>bias cognitivi</strong> che\ndistorcono un’indagine e applicare tecniche concrete per mitigarli;</li>\n<li>conoscere i confini legali ed etici dell’attività OSINT in Italia e\nin Europa;</li>\n<li>preparare un ambiente di lavoro di base sicuro (OPSEC).</li>\n</ol>\n<hr />\n<h2 id=\"che-cosè-losint\">1. Che cos’è l’OSINT</h2>\n<h3 id=\"una-definizione-operativa\">1.1 Una definizione operativa</h3>\n<p><strong>OSINT</strong> è l’acronimo di <em>Open Source\nIntelligence</em>, in italiano “intelligence da fonti pubbliche”. La\ndefinizione più citata viene dalla normativa statunitense (<em>National\nDefense Authorization Act</em>, 2006). Secondo questa definizione,\nl’OSINT è intelligence:</p>\n<blockquote>\n<p>“prodotta a partire da informazioni pubblicamente disponibili,\nraccolte, sfruttate e diffuse in modo tempestivo a un pubblico\nappropriato, allo scopo di soddisfare uno specifico requisito\ninformativo.”</p>\n</blockquote>\n<p>In questa frase ci sono tre elementi fondamentali che vale la pena\nseparare:</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Elemento</th>\n<th>Significato</th>\n<th>Cosa NON è</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Informazioni pubblicamente disponibili</strong></td>\n<td>Dati che chiunque può ottenere legalmente: consultandoli,\nacquistandoli, richiedendoli o osservandoli</td>\n<td>Dati ottenuti violando sistemi, password, accessi riservati</td>\n</tr>\n<tr>\n<td><strong>Raccolta, sfruttamento e diffusione</strong></td>\n<td>Un processo metodico, non una ricerca casuale</td>\n<td>“Googlare qualcosa” e fermarsi al primo risultato</td>\n</tr>\n<tr>\n<td><strong>Requisito informativo specifico</strong></td>\n<td>C’è una domanda precisa a cui rispondere, posta da qualcuno (il\n“cliente”)</td>\n<td>Curiosità generica o accumulo indiscriminato di dati</td>\n</tr>\n</tbody>\n</table>\n<p>Il punto chiave è che <strong>l’OSINT non è la fonte, è il\nprodotto</strong>. Un articolo di giornale, un post su Instagram, una\nvisura camerale sono <em>fonti aperte</em>. Diventano\n<em>intelligence</em> solo quando qualcuno le raccoglie con metodo, ne\nvaluta l’affidabilità, le incrocia, le interpreta e le usa per\nrispondere a una domanda concreta.</p>\n<h3 id=\"dato-informazione-intelligence\">1.2 Dato, informazione,\nintelligence</h3>\n<p>Per capire l’OSINT è utile la cosiddetta <strong>piramide\nDIKW</strong> (<em>Data, Information, Knowledge, Wisdom</em>), adattata\nal mondo dell’intelligence:</p>\n<pre><code>               ▲\n              / \\        INTELLIGENCE\n             /   \\       → conoscenza valutata e contestualizzata,\n            /     \\        utile a prendere una decisione\n           /-------\\\n          /         \\    CONOSCENZA\n         /           \\   → informazioni collegate tra loro\n        /-------------\\\n       /               \\  INFORMAZIONE\n      /                 \\ → dati organizzati e con un contesto\n     /-------------------\\\n    /                     \\ DATO\n   /_______________________\\→ fatto grezzo, privo di contesto</code></pre>\n<p><strong>Esempio pratico.</strong></p>\n<ul>\n<li><em>Dato</em>: “mario.rossi87”.</li>\n<li><em>Informazione</em>: “mario.rossi87” è uno username presente su\nInstagram, GitHub e su un forum di modellismo.</li>\n<li><em>Conoscenza</em>: i tre profili condividono la stessa foto, la\nstessa città (Genova) e scrivono negli stessi orari. Con alta\nprobabilità appartengono alla stessa persona.</li>\n<li><em>Intelligence</em>: il profilo GitHub contiene un repository con\ncredenziali aziendali esposte. L’azienda cliente deve revocarle subito e\navviare un programma di formazione dei dipendenti.</li>\n</ul>\n<p>Solo l’ultimo livello risponde a un bisogno decisionale. È questo che\ndistingue un analista OSINT da un semplice “ricercatore”.</p>\n<h3 id=\"cosa-significa-davvero-aperto\">1.3 Cosa significa davvero\n“aperto”</h3>\n<p>Una fonte è “aperta” quando l’accesso è <strong>lecito e non richiede\ndi aggirare protezioni</strong>. Rientrano nelle fonti aperte:</p>\n<ul>\n<li><strong>Media tradizionali</strong>: giornali, TV, radio, agenzie di\nstampa.</li>\n<li><strong>Internet pubblico</strong>: siti web, blog, forum, social\nnetwork (contenuti pubblici).</li>\n<li><strong>Dati governativi e istituzionali</strong>: Gazzetta\nUfficiale, albi pretori, bandi di gara (ANAC), bilanci, sentenze\npubblicate, registri pubblici.</li>\n<li><strong>Registri commerciali</strong>: Registro delle Imprese,\nvisure camerali (a pagamento, ma accessibili a chiunque).</li>\n<li><strong>Letteratura grigia</strong>: tesi, report tecnici, atti di\nconvegni, brevetti, white paper.</li>\n<li><strong>Dati geospaziali commerciali</strong>: immagini satellitari\n(Google Earth, Sentinel, Maxar), mappe, Street View.</li>\n<li><strong>Dati tecnici</strong>: record DNS, WHOIS, certificati SSL,\nsegnali ADS-B degli aerei, AIS delle navi.</li>\n<li><strong>Osservazione diretta in luoghi pubblici.</strong></li>\n</ul>\n<blockquote>\n<p><strong>Attenzione:</strong> “pubblico” non significa “libero da\nvincoli”. Un dato personale pubblicato su un social resta un dato\npersonale tutelato dal GDPR. Ne parleremo nel box legale di questa\nlezione.</p>\n</blockquote>\n<p>C’è poi un’area grigia importante: i <strong>data breach</strong>. I\ndatabase rubati e diffusi online sono tecnicamente “raggiungibili”, ma\nil loro utilizzo pone seri problemi legali ed etici. In questo corso li\ntratteremo solo attraverso servizi legittimi di verifica, come <em>Have\nI Been Pwned</em>, che indicano <em>se</em> un indirizzo compare in una\nviolazione senza mostrarne i contenuti.</p>\n<hr />\n<h2 id=\"losint-tra-le-discipline-di-intelligence\">2. L’OSINT tra le\ndiscipline di intelligence</h2>\n<p>L’intelligence tradizionale classifica le fonti in diverse\ndiscipline, chiamate “INT”. Conoscerle aiuta a capire dove si colloca\nl’OSINT e con quali discipline si sovrappone.</p>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Disciplina</th>\n<th>Nome esteso</th>\n<th>Fonte</th>\n<th>Esempio</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>HUMINT</strong></td>\n<td>Human Intelligence</td>\n<td>Persone, informatori, colloqui</td>\n<td>Un agente che intervista un testimone</td>\n</tr>\n<tr>\n<td><strong>SIGINT</strong></td>\n<td>Signals Intelligence</td>\n<td>Intercettazione di segnali (COMINT, ELINT)</td>\n<td>Analisi delle trasmissioni radio</td>\n</tr>\n<tr>\n<td><strong>IMINT</strong></td>\n<td>Imagery Intelligence</td>\n<td>Immagini fotografiche e satellitari</td>\n<td>Foto aeree di un sito industriale</td>\n</tr>\n<tr>\n<td><strong>GEOINT</strong></td>\n<td>Geospatial Intelligence</td>\n<td>Dati geografici integrati</td>\n<td>Mappatura dei movimenti in un’area</td>\n</tr>\n<tr>\n<td><strong>MASINT</strong></td>\n<td>Measurement and Signature Intelligence</td>\n<td>Firme fisiche (radar, acustica, chimica)</td>\n<td>Rilevamento di un test nucleare</td>\n</tr>\n<tr>\n<td><strong>FININT</strong></td>\n<td>Financial Intelligence</td>\n<td>Flussi finanziari</td>\n<td>Tracciamento di transazioni sospette</td>\n</tr>\n<tr>\n<td><strong>SOCMINT</strong></td>\n<td>Social Media Intelligence</td>\n<td>Social network</td>\n<td>Analisi di una rete di account coordinati</td>\n</tr>\n<tr>\n<td><strong>OSINT</strong></td>\n<td>Open Source Intelligence</td>\n<td>Tutte le fonti pubbliche</td>\n<td>Tutto ciò che è lecitamente accessibile</td>\n</tr>\n</tbody>\n</table>\n<p>L’OSINT è <strong>trasversale</strong>: molte discipline hanno una\n“componente aperta”.</p>\n<ul>\n<li>Le immagini satellitari commerciali sono <strong>IMINT/GEOINT open\nsource</strong>.</li>\n<li>I segnali ADS-B trasmessi in chiaro dagli aerei, che studieremo\nnella lezione <em>SIGINT: Aeromobili</em>, sono una forma di\n<strong>SIGINT aperta</strong>.</li>\n<li>Il <strong>SOCMINT</strong> è considerato da molti un sottoinsieme\ndell’OSINT, anche se alcuni lo trattano come disciplina autonoma per le\nsue implicazioni sulla privacy.</li>\n</ul>\n<p>Secondo stime spesso citate da ex dirigenti della comunità\nd’intelligence statunitense, tra il <strong>70% e il 90%</strong> delle\ninformazioni usate nelle analisi strategiche proviene da fonti aperte.\nIl numero esatto è dibattuto, ma il concetto è condiviso: <strong>la\nmaggior parte di ciò che serve sapere è già là fuori</strong>. Il\nproblema non è trovarlo, ma riconoscerlo, verificarlo e capirlo.</p>\n<hr />\n<h2 id=\"breve-storia-dellosint\">3. Breve storia dell’OSINT</h2>\n<h3 id=\"le-origini-radio-e-giornali-19391945\">3.1 Le origini: radio e\ngiornali (1939–1945)</h3>\n<p>L’OSINT moderna nasce durante la Seconda guerra mondiale.</p>\n<ul>\n<li>Nel <strong>1939</strong> la BBC crea il <strong>BBC Monitoring\nService</strong>, che ascolta e traduce le trasmissioni radio\nstraniere.</li>\n<li>Nel <strong>1941</strong> gli Stati Uniti istituiscono il\n<strong>Foreign Broadcast Monitoring Service</strong> (poi FBIS), con lo\nstesso scopo.</li>\n</ul>\n<p>Un esempio celebre: gli analisti alleati studiavano i <strong>prezzi\ndelle arance</strong> a Parigi e i treni in partenza per la Germania. Da\nquesti dati deducevano lo stato dei trasporti e l’efficacia dei\nbombardamenti. Altri analizzavano i necrologi dei giornali locali\ntedeschi per stimare le perdite al fronte.</p>\n<h3 id=\"la-guerra-fredda\">3.2 La Guerra fredda</h3>\n<p>Durante la Guerra fredda l’FBIS e i servizi europei raccoglievano\nsistematicamente giornali, riviste tecniche e trasmissioni dei paesi del\nblocco sovietico. Erano note, ad esempio, le analisi della\n<strong>“Cremlinologia”</strong>. Gli analisti deducevano i rapporti di\npotere a Mosca dalla posizione dei dirigenti sul palco della Piazza\nRossa durante le parate, o dall’ordine dei loro nomi sulla\n<em>Pravda</em>.</p>\n<h3 id=\"la-rivoluzione-di-internet-anni-90-2000\">3.3 La rivoluzione di\nInternet (anni ’90 – 2000)</h3>\n<p>Con il web la quantità di informazioni disponibili esplode. Nel\n<strong>2005</strong>, dopo le raccomandazioni della Commissione sull’11\nsettembre, gli USA creano l’<strong>Open Source Center</strong>, che\nassorbe l’FBIS. La NATO pubblica i suoi manuali OSINT (<em>NATO Open\nSource Intelligence Handbook</em>, 2001), che ancora oggi sono un\nriferimento metodologico.</p>\n<h3 id=\"lera-dei-social-e-dellosint-civile-2010-oggi\">3.4 L’era dei\nsocial e dell’OSINT “civile” (2010 – oggi)</h3>\n<p>L’ultimo decennio ha visto la <strong>democratizzazione</strong>\ndell’OSINT:</p>\n<ul>\n<li><strong>Primavere arabe (2011):</strong> i video caricati dai\ncittadini diventano fonti primarie per i giornalisti.</li>\n<li><strong>Abbattimento del volo MH17 (2014):</strong> il collettivo\ninvestigativo <strong>Bellingcat</strong>, fondato da Eliot Higgins,\nricostruisce il percorso del sistema missilistico Buk usando foto e\nvideo pubblicati sui social, immagini satellitari e geolocalizzazione.\nLe sue conclusioni coincideranno in larga parte con quelle del <em>Joint\nInvestigation Team</em> ufficiale.</li>\n<li><strong>Conflitto in Ucraina (2022 – oggi):</strong> analisti\nindipendenti monitorano in tempo reale movimenti di truppe, danni e\nperdite di mezzi attraverso video geolocalizzati. Progetti come\n<em>Oryx</em> documentano visivamente ogni perdita di\nequipaggiamento.</li>\n<li><strong>Giornalismo investigativo:</strong> testate come il <em>New\nYork Times</em> (Visual Investigations), la <em>BBC</em> (Africa Eye) e\nil consorzio <em>OCCRP</em> usano l’OSINT in modo strutturale.</li>\n</ul>\n<p>In parallelo è cresciuta una comunità di appassionati e\nprofessionisti. Ne fanno parte competizioni come le <strong>Trace Labs\nSearch Party</strong> (OSINT per la ricerca di persone scomparse),\ncommunity su Discord e una grande varietà di strumenti open source.</p>\n<h3 id=\"losint-oggi-in-italia\">3.5 L’OSINT oggi in Italia</h3>\n<p>Anche in Italia l’OSINT è sempre più presente:</p>\n<ul>\n<li>nelle <strong>forze dell’ordine</strong> (Polizia Postale, reparti\ninvestigativi);</li>\n<li>nelle attività di <strong>intelligence economica</strong> e di\nsicurezza nazionale;</li>\n<li>nelle <strong>agenzie investigative</strong> autorizzate;</li>\n<li>nei <strong>SOC</strong> e nei team di <em>threat intelligence</em>\naziendali;</li>\n<li>nelle redazioni giornalistiche e nel <strong>fact-checking</strong>\n(ad es. <em>Facta</em>, <em>Pagella Politica</em>, <em>Open</em>).</li>\n</ul>\n<hr />\n<h2 id=\"chi-usa-losint-e-perché\">4. Chi usa l’OSINT e perché</h2>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Settore</th>\n<th>Obiettivi tipici</th>\n<th>Esempio</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Giornalismo investigativo</strong></td>\n<td>Verificare fatti, smascherare disinformazione, inchieste</td>\n<td>Geolocalizzare un video virale per capire se è davvero recente</td>\n</tr>\n<tr>\n<td><strong>Cybersecurity / Threat Intelligence</strong></td>\n<td>Mappare la superficie d’attacco, individuare leak, monitorare attori\nmalevoli</td>\n<td>Trovare sottodomini dimenticati o credenziali esposte su GitHub</td>\n</tr>\n<tr>\n<td><strong>Penetration testing / Red team</strong></td>\n<td>Ricognizione prima di un test autorizzato</td>\n<td>Identificare il formato delle e-mail aziendali e i dipendenti\nesposti</td>\n</tr>\n<tr>\n<td><strong>Due diligence e compliance (KYC/AML)</strong></td>\n<td>Valutare partner, fornitori, clienti</td>\n<td>Verificare se un futuro socio ha precedenti di fallimenti o\nsanzioni</td>\n</tr>\n<tr>\n<td><strong>Forze dell’ordine</strong></td>\n<td>Indagini, ricerca di latitanti, contrasto alla pedopornografia e al\nterrorismo</td>\n<td>Identificare l’autore di minacce online</td>\n</tr>\n<tr>\n<td><strong>Investigazioni private</strong></td>\n<td>Infedeltà aziendale, frodi assicurative, rintraccio di debitori</td>\n<td>Documentare un falso infortunio tramite post pubblici</td>\n</tr>\n<tr>\n<td><strong>Brand protection</strong></td>\n<td>Contraffazione, phishing, frodi</td>\n<td>Trovare siti clone che imitano un e-commerce</td>\n</tr>\n<tr>\n<td><strong>Ricerca umanitaria e diritti umani</strong></td>\n<td>Documentare crimini di guerra, violazioni</td>\n<td>Archiviare e verificare video da zone di conflitto</td>\n</tr>\n<tr>\n<td><strong>Ricerca di persone scomparse</strong></td>\n<td>Supporto alle famiglie e alle autorità</td>\n<td>Iniziative tipo Trace Labs</td>\n</tr>\n<tr>\n<td><strong>Ricerca accademica</strong></td>\n<td>Studio di fenomeni sociali e politici</td>\n<td>Analisi di campagne di disinformazione</td>\n</tr>\n<tr>\n<td><strong>Difesa personale</strong></td>\n<td>Capire la propria esposizione online</td>\n<td>Fare un “audit” della propria impronta digitale</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>Nota:</strong> l’ultimo punto è spesso sottovalutato. Uno dei\nmigliori esercizi per imparare l’OSINT è <strong>indagare su sé\nstessi</strong>. Lo faremo negli esercizi di fine lezione.</p>\n</blockquote>\n<hr />\n<h2 id=\"osint-non-è-googlare-le-caratteristiche-dellanalista\">5. OSINT\nnon è “googlare”: le caratteristiche dell’analista</h2>\n<p>Molti principianti pensano che l’OSINT sia una questione di\nstrumenti: conoscere il sito giusto, lo script giusto, il “trucco”\ngiusto. Gli strumenti cambiano continuamente: servizi chiudono, API\nvengono limitate, i social modificano le impostazioni di privacy.\n<strong>Il metodo invece resta.</strong></p>\n<p>Le qualità di un buon analista OSINT sono:</p>\n<ol type=\"1\">\n<li><strong>Curiosità metodica</strong>: fare domande, ma tenerne\ntraccia in modo ordinato.</li>\n<li><strong>Pazienza e tenacia</strong>: la svolta arriva spesso dopo\nore di vicoli ciechi.</li>\n<li><strong>Attenzione ai dettagli</strong>: un cartello stradale\nsfocato, il riflesso in una finestra, un fuso orario.</li>\n<li><strong>Capacità di pivot</strong>: usare ogni nuovo dato come punto\ndi partenza per una ricerca successiva (username → e-mail → numero di\ntelefono → profilo social → foto → luogo).</li>\n<li><strong>Documentazione rigorosa</strong>: annotare fonte, data, ora\ne URL di ogni scoperta, con screenshot e archiviazione.</li>\n<li><strong>Etica</strong>: sapere dove fermarsi.</li>\n<li><strong>Pensiero critico</strong>: la qualità più importante, a cui\ndedichiamo la seconda parte della lezione.</li>\n</ol>\n<h3 id=\"il-concetto-di-pivot\">5.1 Il concetto di <em>pivot</em></h3>\n<p>Il pivot è il cuore dell’OSINT. Ogni informazione trovata è un\n<strong>selettore</strong>, cioè un elemento che permette di cercare\naltre informazioni. I selettori più comuni sono:</p>\n<ul>\n<li>nome e cognome;</li>\n<li>username;</li>\n<li>indirizzo e-mail;</li>\n<li>numero di telefono;</li>\n<li>immagine del profilo;</li>\n<li>dominio o indirizzo IP;</li>\n<li>indirizzo fisico;</li>\n<li>targa, IBAN, partita IVA, codice fiscale;</li>\n<li>identificativi tecnici (ID Facebook, ID Telegram, hash di\nun’immagine).</li>\n</ul>\n<pre><code> [username] ──► [profilo GitHub] ──► [e-mail nei commit]\n                                         │\n                                         ▼\n [foto profilo] ◄── [account LinkedIn] ◄── [ricerca e-mail]\n       │\n       ▼\n [ricerca inversa] ──► [vecchio blog personale] ──► [città, interessi]</code></pre>\n<p>Ogni freccia è un pivot. Ogni pivot introduce però un <strong>rischio\ndi errore</strong>: se un collegamento è sbagliato, tutto ciò che segue\nè contaminato. Per questo il pensiero critico non è un optional.</p>\n<hr />\n<h2 id=\"pensiero-critico-lo-strumento-più-importante\">6. Pensiero\ncritico: lo strumento più importante</h2>\n<h3 id=\"perché-parlarne-subito\">6.1 Perché parlarne subito</h3>\n<p>Nel 2013, dopo l’attentato alla maratona di Boston, migliaia di\nutenti di Reddit iniziarono una “indagine collettiva” sulle foto della\nfolla. In pochi giorni identificarono “con certezza” diversi sospettati.\nTra questi c’era uno studente scomparso da settimane, poi trovato morto\ne del tutto estraneo ai fatti. La sua famiglia fu travolta da insulti e\nminacce. Nessuno dei “sospettati” indicati dalla folla era\ncoinvolto.</p>\n<p>Gli strumenti erano accessibili a tutti, gli utenti erano motivati e\nin buona fede. <strong>Mancava il metodo</strong>: nessuno valutava le\nfonti, nessuno cercava ipotesi alternative, tutti confermavano ciò che\nvolevano vedere.</p>\n<p>Questo episodio riassume perché, in un corso OSINT, il pensiero\ncritico viene <strong>prima</strong> delle tecniche.</p>\n<h3 id=\"cosè-il-pensiero-critico\">6.2 Cos’è il pensiero critico</h3>\n<p>Il pensiero critico è la capacità di <strong>analizzare informazioni\nin modo obiettivo, valutare le prove e trarre conclusioni\nragionate</strong>, riconoscendo i propri limiti e pregiudizi. Nel\ncontesto OSINT significa porsi continuamente domande come:</p>\n<ul>\n<li><strong>Chi</strong> ha prodotto questa informazione? Con quale\ninteresse?</li>\n<li><strong>Quando</strong> è stata prodotta? È ancora attuale?</li>\n<li><strong>Come</strong> è stata ottenuta dalla fonte originale?</li>\n<li>È <strong>verificabile</strong> in modo indipendente?</li>\n<li>Cosa <strong>dovrebbe esserci</strong> se fosse vero? E cosa\n<strong>non dovrebbe esserci</strong>?</li>\n<li>Quali <strong>ipotesi alternative</strong> spiegano gli stessi\ndati?</li>\n<li>Sto vedendo ciò che c’è o ciò che <strong>mi aspetto</strong> di\nvedere?</li>\n</ul>\n<h3 id=\"fatti-inferenze-e-opinioni\">6.3 Fatti, inferenze e opinioni</h3>\n<p>Un errore frequente nei report OSINT è mescolare tre livelli\ndiversi:</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Livello</th>\n<th>Definizione</th>\n<th>Esempio</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Fatto osservato</strong></td>\n<td>Ciò che è documentato e verificabile</td>\n<td>“Il profilo X ha pubblicato una foto il 12/03 alle 14:20 UTC.”</td>\n</tr>\n<tr>\n<td><strong>Inferenza</strong></td>\n<td>Una deduzione basata sui fatti</td>\n<td>“Lo sfondo mostra un cartello in lingua portoghese: la foto è\nprobabilmente stata scattata in un paese lusofono.”</td>\n</tr>\n<tr>\n<td><strong>Opinione / ipotesi</strong></td>\n<td>Una valutazione soggettiva</td>\n<td>“Il soggetto si è trasferito in Portogallo.”</td>\n</tr>\n</tbody>\n</table>\n<p>Un buon analista <strong>separa sempre questi livelli</strong> nel\nsuo lavoro e nel report finale. Le inferenze vanno accompagnate da un\n<strong>grado di confidenza</strong>.</p>\n<h3 id=\"esprimere-lincertezza-il-linguaggio-probabilistico\">6.4\nEsprimere l’incertezza: il linguaggio probabilistico</h3>\n<p>Le parole che usiamo contano. “Forse”, “probabilmente”, “quasi\ncertamente” vengono interpretati in modo molto diverso da persone\ndiverse. Per questo le agenzie di intelligence usano scale\nstandardizzate. Una delle più diffuse è quella dell’intelligence\nbritannica (<em>PHIA Probability Yardstick</em>), che in forma\nsemplificata è:</p>\n<table>\n<thead>\n<tr>\n<th>Espressione</th>\n<th>Probabilità indicativa</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Remota</td>\n<td>≈ 0–5%</td>\n</tr>\n<tr>\n<td>Altamente improbabile</td>\n<td>≈ 10–20%</td>\n</tr>\n<tr>\n<td>Improbabile</td>\n<td>≈ 25–35%</td>\n</tr>\n<tr>\n<td>Possibile / realistica</td>\n<td>≈ 40–50%</td>\n</tr>\n<tr>\n<td>Probabile</td>\n<td>≈ 55–75%</td>\n</tr>\n<tr>\n<td>Altamente probabile</td>\n<td>≈ 80–90%</td>\n</tr>\n<tr>\n<td>Quasi certa</td>\n<td>≈ 95–100%</td>\n</tr>\n</tbody>\n</table>\n<p>Separatamente si esprime la <strong>confidenza</strong> (alta, media,\nbassa), che riguarda la <em>qualità delle prove</em>, non la probabilità\ndell’evento.</p>\n<blockquote>\n<p><strong>Esempio di frase ben scritta:</strong> “È <em>altamente\nprobabile</em> (confidenza <em>media</em>) che gli account <span\nclass=\"citation\" data-cites=\"alpha\">@alpha</span> e <span\nclass=\"citation\" data-cites=\"beta\">@beta</span> appartengano alla stessa\npersona: condividono la foto profilo, lo stesso errore ortografico\nricorrente e un’attività concentrata nella stessa fascia oraria. La\nconfidenza è media perché la foto è un’immagine reperibile online e non\nuna foto originale.”</p>\n</blockquote>\n<h3 id=\"valutare-le-fonti-la-scala-dellammiragliato-nato\">6.5 Valutare\nle fonti: la scala dell’Ammiragliato (NATO)</h3>\n<p>Per valutare l’<strong>affidabilità della fonte</strong> e la\n<strong>credibilità dell’informazione</strong> si usa da decenni il\ncosiddetto <em>Admiralty Code</em>, adottato anche dalla NATO. Lo\napprofondiremo nella lezione sul Ciclo dell’Intelligence, ma è utile\nconoscerlo fin da subito.</p>\n<p><strong>Affidabilità della fonte</strong></p>\n<table>\n<thead>\n<tr>\n<th>Codice</th>\n<th>Significato</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>A</td>\n<td>Completamente affidabile</td>\n</tr>\n<tr>\n<td>B</td>\n<td>Normalmente affidabile</td>\n</tr>\n<tr>\n<td>C</td>\n<td>Abbastanza affidabile</td>\n</tr>\n<tr>\n<td>D</td>\n<td>Normalmente non affidabile</td>\n</tr>\n<tr>\n<td>E</td>\n<td>Non affidabile</td>\n</tr>\n<tr>\n<td>F</td>\n<td>Affidabilità non valutabile</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Credibilità dell’informazione</strong></p>\n<table>\n<thead>\n<tr>\n<th>Codice</th>\n<th>Significato</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>Confermata da altre fonti indipendenti</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Probabilmente vera</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Possibilmente vera</td>\n</tr>\n<tr>\n<td>4</td>\n<td>Dubbia</td>\n</tr>\n<tr>\n<td>5</td>\n<td>Improbabile</td>\n</tr>\n<tr>\n<td>6</td>\n<td>Veridicità non valutabile</td>\n</tr>\n</tbody>\n</table>\n<p>Un’informazione si classifica combinando i due valori. Ad esempio,\n<strong>B2</strong> indica una fonte normalmente affidabile e\nun’informazione probabilmente vera. Un account anonimo appena creato che\nriporta una notizia non confermata sarà <strong>F6</strong> o\n<strong>E4</strong>.</p>\n<blockquote>\n<p><strong>Importante:</strong> i due assi sono indipendenti. Una fonte\nmolto affidabile può riportare un’informazione sbagliata (A4), e una\nfonte sconosciuta può dire il vero (F1, se confermato altrove).</p>\n</blockquote>\n<h3 id=\"fonti-primarie-secondarie-e-circolarità\">6.6 Fonti primarie,\nsecondarie e “circolarità”</h3>\n<ul>\n<li><strong>Fonte primaria</strong>: chi ha osservato direttamente\nl’evento o ha prodotto il dato (il video originale, il documento\nufficiale, il registro).</li>\n<li><strong>Fonte secondaria</strong>: chi riporta o interpreta la fonte\nprimaria (articolo di giornale, post che condivide un video).</li>\n<li><strong>Fonte terziaria</strong>: sintesi di fonti secondarie\n(enciclopedie, aggregatori).</li>\n</ul>\n<p>Un rischio enorme è il <strong>report circolare</strong>\n(<em>circular reporting</em>). Dieci siti riportano la stessa notizia e\nsembrano dieci conferme indipendenti, ma in realtà copiano tutti\nun’unica fonte originale, magari sbagliata. <strong>Risalire sempre alla\nfonte primaria</strong> è una regola d’oro.</p>\n<pre><code>   Fonte originale (non verificata)\n              │\n     ┌────────┼─────────┐\n     ▼        ▼         ▼\n  Sito A    Sito B    Account C\n     │        │         │\n     └──► &quot;Dieci fonti confermano!&quot; ◄──┘   ← ILLUSIONE DI CONFERMA</code></pre>\n<h3 id=\"il-metodo-sift-per-la-verifica-rapida\">6.7 Il metodo SIFT per la\nverifica rapida</h3>\n<p>Per la verifica di contenuti online è molto pratico il metodo\n<strong>SIFT</strong>, sviluppato dal ricercatore Mike Caulfield:</p>\n<ol type=\"1\">\n<li><strong>S – Stop</strong>: fermati. Prima di condividere o di trarre\nconclusioni, chiediti se conosci la fonte. Prendi nota della tua\nreazione emotiva.</li>\n<li><strong>I – Investigate the source</strong>: indaga sulla fonte. Chi\nè? Che reputazione ha? Usa la <em>lettura laterale</em>: apri nuove\nschede e cerca cosa dicono <em>altri</em> di quella fonte, invece di\nrestare sul sito.</li>\n<li><strong>F – Find better coverage</strong>: cerca una copertura\nmigliore. Fonti più affidabili riportano la stessa cosa?</li>\n<li><strong>T – Trace claims to the original context</strong>: risali al\ncontesto originale di affermazioni, citazioni e media. Spesso\nun’immagine vera viene usata in un contesto falso.</li>\n</ol>\n<hr />\n<h2 id=\"i-bias-cognitivi-il-nemico-interno\">7. I bias cognitivi: il\nnemico interno</h2>\n<h3 id=\"il-cervello-non-è-un-computer-neutrale\">7.1 Il cervello non è un\ncomputer neutrale</h3>\n<p>Il nostro cervello elabora un’enorme quantità di informazioni usando\n<strong>scorciatoie mentali</strong> (<em>euristiche</em>). Sono utili\nnella vita quotidiana perché ci permettono di decidere in fretta, ma in\nun’analisi producono <strong>errori sistematici e prevedibili</strong>:\ni <strong>bias cognitivi</strong>.</p>\n<p>Lo psicologo Daniel Kahneman, premio Nobel per l’economia nel 2002,\nli ha spiegati con il modello dei due sistemi:</p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Sistema 1</th>\n<th>Sistema 2</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Veloce, automatico, intuitivo</td>\n<td>Lento, deliberato, analitico</td>\n</tr>\n<tr>\n<td>Lavora senza sforzo</td>\n<td>Richiede attenzione e fatica</td>\n</tr>\n<tr>\n<td>Genera impressioni e “sensazioni di certezza”</td>\n<td>Verifica, calcola, mette in dubbio</td>\n</tr>\n<tr>\n<td>Fonte della maggior parte dei bias</td>\n<td>Può correggere i bias, se attivato</td>\n</tr>\n</tbody>\n</table>\n<p>Il lavoro dell’analista OSINT consiste in buona parte nel\n<strong>costringere il Sistema 2 ad intervenire</strong> quando il\nSistema 1 “sente” di aver trovato la risposta.</p>\n<p>Richards J. Heuer Jr., analista della CIA, ha scritto un testo\nfondamentale: <em>Psychology of Intelligence Analysis</em> (1999),\ndisponibile gratuitamente sul sito della CIA. La sua tesi centrale è che\n<strong>conoscere i bias non basta a evitarli</strong>: servono\nprocedure strutturate che li neutralizzino.</p>\n<h3 id=\"catalogo-dei-bias-più-pericolosi-nellosint\">7.2 Catalogo dei\nbias più pericolosi nell’OSINT</h3>\n<p>Per ciascun bias vediamo la definizione, un esempio in un’indagine\nOSINT e le contromisure.</p>\n<hr />\n<h4 id=\"bias-di-conferma-confirmation-bias\">1) Bias di conferma\n(<em>Confirmation bias</em>)</h4>\n<p><strong>Definizione:</strong> la tendenza a cercare, interpretare e\nricordare le informazioni che confermano ciò che già crediamo, ignorando\nquelle che lo smentiscono.</p>\n<p><strong>Esempio OSINT:</strong> sei convinto che l’account anonimo\n“<span class=\"citation\" data-cites=\"Lupo_Grigio\">@Lupo_Grigio</span>”\nsia il signor Bianchi. Trovi che entrambi tifano per la stessa squadra e\nvivono nella stessa regione, e ti sembra una conferma. Ignori però che\nquella squadra ha milioni di tifosi e che lo stile di scrittura dei due\nè molto diverso.</p>\n<p><strong>Contromisure:</strong> - Formula esplicitamente l’ipotesi e\npoi chiediti: <em>“Quale prova la smentirebbe?”</em>. Poi vai a\ncercarla. - Usa l’<strong>Analisi delle Ipotesi Concorrenti</strong>\n(ACH, vedi §8.1). - Assegna valore diagnostico alle prove: un indizio\ncompatibile con <em>tutte</em> le ipotesi non prova nulla.</p>\n<hr />\n<h4 id=\"ancoraggio-anchoring\">2) Ancoraggio (<em>Anchoring</em>)</h4>\n<p><strong>Definizione:</strong> la tendenza a dare troppo peso alla\nprima informazione ricevuta, che diventa il punto di riferimento per\ntutte le valutazioni successive.</p>\n<p><strong>Esempio OSINT:</strong> il cliente ti dice: “Pensiamo che il\ndipendente infedele sia Rossi”. Da quel momento tutta l’indagine ruota\nattorno a Rossi, anche se i dati puntano altrove.</p>\n<p><strong>Contromisure:</strong> - All’inizio dell’indagine, annota\nquali informazioni ti sono state fornite e trattale come <em>ipotesi da\nverificare</em>, non come dati di partenza. - Ricostruisci\nperiodicamente il quadro “da zero”, come se fosse un caso nuovo.</p>\n<hr />\n<h4 id=\"bias-di-disponibilità-availability-heuristic\">3) Bias di\ndisponibilità (<em>Availability heuristic</em>)</h4>\n<p><strong>Definizione:</strong> si giudica più probabile ciò che viene\nin mente più facilmente, perché recente, vivido o emotivamente\nforte.</p>\n<p><strong>Esempio OSINT:</strong> hai appena letto un’inchiesta su una\nrete di account falsi gestita da uno stato estero. Da quel momento ogni\ngruppo di account con comportamenti simili ti sembra una “campagna\ncoordinata di disinformazione”, mentre spesso si tratta di semplici\nutenti con interessi comuni.</p>\n<p><strong>Contromisure:</strong> - Chiediti qual è la <strong>frequenza\ndi base</strong> (<em>base rate</em>) del fenomeno: quanto è comune\n<em>in generale</em>? - Elenca spiegazioni banali prima di quelle\nspettacolari (rasoio di Occam).</p>\n<hr />\n<h4 id=\"specchio-proiezione-mirror-imaging\">4) Specchio / proiezione\n(<em>Mirror imaging</em>)</h4>\n<p><strong>Definizione:</strong> presumere che gli altri pensino,\nragionino e agiscano come faremmo noi.</p>\n<p><strong>Esempio OSINT:</strong> “Nessuno userebbe lo stesso username\nsul profilo professionale e su un forum di estremisti. Quindi non può\nessere lui”. Molte persone sono invece molto meno attente alla propria\nprivacy di quanto immaginiamo, oppure hanno abitudini e culture diverse\ndalle nostre.</p>\n<p><strong>Contromisure:</strong> - Studia il contesto culturale,\ngenerazionale e tecnico del soggetto. - Evita frasi come “nessuno\nfarebbe mai…”: le persone fanno di tutto.</p>\n<hr />\n<h4 id=\"apofenia-e-pareidolia\">5) Apofenia e pareidolia</h4>\n<p><strong>Definizione:</strong> l’<strong>apofenia</strong> è la\ntendenza a vedere collegamenti e schemi significativi in dati casuali.\nLa <strong>pareidolia</strong> è la sua forma visiva (vedere volti nelle\nnuvole).</p>\n<p><strong>Esempio OSINT:</strong> due account pubblicano a pochi minuti\ndi distanza per tre volte, e concludi che sono coordinati. Ma con\nmigliaia di post, coincidenze del genere sono statisticamente\ninevitabili. Nell’analisi di immagini sfocate si possono “vedere”\nlettere, numeri o volti che non esistono.</p>\n<p><strong>Contromisure:</strong> - Chiediti: <em>“Quante volte NON è\nsuccesso?”</em>. - Non “migliorare” un’immagine sfocata e poi trattare\nil risultato come prova: gli algoritmi di <em>upscaling</em> basati su\nAI <strong>inventano dettagli</strong>. - Fai controllare l’immagine a\nun collega senza dirgli cosa ti aspetti di vedere (<em>verifica in\ncieco</em>).</p>\n<hr />\n<h4 id=\"effetto-alone-halo-effect\">6) Effetto alone (<em>Halo\neffect</em>)</h4>\n<p><strong>Definizione:</strong> un’impressione positiva o negativa su\nun aspetto si estende a tutti gli altri.</p>\n<p><strong>Esempio OSINT:</strong> una fonte che si è rivelata\naffidabile in passato viene accettata acriticamente anche quando parla\ndi argomenti fuori dalla sua competenza. Oppure un profilo con molti\nfollower e la “spunta blu” viene considerato credibile per default.</p>\n<p><strong>Contromisure:</strong> valuta <strong>ogni singola\ninformazione</strong> separatamente (codice 1–6), anche se la fonte è\nottima (codice A).</p>\n<hr />\n<h4 id=\"bias-di-autorità\">7) Bias di autorità</h4>\n<p><strong>Definizione:</strong> dare più peso a un’affermazione perché\nviene da una figura autorevole o percepita come tale.</p>\n<p><strong>Esempio OSINT:</strong> un esperto di sicurezza con molti\nfollower afferma su X che un’immagine è stata scattata in una certa\ncittà. Decine di persone lo ripetono senza verificare, ma l’esperto si\nera sbagliato.</p>\n<p><strong>Contromisure:</strong> “fidarsi è bene, verificare è meglio”.\nChiedi sempre: <em>qual è la prova?</em></p>\n<hr />\n<h4 id=\"effetto-carrozzone-e-pensiero-di-gruppo-bandwagon-groupthink\">8)\nEffetto carrozzone e pensiero di gruppo (<em>Bandwagon /\nGroupthink</em>)</h4>\n<p><strong>Definizione:</strong> adottare una convinzione perché la\ncondividono molti altri. Nel <strong>groupthink</strong> un gruppo\narriva al consenso sacrificando il pensiero critico per evitare\nconflitti.</p>\n<p><strong>Esempio OSINT:</strong> il caso di Reddit dopo Boston (§6.1)\nne è l’esempio perfetto. Anche nei team professionali, se il capo\nesprime per primo un’opinione, gli altri tendono ad allinearsi.</p>\n<p><strong>Contromisure:</strong> - Fai esprimere le valutazioni\nindividuali <em>prima</em> della discussione di gruppo. - Nomina un\n<strong>avvocato del diavolo</strong> o un <strong>red team</strong>\ninterno, incaricato di smontare la tesi prevalente.</p>\n<hr />\n<h4 id=\"eccesso-di-sicurezza-overconfidence\">9) Eccesso di sicurezza\n(<em>Overconfidence</em>)</h4>\n<p><strong>Definizione:</strong> sopravvalutare l’accuratezza delle\nproprie conoscenze e conclusioni.</p>\n<p><strong>Esempio OSINT:</strong> “Ho trovato il profilo, sono sicuro\nal 100%”. Gli studi sulla previsione mostrano che quando le persone si\ndichiarano “certe” sbagliano molto più spesso di quanto credano.</p>\n<p><strong>Contromisure:</strong> - Usa il linguaggio probabilistico\n(§6.4). - Tieni traccia delle tue previsioni e verifica a posteriori\nquante erano corrette (<em>calibrazione</em>).</p>\n<hr />\n<h4 id=\"costo-irrecuperabile-sunk-cost-fallacy\">10) Costo irrecuperabile\n(<em>Sunk cost fallacy</em>)</h4>\n<p><strong>Definizione:</strong> continuare a investire in una pista\nsolo perché ci si è già investito molto tempo o denaro.</p>\n<p><strong>Esempio OSINT:</strong> dopo dieci ore passate a seguire un\ncerto profilo, ammettere che è la persona sbagliata è psicologicamente\ndoloroso. Così si continua a cercare conferme.</p>\n<p><strong>Contromisure:</strong> stabilisci in anticipo dei\n<strong>punti di controllo</strong> (“se entro 2 ore non trovo X,\nabbandono la pista”) e rispettali.</p>\n<hr />\n<h4 id=\"bias-del-senno-di-poi-hindsight-bias\">11) Bias del senno di poi\n(<em>Hindsight bias</em>)</h4>\n<p><strong>Definizione:</strong> dopo aver saputo come è andata, ci\nsembra che l’esito fosse prevedibile (“lo sapevo”).</p>\n<p><strong>Esempio OSINT:</strong> rileggendo un’indagine conclusa, gli\nindizi sembrano ovvi. Questo porta a giudicare troppo duramente il\nlavoro altrui e a sopravvalutare le proprie capacità di previsione.</p>\n<p><strong>Contromisure:</strong> documenta <em>in tempo reale</em> le\ntue ipotesi e il grado di confidenza (diario d’indagine).</p>\n<hr />\n<h4 id=\"bias-di-sopravvivenza-survivorship-bias\">12) Bias di\nsopravvivenza (<em>Survivorship bias</em>)</h4>\n<p><strong>Definizione:</strong> concentrarsi solo sugli elementi\n“sopravvissuti” a un processo di selezione, ignorando quelli che non\nsono visibili.</p>\n<p><strong>Esempio OSINT:</strong> analizzi solo i post <em>ancora\npresenti</em> su un profilo e concludi che la persona non ha mai parlato\ndi un certo argomento. Ma molti post potrebbero essere stati cancellati.\nEcco perché strumenti come la <strong>Wayback Machine</strong> o\n<em>archive.today</em> sono fondamentali.</p>\n<p>Un esempio storico: durante la Seconda guerra mondiale, lo statistico\n<strong>Abraham Wald</strong> osservò che i fori di proiettile sugli\naerei rientrati alla base indicavano i punti in cui un aereo\n<em>poteva</em> essere colpito e sopravvivere. Le corazze andavano\nquindi rinforzate proprio dove i fori <strong>non</strong> c’erano.</p>\n<p><strong>Contromisure:</strong> chiediti sempre <em>“cosa manca? cosa\nnon vedo e perché?”</em>.</p>\n<hr />\n<h4 id=\"effetto-framing-incorniciamento\">13) Effetto framing\n(incorniciamento)</h4>\n<p><strong>Definizione:</strong> la stessa informazione porta a\nconclusioni diverse a seconda di come viene presentata.</p>\n<p><strong>Esempio OSINT:</strong> il cliente ti chiede “trova le prove\nche il fornitore è inaffidabile”. La domanda stessa ti spinge a cercare\nsolo elementi negativi. Una formulazione neutra sarebbe: “valuta\nl’affidabilità del fornitore”.</p>\n<p><strong>Contromisure:</strong> riformula sempre il requisito\ninformativo in modo <strong>neutro</strong> prima di iniziare.</p>\n<hr />\n<h4 id=\"errore-fondamentale-di-attribuzione\">14) Errore fondamentale di\nattribuzione</h4>\n<p><strong>Definizione:</strong> spiegare il comportamento altrui con\ncaratteristiche personali (“è disonesto”) invece che con fattori\nsituazionali (“era sotto pressione, non sapeva”).</p>\n<p><strong>Esempio OSINT:</strong> un’azienda ha un sito con credenziali\nesposte, e concludi che “l’amministratore è incompetente”. Magari il\nsito è gestito da un fornitore esterno, o è un ambiente di test\ndimenticato.</p>\n<p><strong>Contromisure:</strong> considera sempre le spiegazioni\nsituazionali.</p>\n<hr />\n<h4 id=\"bias-dellautomazione\">15) Bias dell’automazione</h4>\n<p><strong>Definizione:</strong> fidarsi eccessivamente dei risultati\nprodotti da strumenti automatici e software.</p>\n<p><strong>Esempio OSINT:</strong> uno strumento di ricerca username\nsegnala 40 profili con lo stesso nickname. Il principiante li\nattribuisce tutti alla stessa persona. In realtà molti sono\n<strong>falsi positivi</strong> (omonimi, siti che restituiscono\n“trovato” per qualunque nome). Lo stesso vale per i software di\nriconoscimento facciale, la traduzione automatica e i <strong>modelli di\nintelligenza artificiale</strong>, che possono “allucinare” fatti, fonti\ne citazioni inesistenti.</p>\n<p><strong>Contromisure:</strong> - Ogni risultato automatico è un\n<strong>indizio da verificare manualmente</strong>, non una prova. - Non\nusare mai l’output di un chatbot AI come fonte. Al massimo può essere un\naiuto per orientarsi, da verificare su fonti primarie.</p>\n<hr />\n<h3 id=\"tabella-riassuntiva-dei-bias\">7.3 Tabella riassuntiva dei\nbias</h3>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Bias</th>\n<th>In una frase</th>\n<th>Domanda antidoto</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Conferma</td>\n<td>Vedo solo ciò che conferma la mia idea</td>\n<td>“Cosa la smentirebbe?”</td>\n</tr>\n<tr>\n<td>Ancoraggio</td>\n<td>La prima informazione mi condiziona</td>\n<td>“E se partissi da zero?”</td>\n</tr>\n<tr>\n<td>Disponibilità</td>\n<td>Ciò che ricordo meglio mi sembra più probabile</td>\n<td>“Quanto è comune davvero?”</td>\n</tr>\n<tr>\n<td>Mirror imaging</td>\n<td>Gli altri pensano come me</td>\n<td>“Come ragiona <em>lui/lei</em>?”</td>\n</tr>\n<tr>\n<td>Apofenia</td>\n<td>Vedo schemi nel caso</td>\n<td>“Quante volte NON è successo?”</td>\n</tr>\n<tr>\n<td>Alone</td>\n<td>Una buona impressione si estende a tutto</td>\n<td>“Questa specifica info è verificata?”</td>\n</tr>\n<tr>\n<td>Autorità</td>\n<td>L’esperto ha sempre ragione</td>\n<td>“Qual è la prova?”</td>\n</tr>\n<tr>\n<td>Groupthink</td>\n<td>Tutti la pensano così</td>\n<td>“Chi fa l’avvocato del diavolo?”</td>\n</tr>\n<tr>\n<td>Overconfidence</td>\n<td>Sono sicuro al 100%</td>\n<td>“Quanto spesso sbaglio quando sono sicuro?”</td>\n</tr>\n<tr>\n<td>Costo irrecuperabile</td>\n<td>Ci ho investito troppo per mollare</td>\n<td>“Ricomincerei questa pista oggi?”</td>\n</tr>\n<tr>\n<td>Senno di poi</td>\n<td>Era ovvio</td>\n<td>“Cosa sapevo <em>allora</em>?”</td>\n</tr>\n<tr>\n<td>Sopravvivenza</td>\n<td>Vedo solo ciò che è rimasto</td>\n<td>“Cosa manca?”</td>\n</tr>\n<tr>\n<td>Framing</td>\n<td>La domanda orienta la risposta</td>\n<td>“Come la formulerei in modo neutro?”</td>\n</tr>\n<tr>\n<td>Attribuzione</td>\n<td>È colpa sua, non della situazione</td>\n<td>“Quali fattori esterni ci sono?”</td>\n</tr>\n<tr>\n<td>Automazione</td>\n<td>Il software non sbaglia</td>\n<td>“L’ho verificato a mano?”</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2 id=\"tecniche-strutturate-per-combattere-i-bias\">8. Tecniche\nstrutturate per combattere i bias</h2>\n<p>Conoscere i bias non basta. Heuer e la comunità d’intelligence hanno\nsviluppato le <strong>Tecniche Analitiche Strutturate</strong>\n(<em>Structured Analytic Techniques</em>, SAT). Ecco le più utili per\nl’OSINT.</p>\n<h3 id=\"analisi-delle-ipotesi-concorrenti-ach\">8.1 Analisi delle Ipotesi\nConcorrenti (ACH)</h3>\n<p>L’<strong>ACH</strong> (<em>Analysis of Competing Hypotheses</em>) è\nla tecnica principe contro il bias di conferma. Si articola in otto\npassi:</p>\n<ol type=\"1\">\n<li><strong>Identifica tutte le ipotesi plausibili</strong>, comprese\nquelle che ti sembrano improbabili.</li>\n<li><strong>Elenca le prove e gli argomenti</strong> rilevanti, a favore\ne contro.</li>\n<li><strong>Costruisci una matrice</strong>: ipotesi sulle colonne,\nprove sulle righe.</li>\n<li><strong>Valuta la coerenza</strong> di ogni prova con ogni ipotesi:\ncoerente (C), incoerente (I), neutra (N).</li>\n<li><strong>Elimina le prove non diagnostiche</strong>, cioè quelle\ncoerenti con tutte le ipotesi.</li>\n<li><strong>Concentrati sulle incoerenze</strong>: l’ipotesi più\nprobabile è quella con <em>meno prove contrarie</em>, non quella con più\nprove a favore.</li>\n<li><strong>Analizza la sensibilità</strong>: quali prove chiave, se\nsbagliate, cambierebbero la conclusione?</li>\n<li><strong>Riporta le conclusioni</strong> e indica quali indicatori\nfuturi potrebbero modificarle.</li>\n</ol>\n<p><strong>Esempio pratico.</strong> Un video virale mostra\nun’esplosione e viene presentato come “attacco di ieri nella città\nX”.</p>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Prova</th>\n<th>H1: Video recente, città X</th>\n<th>H2: Video vecchio, città X</th>\n<th>H3: Video di un altro luogo</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Il video circola da ieri con didascalia “città X”</td>\n<td>C</td>\n<td>C</td>\n<td>C</td>\n</tr>\n<tr>\n<td>Ricerca inversa: un fotogramma compare su un sito nel 2019</td>\n<td><strong>I</strong></td>\n<td>C</td>\n<td>C</td>\n</tr>\n<tr>\n<td>Lo skyline coincide con la città X su Google Earth</td>\n<td>C</td>\n<td>C</td>\n<td><strong>I</strong></td>\n</tr>\n<tr>\n<td>Un edificio visibile nel video è stato demolito nel 2020</td>\n<td><strong>I</strong></td>\n<td>C</td>\n<td>N</td>\n</tr>\n<tr>\n<td>Nessun media locale riporta esplosioni ieri</td>\n<td><strong>I</strong></td>\n<td>C</td>\n<td>C</td>\n</tr>\n<tr>\n<td><strong>Totale incoerenze</strong></td>\n<td><strong>3</strong></td>\n<td><strong>0</strong></td>\n<td><strong>1</strong></td>\n</tr>\n</tbody>\n</table>\n<p>La prima riga è <strong>non diagnostica</strong>: è coerente con\ntutte le ipotesi, quindi non aiuta a scegliere. Anche se “tutti lo\ncondividono”, non prova nulla. La conclusione più solida è H2: <em>video\nautentico della città X, ma vecchio e ricondiviso fuori contesto</em>. È\nuno degli scenari di disinformazione più comuni in assoluto.</p>\n<h3 id=\"controllo-delle-assunzioni-chiave-key-assumptions-check\">8.2\nControllo delle assunzioni chiave (<em>Key Assumptions Check</em>)</h3>\n<p>Elenca esplicitamente tutte le assunzioni su cui si regge la tua\nanalisi e per ciascuna chiediti:</p>\n<ul>\n<li>Perché credo che sia vera?</li>\n<li>Cosa succederebbe se fosse falsa?</li>\n<li>È mai stata falsa in passato?</li>\n</ul>\n<p><strong>Esempio:</strong> “Assumo che la foto sia stata scattata dal\ntitolare del profilo”. E se l’avesse scattata un amico? E se l’avesse\npresa da Internet?</p>\n<h3 id=\"avvocato-del-diavolo-e-red-teaming\">8.3 Avvocato del diavolo e\n<em>Red Teaming</em></h3>\n<p>Una persona, o un gruppo, riceve l’incarico esplicito di\n<strong>sostenere la tesi opposta</strong> e di attaccare le conclusioni\ndel team. Nei piccoli gruppi, o se lavori da solo, puoi farlo tu stesso\nil giorno dopo, a mente fresca. Scrivi la migliore argomentazione\npossibile <em>contro</em> la tua conclusione.</p>\n<h3 id=\"analisi-pre-mortem\">8.4 Analisi <em>Pre-Mortem</em></h3>\n<p>Immagina che tra sei mesi si scopra che la tua conclusione era\n<strong>completamente sbagliata</strong>. Chiediti: <em>“Che cosa è\nandato storto?”</em>. Questo esercizio, ideato dallo psicologo Gary\nKlein, fa emergere debolezze che normalmente non vediamo per eccesso di\nfiducia.</p>\n<h3 id=\"il-diario-dindagine\">8.5 Il diario d’indagine</h3>\n<p>Tieni un registro cronologico con:</p>\n<ul>\n<li>data e ora di ogni ricerca;</li>\n<li>query usata e strumento;</li>\n<li>risultato (anche negativo!);</li>\n<li>ipotesi del momento e grado di confidenza;</li>\n<li>decisioni prese e perché.</li>\n</ul>\n<p>Il diario contrasta il senno di poi, rende l’indagine\n<strong>riproducibile</strong> e, in caso di contestazioni, è la tua\nmigliore difesa professionale.</p>\n<p><strong>Modello minimo di diario (CSV o foglio di\ncalcolo):</strong></p>\n<table style=\"width:99%;\">\n<colgroup>\n<col style=\"width: 14%\" />\n<col style=\"width: 14%\" />\n<col style=\"width: 14%\" />\n<col style=\"width: 14%\" />\n<col style=\"width: 14%\" />\n<col style=\"width: 14%\" />\n<col style=\"width: 14%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Data/ora (UTC)</th>\n<th>Selettore</th>\n<th>Strumento / query</th>\n<th>Risultato</th>\n<th>URL / archivio</th>\n<th>Hash screenshot</th>\n<th>Note e confidenza</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-10-20 09:15</td>\n<td>mario.rossi87</td>\n<td>Google: <code>\"mario.rossi87\"</code></td>\n<td>3 risultati</td>\n<td>link archive.today</td>\n<td>sha256…</td>\n<td>Profilo GitHub probabile (media)</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"lo-strumento-in-python-un-diario-dindagine-automatico\">8.6 Lo\nstrumento in Python: un diario d’indagine automatico</h3>\n<p>Anche se Python avrà una lezione dedicata, ecco un primo assaggio.\nQuesto semplice script registra le tue annotazioni in un file CSV, con\ntimestamp UTC e hash SHA-256 dell’eventuale screenshot. Garantisce così\nl’integrità delle prove: se il file viene modificato, l’hash cambia.</p>\n<pre class=\"python\"><code>#!/usr/bin/env python3\n&quot;&quot;&quot;\ndiario_osint.py - Registro d&#39;indagine minimale.\nUso: python3 diario_osint.py\nRichiede solo la libreria standard di Python 3.\n&quot;&quot;&quot;\nimport csv\nimport hashlib\nimport os\nfrom datetime import datetime, timezone\n\nFILE_DIARIO = &quot;diario_indagine.csv&quot;\nCAMPI = [&quot;timestamp_utc&quot;, &quot;selettore&quot;, &quot;strumento_query&quot;,\n         &quot;risultato&quot;, &quot;url&quot;, &quot;file_prova&quot;, &quot;sha256&quot;, &quot;confidenza&quot;, &quot;note&quot;]\n\n\ndef calcola_sha256(percorso: str) -&gt; str:\n    &quot;&quot;&quot;Restituisce l&#39;hash SHA-256 di un file (es. uno screenshot).&quot;&quot;&quot;\n    h = hashlib.sha256()\n    with open(percorso, &quot;rb&quot;) as f:\n        # Legge il file a blocchi per non saturare la memoria\n        for blocco in iter(lambda: f.read(8192), b&quot;&quot;):\n            h.update(blocco)\n    return h.hexdigest()\n\n\ndef nuova_voce() -&gt; dict:\n    &quot;&quot;&quot;Chiede all&#39;utente i dati di una nuova voce del diario.&quot;&quot;&quot;\n    voce = {\n        &quot;timestamp_utc&quot;: datetime.now(timezone.utc).isoformat(timespec=&quot;seconds&quot;),\n        &quot;selettore&quot;: input(&quot;Selettore (username, e-mail, ...): &quot;),\n        &quot;strumento_query&quot;: input(&quot;Strumento / query usata: &quot;),\n        &quot;risultato&quot;: input(&quot;Risultato (anche negativo): &quot;),\n        &quot;url&quot;: input(&quot;URL o link d&#39;archivio: &quot;),\n        &quot;file_prova&quot;: input(&quot;Percorso screenshot (invio per saltare): &quot;).strip(),\n        &quot;confidenza&quot;: input(&quot;Confidenza (alta/media/bassa): &quot;),\n        &quot;note&quot;: input(&quot;Note / ipotesi: &quot;),\n    }\n    # Se è stato indicato un file esistente, ne calcola l&#39;hash\n    if voce[&quot;file_prova&quot;] and os.path.isfile(voce[&quot;file_prova&quot;]):\n        voce[&quot;sha256&quot;] = calcola_sha256(voce[&quot;file_prova&quot;])\n    else:\n        voce[&quot;sha256&quot;] = &quot;&quot;\n    return voce\n\n\ndef salva(voce: dict) -&gt; None:\n    &quot;&quot;&quot;Aggiunge la voce al CSV, creando l&#39;intestazione se serve.&quot;&quot;&quot;\n    nuovo_file = not os.path.exists(FILE_DIARIO)\n    with open(FILE_DIARIO, &quot;a&quot;, newline=&quot;&quot;, encoding=&quot;utf-8&quot;) as f:\n        writer = csv.DictWriter(f, fieldnames=CAMPI)\n        if nuovo_file:\n            writer.writeheader()\n        writer.writerow(voce)\n\n\nif __name__ == &quot;__main__&quot;:\n    print(&quot;=== Diario d&#39;indagine OSINT ===  (Ctrl+C per uscire)&quot;)\n    try:\n        while True:\n            salva(nuova_voce())\n            print(&quot;✔ Voce salvata.\\n&quot;)\n    except KeyboardInterrupt:\n        print(&quot;\\nDiario chiuso.&quot;)</code></pre>\n<blockquote>\n<p><strong>Perché l’hash?</strong> In ambito forense e giudiziario è\nfondamentale dimostrare che una prova digitale non è stata alterata dopo\nla raccolta (<em>catena di custodia</em>). Registrare l’hash al momento\ndell’acquisizione è una buona pratica anche per l’OSINT non\nprofessionale.</p>\n</blockquote>\n<hr />\n<h2 id=\"opsec-proteggere-sé-stessi-durante-lindagine\">9. OPSEC:\nproteggere sé stessi durante l’indagine</h2>\n<p>Un concetto da introdurre fin dalla prima lezione: <strong>mentre\nosservi, puoi essere osservato</strong>. L’<strong>OPSEC</strong>\n(<em>Operational Security</em>) è l’insieme delle misure per non\nrivelare la tua identità, le tue intenzioni e i tuoi metodi.</p>\n<h3 id=\"rischi-concreti\">9.1 Rischi concreti</h3>\n<ul>\n<li>LinkedIn mostra al titolare del profilo <strong>chi ha visitato la\nsua pagina</strong>.</li>\n<li>Alcuni siti e servizi registrano il tuo <strong>indirizzo\nIP</strong>; un link inviato può essere un <em>IP logger</em>.</li>\n<li>Un “mi piace” accidentale su Instagram o Facebook ti espone\nimmediatamente.</li>\n<li>Cercare un numero su certe app di rubrica può\n<strong>notificare</strong> la ricerca o caricare la tua rubrica.</li>\n<li>Documenti scaricati (PDF, Office) possono contenere\n<strong>tracker</strong> o malware.</li>\n<li>Un’indagine su soggetti pericolosi (criminalità, estremismo) può\nesporre te e la tua famiglia.</li>\n</ul>\n<h3 id=\"misure-di-base\">9.2 Misure di base</h3>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Livello</th>\n<th>Misura</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Base</strong></td>\n<td>Browser dedicato solo alle indagini, con estensioni di privacy (es.\nuBlock Origin) e nessun account personale connesso</td>\n</tr>\n<tr>\n<td><strong>Base</strong></td>\n<td>Mai interagire (like, follow, messaggi) con i soggetti\ndell’indagine</td>\n</tr>\n<tr>\n<td><strong>Intermedio</strong></td>\n<td><strong>Macchina virtuale</strong> dedicata (VirtualBox/VMware) con\nuna distribuzione per OSINT (es. <em>CSI Linux</em>, <em>Trace Labs\nOSINT VM</em>, o una Linux personalizzata)</td>\n</tr>\n<tr>\n<td><strong>Intermedio</strong></td>\n<td><strong>VPN</strong> affidabile per non esporre il proprio IP</td>\n</tr>\n<tr>\n<td><strong>Intermedio</strong></td>\n<td>Account di ricerca separati (vedi box sui <em>sock puppet</em>)</td>\n</tr>\n<tr>\n<td><strong>Avanzato</strong></td>\n<td>Separazione completa: hardware dedicato, connessioni separate,\nidentità di copertura gestite nel tempo</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>Sock puppet.</strong> Nel gergo OSINT si chiama <em>sock\npuppet</em> (“pupazzo a calza”) un account di ricerca non riconducibile\nall’analista, usato per accedere a contenuti visibili solo agli utenti\nregistrati. Usarli richiede grande cautela, sia per i Termini di\nServizio delle piattaforme sia per i profili penali (vedi box legale).\nIn questo corso ci limiteremo ad <strong>account di ricerca\npassivi</strong>, che non impersonano persone reali e non interagiscono\ncon i soggetti.</p>\n</blockquote>\n<hr />\n<h2 id=\"box-legale-ed-etico\">⚖️ Box legale ed etico</h2>\n<blockquote>\n<p><strong>Avvertenza:</strong> questo box ha scopo divulgativo e non\ncostituisce consulenza legale. Per attività professionali, rivolgiti a\nun avvocato esperto in diritto delle nuove tecnologie.</p>\n</blockquote>\n<h3 id=\"principio-generale-lecito-non-è-uguale-a-pubblico\">Principio\ngenerale: lecito non è uguale a pubblico</h3>\n<p>Il fatto che un’informazione sia accessibile <strong>non rende\nautomaticamente lecito</strong> qualunque uso se ne faccia. In Italia e\nnell’Unione Europea le principali norme di riferimento sono:</p>\n<p><strong>1. GDPR – Regolamento (UE) 2016/679</strong> - Qualunque\ninformazione riferita a una persona fisica identificata o identificabile\nè un <strong>dato personale</strong>, anche se pubblicata\ndall’interessato stesso. - Raccogliere, conservare e analizzare quei\ndati è un <strong>trattamento</strong> e richiede una <strong>base\ngiuridica</strong> (art. 6), ad esempio il legittimo interesse, con un\nbilanciamento documentato rispetto ai diritti dell’interessato. -\nValgono i principi di <strong>minimizzazione</strong> (raccogli solo ciò\nche serve), <strong>limitazione della finalità</strong> e\n<strong>limitazione della conservazione</strong> (art. 5). - I\n<strong>dati particolari</strong> (salute, orientamento sessuale,\nopinioni politiche, religione, ecc., art. 9) e i dati giudiziari (art.\n10) hanno tutele rafforzate. - <em>Eccezione</em>: il GDPR non si\napplica ai trattamenti per attività <strong>esclusivamente personali o\ndomestiche</strong>, ma questa esenzione non copre attività\nprofessionali o la diffusione pubblica.</p>\n<p><strong>2. Codice Privacy – D.Lgs. 196/2003, come modificato dal\nD.Lgs. 101/2018</strong> - Prevede norme specifiche e sanzioni penali\nper il <strong>trattamento illecito di dati</strong> (art. 167) e per\nl’acquisizione fraudolenta di dati su larga scala (art. 167-ter). -\nContiene disposizioni per il trattamento a fini\n<strong>giornalistici</strong> (con le relative Regole deontologiche) e\nper la difesa di un diritto in sede giudiziaria.</p>\n<p><strong>3. Codice Penale – alcuni reati da conoscere</strong> -\n<strong>Art. 615-ter c.p. – Accesso abusivo a sistema\ninformatico</strong>: entrare in un sistema protetto senza\nautorizzazione, o restarci contro la volontà del titolare. Usare\npassword trovate in un data breach per entrare in un account <strong>non\nè OSINT: è un reato</strong>. - <strong>Art. 494 c.p. – Sostituzione di\npersona</strong>: creare un profilo che impersona una persona\n<strong>reale</strong> per trarre vantaggio o recare danno può integrare\nquesto reato. - <strong>Art. 612-bis c.p. – Atti persecutori\n(stalking)</strong>: un monitoraggio ossessivo e invasivo di una persona\npuò avere rilevanza penale. - <strong>Art. 617-quater c.p.</strong> –\nintercettazione illecita di comunicazioni informatiche.</p>\n<p><strong>4. Attività investigativa professionale</strong> - In Italia\nle investigazioni private per conto terzi richiedono una <strong>licenza\nprefettizia</strong> (art. 134 TULPS). Un “OSINT investigator” che\nlavora su commissione per indagare su persone deve verificare di operare\nentro questo quadro.</p>\n<p><strong>5. Termini di Servizio delle piattaforme</strong> - Violare i\nToS (ad esempio con scraping automatizzato o account falsi) di solito ha\nconseguenze contrattuali (ban, azioni civili) più che penali. Può però\navere rilievo, e va comunque considerato.</p>\n<h3 id=\"principi-etici-dellanalista-osint\">Principi etici dell’analista\nOSINT</h3>\n<ol type=\"1\">\n<li><strong>Proporzionalità</strong>: l’invasività della ricerca deve\nessere proporzionata allo scopo.</li>\n<li><strong>Necessità</strong>: raccogli solo ciò che serve a rispondere\nal requisito informativo.</li>\n<li><strong>Non nuocere</strong>: considera le conseguenze della\npubblicazione (doxxing, molestie, errori di identificazione).</li>\n<li><strong>Passività</strong>: osserva, non interagire e non\ningannare.</li>\n<li><strong>Accuratezza</strong>: un errore di attribuzione può\ndistruggere la vita di un innocente (ricorda il caso di Boston).</li>\n<li><strong>Trasparenza metodologica</strong>: documenta come sei\narrivato alle conclusioni.</li>\n<li><strong>Tutela dei soggetti vulnerabili</strong>: minori, vittime,\npersone a rischio.</li>\n</ol>\n<blockquote>\n<p><strong>Regola pratica:</strong> prima di ogni indagine chiediti:\n<em>“Potrei spiegare apertamente a un giudice, a un giornalista o alla\npersona indagata cosa ho fatto e perché?”</em> Se la risposta è no,\nfermati.</p>\n</blockquote>\n<hr />\n<h2 id=\"strumenti-introduttivi\">Strumenti introduttivi</h2>\n<p>Nella tabella che segue trovi alcuni strumenti e risorse “di base”\nche useremo nel corso. Quelli specialistici verranno presentati nelle\nlezioni dedicate.</p>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr>\n<th>Strumento / risorsa</th>\n<th>Tipo</th>\n<th>Uso</th>\n<th>Link</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>OSINT Framework</td>\n<td>Mappa di risorse</td>\n<td>Catalogo ragionato di strumenti per categoria</td>\n<td>https://osintframework.com</td>\n</tr>\n<tr>\n<td>Bellingcat Online Investigation Toolkit</td>\n<td>Catalogo</td>\n<td>Strumenti selezionati dai ricercatori di Bellingcat</td>\n<td>https://bellingcat.gitbook.io/toolkit</td>\n</tr>\n<tr>\n<td>Wayback Machine</td>\n<td>Archivio web</td>\n<td>Versioni storiche di pagine web</td>\n<td>https://web.archive.org</td>\n</tr>\n<tr>\n<td>archive.today</td>\n<td>Archivio web</td>\n<td>Archiviazione istantanea di pagine</td>\n<td>https://archive.today</td>\n</tr>\n<tr>\n<td>Hunchly</td>\n<td>Software (a pagamento)</td>\n<td>Cattura automatica delle pagine visitate durante l’indagine</td>\n<td>https://www.hunch.ly</td>\n</tr>\n<tr>\n<td>Obsidian / CherryTree</td>\n<td>Note</td>\n<td>Organizzazione delle note d’indagine</td>\n<td>https://obsidian.md</td>\n</tr>\n<tr>\n<td>draw.io / Maltego CE</td>\n<td>Grafi</td>\n<td>Visualizzazione delle relazioni tra entità</td>\n<td>https://app.diagrams.net</td>\n</tr>\n<tr>\n<td>VirtualBox</td>\n<td>Virtualizzazione</td>\n<td>Ambiente isolato per le indagini</td>\n<td>https://www.virtualbox.org</td>\n</tr>\n<tr>\n<td>Trace Labs OSINT VM</td>\n<td>Distribuzione Linux</td>\n<td>VM preconfigurata per OSINT</td>\n<td>https://www.tracelabs.org</td>\n</tr>\n<tr>\n<td>Psychology of Intelligence Analysis (Heuer)</td>\n<td>Libro gratuito</td>\n<td>Testo fondamentale sui bias</td>\n<td>https://www.cia.gov (sezione Library)</td>\n</tr>\n<tr>\n<td>Have I Been Pwned</td>\n<td>Servizio</td>\n<td>Verifica se un’e-mail compare in data breach noti</td>\n<td>https://haveibeenpwned.com</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p>I link e la disponibilità degli strumenti possono cambiare nel tempo.\nÈ normale nell’OSINT, ed è proprio il motivo per cui il metodo conta più\ndegli strumenti.</p>\n</blockquote>\n<hr />\n<h2 id=\"caso-di-studio-la-foto-del-lago\">Caso di studio: “La foto del\nlago”</h2>\n<blockquote>\n<p><em>I nomi e i dettagli di questo caso sono fittizi e servono a scopo\ndidattico.</em></p>\n</blockquote>\n<p><strong>Contesto.</strong> Una piccola testata online riceve una\nsegnalazione. Un post su un social, diventato virale, mostra la foto di\nun lago con una grande chiazza scura. La didascalia dice:\n<em>“Sversamento tossico OGGI nel Lago di </em>**, la fabbrica XY\nnasconde tutto!“*. Il post ha 12.000 condivisioni. La redazione chiede a\nGiulia, giovane analista OSINT, di verificarlo prima di pubblicare un\narticolo.</p>\n<p><strong>Fase 1 – Requisito e framing.</strong> Il caporedattore\nchiede: <em>“Trovami le prove dello sversamento”</em>. Giulia riconosce\nil <strong>framing</strong> e riformula il requisito in modo neutro:\n<em>“La foto mostra davvero il Lago di *** oggi? Ci sono evidenze di uno\nsversamento?”</em>.</p>\n<p><strong>Fase 2 – Prime impressioni (Sistema 1).</strong> La foto\nsembra coerente: montagne sullo sfondo, vegetazione simile. Giulia sente\nl’impulso di dire “sì, è quel lago” (<strong>ancoraggio</strong> sulla\ndidascalia). Lo annota nel diario come <em>impressione iniziale, non\nverificata</em>.</p>\n<p><strong>Fase 3 – Ipotesi concorrenti.</strong> - H1: foto autentica,\nrecente, lago indicato, sversamento reale. - H2: foto autentica del lago\nindicato, ma vecchia. - H3: foto di un altro lago. - H4: foto autentica\ne recente, ma la chiazza è un fenomeno naturale (fioritura algale, ombra\ndi nuvole). - H5: immagine manipolata o generata con AI.</p>\n<p><strong>Fase 4 – Raccolta e verifica.</strong> 1. <strong>Ricerca\ninversa dell’immagine</strong> (lo vedremo nella Lezione 8): un’immagine\nmolto simile compare su un forum di escursionisti nel\n<strong>2021</strong>, con il titolo “fioritura di alghe al lago ###”,\nun lago diverso a 80 km. 2. <strong>Confronto del paesaggio</strong>:\ncon Google Earth Giulia confronta il profilo delle montagne. Coincide\ncon il lago ###, non con quello indicato nel post. 3. <strong>Fonte del\npost</strong>: l’account è stato creato tre settimane prima e pubblica\nsolo contenuti contro la fabbrica XY. Valutazione: <strong>E</strong> o\n<strong>F</strong>. 4. <strong>Fonti alternative</strong>: nessuna\ncomunicazione di ARPA o del Comune, nessuna segnalazione dei media\nlocali. 5. <strong>Copertura</strong>: dieci siti riportano la notizia,\nma tutti citano lo stesso post (<strong>report circolare</strong>).</p>\n<p><strong>Fase 5 – Matrice ACH semplificata.</strong></p>\n<table>\n<thead>\n<tr>\n<th>Prova</th>\n<th>H1</th>\n<th>H2</th>\n<th>H3</th>\n<th>H4</th>\n<th>H5</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Immagine identica pubblicata nel 2021</td>\n<td>I</td>\n<td>C</td>\n<td>C</td>\n<td>I</td>\n<td>I</td>\n</tr>\n<tr>\n<td>Profilo montuoso = lago ###</td>\n<td>I</td>\n<td>I</td>\n<td>C</td>\n<td>I</td>\n<td>N</td>\n</tr>\n<tr>\n<td>Nessuna comunicazione ufficiale</td>\n<td>I</td>\n<td>C</td>\n<td>C</td>\n<td>C</td>\n<td>C</td>\n</tr>\n<tr>\n<td>Didascalia originale: “fioritura algale”</td>\n<td>I</td>\n<td>I</td>\n<td>C</td>\n<td>C</td>\n<td>I</td>\n</tr>\n<tr>\n<td><strong>Incoerenze</strong></td>\n<td><strong>4</strong></td>\n<td><strong>2</strong></td>\n<td><strong>0</strong></td>\n<td><strong>2</strong></td>\n<td><strong>2</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Fase 6 – Pre-mortem.</strong> Giulia si chiede: <em>“Se\ndomani si scoprisse che uno sversamento c’è stato davvero, cosa avrei\nsbagliato?”</em>. Risposta: la foto è falsa, ma ciò <strong>non dimostra\nche lo sversamento non esista</strong>. Aggiunge quindi una nota:\n<em>“La foto non documenta l’evento. Non ci sono al momento evidenze\nindipendenti dello sversamento. Consigliato contatto con ARPA per una\nverifica diretta”</em>.</p>\n<p><strong>Fase 7 – Conclusione nel report.</strong> &gt; “È\n<strong>quasi certo</strong> (confidenza <strong>alta</strong>) che la\nfotografia virale non mostri il Lago di *** e che risalga almeno al\n2021. Ritrae con alta probabilità una fioritura algale nel lago ###. Al\nmomento non sono state individuate evidenze indipendenti di uno\nsversamento nel Lago di *<strong>. Questo </strong>non esclude** che\nl’evento sia avvenuto: si raccomanda una verifica presso le autorità\nambientali.”</p>\n<p><strong>Lezioni apprese:</strong> - Il <strong>framing</strong>\niniziale avrebbe orientato l’indagine. - La <strong>circolarità</strong>\ndelle fonti dava un’illusione di conferma. - Dimostrare che una prova è\nfalsa <strong>non dimostra il contrario</strong> della tesi. Un buon\nanalista distingue i due piani.</p>\n<hr />\n<h2 id=\"esercizi-pratici\">Esercizi pratici</h2>\n<blockquote>\n<p>Svolgi gli esercizi <strong>solo su te stesso o su dati\nfittizi</strong>, oppure su soggetti pubblici e per scopi didattici,\nrispettando il box legale.</p>\n</blockquote>\n<p><strong>Esercizio 1 – Autoanalisi della tua impronta digitale (60\nmin)</strong> 1. Cerca il tuo nome e cognome tra virgolette su almeno\ntre motori di ricerca diversi (Google, Bing, DuckDuckGo). 2. Cerca i\ntuoi username abituali e il tuo indirizzo e-mail principale. 3. Verifica\nil tuo indirizzo e-mail su <em>Have I Been Pwned</em>. 4. Annota tutto\nnel diario d’indagine (puoi usare lo script\n<code>diario_osint.py</code>). 5. Scrivi un breve report: <em>cosa\npotrebbe scoprire di te uno sconosciuto in un’ora?</em> Quali\ninformazioni
